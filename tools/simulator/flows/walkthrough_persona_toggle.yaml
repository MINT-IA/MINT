# tools/simulator/flows/walkthrough_persona_toggle.yaml
#
# Phase 91 Plan 91-01 (VIVANT-04) — persona toggle persistence walkthrough.
#
# Asserts that the user's tone selection in `/settings/coach-tone`
# survives app kill + relaunch. This is acceptance criterion #2 of
# the plan: « User selection persists across app kill/restart
# (SharedPreferences flag survives) ».
#
# NO MINT_E2E_* dart-defines. Production code path against Railway
# staging. Reproduit le parcours d'un user authentifie qui change le
# ton de Mint et redemarre l'app.
#
# Test user identical to walkthrough_authed_app.yaml.

appId: ch.mint.app
---
- launchApp
- assertVisible:
    id: "landing-hero"

# ── 01 : login (mirror walkthrough_authed_app.yaml)
- tapOn:
    id: "landing-login-link"
- assertVisible: "Adresse e-mail"
- tapOn: "Se connecter avec un mot de passe"
- assertVisible: "Mot de passe"
- tapOn: "Adresse e-mail"
- inputText: "mint-walkthrough-2026@gmail.com"
- tapOn: "Mot de passe"
- inputText: "WalkthroughTest123!"
- swipe:
    direction: UP
    duration: 200
- tapOn: "Se connecter"

- extendedWaitUntil:
    visible:
      text: "MINT"
    timeout: 15000

# ── 02 : open the Coach tab so the AppBar with the tone icon renders.
- tapOn: "Coach"
- extendedWaitUntil:
    visible:
      id: "coach-app-bar-tone"
    timeout: 10000
- takeScreenshot: "01-coach-screen-with-tone-icon"

# ── 03 : open /settings/coach-tone via the tune icon.
- tapOn:
    id: "coach-app-bar-tone"
- extendedWaitUntil:
    visible: "Choisis le ton de Mint"
    timeout: 5000
- takeScreenshot: "02-tone-screen-default-calm"

# ── 04 : pick "Direct" — the persisted value the test will assert
#         after the kill+relaunch.
- tapOn: "Direct"
# Tap registers selectionClick haptic + SharedPreferences write.
- extendedWaitUntil:
    visible: "Direct"
    timeout: 3000
- takeScreenshot: "03-direct-selected"

# ── 05 : kill + relaunch.
- killApp
- launchApp
- extendedWaitUntil:
    visible:
      text: "MINT"
    timeout: 15000

# ── 06 : navigate back to /settings/coach-tone (post-relaunch we
#         expect the Coach tab to be reachable from the shell).
- tapOn: "Coach"
- extendedWaitUntil:
    visible:
      id: "coach-app-bar-tone"
    timeout: 10000
- tapOn:
    id: "coach-app-bar-tone"
- extendedWaitUntil:
    visible: "Choisis le ton de Mint"
    timeout: 5000

# ── 07 : assert "Direct" is still the selected row. We use Maestro's
#         `assertVisible` on the row's stable Semantics-derived label;
#         the row Key is `coach_tone_row_direct` and the row contains
#         the radio_button_checked icon when selected.
- assertVisible: "Direct"
- takeScreenshot: "04-direct-still-selected-after-relaunch"
