# tools/simulator/flows/julien_swiss.yaml
#
# Phase 90 PERS-03 (v2.13) — Premier Éclairage scenario, julien_swiss
# archetype, FR locale (default). Panel-locked architecture
# 2026-05-05 : Maestro YAML drives the in-app tap choreography ;
# walker_premier_eclairage.sh handles the surrounding flutter build /
# sim boot / install / launch / Sentry pull / artifact bundle.
#
# Semantic locators ONLY — zero pixel coordinates. Drift in any
# `tapOn:` / `assertVisible:` literal is caught by
# `tools/checks/maestro_locator_audit.py` blocking lint (PERS-07).
#
# 5 checkpoints (mirrors walker `walker_premier_eclairage.sh` exit-0
# contract on the same archetype × scenario) :
#   01 landing            — landing screen visible
#   02 anon-chat-opener   — anonymous chat opener bubble + chips
#   03 after-turn1        — first user prompt sent + assistant reply
#   04 eclairage-card     — éclairage card rendered (Cleo brand line)
#   05 register-cta       — register CTA scrolled into viewport
#
# Pre-requisite : app installed on booted iPhone 17 Pro sim with
# dart-defines :
#   MINT_E2E_ARCHETYPE=julien_swiss
#   MINT_E2E_FORCE_ECLAIRAGE_KIND=fiscal_margin_3a
#   MINT_DISABLE_BETA_MODAL=true
#   APP_LOCALE=fr (or de / en — see flows/julien_swiss.de.yaml etc. for
#                  cross-language, follow-up Phase 91)

appId: ch.mint.app
---
# 01 — landing screen visible
# Match by Semantics(identifier:) instead of text — Flutter's
# Semantics(container:true) hides child Text from iOS accessibility
# tree, so Maestro substring matching against the label was unreliable.
# The id-based path is the panel-locked architecture default.
- launchApp
- assertVisible:
    id: "landing-hero"

# 02 — tap landing CTA → anonymous chat opener
- tapOn: "Parle à Mint"
- assertVisible:
    id: "anon-chat-opener-bubble"

# 03 — tap input field, type prompt 1, submit, wait for assistant reply
- tapOn:
    id: "anon-chat-input"
- inputText: "Combien je peux mettre dans un 3a cette annee ?"
- pressKey: Enter
# Maestro 0.15.x doesn't accept `timeout:` inline on assertVisible.
# extendedWaitUntil polls until the visible target appears or 30s
# elapse. Walker replay-cache mode is fast (~50ms response from
# bundled fixture) but live mode against staging can take 5-15s.
- extendedWaitUntil:
    visible:
      id: "anon-chat-message-assistant"
    timeout: 30000

# 04 — éclairage card rendered (forced kind = fiscal_margin_3a)
# Maestro can't substring-match text wrapped in Semantics(container:true)
# on iOS, so we match the card's own `anon-chat-eclairage-headline` id
# (panel-locked Phase A5). The label attribute on the Semantics block
# carries the localized headline string; per-locale flows assert it.
- assertVisible:
    id: "anon-chat-eclairage-headline"

# 05 — scroll to register CTA + assert visible.
# Phase A5 (v2.13) — `anon-chat-register-cta` is the panel-locked
# Semantics container wrapping the entire éclairage card (headline
# + range + body + soft-hint). Verifying its visibility confirms the
# CTA surface is rendered + scrolled into viewport. Soft-hint text
# content is verified at L2 (Dart assertion suite reads walker
# screenshot OCR + the cached LLM payload's softAccountHint field) —
# Maestro 0.15.x can't query nested Semantics inside iOS
# Semantics(container:true), so id-based L1 assertions stop at the
# parent container.
- scroll
- assertVisible:
    id: "anon-chat-register-cta"
