# tools/simulator/flows/walkthrough_login_password_fallback.yaml
#
# Phase A-USER-WALKTHROUGH (v2.13) — toggle from magic-link to
# password fallback on /auth/login. Probe : does the password field
# render after toggle ? Does « Mot de passe oublié ? » link surface ?

appId: ch.mint.app
---
- launchApp
- assertVisible:
    id: "landing-hero"

- tapOn:
    id: "landing-login-link"

- assertVisible: "Adresse e-mail"

# Tap the password fallback toggle
- tapOn: "Se connecter avec un mot de passe"

# Now expect : password field, password toggle off, sign-in CTA
- assertVisible: "Mot de passe"
