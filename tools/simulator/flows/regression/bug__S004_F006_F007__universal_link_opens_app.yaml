# tools/simulator/flows/regression/bug__S004_F006_F007__universal_link_opens_app.yaml
#
# ─── PURPOSE ───────────────────────────────────────────────────────────
# Phase 97 W7 iteration cycle #6 (D-36 step 2 REPRO + step 6 LOCK) —
# regression flow that gates the S004 + F007 + F006 Universal Link fix.
#
# S004 bug : Universal Links not configured — `https://mint-ai.ch/...`
# opens Safari instead of MINT.
# F007 bug : com.apple.developer.associated-domains entitlement absent.
# F006 bug : FlutterDeepLinkingEnabled flag absent from Info.plist.
#
# Reachability path tested (sim-bound caveat see §SIM-CAVEAT below) :
#   stop MINT
#   → host-side openurl https://mint-staging.up.railway.app/anonymous/chat
#   → iOS evaluates the Apple-App-Site-Association on the host domain
#   → IF AASA is reachable + entitlements are present : MINT opens
#   → ELSE : Safari opens the URL
#   → assertVisible Aujourd'hui = MINT app opened
#
# ─── SIM-CAVEAT — IMPORTANT, READ BEFORE INTERPRETING THIS FLOW ───────
# iOS Universal Links require a 3-link chain :
#   1. Info.plist has FlutterDeepLinkingEnabled <true/>  (F006 fix)
#   2. Runner.entitlements has com.apple.developer.associated-domains
#      with applinks:<host>  (F007 fix)
#   3. The <host> serves /.well-known/apple-app-site-association as
#      application/json with the matching appID + paths  (S004 fix)
#
# Current 2026-06-01 release state :
#   - (1) is present in Info.plist.
#   - (3) is implemented by services/backend/app/main.py and must be
#     verified on the exact host being associated.
#   - (2) is NOT present in Runner.entitlements. Associated Domains was
#     removed because the App Store provisioning profile for ch.mint.app
#     did not include that capability and TestFlight archive failed.
#     Re-adding it requires Apple Developer portal + fastlane match profile
#     refresh in an isolated [ios-release] PR before any signed build claim.
#   - Product domain mint-ai.ch must resolve publicly and serve the MINT AASA
#     directly before a production Universal Link claim is true.
#
# On the iOS Simulator, signed entitlements are NOT enforced — so
# the entitlements presence is necessary but not sufficient. The sim
# also bypasses Apple's swcd (System Web Credentials Daemon) check
# in many iOS versions, which means Universal Links on sim are
# UNRELIABLE for full E2E validation pre-Railway-deploy.
#
# This flow is opt-in and must be interpreted as a release gate, not as a
# normal simulator regression. Backend AASA tests + Info.plist prove only
# partial configuration. Full closure requires a signed TestFlight build
# whose entitlements include com.apple.developer.associated-domains and a
# real iOS device opening the associated HTTPS URL into MINT.
#
# ─── MAESTRO 2.5.1 SYNTAX ──────────────────────────────────────────────
# Per https://docs.maestro.dev/api-reference/commands.
#
# ─── PRE-CONDITION ─────────────────────────────────────────────────────
# - App installed on booted iPhone 17 Pro sim (UDID
#   B03E429D-0422-4357-B754-536637D979F9), bundle id ch.mint.app
# - Railway staging serves /.well-known/apple-app-site-association with
#   Content-Type: application/json (verified by tools/simulator/scripts/
#   verify_aasa.sh + backend pytest tests/test_aasa_endpoint.py).
#
# ─── RED-state evidence (pre-fix) ──────────────────────────────────────
# Pre-fix : no associated-domains entitlement + no FlutterDeepLinkingEnabled
# + no AASA file → iOS routes the URL to Safari → MINT app does NOT
# foreground → assertion at step 4 fails.

appId: ch.mint.app
tags:
  - phase-97
  - phase-97-w7
  - bug-s004
  - bug-f006
  - bug-f007
  - regression
  - infra
  - feature:infra
  - archetype:all
---

# ── Step 1 — Stop MINT app ────────────────────────────────────────────
- stopApp

# ── Step 2 — Host-side openurl trigger (Universal Link, HTTPS) ────────
# Maestro's openLink invokes iOS's URL handler ; iOS checks the AASA
# at the host's /.well-known/apple-app-site-association endpoint and
# routes to the MINT app IFF entitlements + AASA match.
- openLink: "https://mint-staging.up.railway.app/anonymous/chat"

# ── Step 3 — Wait for MINT to come to the foreground ──────────────────
- extendedWaitUntil:
    visible:
      text: ".*MINT.*"
    timeout: 15000
- waitForAnimationToEnd

# ── Step 4 — S004+F006+F007 ASSERTION : public app route rendered ─────
# Post-fix : iOS validates the AASA file at the host's /.well-known/
# endpoint, finds the appID + path match, routes the URL to MINT,
# Flutter+GoRouter resolves /anonymous/chat. We look for the anonymous
# chat input hint instead of a debug/demo surface.
- extendedWaitUntil:
    visible:
      text: "Écris ce qui te trotte en tête…"
    timeout: 10000

# ── Step 5 — Optional capture for HUMAN-UAT evidence ──────────────────
- takeScreenshot: "96-s004-universal-link-opens-app"

# ─── S004+F006+F007 RELEASE CONTRACT ──────────────────────────────────
# Simulator steps 3 + 4 are diagnostic only. Passing them does NOT close
# S004/F007 for release because the simulator does not prove Apple
# Developer provisioning, App Store match profile state, or real-device
# Universal Link routing.
#
# Production validation requires TestFlight signed-entitlements build
# (D-22 7-day staging soak). Until Runner.entitlements and the App Store
# provisioning profile both include Associated Domains, this flow is
# expected to remain an OPEN release gate, not a closed regression.
#
# This flow is deliberately kept out of default/all sweeps. Any future PR
# that claims Universal Links must run this on a signed build/device and
# cite the resulting artifact.
