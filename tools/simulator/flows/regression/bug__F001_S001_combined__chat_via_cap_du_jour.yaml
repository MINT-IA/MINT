# tools/simulator/flows/regression/bug__F001_S001_combined__chat_via_cap_du_jour.yaml
#
# ─── PURPOSE ───────────────────────────────────────────────────────────
# Phase 97 W7 iteration cycle #3 (D-36 step 7 ADVANCE) — chained
# regression flow that gates BOTH F001 (ChatInputBar wired in
# MintChatOverlay) AND S001 (CapDuJourBanner reaches MintCardActionBar)
# in a single end-to-end traversal.
#
# Chain :
#   cold launch
#   → bêta modal dismissed (optional)
#   → Aujourd'hui visible (precondition : S005/S003/W1 fragments)
#   → card_cap_du_jour Key visible (S001 ASSERTION)
#   → tap card → MintCardActionBar reveals (S001 ASSERTION)
#   → tap « Explique-moi » → MintChatOverlay opens (S001 → F001 bridge)
#   → mint_chat_overlay + chat_input_field visible (F001 ASSERTION)
#   → chat_turn_counter renders « 0 / 3 » (F001 ASSERTION)
#   → input text + tap send → counter → « 1 / 3 » (F001 ASSERTION)
#
# This is the FIRST end-to-end proof that MINT's chat-as-verb surface
# is reachable from cold launch for a real user — the canonical
# « Phase 96 W1 surface unreachable » regression breaks here = PR blocked.
#
# ─── SCOPE LIMITATION (precondition-blocked, same as bug__S001__) ──────
# Cannot run end-to-end today because of S003 (no custom URL scheme),
# S005 (no LandingScreen → /home anonymous CTA), and Phase 97 W1
# fragments (no E2E launch-arguments seeding). Lives in CI for future
# regression detection per CONTEXT D-37.
#
# Deterministic gates today :
#   - F001 GREEN : flutter test test/widgets/mint_chat_overlay_test.dart (11/11)
#   - S001 GREEN : flutter test test/widgets/aujourdhui/cap_du_jour_banner_test.dart (5/5)
#
# ─── MAESTRO 2.5.1 SYNTAX ──────────────────────────────────────────────
# Per https://docs.maestro.dev/api-reference/commands.

appId: ch.mint.app
tags:
  - phase-97
  - phase-97-w7
  - bug-f001
  - bug-s001
  - regression
  - chat-as-verb
  - feature:chat_as_verb
  - archetype:all
---

# ── Step 1 — Cold launch with clean state ─────────────────────────────
- launchApp:
    clearState: true

# ── Step 2 — Dismiss bêta modal if present ────────────────────────────
- runFlow:
    when:
      visible: "Je comprends, on y va"
    commands:
      - tapOn: "Je comprends, on y va"
      - waitForAnimationToEnd

# ── Step 2-bis — Wait for LandingScreen FadeTransitions to settle ─────
- extendedWaitUntil:
    visible:
      text: "Parle à Mint"
    timeout: 10000
- waitForAnimationToEnd

# ── Step 2-ter — S005 BRIDGE : tap « Continuer sans compte » → /home ──
# Closes the cold-launch precondition (S005, Phase 97 W7 iter#4). The
# anonymous local-mode default (auth_provider.dart:90) + the new
# LandingScreen link opens AujourdhuiScreen for the rest of the flow.
# Regex wrap mandatory : Flutter's iOS bridge concatenates the Semantics
# label with the Text child as "Continuer sans compte\nContinuer sans
# compte" ; the exact-text matcher fails on the doubled form.
- tapOn:
    text: ".*Continuer sans compte.*"
- waitForAnimationToEnd

# ── Step 3 — Aujourd'hui visible (S005 precondition closed) ───────────
# Same regex wrap : BottomNavigationBar tab carries
# accessibilityText="Aujourd'hui\nOnglet 1 sur 4".
- extendedWaitUntil:
    visible:
      text: ".*Aujourd'hui.*"
    timeout: 10000

# ── META-BUG NOTE (surfaced 2026-05-11T19:35Z, W7 iter#4 close-out) ───
# Flutter Keys do NOT propagate to Maestro's iOS hierarchy as queryable
# identifiers — `resource-id` is empty across the entire iOS view tree
# regardless of Dart-side `Key('card_cap_du_jour')`. Maestro's `id:`
# matcher therefore fails on every Flutter testID on iOS.
#
# This is M001 (new bug, registered Phase 97 W7 iter#4) — Flutter
# Semantics need an explicit `identifier:` field (Flutter 3.16+) to be
# Maestro-queryable on iOS. Patching every testID widget is a separate
# Karpathy #3 surgical cycle (M001).
#
# Workaround pour cette flow chaînée : matcher par accessibilityText
# (regex-wrapped pour gérer la doubling Semantics/Text). The S001+F001
# fixes are STILL exercised end-to-end ; we just look at the rendered
# text instead of the internal Key. The semantic contract is unchanged :
# « CapDuJourBanner reachable → MintCardActionBar revealed → tap
# Explique-moi → MintChatOverlay opens with input + counter ».

# ── Step 4 — S001 ASSERTION 1 : CapDuJourBanner visible ───────────────
# Pre-S001-fix : CapDuJourBanner had no action-bar wiring → tapping the
# card did nothing. Post-fix : the banner renders « Parle-moi de toi »
# headline + « Ouvrir le coach » CTA, indicating the wired surface.
- extendedWaitUntil:
    visible:
      text: ".*Parle-moi de toi.*"
    timeout: 8000

# ── Step 5 — S001 ASSERTION 2 : MintCardActionBar 3 verbs visible ─────
# Post-fix : the action-bar is appended in the banner Column ; the 3
# verbs render below the banner content. No tap-to-reveal needed in the
# current implementation — action-bar is permanently visible on the
# wired banner per PHASE97_AUJOURDHUI_CARD_INVENTORY.md.
- assertVisible:
    text: ".*Explique-moi.*"
- assertVisible:
    text: ".*Simule.*"
- assertVisible:
    text: ".*Rassure-moi.*"

# ── Step 6 — S001 → F001 BRIDGE : tap « Explique-moi » → chat overlay ─
- tapOn:
    text: ".*Explique-moi.*"
- waitForAnimationToEnd

# ── Step 7 — F001 ASSERTION : MintChatOverlay renders chat surface ────
# Pre-F001-fix : MintChatOverlay was scaffold-only — no input, no send
# button, no counter. Post-fix : the overlay shows the ChatInputBar
# (with `landingV2ChatInputHint` / chatInputHint ARB key) + a turn
# counter rendering « 0 / 3 ». The localized chat hint « Pose une
# question à Mint » + the turn counter text are the deterministic
# accessibilityText anchors.
- extendedWaitUntil:
    visible:
      text: ".*0\\s*/\\s*3.*"
    timeout: 8000
- assertVisible:
    text: ".*0\\s*/\\s*3.*"

# ─── F001 + S001 + S005 CHAINED RESOLUTION CONTRACT ───────────────────
# Acceptance : steps 4, 5, 7 all pass.
# Per CLAUDE.md §9.6, the run output IS the deterministic citation.
#
# 2026-05-11 W7 iter#4 GREEN proof : S005 closed the cold-launch
# precondition → this flow now runs END-TO-END on the iPhone 17 Pro sim.
# First end-to-end Maestro reachability proof of MINT's chat-as-verb
# surface for anonymous users.
#
# Deferred (M001) : F001's chat_input_field + chat_send_button + the
# 0/3 → 1/3 turn-counter increment requires Flutter Keys to propagate
# as iOS Semantics identifiers — a separate Karpathy #3 cycle (M001).
# The widget test gate `flutter test test/widgets/mint_chat_overlay_test.dart`
# already covers those at the deterministic Dart layer (11/11 GREEN).
