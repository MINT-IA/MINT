# tools/simulator/flows/maestro-perfect-set/flow_tierb_b4_invalidite.yaml
#
# TIER B smoke — lot B4 Décès / Santé / Mobilité — event `disability`
# (route /invalidite). Cadrage :
# .planning/phases/mint-utilisable-tier-b-smoke/00-CADRAGE.md
# Event SANS AUCUN flow avant ce lot (création complète, exclu de
# parcours_secondaires).
#
# ─── AX iOS 26.2 : investigation AX invalidite (ADR 2026-07-31) ─────────────
#   Fix appliqué (3 leviers) : (1) retrait du wrapper racine
#   `Semantics(container:true)` ; (2) `SliverAppBar`→`AppBar` fixe en
#   `Scaffold.appBar` (hero-stat relogé en tête de corps) ; (3) déclencheur de
#   CONTENU du fling-collapse identifié par BISECTION RUNTIME (Probe D/E, iPhone
#   16e / iOS 26.2, seed julien_swiss) = le slider Material interne du
#   `DisabilityCountdownWidget`, zone de scroll médiane → masqué sur cet écran
#   (`interactive:false`, l'écran a déjà son slider d'épargne).
#   Preuves bisection citées :
#     • baseline (wrapper+SliverAppBar)     : repos 52 → fling 16 (collapse)
#     • wrapper retiré + AppBar (Build B)   : repos 46 → fling 16 (collapse persiste)
#     • + bas de page retiré (Probe D)      : repos 46 → fling 32 (RICHE)
#     • countdown SEUL réintroduit (Probe E): repos 46 → fling 16 (collapse) ⇒ countdown
#     • contrôle A/B independant (même build): repos 58 → fling 36 (RICHE) ⇒ structurel
#   NB : le scroll GENTLE gardait l'arbre riche et faisait affleurer
#   `disability-result` même avant le fix countdown (l'effondrement est
#   spécifique au FLING/vélocité). Re-armement ci-dessous = scrollUntilVisible
#   (speed modéré) → `disability-result`. VERIFICATION RUNTIME DU FIX COUNTDOWN
#   EN ATTENTE (build de vérif bloqué par saturation disque partagé — À REJOUER
#   avant merge).
#
# ─── BUILD (seed julien_swiss requis — un build = un seed) ──────────────
#   cd apps/mobile && CODE_SIGNING_ALLOWED=NO flutter build ios --debug \
#     --simulator --no-codesign \
#     --dart-define=API_BASE_URL=https://mint-staging.up.railway.app/api/v1 \
#     --dart-define=MINT_E2E_ARCHETYPE=julien_swiss \
#     --dart-define=MINT_E2E_PROOF_ANCHORS=true
#   Runner : `tools/simulator/maestro_sweep.sh tierb-b4`.
#
# ─── C3 (LSFin) — miroir canonique check_banned_terms ──────────────────
#   `banned_terms_arb.py:13-14` : famille « garanti* » seule → `(?i).*garanti.*`.
#
# ─── VERDICT RUNTIME (iPhone 16e/26.2, seed julien_swiss) ──────────────
#   C1 VERT  — `disability-anchor` (AppBar) visible au repos (arbre riche, 46 nœuds
#            mesurés post-fix).
#   C2 (non-vide) VERT — sentinelles absentes ; chiffré falaise seed-alone.
#   C2b — `disability-result` (Falaise chiffrée) via scrollUntilVisible.
#            ⚠ ATTEINGNABILITÉ AU FLING = fix countdown NON ENCORE VÉRIFIÉ au
#            runtime (build de vérif bloqué disque partagé). Gentle scroll : PROUVÉ
#            atteignable. À REJOUER avant merge.
#   C3 VERT  — aucun `garanti` rendu.
#   C4 VERT  — `disability-back` (safePop, id AppBar ciblable) → `home_route_state`.
#   C5 — arbre AX riche au repos ; effondrement AU FLING localisé au countdown
#            (slider interne, Probe E) → masqué (`interactive:false`). VERIF RUNTIME PENDANTE.

appId: ch.mint.app
tags:
  - tier-b
  - smoke
  - b4
  - invalidite
  - seeded
  - feature:invalidite
---

- launchApp:
    clearState: true
- openLink: "mintapp:///home"
- extendedWaitUntil:
    visible:
      id: "home_route_state"
    timeout: 40000
- assertNotVisible:
    text: "Page introuvable"
- assertNotVisible:
    text: "NoSuchMethodError"

# C1 — Atteignable : deeplink canonique /invalidite. L'ancre affleure AU REPOS
# (arbre riche, 52 nœuds mesurés — PAS d'effondrement au repos malgré le motif
# firstJob ; l'effondrement est AU SCROLL, cf. en-tête).
- openLink: "mintapp:///invalidite"
- extendedWaitUntil:
    visible:
      id: "disability-anchor"
    timeout: 15000

# C3 — Zéro terme banni LSFin (« garanti* » seule ; voir en-tête pour le rationale).
- assertNotVisible:
    text: "(?i).*garanti.*"

# C2 — Non-vide : aucune sentinelle vide (falaise + bulletin chiffrés seed-alone
# au repos). Le chiffré `disability-result` (sous la flottaison) est prouvé au
# widget test (inatteignable au flow : SliverAppBar collapse au scroll).
- assertNotVisible:
    text: "Aucune donnée"
- assertNotVisible:
    text: "Aucune donnée pour l'instant"
- assertNotVisible:
    text: "Définis ton budget"

# C2b — Chiffré ATTEIGNABLE au scroll : la Falaise (`disability-result`, actes
# employeur / IJM / AI+LPP chiffrés seed-alone) affleure via scrollUntilVisible
# (speed modéré = évite le fling qui effondrait l'arbre). Re-armement AX :
# avant le fix (retrait wrapper + AppBar + slider countdown interne masqué) ce
# scroll était inatteignable (collapse). VERIF RUNTIME EN ATTENTE (disque saturé).
- scrollUntilVisible:
    element:
      id: "disability-result"
    direction: DOWN
    timeout: 25000
    speed: 25
- assertVisible:
    id: "disability-result"

# C4 — Pas de cul-de-sac : bouton retour identifié → /home. Le `label`
# accessible (backButtonTooltip) rend le leading de l'AppBar fixe CIBLABLE par
# id (AppBar épinglé en haut → back visible même après scroll).
- tapOn:
    id: "disability-back"
- extendedWaitUntil:
    visible:
      id: "home_route_state"
    timeout: 15000
