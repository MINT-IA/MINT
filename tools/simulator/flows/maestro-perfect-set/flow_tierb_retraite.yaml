# tools/simulator/flows/maestro-perfect-set/flow_tierb_retraite.yaml
#
# TIER B smoke — retraite — event `retirement` (route /retraite).
# Cadrage : .planning/phases/mint-utilisable-tier-b-smoke/00-CADRAGE.md
# Patron : lot B2 Travail (#1139) + lot B3 Logement (#1141). Seed retraité #1138.
#
# ─── BUILD (seed retraite_lausanne requis — un build = un seed) ─────────
#   cd apps/mobile && CODE_SIGNING_ALLOWED=NO flutter build ios --debug \
#     --simulator --no-codesign \
#     --dart-define=API_BASE_URL=https://mint-staging.up.railway.app/api/v1 \
#     --dart-define=MINT_E2E_ARCHETYPE=retraite_lausanne \
#     --dart-define=MINT_E2E_PROOF_ANCHORS=true
#   Runner : `tools/simulator/maestro_sweep.sh tierb-retraite`.
#
# ─── C2 CHIFFRÉ CORRECT (rente LPP, PAS la ventilation AVS) ─────────────
#   `/retraite` (RetirementDashboardScreen) rend le tableau de bord retraite au
#   repos (projection ForecasterService depuis le profil seedé). L'ancre
#   `retraite-result` est posée sur la LIGNE RENTE LPP (avoir 2e pilier ≈ 318'000
#   × taux de conversion 6,8 % ≈ 1'800/mois) — un chiffre JUSTE.
#   DÉFAUT MOTEUR CONNU (#1138) consigné : la ventilation AVS de la projection est
#   recalculée depuis un salaire nul (grossAnnualSalary = 0) → la ligne AVS affiche
#   ≈ 0, FAUX. La rente AVS déclarée (2'000) reste juste là où /home la lit
#   vraiment (budget net explicite 3'800). Le smoke n'asserte donc JAMAIS la ligne
#   AVS — uniquement la rente LPP correcte. La ventilation AVS ≈ 0 reste une dette
#   moteur (correctif 13e rente + plafond couple), hors périmètre de ce lot.
#
# ─── C3 (LSFin) — miroir canonique check_banned_terms ──────────────────
#   Assertion UNIQUEMENT `(?i).*garanti.*` (banned_terms_arb.py:13-14).
#
# ─── AX SAIN (tranche AX 2 appliquée — ADR 2026-07-30, patron #1127/#1140) ──
#   `/retraite` migré : SliverAppBar (expandedHeight 80, floating, snap) +
#   FlexibleSpaceBar/titlePadding (fix Codex #1143) → AppBar classique fixe
#   (`Scaffold.appBar`, titre dans AppBar.title). Le 2e déclencheur d'effondrement
#   iOS 26.2 (SliverAppBar-au-scroll) est supprimé. PREUVE RUNTIME (sweep tranche
#   AX 2, iPhone 16e/26.2, seed retraite_lausanne) : arbre RICHE au repos (44
#   nœuds) ET stable au scroll — `retraite-anchor` + `retraite-back` survivent au
#   swipe (aucun effondrement), et `retraite-back` (leading AppBar fixe) redevient
#   CIBLABLE par id (tap-coordonnée 28,75 supprimé). NB : `retraite-result` n'est
#   PAS rendu au runtime en entrée deeplink (State C onboarding — voir C2).

appId: ch.mint.app
tags:
  - tier-b
  - smoke
  - retraite
  - seeded
  - feature:retirement
---

- launchApp:
    clearState: true
- openLink: "mintapp:///home"
- extendedWaitUntil:
    visible:
      id: "home_route_state"
    timeout: 40000
- assertNotVisible:
    text: "Page introuvable"
- assertNotVisible:
    text: "NoSuchMethodError"

# C1 — Atteignable : deeplink canonique /retraite.
- openLink: "mintapp:///retraite"
- extendedWaitUntil:
    visible:
      id: "retraite-anchor"
    timeout: 15000

# C3 — Zéro terme banni LSFin (« garanti* » seule ; voir en-tête).
- assertNotVisible:
    text: "(?i).*garanti.*"

# C2 — Non-vide : aucune sentinelle vide (dont l'onboarding « 4 infos suffisent »).
- assertNotVisible:
    text: "Aucune donnée"
- assertNotVisible:
    text: "Aucune donnée pour l'instant"
- assertNotVisible:
    text: "Définis ton budget"

# C2 — AX STABLE AU SCROLL (non-régression du swap) : un swipe ne doit PAS
# effondrer l'arbre. Post-fix (SliverAppBar → AppBar fixe), `retraite-anchor`
# (titre AppBar fixe) survit au scroll — avant le swap, le SliverAppBar dépouillait
# tous les ids au scroll (2e trigger iOS 26.2). C'est la preuve runtime du swap
# côté retraite (le `-result` étant non-rendu au runtime, cf. ci-dessous).
- swipe:
    direction: UP
    duration: 400
- assertVisible:
    id: "retraite-anchor"

# C2 — Chiffré CORRECT porté au WIDGET (PAS au flow). PREUVE RUNTIME (sweep tranche
# AX 2, dump maestro hierarchy) : en entrée deeplink, `/retraite` rend l'état
# ONBOARDING State C (« Commencer — 2 min », « Comment fonctionne la retraite »)
# car la CoachProfileProvider n'est pas hydratée quand la route se construit
# (hasProfile=false → State C) — la MÊME course d'hydratation que le quirk
# /home→/onb (root-cause #1144, UNITÉ SÉPARÉE, hors périmètre AX). `retraite-result`
# (ligne rente LPP) n'est donc PAS rendu au runtime (State C n'a pas de dashboard)
# → un scrollUntilVisible échouerait pour une raison SANS RAPPORT avec l'AX
# (l'arbre est sain, cf. swipe ci-dessus). La preuve C2 CHIFFRÉE CORRECTE (rente
# LPP, PAS la ventilation AVS ≈ 0) reste portée au niveau WIDGET
# (`tierb_b5_anchors_test.dart`, retraite-result findsOneWidget sous seed
# retraite_lausanne).

# C4 — Pas de cul-de-sac : le tap back (safePop) NAVIGUE hors de /retraite vers un
# écran réel (pas de blocage, pas de crash). Leading `retraite-back` ciblable par
# id (AppBar fixe — tap-coordonnée 28,75 retiré, patron tranche AX 2) ; en AppBar
# fixe le leading reste visible après le scroll C2 (il ne défile pas hors-écran).
# ATTERRISSAGE CONSTATÉ (sweep 2026-07-31) = `/onb` (OnboardingShellScreen), PAS
# /home : en entrée deeplink, safePop→go('/home') retombe sur /onb APRÈS visite
# /retraite (transition d'état /home→/onb ; le /home INITIAL du flow montrait bien
# home_route_state). C'est un DÉFAUT RÉCOLTÉ (course d'hydratation, root-cause
# #1144 — unité séparée), PAS un cul-de-sac : le back mène à un écran navigable.
# Un vrai user atteint /retraite par push depuis /home → back = pop → /home. On
# asserte l'atterrissage constaté.
- tapOn:
    id: "retraite-back"
- extendedWaitUntil:
    visible:
      id: "onboarding-entry-open"
    timeout: 15000
- assertNotVisible:
    text: "Page introuvable"
- assertNotVisible:
    text: "NoSuchMethodError"
