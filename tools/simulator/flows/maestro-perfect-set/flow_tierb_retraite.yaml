# tools/simulator/flows/maestro-perfect-set/flow_tierb_retraite.yaml
#
# TIER B smoke — retraite — event `retirement` (route /retraite).
# Cadrage : .planning/phases/mint-utilisable-tier-b-smoke/00-CADRAGE.md
# Patron : lot B2 Travail (#1139) + lot B3 Logement (#1141). Seed retraité #1138.
#
# ─── BUILD (seed retraite_lausanne requis — un build = un seed) ─────────
#   cd apps/mobile && CODE_SIGNING_ALLOWED=NO flutter build ios --debug \
#     --simulator --no-codesign \
#     --dart-define=API_BASE_URL=https://mint-staging.up.railway.app/api/v1 \
#     --dart-define=MINT_E2E_ARCHETYPE=retraite_lausanne \
#     --dart-define=MINT_E2E_PROOF_ANCHORS=true \
#     --dart-define=MINT_E2E_SEAL_FALLBACK=true
#   Runner : `tools/simulator/maestro_sweep.sh tierb-retraite`.
#
# ─── FIX SCELLEMENT E2E (codex/journey-os-e2e-seal-fallback) ────────────
#   `MINT_E2E_SEAL_FALLBACK=true` active le fallback de scellement debug/E2E-only
#   de SecureWizardStore : sur build sim `--no-codesign` sans entitlement keychain,
#   `write` lève `PlatformException` (code « Unexpected security result code »,
#   status -34018 errSecMissingEntitlement dans `details`). Sans le fallback, le
#   seal échoue, `saveAnswers` n'écrit rien, et le contrat privacy efface le profil
#   seedé quand `/retraite` persiste son snapshot à l'entrée (_persistInitialSnapshot,
#   post-frame) → State C onboarding. Avec le fallback, le seal réussit en mémoire
#   process (PII jamais en clair — SharedPreferences ne contient que des `__secure__`),
#   le profil est CONSERVÉ, et le dashboard chiffré rend au repos. Double-gardé
#   kReleaseMode + flag → chemin release byte-inaccessible, contrat privacy
#   secure_failure_test intact.
#
# ─── C2 CHIFFRÉ CORRECT (dashboard retraite rendu, plus de State C) ──────
#   `/retraite` (RetirementDashboardScreen) rend le tableau de bord retraite au
#   repos (projection ForecasterService depuis le profil seedé « Roland »). PREUVE
#   RUNTIME (sweep 2026-07-31, iPhone 16e/26.2 dédié, seed retraite_lausanne +
#   SEAL_FALLBACK) : taux de remplacement 100 %, revenu projeté ~CHF 4'055/mois
#   (fourchette 3'447–4'664), ventilation AVS 2'167 + LPP 1'745 (+ 3a 0 / autre 143)
#   — CHIFFRES NON NULS et cohérents (rente AVS DÉCLARÉE honorée dans les deux
#   moteurs, cf. fix retraite AVS déjà sur dev). L'ancre `retraite-result` (ligne
#   rente LPP ≈ 1'745, avoir 2e pilier ≈ 318'000 × taux 6,8 %) est atteignable par
#   scrollUntilVisible et rendue au runtime.
#
# ─── C3 (LSFin) — miroir canonique check_banned_terms ──────────────────
#   Assertion UNIQUEMENT `(?i).*garanti.*` (banned_terms_arb.py:13-14).
#
# ─── AX SAIN (tranche AX 2 appliquée — ADR 2026-07-30, patron #1127/#1140) ──
#   `/retraite` migré : AppBar classique fixe (`Scaffold.appBar`, titre dans
#   AppBar.title). Le 2e déclencheur d'effondrement iOS 26.2 (SliverAppBar-au-scroll)
#   est supprimé. `retraite-anchor` + `retraite-back` survivent au swipe (aucun
#   effondrement) ; `retraite-back` (leading AppBar fixe) reste CIBLABLE par id.
#
# ─── C4 — Back → /home (plus de cul-de-sac ni de détour /onb) ───────────
#   PREUVE RUNTIME (sweep 2026-07-31) : le tap `retraite-back` (safePop) navigue
#   vers `/home` (home_route_state) — le profil étant hydraté et conservé (fix seal),
#   la transition parasite /home→/onb (qui apparaissait quand /retraite retombait en
#   State C) ne se produit plus. Atterrissage = /home, écran réel et navigable.

appId: ch.mint.app
tags:
  - tier-b
  - smoke
  - retraite
  - seeded
  - feature:retirement
---

- launchApp:
    clearState: true
- openLink: "mintapp:///home"
- extendedWaitUntil:
    visible:
      id: "home_route_state"
    timeout: 40000
- assertNotVisible:
    text: "Page introuvable"
- assertNotVisible:
    text: "NoSuchMethodError"

# C1 — Atteignable : deeplink canonique /retraite.
- openLink: "mintapp:///retraite"
- extendedWaitUntil:
    visible:
      id: "retraite-anchor"
    timeout: 15000

# C3 — Zéro terme banni LSFin (« garanti* » seule ; voir en-tête).
- assertNotVisible:
    text: "(?i).*garanti.*"

# C2 — Non-vide : aucune sentinelle vide (dont l'onboarding State C).
- assertNotVisible:
    text: "Aucune donnée"
- assertNotVisible:
    text: "Aucune donnée pour l'instant"
- assertNotVisible:
    text: "Définis ton budget"
- assertNotVisible:
    text: "4 infos suffisent"

# C2 — CHIFFRÉ CORRECT au runtime : le dashboard est rendu (plus de State C grâce au
# fallback de scellement). L'ancre `retraite-result` (ligne rente LPP) est atteignable
# depuis le haut et rendue.
- scrollUntilVisible:
    element:
      id: "retraite-result"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "retraite-result"

# C2 — AX STABLE AU SCROLL (non-régression du swap AppBar) : un swipe ne doit PAS
# effondrer l'arbre. Post-fix (SliverAppBar → AppBar fixe), `retraite-anchor`
# (titre AppBar fixe) survit au scroll.
- swipe:
    direction: UP
    duration: 400
- assertVisible:
    id: "retraite-anchor"

# C4 — Pas de cul-de-sac : le tap back (safePop) navigue hors de /retraite vers
# `/home` (home_route_state) — écran réel, navigable. Leading `retraite-back` ciblable
# par id (AppBar fixe). Atterrissage = /home (le profil hydraté supprime le détour /onb).
- tapOn:
    id: "retraite-back"
- extendedWaitUntil:
    visible:
      id: "home_route_state"
    timeout: 15000
- assertNotVisible:
    text: "Page introuvable"
- assertNotVisible:
    text: "NoSuchMethodError"
