# tools/simulator/flows/maestro-perfect-set/flow_mint2_first_experience_rente_capital_entry.yaml
#
# PURPOSE
# Deterministic runtime proof for Mint 2.0 first experience:
# landing -> Mint 2.0 axes -> LPP/rente-capital -> /retraite/rente-vs-capital.
#
# PRE-CONDITION
# - Debug app ch.mint.app installed on the exact iPhone 13 mini simulator.
# - Fresh app state; this flow calls launchApp clearState:true.
# - Required build defines:
#     --dart-define=MINT_DISABLE_BETA_MODAL=true
#     --dart-define=MINT_E2E_MINT2_FIRST_EXPERIENCE=true
#     --dart-define=MINT_E2E_PROOF_ANCHORS=true

appId: ch.mint.app
tags:
  - mint2
  - first-experience
  - rente-vs-capital
  - iphone13mini
  - runtime-proof
---

- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Je comprends, on y va"
    commands:
      - tapOn: "Je comprends, on y va"
      - waitForAnimationToEnd

# 01 — fresh first screen observed.
- extendedWaitUntil:
    visible:
      text: "Parle à Mint"
    timeout: 10000
- takeScreenshot: "01-mint2-first-screen"

# 02 — enter Mint 2.0 first experience.
- tapOn:
    text: "Parle à Mint"
- extendedWaitUntil:
    visible:
      text: "Un premier aperçu suisse."
    timeout: 10000
- assertVisible:
    text: "Un premier aperçu suisse."
- takeScreenshot: "02-mint2-entry"

# Maestro/iOS omits this CTA from its hierarchy on iPhone 13 mini; the
# calibrated tap center is 200,620 in Maestro's screenshot tap grid.
- tapOn:
    point: "200, 620"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Choisis le sujet que tu veux éclairer d'abord.*"
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: "mint2-axis-lpp_rente_capital"
    timeout: 8000
- assertVisible:
    id: "mint2-axis-lpp_rente_capital"
- assertNotVisible:
    text: "CHF/mois"
- takeScreenshot: "03-mint2-lpp-axis"

# 03 — live LPP/rente-capital axis routes to the real RvC surface.
# Maestro/iOS projects the card resource-id/text bounds too low on iPhone 13
# mini; the calibrated screenshot point targets the first card's visual center.
- tapOn:
    point: "200, 292"
# Ancre d'arrivee = id INTERNE rvc_route_state (proof anchor, en tete d'arbre).
# Pilote AX (ADR 2026-07-30) : l'id racine rente_vs_capital_screen est retire
# (conteneur racine = effondrement de l'arbre AX sur iOS 26.2). rvc_route_state
# est present au repos ; le SliverAppBar reste (re-effondrement au scroll hors
# perimetre pilote — decide post-upgrade 3.44.8).
- extendedWaitUntil:
    visible:
      id: "rvc_route_state"
    timeout: 12000
- assertNotVisible:
    text: "Page introuvable"
- assertNotVisible:
    text: "NoSuchMethodError"
- assertNotVisible:
    text: "Créer ton compte"
- assertNotVisible:
    text: "CHF/mois"
- takeScreenshot: "04-rvc-route-state"
