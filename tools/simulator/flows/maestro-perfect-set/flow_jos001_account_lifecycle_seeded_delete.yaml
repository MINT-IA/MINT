# JOS-001: recovery -> register -> profile seal -> privacy delete.

appId: ch.mint.app
tags:
  - jos-001
  - account-lifecycle
  - runtime
---

- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 6000
- runFlow:
    when:
      visible: "Je comprends, on y va"
    commands:
      - tapOn: "Je comprends, on y va"

- openLink: "mintapp:///auth/forgot-password"
- runFlow:
    when:
      visible: "Ouvrir"
    commands:
      - tapOn: "Ouvrir"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Réinitialiser le mot de passe"
    timeout: 12000
- assertVisible: "Envoyer le lien de réinitialisation"

- openLink: "mintapp:///auth/register?e2e_email=${MINT_E2E_EMAIL}"
- runFlow:
    when:
      visible: "Ouvrir"
    commands:
      - tapOn: "Ouvrir"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Créer ton compte"
    timeout: 12000
- extendedWaitUntil:
    visible: { id: "auth_register_email_field" }
    timeout: 8000
- tapOn:
    id: "auth_register_email_field"
- waitForAnimationToEnd:
    timeout: 1000
- assertNotVisible: "Créer avec e-mail"
- waitForAnimationToEnd:
    timeout: 20000
- assertNotVisible: "Vérifier mon e-mail"

- extendedWaitUntil:
    visible: "Un premier aperçu suisse."
    timeout: 12000
- takeScreenshot: "jos001-first-value-after-register"

- openLink: "mintapp:///profile/privacy-control"
- runFlow:
    when:
      visible: "Ouvrir"
    commands:
      - tapOn: "Ouvrir"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Ce que MINT sait de toi"
    timeout: 12000
- openLink: "mintapp:///profile/privacy"
- runFlow:
    when:
      visible: "Ouvrir"
    commands:
      - tapOn: "Ouvrir"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Ma vie privée"
    timeout: 12000
- assertVisible: "Supprimer mon compte"
- tapOn:
    point: "185, 424"
- extendedWaitUntil:
    visible: "Supprimer le compte.*"
    timeout: 8000
- tapOn:
    point: "244, 537"
- waitForAnimationToEnd:
    timeout: 20000
- openLink: "mintapp:///auth/forgot-password"
- extendedWaitUntil:
    visible: "Réinitialiser le mot de passe"
    timeout: 12000
- assertNotVisible: "Supprimer mon compte"
