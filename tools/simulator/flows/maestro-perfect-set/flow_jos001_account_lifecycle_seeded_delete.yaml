# JOS-001: recovery -> register -> profile seal -> privacy delete.

appId: ch.mint.app
tags:
  - jos-001
  - account-lifecycle
  - runtime
---

- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 6000
- runFlow:
    when:
      visible: "Je comprends, on y va"
    commands:
      - tapOn: "Je comprends, on y va"

- openLink: "mintapp:///auth/forgot-password"
- runFlow:
    when:
      visible: "Ouvrir"
    commands:
      - tapOn: "Ouvrir"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Réinitialiser le mot de passe"
    timeout: 12000
- assertVisible: "Envoyer le lien de réinitialisation"

- openLink: "mintapp:///auth/register"
- runFlow:
    when:
      visible: "Ouvrir"
    commands:
      - tapOn: "Ouvrir"
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Créer ton compte"
    timeout: 12000
- runFlow:
    when:
      visible: "Créer avec e-mail"
    commands:
      - tapOn: "Créer avec e-mail"
- extendedWaitUntil:
    visible: "Adresse e-mail"
    timeout: 8000
- tapOn: ".*J'ai lu et j'accepte.*"
- tapOn: ".*Je confirme avoir 18 ans.*"
- tapOn: "Adresse e-mail"
- inputText: ${MINT_E2E_EMAIL}
- pressKey: Enter
- tapOn: "Prénom"
- inputText: "Jos001"
- pressKey: Enter
- tapOn: { point: "50%,69%" }
- tapOn: "Valider"
- scrollUntilVisible:
    element: { text: "Mot de passe" }
    direction: DOWN
    timeout: 8000
- tapOn: "Mot de passe"
- inputText: ${MINT_E2E_PASSWORD}
- pressKey: Enter
- tapOn: "Confirmer le mot de passe"
- inputText: ${MINT_E2E_PASSWORD}
- pressKey: Enter
- extendedWaitUntil:
    visible: "Créer mon compte"
    timeout: 5000
- tapOn: "Créer mon compte"
- waitForAnimationToEnd:
    timeout: 20000
- assertNotVisible: "Vérifier mon e-mail"

- extendedWaitUntil:
    visible: { id: "onboarding-entry-open" }
    timeout: 12000
- tapOn: { id: "onboarding-entry-open" }
- extendedWaitUntil:
    visible: { id: "onboarding-intent-explorer" }
    timeout: 5000
- tapOn: { id: "onboarding-intent-explorer" }
- extendedWaitUntil:
    visible: ".*États-Unis.*"
    timeout: 5000
- tapOn: "Non"
- extendedWaitUntil:
    visible: "Suisse"
    timeout: 5000
- tapOn: "Suisse"
- extendedWaitUntil:
    visible: "Salarié"
    timeout: 5000
- tapOn: "Salarié"
- extendedWaitUntil:
    visible: "Marié"
    timeout: 5000
- tapOn: "Marié"
- extendedWaitUntil:
    visible: "Non, toujours en Suisse"
    timeout: 5000
- tapOn: "Non, toujours en Suisse"
- extendedWaitUntil:
    visible: "Choisir ma date"
    timeout: 5000
- tapOn: "Choisir ma date"
- extendedWaitUntil:
    visible: "OK"
    timeout: 5000
- tapOn: ".*15.*juillet.*1992.*"
- tapOn: "OK"
- extendedWaitUntil:
    visible: "15.07.1992"
    timeout: 5000
- tapOn: { id: "onboarding-dob-continue" }
- extendedWaitUntil:
    visible: { id: "onboarding-canton-vd" }
    timeout: 5000
- tapOn: { id: "onboarding-canton-vd" }
- extendedWaitUntil:
    visible: { id: "onboarding-revenue-range-continue" }
    timeout: 5000
- tapOn: { id: "onboarding-revenue-range-continue" }
- extendedWaitUntil:
    visible: { id: "onboarding-insight-view" }
    timeout: 8000
- tapOn: { id: "onboarding-insight-view" }
- extendedWaitUntil:
    visible: "Ce que Mint peut déjà situer"
    timeout: 8000
- tapOn: { id: "onboarding-scene-continue" }
- extendedWaitUntil:
    visible: { id: "onboarding-bifurcation-continue" }
    timeout: 8000
- tapOn: { id: "onboarding-bifurcation-continue" }
- extendedWaitUntil:
    visible: { id: "coach_chat_screen" }
    timeout: 15000

- openLink: "mintapp:///profile/privacy-control"
- extendedWaitUntil:
    visible: "Ce que MINT sait de toi"
    timeout: 12000
- openLink: "mintapp:///profile/privacy"
- extendedWaitUntil:
    visible: "Ma vie privée"
    timeout: 12000
- assertVisible: "Supprimer mon compte"
- tapOn: "Supprimer mon compte"
- extendedWaitUntil:
    visible: "Supprimer le compte.*"
    timeout: 8000
- tapOn: "Supprimer"
- waitForAnimationToEnd:
    timeout: 20000
- openLink: "mintapp:///auth/forgot-password"
- extendedWaitUntil:
    visible: "Réinitialiser le mot de passe"
    timeout: 12000
- assertNotVisible: "Supprimer mon compte"
