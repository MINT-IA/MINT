# tools/simulator/flows/maestro-perfect-set/flow_drawer_navigation_smoke.yaml
#
# ─── PURPOSE ───────────────────────────────────────────────────────────
# Validates ProfileDrawer routing from the persistent shell.
# For each user-facing drawer entry, taps it, asserts the destination
# screen renders a known anchor, then navigates back so the next entry
# can be exercised.
#
# Catches :
#   - GoRouter regressions on /profile, /profile/bilan, /documents,
#     /coach/history, /settings/langue, /profile/privacy-control.
#   - Drawer i18n drift (entries renamed in app_fr.arb without updating
#     the drawer widget).
#
# ─── ARCHETYPE SCOPE ───────────────────────────────────────────────────
# Archetype-agnostic. Drawer entries are static modulo two gates :
#   - « Couple » entry : only when `profile.isCouple` (skipped here)
#   - « Clé API »      : only when FeatureFlags.enableByok (skipped here)
# Both intentionally NOT asserted ; default builds ship them off.
#
# ─── EXPECTED DURATION ─────────────────────────────────────────────────
# ~45s wall-clock (6 entries × ~6s each + drawer open/close + 5 shots).
#
# ─── PRE-CONDITION ─────────────────────────────────────────────────────
# - App installed on booted iPhone 17 Pro sim, bundle id ch.mint.app
# - User on a screen that mounts MintShell (i.e. one of /home,
#   /mon-argent, /coach/chat, /explore). Drawer is `endDrawer:` on
#   the shell, opened via the person_outline icon in AppBar actions.
# - Anonymous mode is fine (drawer renders without auth — header just
#   shows « Pas de profil »). « Se connecter » entry visible if logged
#   out, « Se déconnecter » if logged in. We test the layout-stable
#   entries only.
#
# ─── LOCATOR STRATEGY ──────────────────────────────────────────────────
# Drawer is opened by tapping the person icon in /explore AppBar.
# This screen is the most reliable launchpad : its AppBar always
# carries the icon (explorer_screen.dart:24) and the screen is reachable
# in 1 tab tap from any starting state.
#
# Drawer entries (literal FR text from app_fr.arb) :
#   « Mon profil »                  → /profile (redirects to /profile/bilan)
#   « Mon bilan »                   → /profile/bilan
#   « Mes documents »               → /documents
#   « Historique coach »            → /coach/history
#   « Langue »                      → /settings/langue
#   « Ce que MINT sait de toi »     → /profile/privacy-control
#
# Destination assertions are stable AppBar / hero strings on each screen.
# Back navigation : Maestro `back` action (sim-level back gesture).
#
# ─── OUTPUT ────────────────────────────────────────────────────────────
# Screenshots :
#   .planning/walker/maestro-flows/drawer-navigation-smoke/<run-id>/
#     ├── 01-explore-home.png
#     ├── 02-drawer-open.png
#     ├── 03-mon-bilan.png
#     ├── 04-documents.png
#     └── 05-privacy-control.png

appId: ch.mint.app
tags:
  - drawer
  - navigation
  - smoke
  - regression-guard
  - anon
---

# 00 — start at /explore (MintShell tab 4). Tap Explorer tab.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      text: "Voir clair, décider seul."
    timeout: 8000
# Tap landing CTA to enter shell ; the anon path lands us on
# /anonymous/chat which is OUTSIDE MintShell. We need the shell, so
# instead we go via /explore directly via the bottom tab bar after
# entering the shell. Path : tap « J'ai déjà un compte » → cancel →
# back to landing → bypass via `MINT_DISABLE_BETA_MODAL` is not
# enough. Simpler : skip the anon path and use the bottom tab bar
# directly from any shell-mounted screen.
#
# REALITY CHECK : MintShell is only mounted on /home, /mon-argent,
# /coach/chat, /explore (per app.dart:379-455). All four are auth-
# gated except /explore which is `RouteScope.public`. Cleanest entry
# from cold-launched anon is: tap landing CTA → anon chat (no shell)
# → ❌ no drawer there. So this flow REQUIRES the user to already be
# inside the shell.
#
# RECOMMENDED HARNESS WIRING :
#   The harness passes `MINT_E2E_INITIAL_ROUTE=/explore` dart-define
#   (NOT YET WIRED in lib/main.dart — verified 2026-05-08 grep). Until
#   that lands, this flow expects the harness to deep-link via :
#     `xcrun simctl openurl booted ch.mint.app://explore`
#   before invoking maestro test. If the deep-link is not wired either,
#   the flow as-written below will fail at step 01 with « Explorer »
#   not found, which is the correct loud signal.

# 01 — assert we're on /explore (harness pre-conditioned) + drawer icon present
- extendedWaitUntil:
    visible:
      text: "Explorer"
    timeout: 8000
- takeScreenshot: "01-explore-home"

# 02 — open drawer via person icon
# explorer_screen.dart:24-27 — IconButton(icon: person_outline) in AppBar actions
- tapOn:
    id: "endDrawerButton"
    optional: true
# Fallback : tap the icon by its accessibility role
- tapOn:
    text: "Profil"          # person icon Semantics tooltip (Material default)
    optional: true
# Last resort : tap the AppBar trailing region
- tapOn:
    point: "95%, 8%"
    optional: true
- assertVisible:
    text: "Mon profil"      # drawerMyProfile — first drawer entry
    timeout: 4000
- takeScreenshot: "02-drawer-open"

# 03 — Mon bilan → /profile/bilan
- tapOn:
    text: "Mon bilan"
- assertVisible:
    text: "Aucun profil renseigné"  # financialSummaryNoProfile (anon = empty)
    timeout: 6000
- takeScreenshot: "03-mon-bilan"
- back

# 04 — re-open drawer + Mes documents → /documents
- tapOn:
    text: "Profil"
    optional: true
- tapOn:
    point: "95%, 8%"
    optional: true
- tapOn:
    text: "Mes documents"
- assertVisible:
    text: "Mes documents"            # documents screen AppBar
    timeout: 6000
- takeScreenshot: "04-documents"
- back

# 05 — re-open drawer + Historique coach → /coach/history
- tapOn:
    text: "Profil"
    optional: true
- tapOn:
    point: "95%, 8%"
    optional: true
- tapOn:
    text: "Historique coach"
- extendedWaitUntil:
    visible:
      text: "Historique"
    timeout: 6000
- back

# 06 — re-open drawer + Langue → /settings/langue
- tapOn:
    text: "Profil"
    optional: true
- tapOn:
    point: "95%, 8%"
    optional: true
- tapOn:
    text: "Langue"
- extendedWaitUntil:
    visible:
      text: "Langue"
    timeout: 6000
- back

# 07 — re-open drawer + Ce que MINT sait de toi → /profile/privacy-control
- tapOn:
    text: "Profil"
    optional: true
- tapOn:
    point: "95%, 8%"
    optional: true
- tapOn:
    text: "Ce que MINT sait de toi"
- extendedWaitUntil:
    visible:
      text: "Ce que MINT sait de toi"
    timeout: 6000
- takeScreenshot: "05-privacy-control"
- back

# ─── KNOWN LIMITATION ──────────────────────────────────────────────────
# This flow uses `point:` as a last-resort fallback for tapping the
# AppBar profile icon. That violates the « semantic locators ONLY » rule
# from .planning/phases/74-walker-premier-eclairage/PANEL-VERDICT.md.
# Fix-forward (DEFERRED, not done in this flow design pass) :
#   wrap the IconButton in screens/explore/explorer_screen.dart:24-27
#   in `Semantics(label: 'open-profile-drawer', button: true, child: …)`
#   then the locator becomes `text: "open-profile-drawer"`. Until that
#   ships, the `point:` fallback is the working workaround and the flow
#   should be marked « has-pixel-fallback » in the gate report.
