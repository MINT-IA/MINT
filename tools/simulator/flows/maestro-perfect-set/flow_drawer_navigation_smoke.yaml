# tools/simulator/flows/maestro-perfect-set/flow_drawer_navigation_smoke.yaml
#
# ─── PURPOSE ───────────────────────────────────────────────────────────
# Validates ProfileDrawer routing from the persistent shell.
# For each user-facing drawer entry, taps it, asserts the destination
# screen renders a known anchor, then navigates back so the next entry
# can be exercised.
#
# Catches :
#   - GoRouter regressions on /profile, /profile/bilan, /documents,
#     /coach/history, /settings/langue, /profile/privacy-control.
#   - Drawer i18n drift (entries renamed in app_fr.arb without updating
#     the drawer widget).
#
# ─── ARCHETYPE SCOPE ───────────────────────────────────────────────────
# Archetype-agnostic. Drawer entries are static modulo two gates :
#   - « Couple » entry : only when `profile.isCouple` (skipped here)
#   - « Clé API »      : only when FeatureFlags.enableByok (skipped here)
# Both intentionally NOT asserted ; default builds ship them off.
#
# ─── EXPECTED DURATION ─────────────────────────────────────────────────
# ~45s wall-clock (6 entries × ~6s each + drawer open/close + 5 shots).
#
# ─── PRE-CONDITION ─────────────────────────────────────────────────────
# - App installed on booted iPhone 17 Pro sim, bundle id ch.mint.app
# - User on a screen that mounts MintShell (i.e. one of /home,
#   /mon-argent, /coach/chat, /explore). Drawer is `endDrawer:` on
#   the shell, opened via the person_outline icon in AppBar actions.
# - Anonymous mode is fine (drawer renders without auth — header just
#   shows « Pas de profil »). « Se connecter » entry visible if logged
#   out, « Se déconnecter » if logged in. We test the layout-stable
#   entries only.
#
# ─── LOCATOR STRATEGY ──────────────────────────────────────────────────
# Drawer is opened by tapping the person icon in /explore AppBar.
# This screen is the most reliable launchpad : its AppBar always
# carries the icon (explorer_screen.dart:24) and the screen is reachable
# in 1 tab tap from any starting state.
#
# Drawer entries (literal FR text from app_fr.arb) :
#   « Mon profil »                  → /profile (redirects to /profile/bilan)
#   « Mon bilan »                   → /profile/bilan
#   « Mes documents »               → /documents
#   « Historique coach »            → /coach/history
#   « Langue »                      → /settings/langue
#   « Ce que MINT sait de toi »     → /profile/privacy-control
#
# Destination assertions are stable AppBar / hero strings on each screen.
# Back navigation : Maestro `back` action (sim-level back gesture).
#
# ─── OUTPUT ────────────────────────────────────────────────────────────
# Screenshots :
#   .planning/walker/maestro-flows/drawer-navigation-smoke/<run-id>/
#     ├── 01-explore-home.png
#     ├── 02-drawer-open.png
#     ├── 03-mon-bilan.png
#     ├── 04-documents.png
#     └── 05-privacy-control.png

appId: ch.mint.app
tags:
  - drawer
  - navigation
  - smoke
  - regression-guard
  - anon
---

# 00 — cold-launch and deep-link to /explore.
#
# The old bootstrap reused `_fragment_cold_launch_to_aujourdhui.yaml`,
# but that fragment is now stale for this flow: the landing CTA
# « Continuer sans compte » intentionally routes to /onb so the FATCA
# gate runs before financial data capture. Drawer smoke does not need
# onboarding data; it only needs a shell-mounted public route. Use the
# registered custom scheme instead, matching the data-spine Maestro flow.
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 6000
- runFlow:
    when:
      visible: "Je comprends, on y va"
    commands:
      - tapOn: "Je comprends, on y va"
      - waitForAnimationToEnd
- openLink: "mintapp:///explore"
- runFlow:
    when:
      visible: "Ouvrir"
    commands:
      - tapOn: "Ouvrir"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd

# 01 — assert we're on /explore (harness pre-conditioned) + drawer icon present
- extendedWaitUntil:
    visible:
      text: "Explorer"
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: "ouvrir-profil-drawer"
    timeout: 5000
- takeScreenshot: "01-explore-home"

# 02 — open drawer via person icon
# explorer_screen.dart:24-36 — IconButton wrapped in Semantics with
#   identifier: 'ouvrir-profil-drawer' (machine selector) + a LOCALISED
#   a11y label (D11, plan 17). Locator switched text: → id: accordingly.
- tapOn:
    id: "ouvrir-profil-drawer"
- extendedWaitUntil:
    visible:
      text: "Mon profil"      # drawerMyProfile — first drawer entry
    timeout: 4000
- takeScreenshot: "02-drawer-open"

# 03 — Mon bilan → /profile/bilan
- tapOn:
    text: "Mon bilan"
- extendedWaitUntil:
    visible:
      text: "MA SITUATION"  # stable route AppBar, seeded or empty profile
    timeout: 6000
- takeScreenshot: "03-mon-bilan"
- openLink: "mintapp:///explore"
- extendedWaitUntil:
    visible:
      id: "ouvrir-profil-drawer"
    timeout: 5000

# 04 — re-open drawer + Mes documents → /documents
- tapOn:
    id: "ouvrir-profil-drawer"
- tapOn:
    text: "Mes documents"
- extendedWaitUntil:
    visible:
      text: "Coffre-fort"              # documents screen AppBar
    timeout: 6000
- takeScreenshot: "04-documents"
- openLink: "mintapp:///explore"
- extendedWaitUntil:
    visible:
      id: "ouvrir-profil-drawer"
    timeout: 5000

# 05 — re-open drawer + Historique coach → /coach/history
- tapOn:
    id: "ouvrir-profil-drawer"
- tapOn:
    text: "Historique coach"
- extendedWaitUntil:
    visible:
      text: "Historique"
    timeout: 6000
- openLink: "mintapp:///explore"
- extendedWaitUntil:
    visible:
      id: "ouvrir-profil-drawer"
    timeout: 5000

# 06 — re-open drawer + Langue → /settings/langue
- tapOn:
    id: "ouvrir-profil-drawer"
- tapOn:
    text: "Langue"
- extendedWaitUntil:
    visible:
      text: "Langue"
    timeout: 6000
- openLink: "mintapp:///explore"
- extendedWaitUntil:
    visible:
      id: "ouvrir-profil-drawer"
    timeout: 5000

# 07 — re-open drawer + Ce que MINT sait de toi → /profile/privacy-control
- tapOn:
    id: "ouvrir-profil-drawer"
- tapOn:
    text: "Ce que MINT sait de toi"
- extendedWaitUntil:
    visible:
      text: "Ce que MINT sait de toi"
    timeout: 6000
- takeScreenshot: "05-privacy-control"

# ─── PIXEL FALLBACK REMOVED (2026-05-09) ───────────────────────────────
# The previous version of this flow used `point: "95%, 8%"` to tap the
# AppBar profile icon, plus an optional `text: "Profil"` fallback. Both
# violated the « semantic locators ONLY » rule from
# .planning/phases/74-walker-premier-eclairage/PANEL-VERDICT.md.
#
# Fix shipped 2026-05-09 (Maestro paroxysm panel synthesis Tier 1),
# updated 2026-06-11 (D11, plan 17) :
#   apps/mobile/lib/screens/explore/explorer_screen.dart:24-36 wraps the
#   IconButton in `Semantics(identifier: 'ouvrir-profil-drawer', label: <localised>)`.
#   The a11y label is now LOCALISED (no raw key leaked to VoiceOver), so the
#   stable machine locator is `id: "ouvrir-profil-drawer"` (Maestro matches
#   the Flutter Semantics identifier via the accessibility-id matcher).
#
# ─── BOOTSTRAP CONTRACT (2026-05-24) ──────────────────────────────────
# This flow is now self-bootstrapping:
#   1. cold launch with cleared state,
#   2. dismiss optional beta modal,
#   3. deep-link via `mintapp:///explore`,
#   4. dismiss the optional iOS scheme confirmation dialog,
#   5. assert the Explorer AppBar and drawer semantics anchor.
#
# Do not rewire this through the landing CTA. That CTA intentionally
# routes to /onb so the FATCA hard gate runs before financial data
# capture; drawer navigation smoke should stay independent from the
# onboarding step machine.
