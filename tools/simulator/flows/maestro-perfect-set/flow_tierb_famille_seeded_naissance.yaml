# tools/simulator/flows/maestro-perfect-set/flow_tierb_famille_seeded_naissance.yaml
#
# TIER B smoke SEEDÉ — lot B1 Famille — event `birth` (route /naissance).
# Variante SEEDÉE `famille_bern` du smoke julien_swiss (flow_tierb_famille_naissance).
# Prouve le critère C2 « chiffré » que la persona célibataire ne pouvait pas
# atteindre (gate P2 dur). Cadrage : .planning/phases/mint-utilisable-tier-b-smoke.
#
# ─── BUILD (seed famille_bern requis — un build = un seed) ──────────────
#   cd apps/mobile && CODE_SIGNING_ALLOWED=NO flutter build ios --debug \
#     --simulator --no-codesign \
#     --dart-define=API_BASE_URL=https://mint-staging.up.railway.app/api/v1 \
#     --dart-define=MINT_E2E_ARCHETYPE=famille_bern \
#     --dart-define=MINT_E2E_PROOF_ANCHORS=true
#   Runner : `tools/simulator/maestro_sweep.sh tierb-famille-seeded`.
#
# ─── C2 CHIFFRÉ (le delta vs le smoke julien_swiss) ────────────────────
#   famille_bern : Sarah, 38 ans, BE, 9'500 brut/mois, genre F. Le congé APG
#   (onglet Congé, par défaut) se calcule seul (salaire dans [2000,15000] + rôle
#   parental F seedés — fil q_gender câblé #1135) : maternité 14 sem., APG
#   plafonné 220 CHF/j × 98 j = CHF 21'560. L'ancre régionale `naissance-result`
#   (posée sur le hero du congé, présente UNIQUEMENT via le render-gate, jamais
#   sur la carte de situation) prouve le résultat chiffré. Le montant 21'560 est
#   asserté en second (chiffre déterministe).

appId: ch.mint.app
tags:
  - tier-b
  - smoke
  - famille
  - seeded
  - famille-seeded
  - feature:birth
---

- launchApp:
    clearState: true
- openLink: "mintapp:///home"
- extendedWaitUntil:
    visible:
      id: "home_route_state"
    timeout: 40000
- assertNotVisible:
    text: "Page introuvable"
- assertNotVisible:
    text: "NoSuchMethodError"

# C1 — Atteignable : deeplink canonique /naissance.
- openLink: "mintapp:///naissance"
- extendedWaitUntil:
    visible:
      id: "naissance-anchor"
    timeout: 15000

# C3 — Zéro terme banni LSFin (miroir canonique check_banned_terms : famille
# « garanti* » seule ; voir flow_tierb_famille_naissance.yaml pour le rationale).
- assertNotVisible:
    text: "(?i).*garanti.*"

# C2 — Chiffré : le hero du congé APG rend seul sous famille_bern. On scrolle
# jusqu'à l'ancre régionale (Maestro ne dumpe que les nœuds à l'écran → un
# extendedWaitUntil ne scrolle pas, il FAUT scrollUntilVisible).
- scrollUntilVisible:
    element:
      id: "naissance-result"
    direction: DOWN
    timeout: 20000
    centerElement: true
# Chiffre déterministe : APG plafonné 220 CHF/j × 98 j = 21'560 (apostrophe
# suisse ASCII ; NBSP après « CHF » → on asserte le nombre seul).
- assertVisible:
    text: ".*21'560.*"

# C4 — Pas de cul-de-sac : bouton retour identifié → /home. On scrolle d'abord
# vers le HAUT (le résultat était sous la flottaison → la barre AppBar, avec son
# bouton retour, est remontée hors-vue par le scroll précédent).
- scrollUntilVisible:
    element:
      id: "naissance-back"
    direction: UP
    timeout: 20000
- tapOn:
    id: "naissance-back"
- extendedWaitUntil:
    visible:
      id: "home_route_state"
    timeout: 15000
