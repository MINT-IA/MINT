appId: ch.mint.app
tags:
  - mint-next-lpp-affiliation
  - runtime-proof
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Je comprends, on y va"
    commands:
      - tapOn: "Je comprends, on y va"
      - waitForAnimationToEnd
- openLink: "mintapp:///__e2e/row23-independent-no-lpp-profile?slug=cadre_salarie_lpp_suisse_ready"
- runFlow:
    when:
      visible: "Ouvrir"
    commands:
      - tapOn: "Ouvrir"
- extendedWaitUntil:
    visible:
      id: "e2e_profile_fixture_applied"
    timeout: 15000
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 10000
- openLink: "mintapp:///mint-next/lpp-affiliation"
- waitForAnimationToEnd:
    timeout: 5000
- openLink: "mintapp:///mint-next/lpp-affiliation"
- extendedWaitUntil:
    visible:
      id: "node:lpp_affiliation.collect"
    timeout: 15000
- tapOn:
    id: "input:lpp_affiliation.yes"
- scrollUntilVisible:
    element:
      id: "action:lpp_affiliation.continue"
    direction: DOWN
# hideKeyboard iOS peut fermer le clavier en tapant hors champ — parfois sur
# Continuer lui-même. Le tap devient conditionnel : seulement si la review
# n'est pas déjà affichée.
- runFlow:
    when:
      notVisible:
        id: "node:lpp_affiliation.review"
    commands:
      - tapOn:
          id: "action:lpp_affiliation.continue"
- extendedWaitUntil:
    visible:
      id: "node:lpp_affiliation.review"
    timeout: 5000
- tapOn:
    id: "action:lpp_affiliation.confirm"
- extendedWaitUntil:
    visible:
      id: "node:lpp_affiliation.saved"
    timeout: 10000
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 10000
- openLink: "mintapp:///mon-argent"
- waitForAnimationToEnd:
    timeout: 5000
- openLink: "mintapp:///mon-argent"
- waitForAnimationToEnd:
    timeout: 5000
- openLink: "mintapp:///mon-argent"
- extendedWaitUntil:
    visible:
      id: "mon_argent_lpp_affiliation_fact"
    timeout: 20000
- takeScreenshot: "${OUTPUT_DIR}/01-created-visible"
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 10000
- openLink: "mintapp:///mon-argent"
- waitForAnimationToEnd:
    timeout: 5000
- openLink: "mintapp:///mon-argent"
- waitForAnimationToEnd:
    timeout: 5000
- openLink: "mintapp:///mon-argent"
- extendedWaitUntil:
    visible:
      id: "mon_argent_lpp_affiliation_fact"
    timeout: 15000
- takeScreenshot: "${OUTPUT_DIR}/02-cold-relaunch-visible"
- tapOn:
    id: "action:mon_argent.lpp_affiliation.edit"
- extendedWaitUntil:
    visible:
      id: "node:lpp_affiliation.saved"
    timeout: 8000
- tapOn:
    id: "action:lpp_affiliation.edit"
- extendedWaitUntil:
    visible:
      id: "node:lpp_affiliation.collect"
    timeout: 5000
- tapOn:
    id: "input:lpp_affiliation.no"
- scrollUntilVisible:
    element:
      id: "action:lpp_affiliation.continue"
    direction: DOWN
- runFlow:
    when:
      notVisible:
        id: "node:lpp_affiliation.review"
    commands:
      - tapOn:
          id: "action:lpp_affiliation.continue"
- extendedWaitUntil:
    visible:
      id: "node:lpp_affiliation.review"
    timeout: 5000
- tapOn:
    id: "action:lpp_affiliation.confirm"
- extendedWaitUntil:
    visible:
      id: "node:lpp_affiliation.saved"
    timeout: 10000
- openLink: "mintapp:///mon-argent"
- waitForAnimationToEnd:
    timeout: 4000
- openLink: "mintapp:///mon-argent"
- extendedWaitUntil:
    visible:
      id: "mon_argent_lpp_affiliation_fact"
    timeout: 12000
- takeScreenshot: "${OUTPUT_DIR}/03-edited-visible"
- tapOn:
    id: "action:mon_argent.lpp_affiliation.delete"
- extendedWaitUntil:
    visible: "Supprimer ta réponse ?"
    timeout: 5000
- tapOn:
    text: "^Supprimer$"
- extendedWaitUntil:
    notVisible: "Supprimer ta réponse ?"
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: "mon_argent_lpp_affiliation_fact"
    timeout: 10000
- takeScreenshot: "${OUTPUT_DIR}/04-deleted-absent"
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 10000
- openLink: "mintapp:///mon-argent"
- waitForAnimationToEnd:
    timeout: 5000
- openLink: "mintapp:///mon-argent"
- waitForAnimationToEnd:
    timeout: 5000
- openLink: "mintapp:///mon-argent"
- extendedWaitUntil:
    notVisible:
      id: "mon_argent_lpp_affiliation_fact"
    timeout: 12000
- takeScreenshot: "${OUTPUT_DIR}/05-delete-survives-relaunch"
