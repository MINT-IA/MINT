# tools/simulator/flows/maestro-perfect-set/flow_lpp_scan_review.yaml
#
# ─── PURPOSE ───────────────────────────────────────────────────────────
# Validates the document-scan → extraction-review → save flow :
#   /scan → tap « Utiliser un exemple de test » (debug-only seeded LPP) →
#   /scan/review → assert avoirLpp field detected → tap confirm.
#
# This validates :
#   - DocumentScanScreen → ExtractionReviewScreen routing with a real
#     ExtractionResult in `state.extra` (NOT the empty-extra fallback
#     « Document non disponible »).
#   - Field detection : avoirLpp / avoirLppTotal / avoirLppObligatoire
#     surface in the review with confidence badges.
#   - Confirm button persists to BiographyProvider + CoachProfileProvider
#     (signal : after confirm, drawer header reflects the change — but
#     that assertion is OUT OF SCOPE here, see Limitation note).
#
# ─── ARCHETYPE SCOPE ───────────────────────────────────────────────────
# Archetype-agnostic. The « example » button (`_onUseExamplePressed`,
# document_scan_screen.dart:571) ships a deterministic OCR string for
# the currently-selected DocumentType. Selecting LPP first, then tapping
# the example button, yields a Certificat LPP fixture with avoirLpp.
#
# ─── EXPECTED DURATION ─────────────────────────────────────────────────
# ~30s wall-clock (cold launch + deep-link + 4 taps + OCR processing
# spinner + review render).
#
# ─── PRE-CONDITION (CRITICAL — READ BEFORE RUNNING) ────────────────────
# 1. App build MUST be DEBUG (not release). The « Utiliser un exemple
#    de test » button is gated by `kDebugMode` (document_scan_screen.dart:
#    132). On a release/profile build the button is invisible and this
#    flow fails at step 03.
# 2. App installed on booted iPhone 17 Pro sim, bundle id ch.mint.app
# 3. Harness deep-links to /scan via :
#      `xcrun simctl openurl booted ch.mint.app://scan`
# 4. Recommended dart-defines (none required for the flow itself ;
#    archetype seeding is independent of the scan path) :
#      MINT_DISABLE_BETA_MODAL=true
#
# ─── LOCATOR STRATEGY ──────────────────────────────────────────────────
# Literal FR strings from app_fr.arb :
#   docScanAppBarTitle      = "SCANNER UN DOCUMENT"
#   docScanHeaderTitle      = "Améliore la précision de ton profil"
#   docScanDocumentType     = (label) — followed by ChoiceChips per type
#   docScanUseExample       = "Utiliser un exemple de test"   (debug only)
#   extractionReviewAppBar  = "VÉRIFICATION"
#   extractionReviewTitle   = "Vérifie les valeurs extraites"
#
# DocumentType labels are produced by `DocumentType.label` on the enum ;
# verified in document_models.dart (e.g. « Certificat LPP »). We tap the
# LPP chip first to constrain the example fixture.
#
# ─── OUTPUT ────────────────────────────────────────────────────────────
# Screenshots :
#   .planning/walker/maestro-flows/lpp-scan-review/<run-id>/
#     ├── 01-scan-screen.png
#     ├── 02-lpp-type-selected.png
#     ├── 03-example-tapped.png       (right after OCR processing starts)
#     ├── 04-extraction-review.png    (review screen rendered)
#     └── 05-confirmed.png            (post-confirm, route either home or
#                                      back to scan ; we just assert
#                                      review screen unmounted)

appId: ch.mint.app
tags:
  - scan
  - lpp
  - ocr
  - extraction-review
  - debug-only
---

# 01 — assert we're on /scan (harness pre-deep-linked)
- launchApp:
    clearState: false
- openLink: "mintapp:///scan"
- runFlow:
    when:
      visible:
        text: "Ouvrir"
    commands:
      - tapOn:
          text: "Ouvrir"
- runFlow:
    when:
      visible:
        text: "Open"
    commands:
      - tapOn:
          text: "Open"
- extendedWaitUntil:
    visible:
      text: "SCANNER UN DOCUMENT"
    timeout: 8000
- takeScreenshot: "01-scan-screen"

# 02 — LPP is the default selected document type on this screen.
# DocumentType.lppCertificate.label is currently
# "Certificat de prévoyance LPP"; no tap is required to constrain the
# seeded example fixture.
- takeScreenshot: "02-lpp-type-selected"

# 03 — tap the debug example button → seeded OCR string flows through
# `_processOcrText` → ExtractionResult → context.push('/scan/review').
# Network call to the parser endpoint is mocked in debug builds (or
# uses the local-parser path) — Maestro doesn't care which.
- scrollUntilVisible:
    element:
      text: "Utiliser un exemple de test"
    direction: DOWN
    timeout: 8000
- tapOn:
    text: "Utiliser un exemple de test"
- takeScreenshot: "03-example-tapped"

# 04 — wait for the extraction review screen. Processing takes 2-8s
# depending on whether the parser hits the local heuristic or the
# server endpoint. Generous timeout.
- extendedWaitUntil:
    visible:
      text: "VÉRIFICATION"
    timeout: 30000

# Field cards render labels via ExtractedField.fieldName ; for an LPP
# fixture we expect the canonical total-balance field label.
- extendedWaitUntil:
    visible:
      text: ".*Avoir de vieillesse total.*"
    timeout: 4000
- takeScreenshot: "04-extraction-review"

# 05 — tap the confirm button. Its label is rendered by `_buildConfirmButton`
# at extraction_review_screen.dart. The current visible text is
# "Confirmer et enrichir mon profil".
- scrollUntilVisible:
    element:
      text: ".*Confirmer.*"
    direction: DOWN
    timeout: 8000
- tapOn:
    text: ".*Confirmer.*"
- takeScreenshot: "05-confirmed"

# ─── KNOWN LIMITATIONS ─────────────────────────────────────────────────
# 1. Post-confirm assertion (avoirLpp shown in /profile/bilan or drawer)
#    is INTENTIONALLY omitted. After Confirm, the screen pops back —
#    asserting profile state requires a fresh navigation to /profile/bilan
#    AND the post-confirm provider rebroadcast to settle. This belongs
#    in a DIFFERENT flow (flow_lpp_post_save_profile.yaml, deferred).
#    Right now we only validate « scan + review render + confirm tap
#    succeeds » which is the high-value gate.
#
# 2. Debug-only build dependency : if a release build is shipped to a
#    Maestro Cloud agent, this flow must be skipped or replaced with a
#    « Coller le texte OCR » path (production-safe button at
#    document_scan_screen.dart:339, l10n.docScanPasteOcrText). That
#    alternate path is NOT scripted here ; left as TODO for the
#    journalist-defense set.
#
# 3. No `assertVisible: avoirLpp` literal value (e.g. "120 000 CHF").
#    The seeded example fixture's exact numeric values are version-
#    dependent ; asserting them creates flake. We assert the FIELD
#    LABEL exists (« LPP ») which is structurally stable.
