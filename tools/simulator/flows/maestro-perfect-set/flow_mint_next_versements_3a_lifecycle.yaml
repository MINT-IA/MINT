    timeout: 20000
- takeScreenshot: "${OUTPUT_DIR}/02-cold-relaunch-visible"
# Correction ciblée : la première entrée passe à 4'000 — total re-dérivé.
- tapOn:
    id: "action:mon_argent.versements_3a.manage"
- extendedWaitUntil:
    visible:
      id: "node:versements_3a.list"
