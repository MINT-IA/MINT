# tools/simulator/flows/maestro-perfect-set/flow_firstjob_tranche_acceptance_seeded.yaml
#
# FLOW CORE d'acceptation de la tranche verticale firstJob (promu depuis
# tools/simulator/flows/firstjob_tranche_acceptance_seeded.yaml, ADR AX iOS
# 26.2 Etape 2, 2026-07-30).
# Spec : .planning/phases/mint-2-0-first-experience-rente-capital/TRANCHE-FIRSTJOB-SPEC.md
#
# ─── PROMOTION _red -> CORE (2026-07-30) ───────────────────────────────
# La variante REELLE (ex firstjob_tranche_acceptance_red.yaml) marchait le
# parcours landing -> /onb -> /home ; INJOUABLE via locators semantiques
# (9/11 testIDs onb-* absents de apps/mobile/lib, cablage hors-tranche
# SPEC §3.1) -> jamais gate-able -> retiree. Ce flow SEEDE atterrit sur
# /home via le seed d'archetype et couvre la MEME portee d'acceptation
# (RED-1 carte /home -> RED-2 handoff coach) sans masquer de livrable :
# la carte life event et le CTA coach sont TAPES ci-dessous.
#
# Debloque par la migration SliverAppBar -> AppBar fixe (Scaffold.appBar)
# sur first_job_screen : l'arbre AX des routes poussees ne s'effondre plus
# au scroll sur iOS 26.2, donc le flow atteint les ancres INTERNES sous la
# flottaison (firstjob-net-value...). Preuve runtime maestro hierarchy
# (iPhone 16e / iOS 26.2) : first-job repos 53 noeuds -> apres scroll 58
# noeuds (6 ids resultat presents) ; flow VERT bout en bout.
#
# ─── BUILD (seed archetype requis, miroir walker) ──────────────────────
#   cd apps/mobile && CODE_SIGNING_ALLOWED=NO flutter build ios --debug \
#     --simulator --no-codesign \
#     --dart-define=API_BASE_URL=https://mint-staging.up.railway.app/api/v1 \
#     --dart-define=MINT_E2E_ARCHETYPE=jeune_diplome_zurich \
#     --dart-define=MINT_E2E_PROOF_ANCHORS=true
#   Runner sweep : `tools/simulator/maestro_sweep.sh firstjob` (tier seede
#   dedie, hors sweep normal — un app installe ne peut etre a la fois le
#   build normal et le build seede jeune_diplome_zurich, cf. tier fatca).
#
# ─── PORTEE PROUVEE ────────────────────────────────────────────────────
# T2 (/home shell) -> RED-1 (carte firstJob /home) -> /first-job
# (appareil de lucidite : net + confidence + millesime + pourquoi) ->
# RED-2 (CTA coach -> /coach/chat s'ouvre). La PARITE de contenu coach
# exige un backend staging a jour (endpoint /api/v1/lucidity/receipts) :
# hors de ce flow. Locators 100% semantiques, zero pixel.

appId: ch.mint.app
tags:
  - phase-1prime
  - tranche-firstjob
  - acceptance
  - seeded
  - core
  - feature:first-job
---

# ═══════════════════════════════════════════════════════════════════════
# 0. COLD LAUNCH SEEDE -> /home (guestEmpty shell navigable)
#    Le seed guestEmpty atterrit sur le landing (initialLocation `/`) ; on
#    rejoint le shell canonique /home par deeplink. Ce raccourci ne masque
#    AUCUN livrable de tranche : landing->/home releve de la decision
#    onboarding-canonique (HORS-tranche, testIDs onb-* non cables), tandis
#    que RED-1 (/home->/first-job) et RED-2 (/first-job->/coach) sont TAPES
#    plus bas. Contraste avec travail_triad qui deeplinke /first-job (ce qui
#    masquerait RED-1) : ici on deeplinke seulement l'entree du shell.
# ═══════════════════════════════════════════════════════════════════════
- launchApp:
    clearState: true
- openLink: "mintapp:///home"
- extendedWaitUntil:
    visible:
      id: "home_route_state"
    timeout: 40000
- assertNotVisible:
    text: "Page introuvable"
- assertNotVisible:
    text: "NoSuchMethodError"

# ═══════════════════════════════════════════════════════════════════════
# 1. RED-1 : /home -> /first-job (tap carte life event « Premier emploi »)
#    Preuve que LifeEventSuggestionsSection est montee (PR-D).
# ═══════════════════════════════════════════════════════════════════════
- scrollUntilVisible:
    element:
      id: "home-lifeevent-card-firstJob"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "home-lifeevent-card-firstJob"

# ═══════════════════════════════════════════════════════════════════════
# 2. /first-job — premier chiffre + appareil de lucidite
# ═══════════════════════════════════════════════════════════════════════
# 2a. Ancre d'ARRIVEE ecran = titre de l'AppBar (ADR AX 2026-07-30, Etape 2 :
#     SliverAppBar migre en AppBar fixe -> le titre reste a l'ecran au repos ET
#     au scroll, l'arbre AX ne s'effondre plus). L'id racine first_job_screen
#     reste retire (il effondrait l'arbre sur iOS 26.2).
- extendedWaitUntil:
    visible:
      text: "Premier emploi"
    timeout: 15000
# 2b. Premier chiffre (ancre temps/taps du seuil go/no-go). Le bloc resultat est
#     SOUS la flottaison (item 6) : on SCROLLE jusqu'a l'id INTERNE. Le scroll
#     est desormais sur (AppBar fixe -> arbre AX riche+stable, preuve runtime
#     maestro hierarchy : repos 53 noeuds -> apres scroll 58 noeuds, 6 ids
#     resultat presents). scrollUntilVisible asserte AUSSI la visibilite.
- scrollUntilVisible:
    element:
      id: "firstjob-premier-eclairage-value"
    direction: DOWN
    timeout: 15000
- assertVisible:
    text: ".*CHF.*"
# 2c. Source UNIQUE du net (PR-A anchor firstjob-net-value, ajoute PR-I).
- scrollUntilVisible:
    element:
      id: "firstjob-net-value"
    direction: DOWN
    timeout: 12000
# 2d. Appareil de lucidite (PR-C) : confidence + millesime + pourquoi.
- scrollUntilVisible:
    element:
      id: "firstjob-confidence-chip"
    direction: DOWN
    timeout: 12000
- scrollUntilVisible:
    element:
      id: "firstjob-source-vintage"
    direction: DOWN
    timeout: 12000
- scrollUntilVisible:
    element:
      id: "firstjob-why-net"
    direction: DOWN
    timeout: 12000
- tapOn:
    id: "firstjob-why-net"
- extendedWaitUntil:
    visible:
      id: "firstjob-why-net-body"
    timeout: 8000

# ═══════════════════════════════════════════════════════════════════════
# 3. RED-2 : /first-job -> /coach/chat (tap CTA « Demander au coach »)
#    Preuve que le handoff coach est cable (PR-E). La NAV est L1-local ;
#    le CONTENU coach (chiffre/parite) depend de staging -> hors flow.
# ═══════════════════════════════════════════════════════════════════════
- scrollUntilVisible:
    element:
      id: "firstjob-ask-coach"
    direction: DOWN
    timeout: 12000
- tapOn:
    id: "firstjob-ask-coach"
- extendedWaitUntil:
    visible:
      id: "coach_input_field"
    timeout: 20000
