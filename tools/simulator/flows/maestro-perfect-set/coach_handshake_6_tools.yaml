- inputText: "Comment optimiser mes piliers ensemble ?"
- tapOn:
    text: "(?i)Envoyer|Send"
- extendedWaitUntil:
    visible:
      text: "(?i)besoin de|peux-tu|tu peux me partager"
    timeout: 20000
- takeScreenshot: "03a-narrator-asks-cross-pillar"

- inputText: "42 ans, LPP 320'000, 3a 25'000, brut annuel 120'000"
- tapOn:
    text: "(?i)Envoyer|Send"
- extendedWaitUntil:
    visible:
      id: "coachCitationChip-cross_pillar"
    timeout: 20000
- takeScreenshot: "03b-chip-cross-pillar"

