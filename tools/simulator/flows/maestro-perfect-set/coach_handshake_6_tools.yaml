- tapOn:
    text: "(?i)Nouvelle conversation|Nouveau"
- inputText: "Avec ma conjointe, comment optimiser nos LPP ?"
- tapOn:
    text: "(?i)Envoyer|Send"
- extendedWaitUntil:
    visible:
      text: "(?i)besoin de|peux-tu|tu peux me partager"
