# tools/simulator/flows/maestro-perfect-set/flow_mon_argent_budget_setup_spine.yaml
#
# PURPOSE
# Runtime proof for the central MINT money surfaces:
# - Mon Argent renders the money-map tabs and their data-spine backed sections.
# - Budget setup exposes deterministic entry anchors, accepts fixed-charge
#   input, and renders the live fixed-charge total.
# - Direct /budget relaunch restores saved budget inputs.
# - The user can return to the coach surface with stable chat anchors.
# The flow runs with the deterministic `julien_swiss` E2E profile. It enters
# logement + LAMal and expects the Budget read model to preserve the seeded
# monthly resources instead of falling back to a generic income placeholder.
#
# PRE-CONDITION
# - App ch.mint.app installed on a booted iPhone simulator.
# - Recommended build:
#     --dart-define=MINT_E2E_ARCHETYPE=julien_swiss
#     --dart-define=MINT_DISABLE_BETA_MODAL=true
#
# LOCATOR STRATEGY
# Uses Flutter Semantics.identifier anchors instead of French copy where the
# surface is structural. This catches iOS accessibility drift and keeps the
# flow stable across microcopy changes.

appId: ch.mint.app
tags:
  - mon-argent
  - budget
  - data-spine
  - maestro-proof
  - phase-plan-vivant
---

- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 6000

- runFlow:
    when:
      visible: "Je comprends, on y va"
    commands:
      - tapOn: "Je comprends, on y va"
      - waitForAnimationToEnd

- openLink: "mintapp:///mon-argent"
- runFlow:
    when:
      visible: "Ouvrir"
    commands:
      - tapOn: "Ouvrir"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "mon_argent_screen"
    timeout: 12000
- assertVisible:
    id: "mon_argent_section_selector"
- assertVisible:
    id: "mon_argent_data_spine_summary"
- tapOn:
    id: "mon_argent_situation_expand"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: "mon_argent_situation_map"
- assertVisible:
    id: "mon_argent_situation_group_month"
- assertVisible:
    id: "mon_argent_situation_group_wealth"
- scroll
- assertVisible:
    id: "mon_argent_situation_group_pension"

- openLink: "mintapp:///mon-argent?section=month"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: "mon_argent_budget_summary"
- assertVisible:
    id: "mon_argent_budget_flow_bar"

- openLink: "mintapp:///mon-argent?section=wealth"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: "mon_argent_patrimoine_summary"

- openLink: "mintapp:///mon-argent?section=pension"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: "mon_argent_pension_map"

- openLink: "mintapp:///mon-argent?section=future"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: "mon_argent_trajectory_map"
- takeScreenshot: "mon-argent-01-data-spine"

- openLink: "mintapp:///budget/setup"
- extendedWaitUntil:
    visible:
      id: "budget_setup_screen"
    timeout: 12000
- assertVisible:
    id: "budget_housing_field"
- assertVisible:
    id: "budget_lamal_field"

- tapOn:
    id: "budget_housing_field"
- eraseText: 20
- inputText: "2200"
- tapOn:
    id: "budget_lamal_field"
- eraseText: 20
- inputText: "420"
- tapOn:
    text: "Revenus et charges fixes"

- extendedWaitUntil:
    visible:
      id: "budget_setup_live_total"
    timeout: 5000
- assertVisible:
    id: "budget_setup_save_button"
- assertVisible:
    id: "budget_setup_chat_fallback"
- takeScreenshot: "mon-argent-02-budget-setup"

- tapOn:
    id: "budget_setup_save_button"
- waitForAnimationToEnd:
    timeout: 6000

- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 6000

- openLink: "mintapp:///budget"
- extendedWaitUntil:
    visible:
      id: "budget_screen"
    timeout: 12000
- assertVisible:
    id: "budget_data_quality_banner"
- assertVisible:
    id: "budget_calculation_detail_toggle"
# Disclosure expansion is covered by
# `BudgetScreen exposes Maestro semantics anchors`. On iOS 26.2, Maestro can
# resolve this Flutter semantics id/text but did not dispatch the tap reliably.
# The device flow therefore validates the formula that is already visible.
- assertVisible:
    id: "budget_hero_formula"
- assertVisible:
    text: ".*3'482.*"
- assertVisible:
    text: ".*3'928.*"
- assertNotVisible: "19'272'200"
- assertNotVisible: "420'420"
- takeScreenshot: "mon-argent-03-budget-direct-relaunch"

- openLink: "mintapp:///coach/chat"
- extendedWaitUntil:
    visible:
      id: "coach_chat_screen"
    timeout: 12000
- assertVisible:
    id: "coach_input_field"
- assertVisible:
    id: "coach_lightning_menu_button"
- assertVisible:
    id: "coach_send_button"
- takeScreenshot: "mon-argent-04-coach-return"
