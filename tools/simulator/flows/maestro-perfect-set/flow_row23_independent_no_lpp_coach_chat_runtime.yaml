# tools/simulator/flows/maestro-perfect-set/flow_row23_independent_no_lpp_coach_chat_runtime.yaml
#
# PURPOSE
# Runtime proof for Row 23/CJT-063 that an independent/no-LPP persona can use
# /coach/chat for the audited deterministic local no-LPP/3a guidance without
# being sent to /waitlist or showing false LLM transparency.
#
# PRE-CONDITION
# - App ch.mint.app installed on a booted iPhone 16e simulator.
# - Build:
#     flutter build ios --simulator --debug \
#       --dart-define=MINT_E2E_ARCHETYPE=independent_no_lpp_income_reality \
#       --dart-define=MINT_DISABLE_BETA_MODAL=true
#
# SCOPE LIMIT
# This proves one bounded local Coach topic in runtime. It does not close Row
# 23 by itself; broader natural-language Coach calibration, VoiceOver runtime
# traversal, live backend/LLM scoring, and full persona-flow rescoring remain
# separate work. The flow also guards against the generic 3a tax-impact card:
# in this scenario the primary answer must be contribution-capacity guidance
# from the persona context, not a teaser about an indicative tax saving. The
# prompt intentionally does not repeat "indépendant sans LPP"; the runtime
# context must carry that fact.

appId: ch.mint.app
env:
  MINT_E2E_ARCHETYPE: independent_no_lpp_income_reality
tags:
  - row-23
  - coach
  - independent-no-lpp
  - local-fallback
  - maestro-proof
---

- launchApp:
    clearState: true
    arguments:
      MINT_E2E_ARCHETYPE: ${MINT_E2E_ARCHETYPE}
- waitForAnimationToEnd:
    timeout: 6000

- runFlow:
    when:
      visible: "Je comprends, on y va"
    commands:
      - tapOn: "Je comprends, on y va"
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: "Ouvrir"
    commands:
      - tapOn: "Ouvrir"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd

- openLink: "mintapp:///coach/chat"
- runFlow:
    when:
      visible: "Ouvrir"
    commands:
      - tapOn: "Ouvrir"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "coach_chat_screen"
    timeout: 15000
- assertVisible:
    id: "coach_input_field"
- assertVisible:
    id: "coach_send_button"
- assertNotVisible: "Encore en chantier pour ton profil"

- tapOn:
    id: "coach_input_field"
- inputText: "Combien verser en 3a ?"
- tapOn:
    id: "coach_send_button"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: "row23-independent-no-lpp-after-natural-3a-prompt"

# The chat scrolls to the bottom of long assistant answers. Start by proving
# the visible tail: legal boundary, sources, and no misleading product card.
- extendedWaitUntil:
    visible: ".*Outil éducatif simplifié.*"
    timeout: 15000
- assertVisible: ".*Ne constitue pas un conseil financier.*"
- assertVisible: ".*OPP3 art. 7.*"
- assertVisible: ".*LPP art. 4.*"
- assertVisible: ".*LAVS art. 8.*"
- assertNotVisible: "Encore en chantier pour ton profil"
- assertNotVisible: "API Claude"
- assertNotVisible: "Versement 3a 2026"
- assertNotVisible: "Impact fiscal indicatif"
- assertNotVisible: "2'218 CHF"
- assertNotVisible: "7'137 CHF"
- assertNotVisible: "3'068 CHF"
- assertNotVisible: ".*ouvrir un compte.*"
- assertNotVisible: ".*Ouvrir un compte.*"
- assertNotVisible: ".*fintech.*"
- assertNotVisible: ".*Fintech.*"
- assertNotVisible: ".*meilleur.*"
- assertNotVisible: ".*Meilleur.*"
- assertNotVisible: ".*optimal.*"
- assertNotVisible: ".*Optimal.*"
- assertNotVisible: ".*sans risque.*"
- assertNotVisible: ".*Sans risque.*"

# Then scroll back to the top of the same answer and verify the actual
# guidance contract: legal formula first, not tax-impact marketing.
- repeat:
    times: 3
    commands:
      - swipe:
          direction: DOWN
          duration: 250
- extendedWaitUntil:
    visible: ".*Marge 3a à vérifier.*"
    timeout: 8000
- assertVisible: ".*Formule.*"
- assertVisible: ".*revenu déterminant.*"
- assertVisible: ".*versements 3a déjà planifiés.*"

# Verify the runtime used Nadia's MINT data, not a magic generic number.
- assertVisible: ".*Faits MINT.*"
- assertVisible: ".*base professionnelle déclarée dans MINT.*"
- assertVisible: ".*86.*400.*CHF/an.*"
- assertVisible: ".*versements 3a planifiés.*"
- assertVisible: ".*6.*000.*CHF/an.*"
- assertVisible: ".*marge légale restante.*"
- assertVisible: ".*11.*280.*CHF/an.*"
- assertVisible: ".*revenu déterminant fiscal/AVS.*"
- assertVisible: ".*Provenance et fraîcheur.*"
- assertVisible: ".*revenu professionnel.*"
- assertVisible: ".*saisie dans MINT.*"
- assertVisible: ".*versements 3a planifiés.*"
- assertVisible: ".*date par champ non affichée.*"
- assertNotVisible: ".*plan MINT.*"
- assertNotVisible: ".*source non affichée.*"

# Verify the answer separates legal contribution room from monthly cashflow
# capacity and lists the missing professional-advice checks.
- scrollUntilVisible:
    element:
      text: ".*Confirmations manquantes.*"
    direction: DOWN
    centerElement: true
    timeout: 8000
- assertVisible: ".*Confirmations manquantes.*"
- assertVisible: ".*couverture accident.*"
- assertVisible: ".*perte de gain.*"
- assertVisible: ".*liquidité.*"
- assertVisible: ".*LPP facultative.*"
- scrollUntilVisible:
    element:
      text: ".*Carte de décision.*"
    direction: DOWN
    centerElement: true
    timeout: 8000
- extendedWaitUntil:
    visible: ".*Carte de décision.*"
    timeout: 8000
- assertVisible: ".*Marge légale 3a.*"
- assertVisible: ".*Capacité mensuelle.*"
- assertVisible: ".*Couverture risque.*"
- assertVisible: ".*Fiscalité.*"
- assertVisible: ".*budget mensuel.*"
- assertVisible: ".*trésorerie.*"
- scrollUntilVisible:
    element:
      text: ".*Comparer avant de verser.*"
    direction: DOWN
    centerElement: true
    timeout: 8000
- assertVisible: ".*Marge légale.*capacité mensuelle.*"
- assertVisible: ".*Prochaine action prudente.*"
- assertVisible: ".*ne traite pas le plafond comme.*"
- assertVisible: ".*un montant à verser.*"
- assertNotVisible: "Encore en chantier pour ton profil"
- assertNotVisible: "API Claude"
- assertNotVisible: "Versement 3a 2026"
- assertNotVisible: "Impact fiscal indicatif"
- assertNotVisible: "2'218 CHF"
- assertNotVisible: "7'137 CHF"
- assertNotVisible: "3'068 CHF"
- assertNotVisible: ".*ouvrir un compte.*"
- assertNotVisible: ".*Ouvrir un compte.*"
- assertNotVisible: ".*fintech.*"
- assertNotVisible: ".*Fintech.*"
- assertNotVisible: ".*meilleur.*"
- assertNotVisible: ".*Meilleur.*"
- assertNotVisible: ".*optimal.*"
- assertNotVisible: ".*Optimal.*"
- assertNotVisible: ".*sans risque.*"
- assertNotVisible: ".*Sans risque.*"
- assertNotVisible: "NaN"
- assertNotVisible: "Infinity"
- assertNotVisible: "A RenderFlex overflowed"
- assertNotVisible: "Exception caught"
- assertNotVisible: "NoSuchMethodError"
- takeScreenshot: "row23-independent-no-lpp-coach-local-guidance"
