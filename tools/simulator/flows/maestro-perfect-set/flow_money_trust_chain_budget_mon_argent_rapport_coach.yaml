# tools/simulator/flows/maestro-perfect-set/flow_money_trust_chain_budget_mon_argent_rapport_coach.yaml
#
# PURPOSE
# Canonical runtime proof for the MINT money trust chain:
# a debug-only route persists the rich `cadre_salarie_lpp_suisse_ready` persona
# through the report store, Budget setup exposes deterministic monthly
# fixed-charge entry, Budget restores the persisted read model after restart,
# Mon Argent and Coach expose the same money value, Rapport shows only the
# executive summary (no Budget-screen duplicate), and no absurd captured values
# leak into visible surfaces.
#
# JOS-002A owns the production onboarding persistence proof. JOS-002B owns this
# downstream runtime chain proof and uses a non-release E2E route so simulator
# keychain failures do not make the Money Truth surface proof unreplayable.
#
# PRE-CONDITION
# - App ch.mint.app installed on a booted iPhone simulator.
# - Recommended build:
#     --dart-define=MINT_DISABLE_BETA_MODAL=true
# - Do not build this proof with `MINT_E2E_ARCHETYPE`. That seed is in-memory
#   only and is not this persisted-runtime proof.

appId: ch.mint.app
tags:
  - money-trust-chain
  - budget
  - mon-argent
  - rapport
  - coach
  - maestro-proof
---

- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Je comprends, on y va"
    commands:
      - tapOn: "Je comprends, on y va"
      - waitForAnimationToEnd

# Establish persisted Alex through the real report store, not via
# MINT_E2E_ARCHETYPE. The route and simulator fallback are debug-only.
- openLink: "mintapp:///__e2e/row23-independent-no-lpp-profile?slug=cadre_salarie_lpp_suisse_ready"
- extendedWaitUntil:
    visible:
      id: "e2e_profile_fixture_applied"
    timeout: 10000
- copyTextFrom:
    id: "e2e_profile_fixture_applied"
- evalScript: ${output.money_trust_bootstrap = maestro.copiedText}
- runScript: "money_trust_assert_profile_bootstrap.js"

- openLink: "mintapp:///budget/setup"

- extendedWaitUntil:
    visible:
      id: "budget_setup_screen"
    timeout: 12000
- assertVisible:
    id: "budget_housing_field"
- assertVisible:
    id: "budget_lamal_field"

- tapOn:
    id: "budget_housing_field"
- eraseText: 20
- inputText: "2200"
- tapOn:
    id: "budget_lamal_field"
- eraseText: 20
- inputText: "420"
- tapOn:
    text: "Revenus et charges fixes"
- extendedWaitUntil:
    visible:
      id: "budget_setup_live_total"
    timeout: 5000
- tapOn:
    id: "budget_setup_save_button"
- waitForAnimationToEnd:
    timeout: 6000

- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 6000

- openLink: "mintapp:///budget"
- extendedWaitUntil:
    visible:
      id: "budget_screen"
    timeout: 12000
- assertVisible:
    id: "budget_calculation_detail_toggle"
# Disclosure expansion is covered by
# `BudgetScreen exposes Maestro semantics anchors`. On iOS 26.2, Maestro can
# resolve this Flutter semantics id/text but does not always dispatch the tap
# reliably. The device flow validates the formula already visible in the hero.
- assertVisible:
    id: "budget_hero_formula"
- copyTextFrom:
    id: "budget_hero_formula"
- evalScript: ${output.sc4_budget = maestro.copiedText}
- assertNotVisible: "19'272'200"
- assertNotVisible: "420'420"
- assertNotVisible: "19M"
- assertNotVisible: "420k"
- assertNotVisible: "NaN"
- assertNotVisible: "Infinity"

- openLink: "mintapp:///mon-argent?section=month"
- extendedWaitUntil:
    visible:
      id: "mon_argent_screen"
    timeout: 12000
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: "mon_argent_budget_summary"
- assertVisible:
    id: "mon_argent_budget_flow_bar"
- copyTextFrom:
    id: "mon_argent_budget_summary"
- evalScript: ${output.sc4_mon_argent = maestro.copiedText}
- assertNotVisible: "19'272'200"
- assertNotVisible: "420'420"
- assertNotVisible: "19M"
- assertNotVisible: "420k"
- assertNotVisible: "NaN"
- assertNotVisible: "Infinity"

- openLink: "mintapp:///rapport"
- extendedWaitUntil:
    visible: "Ton Bilan Flash"
    timeout: 12000
- assertVisible: "Commencer"
- assertNotVisible: "Ton Budget"
- assertNotVisible: "Logement"
- assertNotVisible: "Primes LAMal"
- assertNotVisible: "19'272'200"
- assertNotVisible: "420'420"
- assertNotVisible: "19M"
- assertNotVisible: "420k"
- assertNotVisible: "NaN"
- assertNotVisible: "Infinity"
- assertNotVisible: "constants_version"
- assertNotVisible: "lpp_conversion_rate"
- assertNotVisible: "avs_max_monthly"
- assertNotVisible: "pillar3a_max"
- assertNotVisible: "A RenderFlex overflowed"
- assertNotVisible: "Exception caught"
- assertNotVisible: "NoSuchMethodError"
- takeScreenshot: "money-trust-chain-rapport-synthesis"

- openLink: "mintapp:///coach/chat"
- extendedWaitUntil:
    visible:
      id: "coach_input_field"
    timeout: 12000
- assertVisible:
    id: "coach_input_field"
- assertVisible:
    id: "coach_send_button"
- assertNotVisible:
    text: ".*taux de remplacement.*"
- assertNotVisible:
    text: ".*À la retraite.*"
- assertNotVisible:
    text: ".*retraite.*manquerait.*"
- runFlow:
    when:
      visible:
        id: "coach_silent_opener_primary_number"
    commands:
      - copyTextFrom:
          id: "coach_silent_opener_primary_number"
      - evalScript: ${output.sc4_coach = maestro.copiedText}
- runFlow:
    when:
      visible:
        text: ".*reste.*CHF.*après tes charges.*"
    commands:
      - copyTextFrom:
          text: ".*reste.*CHF.*après tes charges.*"
      - evalScript: ${output.sc4_coach = maestro.copiedText}
- evalScript: ${if (!output.sc4_coach) { throw new Error('Coach money anchor missing'); }}
- assertNotVisible: "Comment je te parle"
# Do not assert "Direct" globally: valid Coach copy may use direct-tone words.
- assertNotVisible:
    text: "^Doux$"
- assertNotVisible:
    text: "^Sans filtre$"
- assertNotVisible: "Ton 3a.*déductibles"
- assertNotVisible: "économie d'impôt en jeu"
- assertNotVisible: "19'272'200"
- assertNotVisible: "420'420"
- assertNotVisible: "19M"
- assertNotVisible: "420k"
- assertNotVisible: "NaN"
- assertNotVisible: "Infinity"
- runScript: "sc4_assert_value_convergence.js"
- takeScreenshot: "money-trust-chain-budget-mon-argent-rapport-coach"
