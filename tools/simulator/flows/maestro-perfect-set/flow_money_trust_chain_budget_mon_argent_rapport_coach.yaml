# tools/simulator/flows/maestro-perfect-set/flow_money_trust_chain_budget_mon_argent_rapport_coach.yaml
#
# PURPOSE
# Canonical runtime proof for the MINT money trust chain:
# onboarding persists a supported Swiss-native profile, Budget setup exposes
# deterministic monthly fixed-charge entry, Budget restores the persisted read
# model after restart, Mon Argent and Coach expose the same money value, Rapport
# shows only the executive summary (no Budget-screen duplicate), and no absurd
# captured values leak into visible surfaces.
#
# PRE-CONDITION
# - App ch.mint.app installed on a booted iPhone simulator.
# - Recommended build:
#     --dart-define=MINT_DISABLE_BETA_MODAL=true
# - Do not build this proof with `MINT_E2E_ARCHETYPE`. That seed is in-memory
#   only and is not a persistence proof. CJT-023 documents the stale contract.

appId: ch.mint.app
tags:
  - money-trust-chain
  - budget
  - mon-argent
  - rapport
  - coach
  - maestro-proof
---

- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Je comprends, on y va"
    commands:
      - tapOn: "Je comprends, on y va"
      - waitForAnimationToEnd

# Build the profile through the production onboarding writer, not a debug seed.
- openLink: "mintapp:///onb"
- extendedWaitUntil:
    visible:
      text: "Il est temps que tu comprennes."
    timeout: 10000
- tapOn:
    text: "Ouvrir"
- extendedWaitUntil:
    visible:
      text: ".*Ce que je toucherai.*"
    timeout: 5000
- tapOn:
    id: "onboarding-intent-retraite"
- extendedWaitUntil:
    visible:
      text: "Es-tu citoyen ou résident fiscal aux États-Unis ?"
    timeout: 5000
- tapOn:
    text: "Non"
- runFlow:
    when:
      visible: "Quelle est ta nationalité ?"
    commands:
      - tapOn:
          text: "Suisse"
- runFlow:
    when:
      visible: "Quel âge tu as ?"
    commands:
      - takeScreenshot: "money-trust-legacy-age-only-screen"
      - tapOn:
          text: "Continuer"
- extendedWaitUntil:
    visible:
      text: "Choisir ma date"
    timeout: 5000
- tapOn: "Choisir ma date"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "OK"
    timeout: 5000
- tapOn:
    text: ".*15.*juillet.*1992.*"
- tapOn: "OK"
- extendedWaitUntil:
    visible:
      text: "15.07.1992"
    timeout: 5000
- tapOn:
    text: "Continuer"
- runFlow:
    when:
      visible: "Quelle est ta nationalité ?"
    commands:
      - tapOn:
          text: "Suisse"
- extendedWaitUntil:
    visible:
      text: "Où tu vis ?"
    timeout: 5000
- tapOn:
    id: "onboarding-canton-vd"
- extendedWaitUntil:
    visible:
      text: "Combien te tombe net par mois ?"
    timeout: 5000
- tapOn:
    id: "onboarding-revenue-range-continue"
- extendedWaitUntil:
    visible:
      text: "Avant de te montrer…"
    timeout: 12000
- tapOn:
    id: "onboarding-insight-view"
- extendedWaitUntil:
    visible:
      text: "Continuer"
    timeout: 8000
- tapOn:
    id: "onboarding-scene-continue"
- runFlow:
    when:
      visible:
        text: "Continuer"
    commands:
      - tapOn:
          id: "onboarding-scene-continue"
- extendedWaitUntil:
    visible:
      text: "Creuser"
    timeout: 5000
- tapOn:
    id: "onboarding-bifurcation-creuser"
- extendedWaitUntil:
    visible:
      id: "coach_chat_screen"
    timeout: 15000
- assertVisible:
    id: "coach_input_field"

- openLink: "mintapp:///budget/setup"

- extendedWaitUntil:
    visible:
      id: "budget_setup_screen"
    timeout: 12000
- assertVisible:
    id: "budget_housing_field"
- assertVisible:
    id: "budget_lamal_field"

- tapOn:
    id: "budget_housing_field"
- eraseText: 20
- inputText: "2200"
- tapOn:
    id: "budget_lamal_field"
- eraseText: 20
- inputText: "420"
- tapOn:
    text: "Revenus et charges fixes"
- extendedWaitUntil:
    visible:
      id: "budget_setup_live_total"
    timeout: 5000
- tapOn:
    id: "budget_setup_save_button"
- waitForAnimationToEnd:
    timeout: 6000

- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 6000

- openLink: "mintapp:///budget"
- extendedWaitUntil:
    visible:
      id: "budget_screen"
    timeout: 12000
- assertVisible:
    id: "budget_calculation_detail_toggle"
# Disclosure expansion is covered by
# `BudgetScreen exposes Maestro semantics anchors`. On iOS 26.2, Maestro can
# resolve this Flutter semantics id/text but does not always dispatch the tap
# reliably. The device flow validates the formula already visible in the hero.
- assertVisible:
    id: "budget_hero_formula"
- copyTextFrom:
    id: "budget_hero_formula"
- evalScript: ${output.sc4_budget = maestro.copiedText}
- assertNotVisible: "19'272'200"
- assertNotVisible: "420'420"
- assertNotVisible: "19M"
- assertNotVisible: "420k"
- assertNotVisible: "NaN"
- assertNotVisible: "Infinity"

- openLink: "mintapp:///mon-argent?section=month"
- extendedWaitUntil:
    visible:
      id: "mon_argent_screen"
    timeout: 12000
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: "mon_argent_budget_summary"
- assertVisible:
    id: "mon_argent_budget_flow_bar"
- copyTextFrom:
    id: "mon_argent_budget_summary"
- evalScript: ${output.sc4_mon_argent = maestro.copiedText}
- assertNotVisible: "19'272'200"
- assertNotVisible: "420'420"
- assertNotVisible: "19M"
- assertNotVisible: "420k"
- assertNotVisible: "NaN"
- assertNotVisible: "Infinity"

- openLink: "mintapp:///rapport"
- extendedWaitUntil:
    visible: "Ton Bilan Flash"
    timeout: 12000
- assertVisible: "Commencer"
- assertNotVisible: "Ton Budget"
- assertNotVisible: "Logement"
- assertNotVisible: "Primes LAMal"
- assertNotVisible: "19'272'200"
- assertNotVisible: "420'420"
- assertNotVisible: "19M"
- assertNotVisible: "420k"
- assertNotVisible: "NaN"
- assertNotVisible: "Infinity"
- assertNotVisible: "constants_version"
- assertNotVisible: "lpp_conversion_rate"
- assertNotVisible: "avs_max_monthly"
- assertNotVisible: "pillar3a_max"
- assertNotVisible: "A RenderFlex overflowed"
- assertNotVisible: "Exception caught"
- assertNotVisible: "NoSuchMethodError"
- takeScreenshot: "money-trust-chain-rapport-synthesis"

- openLink: "mintapp:///coach/chat"
- extendedWaitUntil:
    visible:
      id: "coach_chat_screen"
    timeout: 12000
- assertVisible:
    id: "coach_input_field"
- assertVisible:
    id: "coach_send_button"
- assertNotVisible:
    text: ".*taux de remplacement.*"
- assertNotVisible:
    text: ".*À la retraite.*"
- assertNotVisible:
    text: ".*retraite.*manquerait.*"
- runFlow:
    when:
      visible:
        id: "coach_silent_opener_primary_number"
    commands:
      - copyTextFrom:
          id: "coach_silent_opener_primary_number"
      - evalScript: ${output.sc4_coach = maestro.copiedText}
- runFlow:
    when:
      visible:
        text: ".*reste.*CHF.*après tes charges.*"
    commands:
      - copyTextFrom:
          text: ".*reste.*CHF.*après tes charges.*"
      - evalScript: ${output.sc4_coach = maestro.copiedText}
- evalScript: ${if (!output.sc4_coach) { throw new Error('Coach money anchor missing'); }}
- assertNotVisible: "Comment je te parle"
# Do not assert "Direct" globally: valid Coach copy may use direct-tone words.
- assertNotVisible:
    text: "^Doux$"
- assertNotVisible:
    text: "^Sans filtre$"
- assertNotVisible: "Ton 3a.*déductibles"
- assertNotVisible: "économie d'impôt en jeu"
- assertNotVisible: "19'272'200"
- assertNotVisible: "420'420"
- assertNotVisible: "19M"
- assertNotVisible: "420k"
- assertNotVisible: "NaN"
- assertNotVisible: "Infinity"
- runScript: "sc4_assert_value_convergence.js"
- takeScreenshot: "money-trust-chain-budget-mon-argent-rapport-coach"
