# tools/simulator/flows/maestro-perfect-set/flow_extractor_captures_age_canton.yaml
#
# ─── PURPOSE ───────────────────────────────────────────────────────────
# Phase 91 G1 Maestro flow — multi-fact extraction baseline.
#
# Wave 0 baseline run: canton + incomeGrossYearly are caught by the regex
# floor today (PASS expected against the current single-LLM build).
# birthYear=1990 may FAIL today because the regex extractor's birth-year
# coverage is weaker (`profile_extractor.py:208-220`) — that single
# assertion is marked `optional: true` for Wave 0 and becomes strict in
# Wave 3 once the LLM extractor is wired (T3.2 will remove the optional).
#
# This flow exists at Wave 0 to (a) lock the contract early, (b) become
# the regression detector through Waves 1-2, (c) gate Phase 91 exit at G1.
#
# Source: `.planning/phases/91-mvp-extractor-v2/91-00-PLAN.md` Task 0.3
#         `.planning/phases/91-mvp-extractor-v2/91-CONTEXT.md` decisions
#         D-07 (telemetry baseline) + D-08 (multi-fact assertion)
#
# ─── ARCHETYPE SCOPE ───────────────────────────────────────────────────
# Anonymous chat path — no `_user`. Per D-04, the extractor (Wave 2+)
# runs but persists into request-scoped state, never to DB. In Wave 0
# the regex floor still runs and the coach response renders normally.
#
# ─── EXPECTED DURATION ─────────────────────────────────────────────────
# ~40s wall-clock (cold launch + landing CTA + composer + LLM round-trip).
#
# ─── PRE-CONDITION ─────────────────────────────────────────────────────
# - App installed on booted iPhone 17 Pro sim, bundle id ch.mint.app
# - Backend is reachable (Railway staging `mint-staging.up.railway.app`
#   per memory feedback_app_targets_staging_always.md)
# - ANTHROPIC_API_KEY set on Railway (server-key path used by anonymous)
# - No special dart-defines required; landing CTA flow is the default.
#
# ─── MAESTRO 2.5.1 SYNTAX NOTES ────────────────────────────────────────
# Mirrors flow_b15_concrete_facts_chips.yaml conventions:
#   - regex locators (`.*…*`)
#   - no `timeout:` on assertVisible (Maestro 2.5.1 default suffices)
#   - extendedWaitUntil with explicit timeout for LLM round-trip
#
# ─── CANONICAL FIXTURE ─────────────────────────────────────────────────
# The user message « j'ai 80k de salaire à Lausanne, je suis né en 1990 »
# is the multi-fact stress test:
#   - incomeGrossYearly = 80000 (regex catches « 80k de salaire » today)
#   - canton            = 'VD'  (regex catches « Lausanne » → VD today)
#   - birthYear         = 1990  (regex coverage weak; LLM extractor target)
#
# ─── OUTPUT ────────────────────────────────────────────────────────────
# Screenshots:
#   .planning/walker/maestro-flows/extractor-captures-age-canton/<run-id>/
#     ├── 01-landing.png
#     ├── 02-anon-chat-composer.png
#     ├── 03-message-typed.png
#     └── 04-coach-response.png

appId: ch.mint.app
tags:
  - phase-91
  - gate-g1
  - extractor
  - extractor-v2
  - anonymous-chat
  - regression-baseline-wave-0
---

# 01 — cold launch + landing
- launchApp:
    clearState: false
- assertVisible: "Parle à Mint"
- takeScreenshot: "01-landing"

# 02 — open anonymous chat
- tapOn: "Parle à Mint"
- extendedWaitUntil:
    visible:
      text: ".*Écris ce qui te trotte.*"
    timeout: 8000
- takeScreenshot: "02-anon-chat-composer"

# 03 — type the canonical multi-fact message + submit
# Fixture: « j'ai 80k de salaire à Lausanne, je suis né en 1990 »
- tapOn:
    text: ".*Écris ce qui te trotte.*"
- inputText: "j'ai 80k de salaire à Lausanne, je suis né en 1990"
- pressKey: Enter
- takeScreenshot: "03-message-typed"

# 04 — wait for coach response (LSFin disclaimer renders persistently
# at the bottom of every coach turn ; same anchor pattern as flow_b15)
- extendedWaitUntil:
    visible:
      text: ".*Information générale.*"
    timeout: 35000
- takeScreenshot: "04-coach-response"

# 05 — STRICT FACT ASSERTION : canton (Lausanne → VD).
# The regex floor catches this today (`profile_extractor.py:208-220`).
# This assertion gates the Wave 0 baseline run as PASS.
# Surface: anonymous chat does NOT render a profile drawer in Wave 0
# (D-04 ; persistence is request-scoped). We assert via the coach reply
# referencing the canton — the coach must echo the geographic anchor
# in its response per the « Ancre toujours sur un chiffre concret du
# contexte utilisateur » rule (claude_coach_service.py FORMAT block).
- assertVisible:
    text: ".*Lausanne.*|.*Vaud.*|.*VD.*"

# 06 — STRICT FACT ASSERTION : incomeGrossYearly (80k).
# Regex floor catches this today. The coach response should reference
# the income figure in some form (« 80'000 », « 80k », « 80 000 »).
- assertVisible:
    text: ".*80.000.*|.*80'000.*|.*80k.*|.*80 000.*"

# 07 — OPTIONAL FACT ASSERTION : birthYear (1990).
# Wave 0 expectation: this MAY FAIL today against the regex extractor.
# Wave 3 (T3.2) removes `optional: true` once the LLM extractor is wired
# behind COACH_DUAL_LLM_ENABLED=True.
- assertVisible:
    text: ".*1990.*|.*34 ans.*|.*35 ans.*"
    optional: true

# ─── KNOWN LIMITATIONS / WAVE-PROGRESSION CONTRACT ─────────────────────
# 1. Wave 0 (this commit): canton + income strict, birthYear optional.
#    Run command:
#      bash tools/simulator/walker_audit_tap_render.sh flow_extractor_captures_age_canton
#    Acceptance: exit 0 against current single-LLM build (regex floor only).
#
# 2. Wave 2: COACH_DUAL_LLM_ENABLED=False default → no regression on this
#    flow vs Wave 0 baseline.
#
# 3. Wave 3 T3.2: remove `optional: true` from the birthYear assertion
#    once the LLM extractor is wired. This flow becomes the GATE for
#    Phase 91 exit at G1.
#
# 4. The fact-state assertion strategy here is INDIRECT (asserting the
#    coach's textual echo of the fact). A stronger gate would inspect
#    the in-memory profile snapshot via a debug overlay — that surface
#    does not exist yet in Wave 0 (anonymous chat has no drawer or
#    profile screen). Wave 3 may add a `MINT_E2E_PROFILE_DUMP=true`
#    dart-define + endpoint that exposes the request-scoped extractor
#    output for direct fact-state assertion ; until then, the textual
#    echo is the available signal.
