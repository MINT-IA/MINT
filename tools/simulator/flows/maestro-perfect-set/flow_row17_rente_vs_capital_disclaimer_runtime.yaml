# tools/simulator/flows/maestro-perfect-set/flow_row17_rente_vs_capital_disclaimer_runtime.yaml
#
# PURPOSE
# Runtime disclaimer/source proof for Journey Truth Matrix Row 17:
# canonical /rente-vs-capital exposes its educational disclaimer and legal
# sources on-device, not only in widget tests.
#
# PRE-CONDITION
# - Debug app ch.mint.app installed on a booted iPhone simulator.
# - Recommended build:
#     --dart-define=MINT_DISABLE_BETA_MODAL=true
#     --dart-define=MINT_E2E_ARCHETYPE=julien_swiss

appId: ch.mint.app
tags:
  - row-17
  - rente-vs-capital
  - disclaimer
  - legal-sources
  - runtime-proof
---

- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 6000
- openLink: "mintapp:///rente-vs-capital"
- runFlow:
    when:
      visible: "Ouvrir"
    commands:
      - tapOn: "Ouvrir"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: ".*Rente ou capital.*"
    timeout: 12000

# Scroll to the legal-source card. Bounded explicit swipes are more reliable
# than scrollUntilVisible on this static, non-interactive disclaimer block.
- repeat:
    times: 5
    commands:
      - swipe:
          direction: UP
          duration: 250
- extendedWaitUntil:
    visible:
      text: ".*Avertissement.*"
    timeout: 8000
- assertVisible:
    id: "rente_vs_capital_disclaimer_card"
- assertVisible:
    text: ".*LSFin.*"
- assertVisible:
    text: ".*LIFD art. 38.*"
- takeScreenshot: "01-row17-rente-vs-capital-disclaimer-sources"
