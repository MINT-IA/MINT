# tools/simulator/flows/maestro-perfect-set/flow_rapport_budget_read_model_spine.yaml
#
# PURPOSE
# Runtime proof that the direct Rapport (/rapport) fallback does not resurrect
# the legacy "Plan Mint" wording or duplicate the Budget/Mon Argent dashboard
# after a user edits fixed monthly charges. The complete money-trust flow covers
# the populated Budget -> Mon Argent -> Rapport path.
#
# PRE-CONDITION
# - App ch.mint.app installed on a booted iPhone simulator.
# - Recommended build:
#     --dart-define=MINT_E2E_ARCHETYPE=julien_swiss
#     --dart-define=MINT_DISABLE_BETA_MODAL=true

appId: ch.mint.app
tags:
  - rapport
  - budget
  - read-model
  - data-spine
  - maestro-proof
---

- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 6000

- runFlow:
    when:
      visible: "Je comprends, on y va"
    commands:
      - tapOn: "Je comprends, on y va"
      - waitForAnimationToEnd

- openLink: "mintapp:///budget/setup"
- runFlow:
    when:
      visible: "Ouvrir"
    commands:
      - tapOn: "Ouvrir"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "budget_setup_screen"
    timeout: 12000

- tapOn:
    id: "budget_housing_field"
- inputText: "2200"
- tapOn:
    id: "budget_lamal_field"
- inputText: "420"
- tapOn:
    text: "Revenus et charges fixes"
- tapOn:
    id: "budget_setup_save_button"
- waitForAnimationToEnd:
    timeout: 6000

- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 6000

- openLink: "mintapp:///rapport"
- extendedWaitUntil:
    visible: "Ton Bilan Flash"
    timeout: 12000
- assertVisible: "Transparence et conformité"
- assertNotVisible: "Ton Plan Mint"
- assertNotVisible: "Ton Budget"
- assertNotVisible: "Logement"
- assertNotVisible: "Primes LAMal"
- assertNotVisible:
    text: ".*2'200.*"
- assertNotVisible:
    text: ".*420.*"
- assertNotVisible: "19'272'200"
- assertNotVisible: "420'420"
- assertNotVisible: "NaN"
- assertNotVisible: "Infinity"
- assertNotVisible: "A RenderFlex overflowed"
- assertNotVisible: "Exception caught"
- assertNotVisible: "NoSuchMethodError"
- takeScreenshot: "rapport-01-budget-read-model"
