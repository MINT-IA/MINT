# tools/simulator/flows/maestro-perfect-set/flow_g2_julien_walkthrough.yaml
#
# Phase 91 G2 Maestro flow — Julien on-brand walkthrough on sim.
#
# Distinct from G1 (flow_extractor_captures_age_canton.yaml) :
# - G1 = strict 3-fact assertion (canton + income + birthYear) on turn 1.
# - G2 = on-brand judgement + multi-turn continuity + anti-leak visual check
#        + drawer attempt + 3 screenshots for sign-off evidence.
#
# Pre-condition (same as G1) :
# - App ch.mint.app installed on booted iPhone 17 Pro sim
# - Backend reachable at https://mint-staging.up.railway.app
# - COACH_DUAL_LLM_ENABLED=true + COACH_NARRATOR_MODEL=sonnet on Railway
#
# Output : 3 screenshots under .planning/phases/91-mvp-extractor-v2/g2-evidence/
#
# Source plan : .planning/phases/91-mvp-extractor-v2/91-06-PLAN.md Task 6.2
# Sign-off doc : .planning/phases/91-mvp-extractor-v2/g2-device-walkthrough.md

appId: ch.mint.app
tags:
  - phase-91
  - gate-g2
  - extractor-v2
  - anonymous-chat
  - julien-walkthrough
  - multi-turn
---

# 01 — cold launch + landing
- launchApp:
    clearState: false
- assertVisible: "Parle à Mint"

# 02 — open anonymous chat
- tapOn: "Parle à Mint"
- extendedWaitUntil:
    visible:
      text: ".*Écris ce qui te trotte.*"
    timeout: 8000

# 03 — type the canonical multi-fact message + submit
# Fixture: « j'ai 80k de salaire à Lausanne, je suis né en 1990 »
- tapOn:
    text: ".*Écris ce qui te trotte.*"
- inputText: "j'ai 80k de salaire à Lausanne, je suis né en 1990"
- pressKey: Enter

# 04 — wait for narrator response (LSFin disclaimer anchor)
- extendedWaitUntil:
    visible:
      text: ".*Information générale.*"
    timeout: 35000

# 05 — STRICT G2 ANTI-LEAK ASSERTIONS : narrator MUST NOT emit phantom tool calls
# These are the P0 brand defects identified in Stage 3 eval (Haiku leak).
# Sonnet should not exhibit these in production. We assert NEGATIVELY :
# none of the leak markers should be visible in the rendered chat surface.
- assertNotVisible:
    text: ".*save_fact\\(.*"
- assertNotVisible:
    text: ".*save_insight\\(.*"
- assertNotVisible:
    text: ".*<function_calls>.*"
- assertNotVisible:
    text: ".*<tool_use>.*"

# 06 — STRICT G2 LSFIN BANNED-TERMS ASSERTIONS (CLAUDE.md §1)
# These are NEVER words. The narrator must use « pourrait », « envisager », etc.
- assertNotVisible:
    text: ".*\\bgaranti\\b.*"
- assertNotVisible:
    text: ".*\\boptimal\\b.*"
- assertNotVisible:
    text: ".*\\bsans risque\\b.*"

# 07 — Capture turn-1 evidence
- takeScreenshot: "g2-01-turn1"

# 08 — Send follow-up : multi-turn continuity probe
# Per D-04 anonymous chat = request-scoped state; expectations differ
# vs registered. Document outcome either way (both informative for ship).
- tapOn:
    text: ".*Écris ce qui te trotte.*|.*Réponds.*|.*Ta réponse.*"
- inputText: "et toi, qu'est-ce que tu en penses ?"
- pressKey: Enter

# 09 — wait for follow-up response (LSFin anchor again)
- extendedWaitUntil:
    visible:
      text: ".*Information générale.*"
    timeout: 35000

# 10 — Capture turn-2 evidence
- takeScreenshot: "g2-02-turn2"

# 11 — Try to open profile drawer (Semantics label per commit 59d8c69a)
# Anonymous chat may not expose the drawer — handle gracefully.
- runFlow:
    when:
      visible:
        id: "ouvrir-profil-drawer"
    commands:
      - tapOn:
          id: "ouvrir-profil-drawer"
      - takeScreenshot: "g2-03-drawer"

# 12 — Final state screenshot (whether drawer opened or not)
- takeScreenshot: "g2-04-final"
