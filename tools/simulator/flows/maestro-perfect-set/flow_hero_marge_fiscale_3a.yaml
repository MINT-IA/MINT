# tools/simulator/flows/maestro-perfect-set/flow_hero_marge_fiscale_3a.yaml
#
# ─── PURPOSE ───────────────────────────────────────────────────────────
# Phase 01.1 hero flow — the parent CONTEXT §1 bar measurement vehicle.
#
# Asserts : onboarding wedge (swiss_native supported path, retirement
# intent, local dossier flushed to Coach) → composer « Dis-moi. » → ask
# « Combien je peux mettre sur mon 3a cette annee ? » → coach emits the
# salaried plafond 3a 2026 CHF figure (7'258 — per OPP3 art. 7 al. 1, staging
# /api/v1/regulatory/constants/snapshot.pillar3a.max_with_lpp) with a
# citation chip (OPP3 art. 7 OR LIFD art. 38) within 3 turns ; no LSFin
# banned-term ; no app crash.
#
# Tier-1 (grounded-values) : assertVisible CHF figure 7258 +
#                            citation chip (OPP3 art. 7 OR LIFD art. 38).
# Tier-2 (non-crash)       : composer / Coach tab visible at each gate.
# Tier-3 (exploratory)     : takeScreenshot at each gate for audit.
#
# Negative assertions :
#   assertNotVisible LSFin banned-term lemmas (garanti / optimal /
#   meilleur / sans risque / parfait / assure / certain) — anywhere
#   on the coach reply surface at evaluation time.
#
# ─── ARCHETYPE SCOPE ──────────────────────────────────────────────────
# Coach surface reached through the current onboarding wedge. Default
# archetype swiss_native per Phase 01.1 CONTEXT §1. swiss_native_couple
# deferred to sub-phase 01.10.
#
# ─── EXPECTED DURATION ────────────────────────────────────────────────
# ~3-5 min wall-clock (cold launch + onboarding wizard + 1 coach
# turn LLM round-trip + assertions).
#
# ─── PRE-CONDITION ────────────────────────────────────────────────────
# - App installed on booted iPhone 17 Pro sim, bundle id ch.mint.app.
# - Backend = Railway staging mint-staging.up.railway.app per memory
#   feedback_app_targets_staging_always.md ; NEVER local backend.
# - Plan 01.1-01 PRECONDITIONS.md overall_verdict = GO (8/8 checks ✓,
#   see .planning/phases/01.1-walkthrough-first-grounding/01.1-PRECONDITIONS.md).
# - Staging health endpoint = /api/v1/health (NOT /health — Wave 1
#   path correction). Staging OpenAPI = /api/v1/openapi.json.
#
# ─── REFERENCES ───────────────────────────────────────────────────────
# Structure diff'd line-by-line against the Phase 94 G1 precedent
# flow_narrator_refuses_uncited_numbers.yaml per memory
# feedback_diff_against_existing_tool.md.
#
# Selector source-of-truth (per threat-model T-01.1-02-04 mitigation) :
#   - « Je comprends, on y va »   → app_fr.arb:12221 betaDisclosureCta
#   - « Parle à Mint »            → app_fr.arb:11392 landingV2CtaSober
#   - « Coach » (bottom-nav tab)  → app_fr.arb:4154 tabCoach
#   - « Dis-moi. » (auth coach composer hint) → app_fr.arb:3991 coachInputHint
#   - « Suivant » (wizard)        → app_fr.arb:2456 wizardNext
#   - « Continuer » (precision)   → app_fr.arb:2677 precisionPromptContinuer
#   - « Commencer »               → app_fr.arb:2518 landingCtaCommencer
#   - « Démarrer mon diagnostic » → app_fr.arb:9 startDiagnostic
#
# Plafond 3a CHF source-of-truth :
#   - 7258 CHF salaried (pillar3a.max_with_lpp, OPP3 art. 7 al. 1,
#     taxYear 2026) — refreshed by the runtime freshness gate and
#     regulatory constants registry.
#   - 36'288 CHF independent (pillar3a.max_without_lpp, OPP3 art. 7 al. 2)
#     NOT asserted here — the input archetype is salaried.

appId: ch.mint.app
tags:
  - phase-01.1
  - hero-flow
  - marge-fiscale-3a
  - opp3-art-7
  - lifd-art-38
  - audit-grounding
  - gate-g1
---

# 01 — cold launch, then deterministic entry into the current onboarding
# wedge. The older landing-path variant could stop on the storyboard
# "Ouvrir" frame and falsely name it "home reached".
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Je comprends, on y va"
    commands:
      - tapOn: "Je comprends, on y va"
      - waitForAnimationToEnd
- openLink: "mintapp:///onb"
- extendedWaitUntil:
    visible:
      text: "Il est temps que tu comprennes."
    timeout: 10000
- tapOn:
    text: "Ouvrir"
- takeScreenshot: "01.1-hero-01-onboarding-opened"

# 02 — choose a supported Swiss-native intent.
- extendedWaitUntil:
    visible:
      text: ".*Ce que je toucherai.*"
    timeout: 5000
- tapOn:
    id: "onboarding-intent-retraite"

# 03 — FATCA / nationality / date-of-birth / canton gates. These are
# product gates, not test ceremony: the Coach route must only be reached
# after a coherent supported dossier exists. The source-of-truth path asks
# for date of birth; a legacy age-only screen is still tolerated here so
# the runtime test can expose and track that drift instead of blocking
# before the Coach trust assertion.
- extendedWaitUntil:
    visible:
      text: "Es-tu citoyen ou résident fiscal aux États-Unis ?"
    timeout: 5000
- tapOn:
    text: "Non"
- runFlow:
    when:
      visible: "Quelle est ta nationalité ?"
    commands:
      - tapOn:
          text: "Suisse"
- runFlow:
    when:
      visible: "Quel âge tu as ?"
    commands:
      - takeScreenshot: "01.1-hero-legacy-age-only-screen"
      - tapOn:
          text: "Continuer"
- extendedWaitUntil:
    visible:
      text: "Choisir ma date"
    timeout: 5000
- tapOn: "Choisir ma date"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "OK"
    timeout: 5000
- takeScreenshot: "01.1-hero-dob-picker-open"
- tapOn:
    text: ".*15.*juillet.*1992.*"
- takeScreenshot: "01.1-hero-dob-day-15-selected"
- tapOn: "OK"
- extendedWaitUntil:
    visible:
      text: "15.07.1992"
    timeout: 5000
- tapOn:
    text: "Continuer"
- runFlow:
    when:
      visible: "Quelle est ta nationalité ?"
    commands:
      - tapOn:
          text: "Suisse"
- extendedWaitUntil:
    visible:
      text: "Où tu vis ?"
    timeout: 5000
- tapOn:
    id: "onboarding-canton-vd"

# 04 — keep the default salary band, advance through the insight scene,
# and take the explicit "Creuser" path that flushes the dossier to Coach.
- extendedWaitUntil:
    visible:
      text: "Combien te tombe net par mois ?"
    timeout: 5000
- tapOn:
    id: "onboarding-revenue-range-continue"
- takeScreenshot: "01.1-hero-02-onboarding-income"
- extendedWaitUntil:
    visible:
      text: "Avant de te montrer…"
    timeout: 12000
- tapOn:
    id: "onboarding-insight-view"
- extendedWaitUntil:
    visible:
      text: "Continuer"
    timeout: 8000
- tapOn:
    id: "onboarding-scene-continue"
- runFlow:
    when:
      visible:
        text: "Continuer"
    commands:
      - tapOn:
          id: "onboarding-scene-continue"
- extendedWaitUntil:
    visible:
      text: "Creuser"
    timeout: 5000
- tapOn:
    id: "onboarding-bifurcation-creuser"
- takeScreenshot: "01.1-hero-03-coach-route"

# 05 — verify Coach composer on the supported path.
- extendedWaitUntil:
    visible:
      text: ".*(Dis-moi|Tape ton message|Pose|Demande|Écris).*"
    timeout: 15000
- assertNotVisible:
    text: "Encore en chantier pour ton profil"
- takeScreenshot: "01.1-hero-04-coach-composer"

# 06 — turn 1 : the hero question.
# Literal phrasing per threat-model T-01.1-02-02 — LSFin-neutral :
# « Combien je peux mettre sur mon 3a cette annee ? ». NEVER « meilleur
# 3a » or « 3a garanti ». « annee » without accent because Maestro
# inputText accent rendering varies across sim/build matrix ; the coach
# NLU normalises both forms.
- tapOn:
    text: ".*(Dis-moi|Tape ton message|Pose|Demande|Écris).*"
- inputText: "Combien je peux mettre sur mon 3a cette annee ?"
- pressKey: Enter
- takeScreenshot: "01.1-hero-05-after-send"
- assertNotVisible:
    text: "Encore en chantier pour ton profil"

# 07 — wait for user-message bubble to render (confirms send fired).
# Anchors on the question echo before checking for the response — guards
# against false-positive matches on residual chat history.
- extendedWaitUntil:
    visible:
      text: ".*(3a|pilier).*"
    timeout: 8000

# 08 — wait for the coach response stream complete. Budget = 60s
# single round-trip (citation gate adds ~5s per memory project obs).
# The anchor matches EITHER citation surface : OPP3 art. 7 (the staging
# canonical, per PRECONDITIONS Check 8 sourceTitle) OR LIFD art. 38
# (the RESEARCH §1.4 planner-assumed surface — both are legitimate
# Swiss-3a citations and the coach may render either).
- extendedWaitUntil:
    visible:
      text: ".*(OPP3|art\\.?\\s*7|art\\.?\\s*38|LIFD).*"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "01.1-hero-06-coach-response"

# 09 — Tier-1 grounded-values assertion : the salaried plafond 3a 2026
# CHF figure. Regex covers all 3 thousands-separator variants per
# LIFD/OPP3 doc conventions :
#   « 7258 » (no separator, Maestro inputText rendering)
#   « 7'258 » (Swiss apostrophe — canonical UI rendering)
#   « 7 258 » (narrow no-break space — French typography)
- assertVisible:
    text: ".*7['\\s ]?258.*"

# 10 — Tier-1 grounded-values assertion : citation chip presence.
# Either source (OPP3 art. 7 al. 1 OR LIFD art. 38) satisfies the gate
# — the bar is « cited number », not « cited from a specific source ».
- assertVisible:
    text: ".*(OPP3|art\\.?\\s*7|art\\.?\\s*38|LIFD).*"

# 11 — negative assertion : NO LSFin banned-term anywhere on the visible
# coach surface at evaluation time. Lemma list mirrors the canonical
# vocabulary from tools/checks/banned_terms_python.py (top-3 critical
# + 4 extended). Maestro evaluates `assertNotVisible` against the
# CURRENT view hierarchy — Tier-3 takeScreenshot at step 08 captured
# the surface state moments before this assertion.
- assertNotVisible:
    text: "(garanti|optimal|meilleur|sans risque|parfait|assuré|certain)"

# 12 — Tier-2 non-crash : main shell still visible. The Coach tab
# label remains rendered if the app didn't crash to SpringBoard /
# white-screen during the coach round-trip.
- assertVisible:
    text: ".*\\bCoach\\b.*"

# 13 — Tier-3 exploratory : final screenshot for audit trail.
- takeScreenshot: "01.1-hero-07-final"

# ─── 3-TURN CAP ───────────────────────────────────────────────────────
# Per Phase 01.1 CONTEXT §1 bar « coach emits ≥1 cited number within 3
# turns ». This flow exercises 1 turn (single coach round-trip). If
# turn 1 fails to surface 7258 + citation, the regex assertions at
# steps 09-10 fail and the flow exits non-zero — Plan 03 logs that as
# a finding-class « coach-runtime » row in 01.1-OBSERVATIONS.md, NOT a
# blocker (per CONTEXT §4 « Number without citation = finding row »).
#
# Re-running turn 2 / turn 3 follow-ups is OUT of scope for this flow.
# Per the 01.1 scope (single hero flow + 4 optional adversarial probes),
# turn-2/3 logic belongs to the adversarial probes in Plan 01.1-03 OR
# to sub-phase 01.4 (prompt/RAG iteration).
#
# ─── EXPECTED OUTPUT (Plan 03 live run) ───────────────────────────────
# Screenshots:
#   .planning/walker/maestro-flows/hero-marge-fiscale-3a/<run-id>/
#     ├── 01.1-hero-01-onboarding-opened.png
#     ├── 01.1-hero-02-onboarding-income.png
#     ├── 01.1-hero-03-coach-route.png
#     ├── 01.1-hero-04-coach-composer.png
#     ├── 01.1-hero-05-after-send.png
#     ├── 01.1-hero-06-coach-response.png
#     └── 01.1-hero-07-final.png
#
# Run command (Plan 01.1-03 ; NOT Plan 01.1-02) :
#   bash tools/simulator/maestro_env.sh test \
#     tools/simulator/flows/maestro-perfect-set/flow_hero_marge_fiscale_3a.yaml \
#     --device "B03E429D-0422-4357-B754-536637D979F9" \
#     --format junit --output result.xml
