# tools/simulator/flows/salvage01_retraite_onboarding_coach.yaml
#
# SALVAGE-01 SC-4 device gate — RETRAITE persona onboarding → coach.
#
# Scope:
#   Exercises the REAL MVP-wedge flush (q_age→q_birth_year conversion +
#   nationality capture) for a freshly-onboarded CH user with a RETRAITE
#   intent, and proves the two downstream effects the SALVAGE-01 contract
#   fix unblocks:
#     1. nationality:Suisse → swissNative archetype → coach reachable
#        (lands on /coach/chat, NOT /waitlist).
#     2. q_birth_year (not q_age) flows to the profile → simulator_3a and
#        the arbitrage scene render a REAL age / years-to-retirement, never
#        the sentinel 'Ton âge: 2026' or a fabricated '65 ans'.
#
# PRE-CONDITION (harness responsibility):
#   Run with the MINT_E2E_ARCHETYPE seed bridge OFF (post SALVAGE-00
#   neutralization) so the walker exercises the actual wedge contract
#   rather than a pre-seeded archetype (RESEARCH § Pitfall 5).
#   App targets Railway staging (memory: app_targets_staging_always).
#
# Semantic locators ONLY (memory feedback_perimeter_5_gates +
# maestro_locator_audit.py blocking lint). The wedge prompts are FR
# literals matching onboarding_shell_screen.dart.
#
# Wall-clock budget: < 90s. Output dir set by harness (never /tmp).
#
# STATUS (SALVAGE-01 Wave 0): this flow is the SC-4 device-gate ARTIFACT.
# It is authored now (Wave 0 / Task 1) but is NOT expected to pass until
# the nationality step lands (Task 2) AND the device gate runs against a
# staging build carrying this branch. It does not gate the unit-test waves.

appId: ch.mint.app
---

# NOTE (Maestro 2.5.1): `timeout` is NOT a valid property on `assertVisible`
# in this CLI version (it raises « Unknown Property: timeout » — verified
# against the formerly-passing coach_tools_server_side_smoke.yaml too). The
# wait-with-timeout primitive is `extendedWaitUntil: { visible: {…}, timeout }`
# (proven by the passing flow_data_spine_visible_coach_packet.yaml). Bare
# `assertVisible` / `assertNotVisible` use Maestro's default assertion window.

# ─── T1 entry → T2 intents ──────────────────────────────────────────────
# Cold launch must exercise the same first-run route as production users:
# landing CTA -> /start -> /onb. This catches the previous TestFlight
# regression where /start fell back to the legacy anonymous chat when the
# backend rollout flag was false or unavailable.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: "Parle à Mint"
    timeout: 10000
- tapOn:
    text: "Parle à Mint"
- extendedWaitUntil:
    visible:
      text: "Il est temps que tu comprennes."
    timeout: 10000
- tapOn:
    text: "Ouvrir"

# ─── T2 intents:RETRAITE ────────────────────────────────────────────────
# The RETRAITE _IntentCard is a bare InkWell wrapping two Text widgets
# (eyebrow "RETRAITE" + phrase "Ce que je toucherai, vraiment."). Unlike the
# FilledButton CTAs elsewhere, this InkWell does NOT expose a single tappable
# Semantics node carrying the label, so `tapOn: text:` (on either the eyebrow
# or the phrase) cannot resolve a tappable element. We tap by relative point:
# the RETRAITE card is the first of four, top of the list. The text assertion
# below confirms we are on the right screen before the positional tap, so the
# point is well-defined. (A Semantics(button,label) on _IntentCard would let
# us go back to a pure text locator, but that is product code outside this
# device-gate plan's scope.)
- extendedWaitUntil:
    visible:
      text: ".*Ce que je toucherai.*"
    timeout: 5000
- tapOn:
    point: "50%,24%"

# ─── T2.5 usTaxPerson:NO ────────────────────────────────────────────────
# The NO button is a labelled FilledButton ("Non" = waitlistUsTaxPersonNo).
# Maestro's `id:` matcher does not resolve Flutter's ValueKey('us-tax-person-no')
# to an iOS accessibility identifier here, so we tap the button label, which
# (being a FilledButton, unlike the bare-InkWell cards) exposes a tappable
# Semantics node. "Non" is unambiguous on this 2-button screen.
- extendedWaitUntil:
    visible:
      text: "Es-tu citoyen ou résident fiscal aux États-Unis ?"
    timeout: 5000
- tapOn:
    text: "Non"

# ─── T2.6 nationality:Suisse (NEW SALVAGE-01 step) ──────────────────────
# The CH option is a FilledButton.tonal with child Text("Suisse" =
# nationalitySuisse) and a ValueKey('onboarding-nationality-ch'). As with the
# usTax button, the ValueKey is not resolved by Maestro's `id:` matcher on
# iOS; tap the button label instead (exposed as a tappable Semantics node).
- extendedWaitUntil:
    visible:
      text: "Quelle est ta nationalité ?"
    timeout: 5000
- tapOn:
    text: "Suisse"

# ─── T3 date de naissance ───────────────────────────────────────────────
- extendedWaitUntil:
    visible:
      text: "Quelle est ta date de naissance ?"
    timeout: 5000
- tapOn:
    text: "Choisir ma date"
- extendedWaitUntil:
    visible:
      text: "OK"
    timeout: 5000
- tapOn:
    text: ".*15.*juillet.*1992.*"
- tapOn: "OK"
- extendedWaitUntil:
    visible:
      text: "15.07.1992"
    timeout: 5000
- tapOn:
    text: "Continuer"

# ─── T4 canton:VD ───────────────────────────────────────────────────────
- extendedWaitUntil:
    visible:
      text: "Où tu vis ?"
    timeout: 5000
- tapOn:
    id: "onboarding-canton-vd"

# ─── T5 revenue (default fourchette) ────────────────────────────────────
# Keep default fourchette (7'000–7'500 CHF); no adjustment interaction.
- extendedWaitUntil:
    visible:
      text: "Combien te tombe net par mois ?"
    timeout: 5000
- tapOn:
    id: "onboarding-revenue-range-continue"

# ─── T6 insight ─────────────────────────────────────────────────────────
# Give the revenue→insight transition a generous window: the revenue
# "Continuer" tap triggers a provider.advance() + rebuild, and the insight
# scene computes its copy from the dossier, so first paint can lag a beat.
- extendedWaitUntil:
    visible:
      text: "Avant de te montrer…"
    timeout: 12000
- tapOn:
    id: "onboarding-insight-view"

# ─── T7 scene (MintSceneRenteTrouee — renders the user's REAL currentAge) ─
# The scene receives provider.ageYears, which is derived from q_birth_year
# (the SALVAGE-01 flush fix). It must show a real age, not the sentinel.
- extendedWaitUntil:
    visible:
      text: "Continuer"
    timeout: 8000
- tapOn:
    id: "onboarding-scene-continue"
- runFlow:
    when:
      visible:
        text: "Continuer"
    commands:
      - tapOn:
          id: "onboarding-scene-continue"

# ─── T8 bifurcation:Creuser → /coach/chat ───────────────────────────────
# This terminal step flushes the dossier to CoachProfile and routes to
# /coach/chat.
- extendedWaitUntil:
    visible:
      text: "Creuser"
    timeout: 5000
- tapOn:
    id: "onboarding-bifurcation-creuser"

# ─── SC-3: lands on /coach/chat, NOT /waitlist ──────────────────────────
- extendedWaitUntil:
    visible:
      text: "Dis-moi."          # coachInputHint — input bar present == /coach/chat
    timeout: 15000
# Waitlist guard: the waitlist screen title is `waitlistTitle` ==
# "Encore en chantier pour ton profil" (app_fr.arb:12570). The prior stub
# asserted against "liste d’attente" (curly apostrophe) which is a SUBSTRING
# of waitlistAnnounceRedirect using a STRAIGHT apostrophe — the mismatch made
# the guard trivially pass (false-green). The title is apostrophe-free and is
# the screen's own header, so it is the robust not-waitlist signal.
- assertNotVisible:
    text: "Encore en chantier pour ton profil"
- takeScreenshot: "01-coach-reachable-not-waitlist"

# Coach answers a REAL message (substantive engagement, not waitlist).
# The wedge→coach handoff lands on the coach surface with the dossier
# summary (e.g. "Avoir LPP", "Point de départ" / "Marge libre") + an EMPTY
# "Dis-moi." input — it does NOT auto-inject an assistant greeting, so we
# must actually send a message and wait for the reply (mirrors the proven
# auth_coach_post_hotfix.yaml pattern). Coach replies render inside a
# Semantics(label: "Réponse du coach" = coachCoachMessage, app_fr.arb:3993).
# Staging coach LLM verified live at gate time (POST /api/v1/anonymous/chat
# -> 200, ~6s, real reply), so a miss here is a routing/product failure,
# not infra.
# Tap input, type, submit. (Two "Dis-moi." nodes exist — the hint label and
# the field; tapping the text focuses the field.)
- tapOn:
    text: "Dis-moi."
- inputText: "Je devrais sortir mon LPP en rente ou en capital ?"
- pressKey: Enter
# The coach reply can render without the accessibility prefix "Réponse du coach"
# in Maestro 2.5.1. Assert a stable, user-visible fragment from the actual
# response instead: it proves the message round-tripped and catches the previous
# waitlist refusal regression.
- extendedWaitUntil:
    visible:
      text: ".*Réponse via l'API Claude.*"
    timeout: 60000
- takeScreenshot: "01b-coach-real-reply"

# ─── SC-4: navigate /pilier-3a, assert a REAL age (never sentinel) ──────
# Deeplink form proven by the passing maestro-perfect-set flows:
#   scheme = `mintapp` (Info.plist CFBundleURLSchemes), then `:///<GoRouter path>`.
#   The GoRouter route is `/pilier-3a` (app.dart:900). `mint://pilier-3a`
#   (the prior stub) does NOT resolve — wrong scheme + no host→path map.
- openLink: "mintapp:///pilier-3a"
# AppBar title `sim3aTitle` == "Ton 3e pilier" (app_fr.arb:4827) — stable
# semantic locator. The prior stub asserted id:"simulator-3a-root", a key
# that does not exist in simulator_3a_screen.dart.
- extendedWaitUntil:
    visible:
      text: "Ton 3e pilier"
    timeout: 10000
# Sentinel-age guard. age = currentYear - profile.birthYear
# (rente_vs_capital_screen.dart:195). An UNFLUSHED birthYear (0) yields
# age == 2026 (this calendar year) — the sentinel. A correctly-flushed
# q_birth_year yields a real age. We assert the raw sentinel value 2026
# does not surface as an age. (Label "Ton âge" is legitimate i18n and is
# expected to be present — we never assert against the label itself.)
- assertNotVisible:
    text: "Ton âge: 2026"
- assertNotVisible:
    text: "Ton âge : 2026"
- takeScreenshot: "02-pilier3a-real-age"

# ─── SC-4: navigate rente-vs-capital (arbitrage scene), assert a real age ─
# GoRouter route is `/rente-vs-capital` (app.dart:766, hyphen). The prior
# stub used the underscore intentTag `rente_vs_capital`, which is NOT a
# route and would not resolve.
- openLink: "mintapp:///rente-vs-capital"
# Anchor on the screen title (contiguous node). The "Ton âge" label is joined
# into a multi-line section node ("Estimer pour moi\nTon âge\nÂge de départ…",
# verified via describe-all), so it is not directly matchable; the title is.
- extendedWaitUntil:
    visible:
      text: ".*Rente ou capital.*"
    timeout: 10000
# Real-age proof: the picker selects 02.07.1992 in this simulator, which is
# 33 years old on 2026-05-31. An UNFLUSHED birthYear (0) would render 2026
# (the sentinel). Assert the real age node is present and the sentinel is not.
- assertVisible:
    text: "33"
- assertNotVisible:
    text: "2026"
- assertNotVisible:
    text: "Ton âge: 2026"
- assertNotVisible:
    text: "Ton âge : 2026"
- takeScreenshot: "03-rente-vs-capital-real-age"
