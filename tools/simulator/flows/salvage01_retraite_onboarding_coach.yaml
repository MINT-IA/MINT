# tools/simulator/flows/salvage01_retraite_onboarding_coach.yaml
#
# SALVAGE-01 SC-4 device gate — RETRAITE persona onboarding → RvC decision room.
#
# Scope:
#   Exercises the REAL MVP-wedge flush (q_age→q_birth_year conversion +
#   nationality capture) for a freshly-onboarded CH user with a RETRAITE
#   intent, and proves the downstream effects the SALVAGE-01 contract
#   fix unblocks:
#     1. nationality:Suisse → swissNative archetype → public RvC room
#        reachable from the terminal "Continuer" action.
#     2. q_birth_year (not q_age) flows to the profile → the arbitrage scene
#        renders a REAL age / years-to-retirement, never the sentinel
#        'Ton âge: 2026' or a fabricated '65 ans'.
#
# PRE-CONDITION (harness responsibility):
#   Run with the MINT_E2E_ARCHETYPE seed bridge OFF (post SALVAGE-00
#   neutralization) so the walker exercises the actual wedge contract
#   rather than a pre-seeded archetype (RESEARCH § Pitfall 5).
#   App targets Railway staging (memory: app_targets_staging_always).
#
# End-state assertions use semantic locators and the locator audit still
# guards those IDs. Some iOS tap targets are point-tapped because Maestro 2.5.1
# does not resolve the Flutter semantics identifier to a tappable AX node there;
# each such case is anchored by a prompt assertion immediately before it.
#
# Wall-clock budget: < 90s. Output dir set by harness (never /tmp).
#
# STATUS (SALVAGE-01 Wave 0): this flow is the SC-4 device-gate ARTIFACT.
# It is authored now (Wave 0 / Task 1) but is NOT expected to pass until
# the nationality step lands (Task 2) AND the device gate runs against a
# staging build carrying this branch. It does not gate the unit-test waves.

appId: ch.mint.app
---

# NOTE (Maestro 2.5.1): `timeout` is NOT a valid property on `assertVisible`
# in this CLI version (it raises « Unknown Property: timeout » — verified
# against the formerly-passing coach_tools_server_side_smoke.yaml too). The
# wait-with-timeout primitive is `extendedWaitUntil: { visible: {…}, timeout }`
# (proven by the passing flow_data_spine_visible_coach_packet.yaml). Bare
# `assertVisible` / `assertNotVisible` use Maestro's default assertion window.

# ─── T1 entry → T2 intents ──────────────────────────────────────────────
# Cold launch must exercise the same first-run route as production users:
# landing CTA -> /start -> /onb. This catches the previous TestFlight
# regression where /start fell back to the legacy anonymous chat when the
# backend rollout flag was false or unavailable.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: "Éclaire ma situation"
    timeout: 10000
- tapOn:
    text: "Éclaire ma situation"
- extendedWaitUntil:
    visible:
      text: "Un premier aperçu suisse."
    timeout: 10000
# Maestro/iOS does not expose the entry CTA id/text on this first panel.
- tapOn:
    point: "200, 620"

# ─── T2 intents:RETRAITE ────────────────────────────────────────────────
# The intent card has a Flutter semantics identifier, but Maestro/iOS does not
# resolve it as a tappable AX node in this scroll position.
- waitForAnimationToEnd
- swipe:
    direction: UP
    duration: 250
- waitForAnimationToEnd
- tapOn:
    point: "200, 390"

# ─── T2.5 usTaxPerson:NO ────────────────────────────────────────────────
# The NO button is a labelled FilledButton ("Non" = waitlistUsTaxPersonNo).
# Maestro's `id:` matcher does not resolve Flutter's ValueKey('us-tax-person-no')
# to an iOS accessibility identifier here, so we tap the button label, which
# (being a FilledButton, unlike the bare-InkWell cards) exposes a tappable
# Semantics node. "Non" is unambiguous on this 2-button screen.
- extendedWaitUntil:
    visible:
      text: "Es-tu citoyen ou résident fiscal aux États-Unis ?"
    timeout: 5000
- tapOn:
    point: "200, 515"

# ─── T2.6 nationality:Suisse (NEW SALVAGE-01 step) ──────────────────────
# The CH option is a FilledButton.tonal with child Text("Suisse" =
# nationalitySuisse) and a ValueKey('onboarding-nationality-ch'). As with the
# usTax button, the ValueKey is not resolved by Maestro's `id:` matcher on
# iOS; tap the button label instead (exposed as a tappable Semantics node).
- extendedWaitUntil:
    visible:
      text: "Quelle est ta nationalité ?"
    timeout: 5000
- tapOn:
    point: "200, 370"

# ─── T2.7 employment status:Salarié ────────────────────────────────────
- extendedWaitUntil:
    visible:
      text: "Quelle est ta situation professionnelle ?"
    timeout: 5000
- tapOn:
    point: "200, 370"

# ─── T2.8 civil status:Marié ───────────────────────────────────────────
- extendedWaitUntil:
    visible:
      text: "Quelle est ta situation familiale ?"
    timeout: 5000
- tapOn:
    point: "200, 435"

# ─── T2.9 years abroad:No ──────────────────────────────────────────────
- extendedWaitUntil:
    visible:
      text: "As-tu passé des années hors de Suisse ?"
    timeout: 5000
- tapOn:
    point: "200, 315"

# ─── T3 date de naissance ───────────────────────────────────────────────
- extendedWaitUntil:
    visible:
      text: "Quelle est ta date de naissance ?"
    timeout: 5000
- tapOn:
    point: "200, 405"
- waitForAnimationToEnd
- tapOn:
    point: "153, 474"
- tapOn:
    point: "330, 640"
- extendedWaitUntil:
    visible:
      text: "15.07.1992"
    timeout: 5000
- tapOn:
    point: "200, 545"

# ─── T4 canton ──────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible:
      text: "Où tu vis ?"
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "VD"
    direction: DOWN
    timeout: 8000
- tapOn:
    point: "200, 465"

# ─── T5 revenue (default fourchette) ────────────────────────────────────
# Keep default fourchette (7'000–7'500 CHF); no adjustment interaction.
- extendedWaitUntil:
    visible:
      text: "Combien te tombe net par mois ?"
    timeout: 5000
- tapOn:
    point: "160, 452"

# ─── T6 insight ─────────────────────────────────────────────────────────
# Give the revenue→insight transition a generous window: the revenue
# "Continuer" tap triggers a provider.advance() + rebuild, and the insight
# scene computes its copy from the dossier, so first paint can lag a beat.
- extendedWaitUntil:
    visible:
      text: "Avant de te montrer…"
    timeout: 12000
- tapOn:
    point: "160, 430"

# ─── T7 scene (MintSceneRenteTrouee — renders the user's REAL currentAge) ─
# The scene receives provider.ageYears, which is derived from q_birth_year
# (the SALVAGE-01 flush fix). It must show a real age, not the sentinel.
- extendedWaitUntil:
    visible:
      text: "Continuer"
    timeout: 8000

# ─── T7 PREUVE DE LECTURE (ajoutée 2026-08-14) ─────────────────────────
#
# POURQUOI CES ASSERTIONS EXISTENT
#
# Ce flot marchait déjà ce parcours, et choisissait déjà cette date de
# naissance. Il n'a rien vu quand l'écran a annoncé une rente projetée à
# quarante ans en taisant l'hypothèse qui la porte. Ses huit assertions
# étaient six `assertNotVisible` sur des chaînes d'erreur et deux
# identifiants : elles prouvaient qu'il ne s'était rien passé de
# catastrophique. Aucune ne regardait ce qui est LU.
#
# Le couplage au texte français EST VOULU. Un identifiant prouve qu'un
# widget existe, jamais que ce qu'il dit est vrai. Ici on veut qu'un
# changement de SENS casse le gate. Les cinq autres langues exigeront leurs
# propres exécutions — un identifiant n'est pas une preuve de traduction.
- assertVisible:
    text: "SCÈNE · TA RETRAITE PROJETÉE"
- assertVisible:
    text: "CHF [0-9’']+ – [0-9’']+"
- assertVisible:
    text: "/ mois, dès 65 ans"

# L'ASSERTION QUI AURAIT ATTRAPÉ LE DÉFAUT DU 2026-08-14.
# Le profil est né le 15.07.1992 : il n'a pas atteint l'âge de référence,
# donc les 44 années de cotisation que le chiffre suppose n'existent pas
# encore. L'étiquette DOIT être là. Elle était conditionnée aux moins de
# 30 ans — elle disparaissait exactement là où le chiffre devient crédible.
- assertVisible:
    text: "hypothèse : carrière complète"

# Parcours SALARIÉ : la fourchette de rendement porte sur la LPP, qui est
# bien comptée ici. Sa présence prouve que l'hypothèse déclarée correspond
# au calcul fait.
- assertVisible:
    text: "Hypothèse : rendement moyen 1,5 à 3,5 %.*"

# ASSERTION NÉGATIVE — régression du câblage du statut professionnel.
# Cette ligne n'appartient qu'au parcours non salarié. Si elle apparaît
# ici, c'est que `isSalaried` a cessé d'être transmis depuis le
# fournisseur, et un salarié se verrait dire que son 2e pilier est inconnu.
- assertNotVisible:
    text: "2e pilier pas compté : on ne le connaît pas encore"

- tapOn:
    point: "160, 430"

# ─── T8 bifurcation:Creuser → /retraite/rente-vs-capital ───────────────
# This terminal step flushes the dossier to CoachProfile and routes the live
# retirement intent into the decision room instead of stranding the user in
# generic chat.
- extendedWaitUntil:
    visible:
      id: "onboarding-bifurcation-continue"
    timeout: 5000
# Maestro's iOS hierarchy maps this terminal button too low on iPhone 13 mini:
# `tapOn: id` resolves to the reset area. Point validated with idb
# describe-point against the real button center.
- tapOn:
    point: "160, 280"

# ─── SC-3: lands on RvC, NOT /coach/chat or /waitlist ───────────────────
# Pilote AX (ADR 2026-07-30) : id racine rente_vs_capital_screen retire ;
# on gate sur l'id INTERNE rvc_route_state (proof anchor, present au repos).
- extendedWaitUntil:
    visible:
      id: "rvc_route_state"
    timeout: 15000
- assertNotVisible:
    text: "Encore en chantier pour ton profil"
- assertNotVisible:
    text: "Dis-moi."
- assertNotVisible:
    text: "Page introuvable"
- assertNotVisible:
    text: "NoSuchMethodError"

# ─── SC-4: RvC scene receives the real birth year ───────────────────────
# Real-age proof: the picker selects 15.07.1992 in this simulator. Compute the
# expected age at runtime so this gate survives the user's next birthday. An
# UNFLUSHED birthYear (0) would render 2026 (the sentinel).
- evalScript: ${output.rvc_expected_age = ((now) => { let age = now.getFullYear() - 1992; if ((now.getMonth() + 1) < 7 || ((now.getMonth() + 1) === 7 && now.getDate() < 15)) age -= 1; return String(age); })(new Date())}
- extendedWaitUntil:
    visible:
      id: "rvc_age_state_${output.rvc_expected_age}"
    timeout: 5000
- assertNotVisible:
    text: "Ton âge: 2026"
- assertNotVisible:
    text: "Ton âge : 2026"
- takeScreenshot: "01-rvc-decision-room-from-onboarding"
