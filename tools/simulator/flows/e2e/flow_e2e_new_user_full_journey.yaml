# tools/simulator/flows/e2e/flow_e2e_new_user_full_journey.yaml
#
# ─── PURPOSE ───────────────────────────────────────────────────────────
# THE single source of truth for « MINT marche pour un nouvel utilisateur ».
# When this flow exits 0 against Railway staging on iPhone 17 Pro sim,
# MINT is ship-able. Otherwise it is not. Per the 2026-05-13 Plan
# « Débugage logique de MINT » (single E2E gate, anti-paper-green).
#
# This file is intentionally written END-TO-END before any of its
# downstream steps are known-passing. Every step assertion is a deliberate
# bet about what SHOULD work. The first assertion to fail is the next
# bug to root-cause-fix. Iteration loop : run → diagnose first break →
# fix root cause → re-run.
#
# ─── JOURNEY SPEC ──────────────────────────────────────────────────────
# Step 01 — cold launch with clean state (clearState: true)
# Step 02 — bêta modal dismissed (if surfaced)
# Step 03 — landing « Voir clair, décider seul. » visible
# Step 04 — tap « Parle à Mint » → anonymous chat opener
# Step 05 — anonymous chat LSFin disclaimer visible
# Step 06 — type 1 message + submit → assistant reply rendered
# Step 07 — scroll + wait « Créer un compte » CTA (post auth-gate)
# Step 08 — tap « Créer un compte » → /auth/register
# Step 09 — register form fields visible (email + prénom + DOB +
#           mot de passe + confirmer mot de passe)
# Step 10 — fill all 5 fields with E2E test values
# Step 11 — tap « Créer un compte » submit
# Step 12 — [BLOCKER LIKELY] handle email verification
#           Today's path : « Vérifier mon e-mail » screen with
#           « Token de vérification » label + « Valider la vérification »
#           button. The token must arrive via fixture endpoint on
#           Railway staging (TODO confirm exists ; if not, this step
#           is bug #1 — « staging has no E2E token fixture, real user
#           cannot complete register without inbox access »).
# Step 13 — post-verification : land on /aujourdhui (assumed redirect
#           per app.dart routing ; no `hasMinimumViableFacts` redirect
#           wired today, so direct to /aujourdhui).
# Step 14 — CapDuJourBanner « Parle-moi de toi » visible on /aujourdhui
# Step 15 — MintCardActionBar 3 verbs visible (« Explique-moi » /
#           « Simule » / « Rassure-moi »)
# Step 16 — tap « Explique-moi » → MintChatOverlay opens
# Step 17 — overlay body populated (per #582 P004 + #589 regression
#           lock) : « Tape une question pour creuser » visible
# Step 18 — type a follow-up question → response renders (turn 1 → 2)
#
# ─── KNOWN UNKNOWNS / EXPECTED FIRST BREAKS ────────────────────────────
# Hypotheses ordered by probability (highest first) :
#  H1 — Step 12 email verification fails (no Maestro-friendly token
#       fixture on Railway staging). Most likely first break.
#  H2 — Step 11 register form rejects E2E test values (validation rule
#       not anticipated : DOB format / password complexity).
#  H3 — Step 13 redirect goes to a different route than /aujourdhui
#       (Sentry breadcrumb logs would reveal — `app.dart` redirect
#       logic at lines 177-261).
#  H4 — Step 16-17 overlay tap-target offset on the new authenticated
#       /aujourdhui (vs the anonymous /aujourdhui tested by
#       bug__F001_S001_combined__ today).
#  H5 — Step 18 second turn fails the 3-turn-cap server contract
#       (turn counter at 1/3 should accept turn 2).
#
# Once H1 is fixed, H2-H5 re-evaluate. The loop runs until exit 0.
#
# ─── M001 NOTE (Flutter Keys ≠ Maestro iOS resource-id) ────────────────
# Same workaround as bug__P004__overlay_populated_on_open.yaml + the
# template. Text-anchor assertions on ARB-locked strings ; no `id:`
# matchers on iOS. ARB drift caught by 6-locale parity lint.
#
# ─── EXECUTION ─────────────────────────────────────────────────────────
# Pre-condition : booted iPhone 17 Pro sim, ch.mint.app installed,
# Railway staging reachable, no auth token in keychain (`xcrun simctl
# uninstall ch.mint.app` if previous run left state).
#
# Env vars expected from the harness :
#   MINT_E2E_EMAIL    : unique per run (e.g. `e2e+$(date +%s)@mint.test`)
#   MINT_E2E_PASSWORD : >= 8 chars + uppercase + digit + symbol
#                       (matches authPasswordHintFull contract)
#
# Run :
#   maestro test --env MINT_E2E_EMAIL=$(...) \
#                --env MINT_E2E_PASSWORD='Test1234!' \
#                tools/simulator/flows/e2e/flow_e2e_new_user_full_journey.yaml

appId: ch.mint.app
tags:
  - e2e
  - new-user
  - full-journey
  - ship-gate
  - phase-97.5-v2.9
  - phase-97.6-v2.10
  - golden-path
env:
  MINT_E2E_EMAIL: e2e@mint.test
  MINT_E2E_PASSWORD: Test1234!
---

# ╔══════════════════════════════════════════════════════════════════════╗
# ║ Step 01-03 — Cold launch + bêta dismiss + landing render             ║
# ╚══════════════════════════════════════════════════════════════════════╝

- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "Je comprends, on y va"
    commands:
      - tapOn: "Je comprends, on y va"
      - waitForAnimationToEnd

# M001 workaround : Flutter Semantics label not always queryable on iOS
# via Maestro's exact-text match (Gambarino italic hero rendered via
# custom paint). Use regex wildcards + anchor on the « Parle à Mint »
# CTA which is a Material button (queryable reliably). Fallback regex
# on the hero substring stays as soft confirmation.
- extendedWaitUntil:
    visible:
      text: "Parle à Mint"
    timeout: 15000
- waitForAnimationToEnd

# ╔══════════════════════════════════════════════════════════════════════╗
# ║ Step 04-07 — Anonymous chat warm-up : surfaces « Créer un compte »   ║
# ║ The acquisition funnel requires the user to tap landing CTA, send    ║
# ║ at least one message, trigger _isAuthGateLocked, then the register   ║
# ║ CTA surfaces. Mirrors flow_landing_to_register.yaml steps 02-04.     ║
# ╚══════════════════════════════════════════════════════════════════════╝

- tapOn:
    text: "Parle à Mint"
- extendedWaitUntil:
    visible:
      text: "Écris ce qui te trotte en tête…"
    timeout: 6000
- assertVisible:
    text: "Information générale, pas un conseil financier personnalisé."

# Send 3 messages to trigger auth-gate (the « Créer un compte » CTA
# surfaces post-cap, not after a single message — observed
# empirically run 5 2026-05-13 : 1 message ≠ cap reached).
# Each iteration : tap input → type → enter → wait for input bar to
# re-enable (signals previous response complete).
- tapOn:
    text: "Écris ce qui te trotte en tête…"
- inputText: "J'aimerais comprendre comment optimiser mon 3e pilier"
- pressKey: Enter
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "Écris ce qui te trotte en tête…"
    timeout: 60000
- tapOn:
    text: "Écris ce qui te trotte en tête…"
- inputText: "Et concrètement, combien je peux mettre cette année ?"
- pressKey: Enter
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "Écris ce qui te trotte en tête…"
    timeout: 60000
- tapOn:
    text: "Écris ce qui te trotte en tête…"
- inputText: "Et si je change d'employeur ?"
- pressKey: Enter
- waitForAnimationToEnd

# Post-cap : the auth-gate is a MODAL BOTTOM SHEET (AuthGateBottomSheet)
# triggered when messagesRemaining == 0. The sheet body carries the
# conversion message « Je peux garder tout ça en mémoire pour toi —
# il te suffit de créer un compte. » + primary CTA « Créer un compte »
# + secondary « J'ai déjà un compte » + dismissive « Plus tard ».
# We anchor on the conversion message (unique to the modal, no
# ambiguity with chat text) before tapping the modal's CTA.
- extendedWaitUntil:
    visible:
      text: ".*Je peux garder tout.*en mémoire.*"
    timeout: 30000

# ╔══════════════════════════════════════════════════════════════════════╗
# ║ Step 08-11 — Register form : open, fill 5 fields, submit             ║
# ╚══════════════════════════════════════════════════════════════════════╝

- tapOn:
    text: "Créer un compte"

# CASSURE #5 (observed run 11 2026-05-13, post cassure #4 fix in PR #594) :
# the « Créer un compte » CTA inside the AuthGateBottomSheet routes
# directly to /auth/register (see auth_gate_bottom_sheet.dart:93 :
# `context.push('/auth/register?redirect=/home')`). The previous detour
# via the Connexion screen was correct only when the CTA was tapped on
# the chat's text bubble (cassure #3 path). With the modal, we skip
# Connexion entirely. Anchor on the register form header right away.
- extendedWaitUntil:
    visible:
      text: "Créer ton compte"
    timeout: 8000

- assertVisible:
    text: "Adresse e-mail"
- assertVisible:
    text: "Prénom"
- assertVisible:
    text: "Date de naissance"
- assertVisible:
    text: "Mot de passe"
- assertVisible:
    text: "Confirmer le mot de passe"

- tapOn:
    text: "Adresse e-mail"
- inputText: ${MINT_E2E_EMAIL}

- tapOn:
    text: "Prénom"
- inputText: "TestE2E"

- tapOn:
    text: "Date de naissance"
- inputText: "01.01.1990"

- tapOn:
    text: "Mot de passe"
- inputText: ${MINT_E2E_PASSWORD}

- tapOn:
    text: "Confirmer le mot de passe"
- inputText: ${MINT_E2E_PASSWORD}

# Hide keyboard before tapping the submit button (the keyboard may
# overlay the « Créer un compte » CTA on small viewports).
- hideKeyboard

# « Créer un compte » appears TWICE on this screen (form title + submit
# button). The submit is the one nested in the bottom CTA region. If
# Maestro picks the wrong one, the flow either no-ops or re-opens
# register. Document as known ambiguity ; first run reveals which.
- tapOn:
    text: "Créer un compte"

# ╔══════════════════════════════════════════════════════════════════════╗
# ║ Step 12 — Email verification (LIKELY FIRST BREAK : H1)               ║
# ║ Today's contract : « Vérifier mon e-mail » screen with a token       ║
# ║ field. Without a Maestro-friendly fixture endpoint on Railway        ║
# ║ staging that returns the token, this step CANNOT pass. Filing as    ║
# ║ TODO + planning to surface via the first sim run.                    ║
# ╚══════════════════════════════════════════════════════════════════════╝

- extendedWaitUntil:
    visible:
      text: "Vérifier mon e-mail"
    timeout: 15000

# TODO[E2E-VERIF-FIXTURE] : Railway staging needs a fixture endpoint
# `POST /api/test/e2e/last-verification-token` returning the most-
# recently-issued verification token for MINT_E2E_EMAIL. Without it,
# Maestro cannot complete register. First break to root-cause.
- assertVisible:
    text: "Token de vérification"

# Optimistic continuation : assume the harness reads the token from the
# fixture endpoint via Maestro's `runScript` (TODO add when fixture
# exists) and types it here. For v0 we use a placeholder so the
# assertion bites at this line if the fixture is missing.
- tapOn:
    text: "Token de vérification"
- inputText: "VERIFICATION_TOKEN_PLACEHOLDER_FIXTURE_REQUIRED"

- tapOn:
    text: "Valider la vérification"
- extendedWaitUntil:
    visible:
      text: "E-mail vérifié. Tu peux te connecter."
    timeout: 10000

# ╔══════════════════════════════════════════════════════════════════════╗
# ║ Step 13-15 — Land on /aujourdhui post-login + CapDuJourBanner visible║
# ║ Assumes `app.dart` redirect post-auth → /aujourdhui (today, since    ║
# ║ no `hasMinimumViableFacts` getter exists yet).                       ║
# ╚══════════════════════════════════════════════════════════════════════╝

- extendedWaitUntil:
    visible:
      text: ".*Aujourd'hui.*"
    timeout: 15000

- extendedWaitUntil:
    visible:
      text: ".*Parle-moi de toi.*"
    timeout: 8000

- assertVisible:
    text: ".*Explique-moi.*"
- assertVisible:
    text: ".*Simule.*"
- assertVisible:
    text: ".*Rassure-moi.*"

# ╔══════════════════════════════════════════════════════════════════════╗
# ║ Step 16-17 — Tap « Explique-moi » → MintChatOverlay populated        ║
# ║ Mirrors bug__P004__overlay_populated_on_open.yaml semantic lock.     ║
# ╚══════════════════════════════════════════════════════════════════════╝

- tapOn:
    text: ".*Explique-moi.*"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: ".*0\\s*/\\s*3.*"
    timeout: 8000

- extendedWaitUntil:
    visible:
      text: ".*Tape une question pour creuser.*"
    timeout: 5000

# ╔══════════════════════════════════════════════════════════════════════╗
# ║ Step 18 — Second turn : confirm 3-turn cap accepts turn 2            ║
# ║ User types a follow-up question → assistant responds → counter       ║
# ║ « 1 / 3 ».                                                            ║
# ╚══════════════════════════════════════════════════════════════════════╝

- tapOn:
    text: "Pose une question à Mint"
- inputText: "Et concrètement, je verse combien ?"
- pressKey: Enter

- extendedWaitUntil:
    visible:
      text: ".*1\\s*/\\s*3.*"
    timeout: 30000

# ─── GOLDEN PATH COMPLETE ──────────────────────────────────────────────
# If we reach this point, the new-user E2E path is GREEN. Exit 0.
# That is the ship-gate for v2.10 public TestFlight per the
# 2026-05-13 Plan « Débugage logique de MINT ».
