name: MINT Next Batch 10 Runtime Trust Unit

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

concurrency:
  group: mint-next-batch10-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_BATCH10_GUARD_SHA256: 6c734fd862c752ce912af6bdc35e76578a8d8e1319f9b4454affdff7d5663910
  EXPECTED_BATCH10_TESTS_SHA256: 17e24136242f237361ac1a1a61577aaf5bfaf92ed8915e2e4e8e4fc9cbd6a614
  EXPECTED_BATCH10_ACCEPTANCE_SHA256: 36c9ef128aa7b548c1df04637d9721cda2babfe330ef16ff1133f5a1288846f2

jobs:
  trust-unit:
    name: Exact contribution runtime trust unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.11'
      - name: Install exact guard dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Verify the verifier trust unit
        run: |
          test "$(shasum -a 256 tools/checks/mint_next_batch10_contribution_runtime_guard.py | cut -d ' ' -f 1)" = "$EXPECTED_BATCH10_GUARD_SHA256"
          test "$(shasum -a 256 tools/checks/tests/test_mint_next_batch10_contribution_runtime_guard.py | cut -d ' ' -f 1)" = "$EXPECTED_BATCH10_TESTS_SHA256"
          test "$(shasum -a 256 product/mint_next/batch10/design-lab-acceptance.yaml | cut -d ' ' -f 1)" = "$EXPECTED_BATCH10_ACCEPTANCE_SHA256"
      - name: Verify accepted contribution runtime package
        run: python3 tools/checks/mint_next_batch10_contribution_runtime_guard.py
      - name: Fire hostile promotion mutations
        run: python3 -m unittest tools.checks.tests.test_mint_next_batch10_contribution_runtime_guard
