name: MINT visual retirement exact TestFlight availability
on:
  push:
    branches: [codex/visual-retirement-availability-20261103-7943f48f95]
permissions:
  contents: read
  actions: read
concurrency:
  group: visual-retirement-testflight-availability
  cancel-in-progress: false
jobs:
  verify-availability:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Verify exact terminal upload and immutable receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python3 {0}
        run: |
          import subprocess,json,os,re,hashlib
          repo='MINT-IA/MINT';run_id=41627152121;job_id=125887244004
          expected='9009b6d5c4409810db60b665e002ef4c78965a48';branch='codex/visual-retirement-testflight-20261103-7943f48f95'
          wanted=json.loads('{"build": "18", "bundle": "ch.mint.app", "distributionEntitlementsVerified": true, "finishedAt": 1793705515.277714, "frameworkArm64Verified": true, "ipaBytes": 11955364, "ipaSHA256": "2eac9c5f2b1eeec9c36c6a20b7e8021c1901d311bb92fcda07e00519a8f58b65", "nativeUploadCommandSucceeded": true, "sourceCommit": "7943f48f9599cfb7f611deaae610f711f5aed229", "sourceManifestSHA256": "efd416a11af1db1579b53b135ac62dd637b1761d6e35eb0c285543351b60b0fb", "sourceMetadataDelta": "Info.plist CFBundleVersion ->18 only", "testerAvailabilityVerified": false, "version": "2.15.0"}')
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path]))
          r=api('actions/runs/'+str(run_id));assert r['head_sha']==expected and r['head_branch']==branch and r['status']=='completed' and r['conclusion']=='success','Exact completed upload run required'
          j=api('actions/jobs/'+str(job_id));assert j['run_id']==run_id and j['status']=='completed' and j['conclusion']=='success','Exact completed upload job required'
          raw=subprocess.check_output(['gh','api','--allow-escape-sequences','repos/'+repo+'/actions/jobs/'+str(job_id)+'/logs'])
          assert hashlib.sha256(raw).hexdigest()=='052bcb4db30d0de9211b3b27ba3acbafaf889c32a63589b7c7ae0ef64b4062b5', 'Upload job log changed'
          receipts=[]
          for line in raw.decode('utf-8',errors='strict').splitlines():
           start=line.find('{')
           if start<0:continue
           try:value=json.loads(line[start:])
           except (ValueError,TypeError):continue
           if isinstance(value,dict) and value.get('nativeUploadCommandSucceeded') is True:receipts.append(value)
          assert len(receipts)==1 and receipts[0]==wanted,'Exactly one agreeing receipt required'
          assert hashlib.sha256(json.dumps(wanted,sort_keys=True,separators=(',',':'),ensure_ascii=True).encode()).hexdigest()=='a549087ef75bf4c6f4e6ff5ff9d991da5d5cf211ba2b824bc2646930ca9fd744'
          with open(os.environ['GITHUB_ENV'],'a') as f:
           print('MINT_EXPECTED_BUILD='+wanted['build'],file=f)
           print('MINT_UPLOAD_PROOF_VERIFIED=true',file=f)
          print(json.dumps(dict(qualifiedUploadProofVerified=True,rawLogByteIdentityVerified=True,rawLogSHA256=hashlib.sha256(raw).hexdigest(),sourceCommit=wanted['sourceCommit'],build=wanted['build'],ipaSHA256=wanted['ipaSHA256'],testerAvailabilityVerified=False)))
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: '3.4'
      - name: Confirm Apple processing notes and existing internal group
        env:
          ASC_KEY_ID: "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}"
          ASC_ISSUER_ID: "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          ASC_KEY_CONTENT: "${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}"
          MINT_UPLOAD_SOURCE_COMMIT: "7943f48f9599cfb7f611deaae610f711f5aed229"
          MINT_QUALIFICATION_SHA256: "4d9e4397bf7aa9b5093446edfbd434659fb6f2df4e3740684b85539f54ba1b79"
          MINT_BETA_NOTES_BASE64: ""
          MINT_BETA_NOTES_SHA256: "24ff1a4c870db32b3c4279c6553d45e4c8dc64c7107512b831314f427b35630c"
        shell: ruby {0}
        run: |
          require 'openssl'
          require 'base64'
          require 'json'
          require 'net/http'
          require 'uri'
          require 'digest'
          # Must only run after the qualified upload report has established this build identity.
          expected_build=ENV.fetch('MINT_EXPECTED_BUILD','')
          abort('Canonical receipt-selected build required') unless expected_build.match?(/\A[1-9][0-9]*\z/) && expected_build=='18'
          abort('Qualified upload gate required') unless ENV.fetch('MINT_UPLOAD_PROOF_VERIFIED','')=='true'
          abort('Upload proof required') unless ENV.fetch('MINT_UPLOAD_SOURCE_COMMIT','')=='7943f48f9599cfb7f611deaae610f711f5aed229'
          abort('Qualification binding required') unless ENV.fetch('MINT_QUALIFICATION_SHA256','')=='4d9e4397bf7aa9b5093446edfbd434659fb6f2df4e3740684b85539f54ba1b79'
          key_id=ENV.fetch('ASC_KEY_ID').strip;issuer=ENV.fetch('ASC_ISSUER_ID').strip
          raw=ENV.fetch('ASC_KEY_CONTENT').strip.gsub('\\n',"\n");raw=Base64.strict_decode64(raw) unless raw.include?('-----BEGIN PRIVATE KEY-----')
          key=OpenSSL::PKey.read(raw)
          abort('Expected configured key') unless key_id=='6TZCV5S346' && !issuer.empty? && key.group.curve_name=='prime256v1'
          encode=->(s) { Base64.urlsafe_encode64(s,padding:false) }
          token=lambda do
            now=Time.now.to_i
            content=[encode.call(JSON.generate(alg:'ES256',kid:key_id,typ:'JWT')),encode.call(JSON.generate(iss:issuer,iat:now-30,exp:now+300,aud:'appstoreconnect-v1'))].join('.')
            der=key.sign(OpenSSL::Digest::SHA256.new,content);sig=OpenSSL::ASN1.decode(der).value.map { |x| x.value.to_s(2).rjust(32,"\0") }.join
            content+'.'+encode.call(sig)
          end
          request=lambda do |method,path,query={},body=nil|
            abort('Only Apple API paths allowed') unless path.start_with?('/v1/') && !path.include?('://')
            uri=URI('https://api.appstoreconnect.apple.com'+path);uri.query=URI.encode_www_form(query) unless query.empty?
            klass={'GET'=>Net::HTTP::Get,'POST'=>Net::HTTP::Post,'PATCH'=>Net::HTTP::Patch}.fetch(method)
            req=klass.new(uri);req['Authorization']='Bearer '+token.call
            if body;req['Content-Type']='application/json';req.body=JSON.generate(body);end
            response=Net::HTTP.start(uri.host,uri.port,use_ssl:true,open_timeout:20,read_timeout:40) { |http| http.request(req) }
            data=response.body.to_s.empty? ? {} : JSON.parse(response.body)
            abort(JSON.generate(apiRequestFailed:true,status:response.code,path:path,codes:(data['errors']||[]).map { |x| x['code'] })) unless ['200','201','204'].include?(response.code)
            data
          end
          get=->(path,query={}) { request.call('GET',path,query) }
          # Explicit complete pagination for every collection, including group membership and notes.
          get_all=lambda do |path,query={}|
            page=get.call(path,query);rows=[];included=[];seen={};pages=0
            loop do
              pages+=1;abort('Unexpected collection size') if pages>100
              rows.concat(page.fetch('data'));included.concat(page.fetch('included',[]))
              link=page.dig('links','next');break unless link
              uri=URI(link)
              abort('Unexpected collection pagination URL') unless uri.scheme=='https' && uri.host=='api.appstoreconnect.apple.com' && uri.port==443 && uri.path==path && uri.userinfo.nil? && uri.fragment.nil?
              abort('Repeated collection page') if seen[link];seen[link]=true
              page=get.call(uri.path,URI.decode_www_form(uri.query.to_s).to_h)
            end
            abort('Duplicate collection identities') unless rows.map { |x| x.fetch('id') }.uniq.size==rows.size
            {'data'=>rows,'included'=>included}
          end
          apps=get_all.call('/v1/apps',{'filter[bundleId]'=>'ch.mint.app'})['data'];abort('App identity mismatch') unless apps.size==1 && apps[0]['id']=='6759292583' && apps[0]['attributes']['bundleId']=='ch.mint.app'
          app_id=apps[0]['id'];target=nil;deadline=Time.now+1200
          loop do
            data=get_all.call('/v1/builds',{'filter[app]'=>app_id,'sort'=>'-uploadedDate','limit'=>'200','include'=>'preReleaseVersion'})
            versions=(data['included']||[]).to_h { |x| [x['id'],x.dig('attributes','version')] }
            matches=data['data'].select { |b| b.dig('attributes','version')==expected_build && versions[b.dig('relationships','preReleaseVersion','data','id')]=='2.15.0' }
            abort('Duplicate expected build') if matches.size>1
            target=matches.first
            break if target && target.dig('attributes','processingState')=='VALID'
            abort('Apple processing failed') if target && %w[FAILED INVALID].include?(target.dig('attributes','processingState'))
            abort('Apple processing still pending after bounded wait; inspect same build, never re-upload') if Time.now>=deadline
            puts JSON.generate(appleProcessing:target ? target.dig('attributes','processingState') : 'NOT_YET_LISTED',build:expected_build)
            sleep(20)
          end
          build_id=target['id'];group_id='babae2ed-6c5a-4e22-9dd2-3ee5288e3fc5'
          groups=get_all.call('/v1/apps/'+app_id+'/betaGroups',{'limit'=>'200','fields[betaGroups]'=>'isInternalGroup,hasAccessToAllBuilds'})['data']
          group=groups.find { |x| x['id']==group_id };abort('Known internal group required') unless group && group.dig('attributes','isInternalGroup')==true
          membership=lambda do
            get_all.call('/v1/betaGroups/'+group_id+'/builds',{'limit'=>'200','fields[builds]'=>'version,processingState'})['data'].any? { |b| b['id']==build_id }
          end
          unless membership.call
            request.call('POST','/v1/builds/'+build_id+'/relationships/betaGroups',{}, {data:[{type:'betaGroups',id:group_id}]})
          end
          notes=Base64.strict_decode64(ENV.fetch('MINT_BETA_NOTES_BASE64')).force_encoding('UTF-8');abort('Invalid beta notes') unless notes.valid_encoding? && notes.length.between?(1,4000) && Digest::SHA256.hexdigest(notes)==ENV.fetch('MINT_BETA_NOTES_SHA256')
          path='/v1/builds/'+build_id+'/betaBuildLocalizations'
          list=get_all.call(path,{})['data'];matches=list.select { |x| x.dig('attributes','locale')=='fr-FR' };abort('Duplicate French localization') if matches.size>1;localized=matches.first
          if localized
            request.call('PATCH','/v1/betaBuildLocalizations/'+localized['id'],{}, {data:{type:'betaBuildLocalizations',id:localized['id'],attributes:{whatsNew:notes}}}) unless localized.dig('attributes','whatsNew')==notes
          else
            request.call('POST','/v1/betaBuildLocalizations',{}, {data:{type:'betaBuildLocalizations',attributes:{locale:'fr-FR',whatsNew:notes},relationships:{build:{data:{type:'builds',id:build_id}}}}})
          end
          readback=get_all.call(path,{})['data'].select { |x| x.dig('attributes','locale')=='fr-FR' };abort('Notes readback mismatch') unless readback.size==1 && readback.first.dig('attributes','whatsNew')==notes
          deadline=Time.now+600;detail=nil
          loop do
            detail=get.call('/v1/builds/'+build_id+'/buildBetaDetail',{}).dig('data','attributes')
            break if detail && detail['internalBuildState']=='IN_BETA_TESTING' && membership.call
            abort('Internal beta availability pending; inspect same build') if Time.now>=deadline
            puts JSON.generate(internalBetaState:detail && detail['internalBuildState'],groupMembership:membership.call)
            sleep(20)
          end
          report={testerAvailabilityVerified:true,uploadCommandSucceeded:true,uploadReceiptSHA256:'a549087ef75bf4c6f4e6ff5ff9d991da5d5cf211ba2b824bc2646930ca9fd744',uploadJobLogSHA256:'052bcb4db30d0de9211b3b27ba3acbafaf889c32a63589b7c7ae0ef64b4062b5',ipaSHA256:'2eac9c5f2b1eeec9c36c6a20b7e8021c1901d311bb92fcda07e00519a8f58b65',ipaBytes:11955364,qualificationSHA256:'4d9e4397bf7aa9b5093446edfbd434659fb6f2df4e3740684b85539f54ba1b79',uploadWorkflowRun:41627152121,uploadWorkflowJob:125887244004,uploadWorkflowCommit:'9009b6d5c4409810db60b665e002ef4c78965a48',sourceManifestSHA256:'efd416a11af1db1579b53b135ac62dd637b1761d6e35eb0c285543351b60b0fb',sourceCommit:'7943f48f9599cfb7f611deaae610f711f5aed229',bundle:'ch.mint.app',version:'2.15.0',build:expected_build,buildId:build_id,processingState:'VALID',internalBuildState:detail['internalBuildState'],internalGroup:group_id,groupMembershipVerified:true,betaNotesLocale:'fr-FR',betaNotesSHA256:Digest::SHA256.hexdigest(notes),betaNotesReadbackVerified:true}
          puts JSON.generate(report)
          File.open(ENV.fetch('GITHUB_STEP_SUMMARY'),'a') { |f| f.puts(JSON.pretty_generate(report)) }
