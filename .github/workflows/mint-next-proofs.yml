name: MINT Next Batch 19 R1 RED Proofs

# Neutral CI executor for the Batch 19 R1 expected-RED contract.
# The clean GitHub runner IS the isolation: this job runs the guards directly
# and does NOT depend on the guard's anti-local-state machinery
# (isolated -ISB bootstrap / detached worktree replay). The 27 hostile
# acceptance-guard tests + the 2-pass/13-behavioral-fail RED replay are the
# proof. The acceptance guard's git-boundary check is intentionally NOT run
# here: this branch carries the workflow file, a path foreign to that guard by
# design, and the branch is a declared non-merge executor.

on:
  pull_request:
    branches: [dev, staging, main]
    paths:
      - 'product/mint_next/**'
      - 'tools/checks/mint_next_batch19_r1_red*'
      - 'tools/checks/tests/test_mint_next_batch19_r1_red*'
      - '.planning/journeys/path-owners/**'
      - '.github/workflows/mint-next-proofs.yml'
  push:
    branches:
      - 'codex/mint-next-batch5-beginner-navigation-3a-20260802'
    paths:
      - 'product/mint_next/**'
      - 'tools/checks/mint_next_batch19_r1_red*'
      - 'tools/checks/tests/test_mint_next_batch19_r1_red*'
      - '.planning/journeys/path-owners/**'
      - '.github/workflows/mint-next-proofs.yml'
  workflow_dispatch:

concurrency:
  group: mint-next-batch19-r1-red-proofs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance-contract:
    name: Batch19 acceptance guard hostile suite (27) + receipt substance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.11'
      - name: Install exact guard dependency
        run: |
          python3 -m pip install PyYAML==6.0.2
          # run_proofs' trusted dependency_site probe (exercised by the
          # sitecustomize-isolation test) requires the user site-packages DIR
          # to exist. A fresh runner has none, and --user would no-op because
          # PyYAML is already satisfied in the interpreter site, so create the
          # dir directly. An empty dir is enough: the isolated proof then fails
          # on the absent yaml/flutter, which is the expected "proof failed".
          python3 -c "import site, os; os.makedirs(site.getusersitepackages(), exist_ok=True)"
      - name: Fire the 27 hostile acceptance-guard mutations
        run: python3 -m unittest tools.checks.tests.test_mint_next_batch19_r1_red_acceptance_guard
      - name: Verify acceptance receipt substance (payload + schema + RED integrity; git boundary waived on this non-merge executor branch)
        run: >-
          python3 -c "import sys; sys.path.insert(0, '.');
          from tools.checks.mint_next_batch19_r1_red_acceptance_guard import validate, REPO_ROOT;
          validate(REPO_ROOT, check_git=False);
          print('ACCEPTANCE RECEIPT SUBSTANCE OK')"

  red-replay:
    name: Batch19 R1 expected-RED replay (2 pass / 13 behavioral fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.11'
      - name: Install exact guard dependency
        run: python3 -m pip install PyYAML==6.0.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # The RED contract's pubspec.lock (test_api 0.7.10, vector_math 2.2.0,
          # Dart ^3.11.0) is satisfied only by 3.41.6 — the SDK it was authored
          # on. Newer Flutter re-pins those SDK-vendored packages, so
          # `pub get --offline --enforce-lockfile` (used inside the guard)
          # cannot resolve. Verified locally: 3.41.6 replays exactly 2/13.
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Warm pub cache with the LOCKED versions (no lock rewrite)
        working-directory: product/mint_next/batch7/design_lab
        # --enforce-lockfile downloads exactly the pinned lockfile versions
        # (what the guard's isolated `pub get --offline --enforce-lockfile`
        # needs) WITHOUT upgrading/rewriting pubspec.lock. Plain `flutter pub
        # get` would upgrade transitive deps and drift the guard's pinned SHA.
        run: flutter pub get --enforce-lockfile
      - name: Guarantee the pinned lockfile is byte-identical before the guard reads it
        run: git checkout -- product/mint_next/batch7/design_lab/pubspec.lock
      - name: Replay expected-RED contract and assert exact 2/13 behavioral pattern
        run: python3 tools/checks/mint_next_batch19_r1_red_guard.py
      - name: Fire the 40 hostile RED-guard mutations
        run: python3 -m unittest tools.checks.tests.test_mint_next_batch19_r1_red_guard
