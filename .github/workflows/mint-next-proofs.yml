name: MINT Next Batch 19 R1 Proofs

# Neutral CI executor + GREEN release attestation for the Batch 19 R1 transition.
# Two regimes:
#   - executor job (if != workflow_dispatch): the green-gate transition CONTRACT
#     (--contract, structure only, no Flutter). The batch19 acceptance-contract
#     executor job was RETIRED (Option 2, product decision 2026-08-05): see the
#     supersession note above green-gate-contract below.
#     The retired expected-RED replay (2 pass / 13 behavioral fail) is
#     intentionally NOT run here: after the OPTION-A re-seal it fails on two
#     axes that are hygiene, not 2/13 substance — the RED guard's diff-boundary
#     (candidate_end moved past accumulated non-RED commits) and lib-inventory
#     drift (the R1 runtime is now written). Behavioral 2/13 at the new
#     RED_COMMIT eb3211a2 is proven locally (check_git=False) and attested
#     historically via the dev release-attestation dispatch (check_git=True).
#   - green-release-attestation (if == workflow_dispatch): checks out an
#     immutable promotion SHA and runs the green guard `--release`
#     (validate require_accepted=True + exact lib-inventory seal + runner-input
#     seal + the 15/15 replay), then the state-agnostic hostile suite. This
#     attests the GREEN flip mechanically at promotion time. On a PENDING
#     manifest `--release` exits 1 ("green gate is still pending").

on:
  pull_request:
    branches: [dev, staging, main]
    paths:
      - 'product/mint_next/**'
      - 'tools/checks/mint_next_batch19_r1_red*'
      - 'tools/checks/mint_next_batch19_r1_green*'
      - 'tools/checks/tests/test_mint_next_batch19_r1_red*'
      - 'tools/checks/tests/test_mint_next_batch19_r1_green*'
      - '.planning/journeys/path-owners/**'
      - '.github/workflows/mint-next-proofs.yml'
  push:
    branches:
      - 'codex/mint-next-batch5-beginner-navigation-3a-20260802'
    paths:
      - 'product/mint_next/**'
      - 'tools/checks/mint_next_batch19_r1_red*'
      - 'tools/checks/mint_next_batch19_r1_green*'
      - 'tools/checks/tests/test_mint_next_batch19_r1_red*'
      - 'tools/checks/tests/test_mint_next_batch19_r1_green*'
      - '.planning/journeys/path-owners/**'
      - '.github/workflows/mint-next-proofs.yml'
  workflow_dispatch:
    inputs:
      promotion_sha:
        description: 'Immutable promotion head SHA to attest with the green guard --release (accepted manifest, 15/15). Leave empty for the executor jobs.'
        required: false
        default: ''

concurrency:
  group: mint-next-batch19-r1-proofs-${{ github.ref }}-${{ inputs.promotion_sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Batch19 R1 acceptance-contract job — RETIRED (Option 2, product decision
  # 2026-08-05). batch19 R1 acceptance attested historically at RED_COMMIT
  # 891355d9 / run 30915390698; live RED-artifact re-verification retired —
  # superseded by batch20 fact_lieu fusion (fact_canton folded into fact_lieu on
  # both contribution branches; the standalone canton screen and its RED test are
  # removed). The retired job ran the acceptance guard's validate(check_git=False),
  # whose RED_ARTIFACTS drift check required the LIVE
  # design_lab_batch18_canton_r1_test.dart to stay byte-identical to RED_COMMIT
  # 891355d9 — obsolete once batch20 removes that test with the fact_canton
  # screen. The acceptance guard's own source is bound into its accepted payload,
  # so it cannot be edited without un-accepting the receipt (Option 1, rejected);
  # the historical attestation stands. The green-gate transition contract below is
  # unaffected and still runs.

  green-gate-contract:
    name: Batch19 R1 green-gate transition contract (PENDING, --contract, no Flutter)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.11'
      - name: Install exact guard dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Validate the PENDING green-gate transition contract (structure only; the 15/15 replay is deferred to green-release-attestation)
        run: |
          python3 -I tools/checks/mint_next_batch19_r1_green_gate_guard.py --contract
          echo "GREEN GATE CONTRACT PASS — pending, structure only"
      - name: Fire the hostile green-gate mutations (state-agnostic)
        run: python3 -m unittest tools.checks.tests.test_mint_next_batch19_r1_green_gate_guard

  green-release-attestation:
    name: Batch19 R1 GREEN release attestation (accepted, 15/15, dispatch-only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Immutable promotion head SHA. On a PENDING manifest --release exits 1
          # ("green gate is still pending"); on the accepted green flip commit it
          # runs validate(require_accepted=True) + the exact lib-inventory seal +
          # the runner-input seal + the 15/15 replay and exits 0.
          ref: ${{ inputs.promotion_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.11'
      - name: Install exact guard dependency + create user-site dir
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 -c "import site, os; os.makedirs(site.getusersitepackages(), exist_ok=True)"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Only the SDK that satisfies the design_lab pinned pubspec.lock under
          # --enforce-lockfile; --release replays the sealed spec to 15/15.
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - name: Warm pub cache with the LOCKED versions (no lock rewrite)
        working-directory: product/mint_next/batch7/design_lab
        run: flutter pub get --enforce-lockfile
      - name: Guarantee the pinned lockfile is byte-identical before the guard reads it
        run: git checkout -- product/mint_next/batch7/design_lab/pubspec.lock
      - name: Full green release attestation (validate require_accepted + inventory seal + runner-input seal + 15/15 replay)
        run: python3 -I tools/checks/mint_next_batch19_r1_green_gate_guard.py --release
      - name: Fire the hostile green-gate mutations (state-agnostic)
        run: python3 -m unittest tools.checks.tests.test_mint_next_batch19_r1_green_gate_guard
