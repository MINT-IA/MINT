name: MINT Next Batch 16C Runtime Acceptance

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

permissions:
  contents: read

env:
  EXPECTED_BATCH16C_GREEN_GUARD_SHA256: 7154d289d9c532c94f31b64f383fc3c8a4dae6e5c39705b08593255249d39552
  EXPECTED_BATCH16C_GREEN_GUARD_TESTS_SHA256: 294d2a187391c868e9fcf0f1d50bddd78e8b366b1bbce358a54fa4d70dc1ce64
  EXPECTED_BATCH16C_GREEN_MANIFEST_SHA256: 61c5e4849396521cc1ed5b3c22551f6a2c8ff2ba5a5ca2b2156811927b60cbee
  EXPECTED_BATCH16C_GREEN_SCOPE_SHA256: b92bbbdc3500f2027d9c0d7e8c548082a65a08a1a3c8d04689b8d0de57675f08
  EXPECTED_BATCH16C_GREEN_NAVIGATION_SHA256: e2894b8a47ce971a1bb8cdccf25e9e8d336183fb64416e9f5eb1be184fec48e5
  EXPECTED_BATCH16C_GREEN_WIDGET_TEST_SHA256: 912ef2a94ce33a220df45512f415b39b2598d4d1e7774f9abc53f9b23c224610
  EXPECTED_BATCH16C_GREEN_SWISS_FIXTURE_SHA256: 27e4ffe17cc53d17cb572c2c9f3ee43bde01aee46e0635984a974dc357153032
  EXPECTED_BATCH16C_GREEN_OFFICIAL_SOURCES_SHA256: 88be0657eb61284857092adfb7f002b180e6df24834a99bce34a43736b64cab5
  EXPECTED_BATCH16C_GREEN_GENERATED_FIXTURE_SHA256: 02ec4f1c28afb040af2cb4f0b89bde55811caaf8e063d4c86cbdab35689a640a
jobs:
  runtime-acceptance:
    name: Hidden runtime acceptance — production promotion remains forbidden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.11'
      - name: Install exact guard dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Verify the GREEN trust unit
        run: |
          test "$(sha256sum tools/checks/mint_next_batch16_runtime_guard.py | cut -d ' ' -f 1)" = "$EXPECTED_BATCH16C_GREEN_GUARD_SHA256"
          test "$(sha256sum tools/checks/tests/test_mint_next_batch16_runtime_guard.py | cut -d ' ' -f 1)" = "$EXPECTED_BATCH16C_GREEN_GUARD_TESTS_SHA256"
          test "$(sha256sum product/mint_next/batch16/runtime-navigation-acceptance.yaml | cut -d ' ' -f 1)" = "$EXPECTED_BATCH16C_GREEN_MANIFEST_SHA256"
          test "$(sha256sum product/mint_next/batch16/classification-doubt-scope.yaml | cut -d ' ' -f 1)" = "$EXPECTED_BATCH16C_GREEN_SCOPE_SHA256"
          test "$(sha256sum product/mint_next/batch16/navigation.mmd | cut -d ' ' -f 1)" = "$EXPECTED_BATCH16C_GREEN_NAVIGATION_SHA256"
          test "$(sha256sum product/mint_next/batch7/design_lab/test/design_lab_batch16_unresolved_navigation_test.dart | cut -d ' ' -f 1)" = "$EXPECTED_BATCH16C_GREEN_WIDGET_TEST_SHA256"
          test "$(sha256sum product/mint_next/batch16/six-locale-semantic-fixture.yaml | cut -d ' ' -f 1)" = "$EXPECTED_BATCH16C_GREEN_SWISS_FIXTURE_SHA256"
          test "$(sha256sum product/mint_next/batch16/official-sources.yaml | cut -d ' ' -f 1)" = "$EXPECTED_BATCH16C_GREEN_OFFICIAL_SOURCES_SHA256"
          test "$(sha256sum product/mint_next/batch7/design_lab/test/batch16_semantic_fixture.g.dart | cut -d ' ' -f 1)" = "$EXPECTED_BATCH16C_GREEN_GENERATED_FIXTURE_SHA256"
      - name: Verify mapped GREEN obligations and privacy boundary
        run: python3 tools/checks/mint_next_batch16_runtime_guard.py
      - name: Fire hostile GREEN-contract mutations
        run: python3 -m unittest tools.checks.tests.test_mint_next_batch16_runtime_guard

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Verify analyzer, Batch16 runtime, and full Design Lab
        working-directory: product/mint_next/batch7/design_lab
        run: |
          flutter pub get
          flutter analyze
          flutter test test/design_lab_batch16_unresolved_navigation_test.dart
          flutter test
