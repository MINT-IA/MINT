name: MINT Next Batch 16 Classification Contract

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

concurrency:
  group: mint-next-batch16-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPECTED_BATCH16_SCOPE_GUARD_SHA256: 79ddc2eba4fddf9cf6da15e35bfa6caa736ec9fb57d0c69ec55120d872484d35
  EXPECTED_BATCH16_SCOPE_TESTS_SHA256: ed45f287706f529c0719675426ad1933fbb1db57aed52a7489fce27c88c3df70
  EXPECTED_BATCH16_ACCEPTANCE_SHA256: 68d9eb54e0a9dca4ca11071344f09e35838b7fb69b3dfef7642aee3c829433c9
  EXPECTED_BATCH16_MODEL_GUARD_SHA256: be3e796be2dab95ff449790d1ad087260c8190beb9ec021ce9088b7251c94231
  EXPECTED_BATCH16_MODEL_GUARD_TESTS_SHA256: fa6ea2097e4bbeddd9349e7aea686f4d82f43efa6e10f05ee298120b0fdf0888
  EXPECTED_BATCH16_MODEL_RECEIPT_SHA256: e940b72b5c400525164b1fa23807a7dcccfea6b01241df104a3695b336d06e52

jobs:
  written-contract:
    name: Classification/doubt written contract only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.11'
      - name: Install exact guard dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Verify the verifier trust unit
        run: |
          test "$(shasum -a 256 tools/checks/mint_next_batch16_classification_scope_guard.py | cut -d ' ' -f 1)" = "$EXPECTED_BATCH16_SCOPE_GUARD_SHA256"
          test "$(shasum -a 256 tools/checks/tests/test_mint_next_batch16_classification_scope_guard.py | cut -d ' ' -f 1)" = "$EXPECTED_BATCH16_SCOPE_TESTS_SHA256"
          test "$(shasum -a 256 product/mint_next/batch16/acceptance.yaml | cut -d ' ' -f 1)" = "$EXPECTED_BATCH16_ACCEPTANCE_SHA256"
      - name: Verify accepted written contract remains runtime-forbidden
        run: python3 tools/checks/mint_next_batch16_classification_scope_guard.py
      - name: Fire hostile written-contract mutations
        run: python3 -m unittest tools.checks.tests.test_mint_next_batch16_classification_scope_guard

  hidden-model-trust:
    name: Hidden classification model trust unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.11'
      - name: Install exact guard dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Verify hidden-model trust files
        run: |
          test "$(shasum -a 256 tools/checks/mint_next_batch16_classification_model_guard.py | cut -d ' ' -f 1)" = "$EXPECTED_BATCH16_MODEL_GUARD_SHA256"
          test "$(shasum -a 256 tools/checks/tests/test_mint_next_batch16_classification_model_guard.py | cut -d ' ' -f 1)" = "$EXPECTED_BATCH16_MODEL_GUARD_TESTS_SHA256"
          test "$(shasum -a 256 product/mint_next/batch16/model-groundwork-acceptance.yaml | cut -d ' ' -f 1)" = "$EXPECTED_BATCH16_MODEL_RECEIPT_SHA256"
      - name: Verify hidden-only model boundary
        run: python3 tools/checks/mint_next_batch16_classification_model_guard.py --static-only
      - name: Fire hostile hidden-model mutations
        run: python3 -m unittest tools.checks.tests.test_mint_next_batch16_classification_model_guard

  hidden-model-flutter:
    name: Hidden classification model Flutter proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve isolated Design Lab dependencies
        working-directory: product/mint_next/batch7/design_lab
        run: flutter pub get
      - name: Verify hidden classification model and all prior model behavior
        run: python3 tools/checks/mint_next_batch16_classification_model_guard.py
