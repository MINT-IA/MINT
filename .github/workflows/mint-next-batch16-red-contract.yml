name: MINT Next Batch 16C RED Contract

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

permissions:
  contents: read

env:
  EXPECTED_BATCH16C_RED_GUARD_SHA256: c6f36b6fd6d61bc393d1d1b53e7abc2ab1213ca4674f2a8139a659b079e9177b
  EXPECTED_BATCH16C_RED_GUARD_TESTS_SHA256: 1fe5a30b4b712824472b54a8b9a50c440b773cbc9a8ec248279a763c4a0fa699
  EXPECTED_BATCH16C_RED_MANIFEST_SHA256: 2f8bb5f4160f76ed087977fcc62f095aac1f5c55446a47c22d3c44f403c260d0
  EXPECTED_BATCH16C_RED_WIDGET_TEST_SHA256: fa0d8752b26ba3c9e60569acf5dace5db52d00096276aa0e8cbfe00c37726fab
  EXPECTED_BATCH16C_RED_SWISS_FIXTURE_SHA256: 03ef84c9369dc98d7aeec99e047c9a3e5683533822a2187991afdeb4ef5a5dc0
  EXPECTED_BATCH16C_RED_GENERATED_FIXTURE_SHA256: 02ec4f1c28afb040af2cb4f0b89bde55811caaf8e063d4c86cbdab35689a640a

jobs:
  red-contract:
    name: Candidate RED contract only — runtime remains forbidden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.11'
      - name: Install exact guard dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Verify the RED trust unit
        run: |
          test "$(sha256sum tools/checks/mint_next_batch16_runtime_red_contract_guard.py | cut -d ' ' -f 1)" = "$EXPECTED_BATCH16C_RED_GUARD_SHA256"
          test "$(sha256sum tools/checks/tests/test_mint_next_batch16_runtime_red_contract_guard.py | cut -d ' ' -f 1)" = "$EXPECTED_BATCH16C_RED_GUARD_TESTS_SHA256"
          test "$(sha256sum product/mint_next/batch16/runtime-navigation-red.yaml | cut -d ' ' -f 1)" = "$EXPECTED_BATCH16C_RED_MANIFEST_SHA256"
          test "$(sha256sum product/mint_next/batch7/design_lab/test/design_lab_batch16_unresolved_navigation_test.dart | cut -d ' ' -f 1)" = "$EXPECTED_BATCH16C_RED_WIDGET_TEST_SHA256"
          test "$(sha256sum product/mint_next/batch16/six-locale-semantic-fixture.yaml | cut -d ' ' -f 1)" = "$EXPECTED_BATCH16C_RED_SWISS_FIXTURE_SHA256"
          test "$(sha256sum product/mint_next/batch7/design_lab/test/batch16_semantic_fixture.g.dart | cut -d ' ' -f 1)" = "$EXPECTED_BATCH16C_RED_GENERATED_FIXTURE_SHA256"
      - name: Verify mapped RED obligations without executing forbidden runtime
        run: python3 tools/checks/mint_next_batch16_runtime_red_contract_guard.py
      - name: Fire hostile RED-contract mutations
        run: python3 -m unittest tools.checks.tests.test_mint_next_batch16_runtime_red_contract_guard
