name: AI Workflow Guards

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

concurrency:
  group: ai-workflow-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Active context and agent workflow guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install guard dependencies
        run: |
          python3 -m pip install pytest jsonschema pyyaml
          python3 -m pip install -e services/backend
      - name: Active context guard
        run: python3 tools/checks/active_context_guard.py
      - name: Phase contract guard
        run: python3 tools/checks/phase_contract_guard.py
      - name: Mint rules guard
        run: python3 tools/checks/mint_rules_guard.py
      - name: Agent reference guard
        run: python3 tools/checks/agent_reference_guard.py
      - name: Claude hooks guard
        run: python3 tools/checks/claude_hooks_guard.py
      - name: Journey OS guard
        run: python3 tools/checks/journey_os_check.py
      - name: Mint 2 navigation spine guard
        run: python3 tools/checks/mint2_navigation_spine_guard.py
      - name: Mint 2 VZ route contract guard
        run: python3 tools/checks/mint2_vz_route_contract_guard.py
      - name: Workflow contract guard
        run: python3 tools/checks/workflow_contract_guard.py
      - name: Mermaid render guard
        run: python3 tools/checks/mermaid_render_guard.py
      - name: Maestro locator audit
        run: python3 tools/checks/maestro_locator_audit.py
      - name: Journey OS runtime replay dry run
        run: bash tools/simulator/journey_os_runtime_replay.sh --dry-run
      - name: Journey OS top runtime replay dry run
        run: bash tools/simulator/journey_os_runtime_replay.sh --dry-run --set top
      - name: Phase acceptance verifier
        run: python3 tools/checks/verify_phase_acceptance.py
      - name: Guard tests
        run: >
          python3 -m pytest
          tools/checks/tests/test_active_context_guard.py
          tools/checks/tests/test_phase_contract_guard.py
          tools/checks/tests/test_mint_rules_guard.py
          tools/checks/tests/test_agent_reference_guard.py
          tools/checks/tests/test_claude_hooks_guard.py
          tools/checks/tests/test_journey_os_check.py
          tools/checks/tests/test_journey_os_runtime_replay.py
          tools/checks/tests/test_mint2_navigation_spine_guard.py
          tools/checks/tests/test_mint2_vz_route_contract_guard.py
          tools/checks/tests/test_maestro_locator_audit.py
          tools/checks/tests/test_mermaid_render_guard.py
          tools/checks/tests/test_workflow_contract_guard.py
          tools/checks/tests/test_verify_phase_acceptance.py
          -q
