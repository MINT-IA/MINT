name: AI Workflow Guards

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

concurrency:
  group: ai-workflow-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Active context and agent workflow guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Cache Mermaid CLI (npx download + Puppeteer Chromium)
        # The « Mermaid render guard » step below shells out to
        # `npx -y @mermaid-js/mermaid-cli@11.4.2`, which on a COLD runner
        # downloads the CLI into ~/.npm/_npx AND a full Chromium into
        # ~/.cache/puppeteer — the slow first render that blew past the
        # subprocess timeout (#1164 first pass ; timeout since raised to 300 s).
        # Caching both dirs keyed on the pinned CLI version keeps warm runs off
        # the cold path. A version bump in mermaid_render_guard.py rotates the
        # key. Same first-party action + convention as calc-rigor.yml.
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/puppeteer
          key: mermaid-cli-${{ runner.os }}-node22-11.4.2
      - name: Install guard dependencies
        run: |
          python3 -m pip install pytest jsonschema pyyaml
          python3 -m pip install -e services/backend
      - name: Active context guard
        run: python3 tools/checks/active_context_guard.py
      - name: Phase contract guard
        run: python3 tools/checks/phase_contract_guard.py
      - name: Mint rules guard
        run: python3 tools/checks/mint_rules_guard.py
      - name: Agent reference guard
        run: python3 tools/checks/agent_reference_guard.py
      - name: Claude hooks guard
        run: python3 tools/checks/claude_hooks_guard.py
      - name: Journey OS guard
        run: python3 tools/checks/journey_os_check.py
      - name: Sentry privacy guard (nLPD)
        run: python3 tools/checks/verify_sentry_init.py
      - name: False privacy attestation guard (campagne-A)
        run: python3 tools/checks/no_false_privacy_attestation.py
      - name: Mint 2 navigation spine guard
        run: python3 tools/checks/mint2_navigation_spine_guard.py
      - name: Mint 2 VZ route contract guard
        run: python3 tools/checks/mint2_vz_route_contract_guard.py
      - name: Workflow contract guard
        run: python3 tools/checks/workflow_contract_guard.py
      - name: MINT Next foundation guard
        run: python3 tools/checks/mint_next_foundation_guard.py
      - name: MINT Next Batch 1 design guard
        run: python3 tools/checks/mint_next_batch1_guard.py
      - name: MINT Next Batch 1 Handoff inventory
        run: python3 tools/checks/mint_next_batch1_inventory.py
      - name: MINT Next Batch 1 prototype runtime probe
        run: python3 tools/checks/mint_next_batch1_runtime_probe.py
      - name: MINT Next Batch 2 Vaud fixture guard
        run: python3 tools/checks/mint_next_batch2_guard.py
      - name: MINT Next Batch 3 derivative prototype guard
        run: python3 tools/checks/mint_next_batch3_guard.py
      - name: MINT Next Batch 3 runtime probe
        run: python3 tools/checks/mint_next_batch3_runtime_probe.py
      - name: MINT Next Batch 3 render evidence
        run: python3 tools/checks/mint_next_batch3_render.py
      - name: Product prescription lint (ADR 2026-07-28)
        run: |
          python3 tools/checks/product_prescription_lint.py --self-test
          python3 tools/checks/product_prescription_lint.py
      - name: Prescription baseline anti-growth (cliquet)
        # La baseline ne peut pas GROSSIR vs origin/dev — le blanchiment par
        # --emit-baseline est refusé (bootstrap : fichier absent sur dev).
        # Les entrées sont par OCCURRENCE (chemin::motif::hash d'extrait) :
        # toute entrée présente ici et absente de dev est une addition —
        # y compris l'échange d'occurrence même-fichier (revue Codex P1).
        run: |
          git fetch origin dev --quiet
          git show origin/dev:tools/checks/_baseline_prescription_sites.txt \
            > /tmp/baseline_dev.txt 2>/dev/null || {
              echo "Bootstrap : baseline absente sur origin/dev."; exit 0; }
          added=$(grep '::' tools/checks/_baseline_prescription_sites.txt \
            | grep -Fxv -f <(grep '::' /tmp/baseline_dev.txt) || true)
          if [ -n "$added" ]; then
            echo "::error::Baseline prescriptions en CROISSANCE (cliquet) :"
            echo "$added"
            exit 1
          fi
          echo "Cliquet OK : aucune entrée ajoutée vs origin/dev."
      - name: Mermaid render guard
        run: python3 tools/checks/mermaid_render_guard.py
      - name: Maestro locator audit
        run: python3 tools/checks/maestro_locator_audit.py
      - name: Journey OS runtime replay dry run
        run: bash tools/simulator/journey_os_runtime_replay.sh --dry-run
      - name: Journey OS top runtime replay dry run
        run: bash tools/simulator/journey_os_runtime_replay.sh --dry-run --set top
      - name: Phase acceptance verifier
        run: python3 tools/checks/verify_phase_acceptance.py
      - name: Guard tests
        run: >
          python3 -m pytest
          tools/checks/tests/test_active_context_guard.py
          tools/checks/tests/test_phase_contract_guard.py
          tools/checks/tests/test_mint_rules_guard.py
          tools/checks/tests/test_agent_reference_guard.py
          tools/checks/tests/test_claude_hooks_guard.py
          tools/checks/tests/test_journey_os_check.py
          tools/checks/tests/test_journey_os_runtime_replay.py
          tools/checks/tests/test_mint2_navigation_spine_guard.py
          tools/checks/tests/test_mint2_vz_route_contract_guard.py
          tools/checks/tests/test_maestro_locator_audit.py
          tools/checks/tests/test_mermaid_render_guard.py
          tools/checks/tests/test_workflow_contract_guard.py
          tools/checks/tests/test_mint_next_foundation_guard.py
          tools/checks/tests/test_mint_next_batch1_guard.py
          tools/checks/tests/test_mint_next_batch2_guard.py
          tools/checks/tests/test_mint_next_batch3_guard.py
          tools/checks/tests/test_mint_next_batch3_runtime_probe.py
          tools/checks/tests/test_mint_next_artifact_manifest.py
          tools/checks/tests/test_mint_next_batch7_design_lab_guard.py
          tools/checks/tests/test_mint_next_batch8_lpp_scope_guard.py
          tools/checks/tests/test_mint_next_batch8_lpp_runtime_guard.py
          tools/checks/tests/test_verify_phase_acceptance.py
          -q
