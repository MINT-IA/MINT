name: MINT Next Batch 11 Written Amount Contract

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

concurrency:
  group: mint-next-batch11-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPECTED_BATCH11_GUARD_SHA256: 5cd3d7c2dae9602430132a6d804513e7905a6a1475ccfade231712467bfedb83
  EXPECTED_BATCH11_TESTS_SHA256: dc1ab577dbf7bbba852cbb69443ad72ca952c4ac4fbcbfbfc223ef304170c05f
  EXPECTED_BATCH11_ACCEPTANCE_SHA256: 5b6c78a50ec4bcb2d54ce3487f0c7836d9a56a5afd80ef6f6a1b1922f8ca1dec

jobs:
  contract:
    name: Ordinary 3a credited amount written contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.11'
      - name: Install exact guard dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Verify the verifier trust unit
        run: |
          test "$(shasum -a 256 tools/checks/mint_next_batch11_amount_scope_guard.py | cut -d ' ' -f 1)" = "$EXPECTED_BATCH11_GUARD_SHA256"
          test "$(shasum -a 256 tools/checks/tests/test_mint_next_batch11_amount_scope_guard.py | cut -d ' ' -f 1)" = "$EXPECTED_BATCH11_TESTS_SHA256"
          test "$(shasum -a 256 product/mint_next/batch11/ordinary-contribution-amount-acceptance.yaml | cut -d ' ' -f 1)" = "$EXPECTED_BATCH11_ACCEPTANCE_SHA256"
      - name: Verify write-only amount contract
        run: python3 tools/checks/mint_next_batch11_amount_scope_guard.py
      - name: Fire hostile amount-contract mutations
        run: python3 -m unittest tools.checks.tests.test_mint_next_batch11_amount_scope_guard
