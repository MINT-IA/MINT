name: MINT Next Batch 18 Dispatcher Decoupling

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

concurrency:
  group: mint-next-batch18-dispatcher-decoupling-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPECTED_DISPATCHER_GUARD_SHA256: 929c489b207b9a1f976baf090df109d4e2497754d6861b7c261f90f4e4c63c79
  EXPECTED_DISPATCHER_TESTS_SHA256: f571ef47bced7cf82eaae0a0f4734cbb5909f24797ab9ebc48986cd89704457d
  EXPECTED_DISPATCHER_ACCEPTANCE_SHA256: 3059d4690379d8d6d11c681defe630eee39f5690c09c2a6fc601c9a88a73bee3

jobs:
  contract:
    name: Verify reviewed path-owner dispatcher amendment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.11'
      - name: Install exact guard dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Verify dispatcher amendment candidate
        run: python3 tools/checks/mint_next_batch18_dispatcher_decoupling_guard.py --release
      - name: Fire hostile dispatcher mutations
        run: python3 -m unittest tools.checks.tests.test_mint_next_batch18_dispatcher_decoupling_guard
