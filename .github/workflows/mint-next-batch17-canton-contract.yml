name: MINT Next Batch 17 Written Canton Contract

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

concurrency:
  group: mint-next-batch17-canton-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPECTED_BATCH17_GUARD_SHA256: b6c514533ca85e82a9b9b34db1f24aae13583f046b551ae1281d0c2a5465fcf8
  EXPECTED_BATCH17_TESTS_SHA256: 69cfaa4f117cbecc5246d6cfdd51039615176116c1e047fd176eb45ad2a8bc4a
  EXPECTED_BATCH17_ACCEPTANCE_SHA256: 44853b29c4274cc80f81d8cca57351aa9ad7531afa3f06c23be21caefd068a94

jobs:
  contract:
    name: Canton written-only contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.11'
      - name: Install exact guard dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Verify the verifier trust unit
        run: |
          test "$(sha256sum tools/checks/mint_next_batch17_canton_scope_guard.py | cut -d ' ' -f 1)" = "$EXPECTED_BATCH17_GUARD_SHA256"
          test "$(sha256sum tools/checks/tests/test_mint_next_batch17_canton_scope_guard.py | cut -d ' ' -f 1)" = "$EXPECTED_BATCH17_TESTS_SHA256"
          test "$(sha256sum product/mint_next/batch17/canton-acceptance.yaml | cut -d ' ' -f 1)" = "$EXPECTED_BATCH17_ACCEPTANCE_SHA256"
      - name: Verify accepted written contract remains runtime-forbidden
        run: python3 tools/checks/mint_next_batch17_canton_scope_guard.py
      - name: Fire hostile canton-contract mutations
        run: python3 -m unittest tools.checks.tests.test_mint_next_batch17_canton_scope_guard
