name: MINT plan de vie native TestFlight
on:
  push:
    branches: [codex/life-plan-native-testflight-20261101-0d9272d2aa]
permissions:
  contents: read
concurrency:
  group: native-testflight-2150-architecture
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: '3.4'
      - name: Install existing pinned signing tooling
        run: gem install fastlane --version 2.232.1 --no-document
      - name: Verify exact native toolchain
        shell: python3 {0}
        run: |
          import os,pathlib,subprocess,json
          assert pathlib.Path(os.environ['DEVELOPER_DIR']).is_dir()
          v=subprocess.check_output(['xcodebuild','-version'],text=True).splitlines();sdk=subprocess.check_output(['xcrun','--sdk','iphoneos','--show-sdk-version'],text=True).strip()
          assert v==['Xcode 26.2','Build version 17C52'] and sdk=='26.2'
          print(json.dumps(dict(qualifiedToolchain=True,xcode=v,sdk=sdk)))
      - name: Fetch pinned encrypted inputs only
        shell: python3 {0}
        run: |
          from pathlib import Path
          import urllib.request,hashlib,os
          p=Path(os.environ['RUNNER_TEMP'])/'mint-native-release';p.mkdir(mode=0o700)
          u='https://raw.githubusercontent.com/MINT-IA/MINT/'+os.environ['GITHUB_SHA']+'/.ci/qualified-native-inputs.mintenc'
          data=urllib.request.urlopen(u,timeout=120).read(80000001);assert len(data)<=80000000
          assert hashlib.sha256(data).hexdigest()=='e5c5ad4bded84d885e501395a2763c883054e12786d856beaf9aac92fc53c1cf'
          (p/'inputs.mintenc').write_bytes(data);(p/'inputs.mintenc').chmod(0o600)
      - name: Authenticate and decrypt inputs without printing source
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        shell: ruby {0}
        run: |
          require 'openssl'
          require 'base64'
          require 'json'
          require 'digest'
          raw=ENV.fetch('ASC_KEY_CONTENT').strip.gsub('\\n',"\n")
          raw=Base64.strict_decode64(raw) unless raw.include?('-----BEGIN PRIVATE KEY-----')
          abort('Unexpected Apple key id') unless ENV.fetch('ASC_KEY_ID').strip=='6TZCV5S346'
          key=OpenSSL::PKey.read(raw);abort('Expected P256') unless key.group.curve_name=='prime256v1'
          bytes=File.binread(File.join(ENV.fetch('RUNNER_TEMP'),'mint-native-release','inputs.mintenc'));abort('Encrypted input digest mismatch') unless Digest::SHA256.hexdigest(bytes)=='e5c5ad4bded84d885e501395a2763c883054e12786d856beaf9aac92fc53c1cf'
          line,encrypted=bytes.split("\n",2);abort('Invalid encrypted envelope') unless line && line.bytesize<4096 && encrypted && encrypted.bytesize>16
          h=JSON.parse(line);abort('Envelope metadata mismatch') unless h.keys.sort==%w[domain format nonce plaintextSHA256].sort && h['format']=='MINTCI1' && h['domain']=='MINT native source transfer v1|0d9272d2aaad6ed7772c9e67b0065eb2f25d8c6e' && h['plaintextSHA256']=='7f626c123a8f041d7d8b0401106831984dfa43cbda219893289fd5f9c40b9645'
          nonce=Base64.strict_decode64(h.fetch('nonce'));abort('Nonce length') unless nonce.bytesize==12
          derived=OpenSSL::KDF.hkdf(key.private_key.to_s(2).rjust(32,"\0"),salt:'MINT CI transport v1',info:h.fetch('domain'),length:32,hash:'SHA256')
          cipher=OpenSSL::Cipher.new('aes-256-gcm');cipher.decrypt;cipher.key=derived;cipher.iv=nonce;cipher.auth_tag=encrypted[-16,16];cipher.auth_data=h.fetch('domain')
          plain=cipher.update(encrypted[0...-16])+cipher.final
          abort('Plaintext digest mismatch') unless Digest::SHA256.hexdigest(plain)=='7f626c123a8f041d7d8b0401106831984dfa43cbda219893289fd5f9c40b9645'
          File.open(File.join(ENV.fetch('RUNNER_TEMP'),'mint-native-release','inputs.tar'),File::WRONLY|File::CREAT|File::EXCL,0600) { |f| f.binmode;f.write(plain) }
          puts JSON.generate(encryptedTransportVerified:true,plaintextSHA256:'7f626c123a8f041d7d8b0401106831984dfa43cbda219893289fd5f9c40b9645',sourceCommit:'0d9272d2aaad6ed7772c9e67b0065eb2f25d8c6e',noSourcePrinted:true)
      - name: Verify and extract qualified source
        shell: python3 {0}
        run: |
          from pathlib import Path,PurePosixPath
          import tarfile,json,hashlib,os
          folder=Path(os.environ['RUNNER_TEMP'])/'mint-native-release';assert folder.is_dir() and not folder.is_symlink()
          expected={'qualified-native-source.tar.gz': 'fc3138fef577483bcb9ae64c364835ac241a0998c48b46cb2819f290e37f771d', 'encrypted-match-snapshot.tar.gz': 'ee30b6e20af1f42ae5aba193cb122985ad8d64644f08f262f62835bc0dd952d9', 'beta-notes-fr.txt': '557ac214d6ba455baf1422866125ecb937f9468aa6b80bbe92d02e6c8d7e837b'}
          def unpack(path,expected,destination):
           with tarfile.open(path,'r:*') as t:
            members=t.getmembers();names=[m.name for m in members];assert len(names)==len(set(names)) and set(names)==set(expected)
            assert all(m.isfile() and not PurePosixPath(m.name).is_absolute() and '..' not in PurePosixPath(m.name).parts for m in members)
            for m in members:
             data=t.extractfile(m).read();assert hashlib.sha256(data).hexdigest()==expected[m.name]
             p=destination/m.name;p.parent.mkdir(parents=True,exist_ok=True,mode=0o700)
             with p.open('xb') as f:f.write(data)
             p.chmod(0o600)
          unpack(folder/'inputs.tar',expected,folder)
          archive=folder/'qualified-native-source.tar.gz'
          with tarfile.open(archive,'r:gz') as t:
           raw=t.extractfile('mint-release-manifest.json').read();assert hashlib.sha256(raw).hexdigest()=='d92fc3b348f5d7d576dab1f4583647f7a793cff46d4b1236241044ca16129829'
           manifest=json.loads(raw);assert manifest['sourceCommit']=='0d9272d2aaad6ed7772c9e67b0065eb2f25d8c6e' and len(manifest['files'])==3257
          expected={name:entry['sha256'] for name,entry in manifest['files'].items()};expected['mint-release-manifest.json']='d92fc3b348f5d7d576dab1f4583647f7a793cff46d4b1236241044ca16129829'
          unpack(archive,expected,folder)
          for name,entry in manifest['files'].items():(folder/name).chmod(entry['mode'])
          print(json.dumps(dict(qualifiedSourceVerified=True,sourceCommit=manifest['sourceCommit'],sourceFiles=3257,noSourcePrinted=True)))
      - name: Restore existing signing assets readonly
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
          FASTLANE_HIDE_CHANGELOG: 'true'
          GIT_TERMINAL_PROMPT: '0'
        shell: ruby {0}
        run: |
          require 'base64'
          require 'json'
          require 'fileutils'
          %w[MATCH_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT].each { |name| abort('Missing configured field: '+name) if ENV.fetch(name,'').strip.empty? }
          temp = ENV.fetch('RUNNER_TEMP')
          api = File.join(temp,'mint-native-api.json')
          require 'open3'
          require 'digest'
          require 'zlib'
          require 'rubygems/package'
          require 'stringio'
          encrypted = File.binread(File.join(temp,'mint-native-release','encrypted-match-snapshot.tar.gz'))
          abort('Encrypted signing snapshot changed') unless Digest::SHA256.hexdigest(encrypted)=='ee30b6e20af1f42ae5aba193cb122985ad8d64644f08f262f62835bc0dd952d9'
          expected = {"certs/distribution/U3CJX93TKW.cer"=>"97efa0fba411adedeebd570bbc8b804fe9fe8836175ff830e7a615d3f21ebe1f","certs/distribution/U3CJX93TKW.p12"=>"e5caffd8cab3927675820d917b3bc1457463cd43c7c91155d7925ed3b4d57e64","match_version.txt"=>"0185a636f9fd94cce4009b8636094cd5e35c6c60997cb80f1fe3efcc9d32485c","profiles/appstore/AppStore_ch.mint.app.mobileprovision"=>"046df130c3f2ba556cb134f72443b0a2e383109fa635ce45b991a44fbeab2737"}
          repo = File.join(temp,'mint-encrypted-match-snapshot')
          FileUtils.mkdir_p(repo,mode:0700)
          observed = []
          Gem::Package::TarReader.new(Zlib::GzipReader.new(StringIO.new(encrypted))) do |archive|
            archive.each do |entry|
              name = entry.full_name
              abort('Unexpected snapshot entry') unless entry.file? && expected.key?(name) && !observed.include?(name)
              body = entry.read
              abort('Snapshot entry changed') unless Digest::SHA256.hexdigest(body) == expected.fetch(name)
              path = File.join(repo,name); FileUtils.mkdir_p(File.dirname(path),mode:0700)
              File.binwrite(path,body); File.chmod(0600,path); observed << name
            end
          end
          abort('Snapshot incomplete') unless observed.sort == expected.keys.sort
          [['init','--quiet','--initial-branch=master'],['add','--all'],['-c','user.name=MINT Signing Check','-c','user.email=signing-check@localhost','commit','--quiet','-m','Pinned encrypted Match snapshot']].each do |args|
            _,_,ok = Open3.capture3('git','-C',repo,*args)
            abort('Encrypted local repository setup failed') unless ok.success?
          end
          ENV['MINT_MATCH_SNAPSHOT_GIT'] = repo
          raw = ENV.fetch('ASC_KEY_CONTENT').strip.gsub('\\n',"\n")
          raw = Base64.strict_decode64(raw) unless raw.include?('-----BEGIN PRIVATE KEY-----')
          File.write(api,JSON.generate({key_id:ENV.fetch('ASC_KEY_ID').strip,issuer_id:ENV.fetch('ASC_ISSUER_ID').strip,key:raw,in_house:false}))
          File.chmod(0600,api)
          ENV['MINT_SIGN_CHECK_API_PATH'] = api
          FileUtils.mkdir_p('fastlane')
          File.write('fastlane/Fastfile', <<~'LANE')
            require 'json'
            require 'open3'
            require 'digest'
            require 'cfpropertylist'
            require 'time'
            lane :verify_native_signing do
              setup_ci(keychain_name:'mint_native_signing_check',timeout:5400)
              match(type:'appstore',app_identifier:'ch.mint.app',team_id:'7F5UDGYS5H',git_url:ENV.fetch('MINT_MATCH_SNAPSHOT_GIT'),git_branch:'master',api_key_path:ENV.fetch('MINT_SIGN_CHECK_API_PATH'),readonly:true)
              expected='DD766DEDB95441E70FB01ADB16E6AE338D3C211E'
              identities,err,status=Open3.capture3('security','find-identity','-v','-p','codesigning')
              UI.user_error!('Expected distribution identity not installed') unless status.success? && identities.include?(expected)
              paths=Dir[File.expand_path('~/Library/Developer/Xcode/UserData/Provisioning Profiles/*.mobileprovision')]+Dir[File.expand_path('~/Library/MobileDevice/Provisioning Profiles/*.mobileprovision')]
              selected=nil
              paths.each do |path|
                xml,_,ok=Open3.capture3('security','cms','-D','-i',path)
                next unless ok.success?
                profile=CFPropertyList.native_types(CFPropertyList::List.new(data:xml).value)
                next unless profile['UUID']=='946e0a55-e56f-4b6e-9a3f-38596098305d'
                UI.user_error!('Wrong team or distribution entitlement') unless profile['TeamIdentifier']==['7F5UDGYS5H'] && profile['Entitlements']['application-identifier']=='7F5UDGYS5H.ch.mint.app' && profile['Entitlements']['get-task-allow']==false
                UI.user_error!('Distribution profile expired') unless Time.parse(profile['ExpirationDate'].to_s)>Time.now
                selected={profileUUID:profile['UUID'],profileSHA256:Digest::SHA256.file(path).hexdigest,expiration:profile['ExpirationDate'].to_s}
              end
              UI.user_error!('Expected native distribution profile missing') unless selected
              probe=File.join(ENV.fetch('RUNNER_TEMP'),'mint-native-signing-probe')
              FileUtils.cp('/usr/bin/true',probe);File.chmod(0700,probe)
              _,_,signed=Open3.capture3('codesign','--force','--sign',expected,'--timestamp=none',probe)
              _,_,verified=Open3.capture3('codesign','--verify','--strict',probe)
              UI.user_error!('Noninteractive signing probe failed') unless signed.success? && verified.success?
              report={passed:true,readonlyMatch:true,uploaded:false,createdCertificates:false,team:'7F5UDGYS5H',identitySHA1:expected,noninteractiveSignatureVerified:true}.merge(selected)
              puts JSON.generate(report)
              File.open(ENV.fetch('GITHUB_STEP_SUMMARY'),'a') { |f| f.puts(JSON.pretty_generate(report)) }
              FileUtils.rm_f(probe)
            end
          LANE
          begin
            abort('Existing CI signing validation failed') unless system('fastlane','verify_native_signing')
          ensure
            FileUtils.rm_f(api)
            FileUtils.rm_rf(repo)
          end
      - name: Verify unused Apple build number
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        shell: ruby {0}
        run: |
          require 'openssl'
          require 'base64'
          require 'json'
          require 'net/http'
          require 'uri'
          key_id = ENV.fetch('ASC_KEY_ID').strip
          issuer = ENV.fetch('ASC_ISSUER_ID').strip
          raw = ENV.fetch('ASC_KEY_CONTENT').strip.gsub('\\n', "\n")
          abort('Configured Apple secret is empty') if [key_id,issuer,raw].any?(&:empty?)
          raw = Base64.strict_decode64(raw) unless raw.include?('-----BEGIN PRIVATE KEY-----')
          key = OpenSSL::PKey.read(raw)
          encode = ->(data) { Base64.urlsafe_encode64(data, padding: false) }
          now = Time.now.to_i
          payload = {iss:issuer, iat:now-30, exp:now+300, aud:'appstoreconnect-v1'}
          signing = [encode.call(JSON.generate({alg:'ES256',kid:key_id,typ:'JWT'})),encode.call(JSON.generate(payload))].join('.')
          der = key.sign(OpenSSL::Digest::SHA256.new, signing)
          signature = OpenSSL::ASN1.decode(der).value.map { |v| v.value.to_s(2).rjust(32,"\0") }.join
          token = signing + '.' + encode.call(signature)
          get = lambda do |path,query|
            uri = URI('https://api.appstoreconnect.apple.com'+path)
            uri.query = URI.encode_www_form(query)
            request = Net::HTTP::Get.new(uri)
            request['Authorization'] = 'Bearer '+token
            response = Net::HTTP.start(uri.host,uri.port,use_ssl:true,open_timeout:20,read_timeout:30) { |http| http.request(request) }
            data = JSON.parse(response.body)
            unless response.code == '200'
              puts JSON.generate({authenticated:false,httpStatus:response.code,errorCodes:(data['errors']||[]).map { |x| x['code'] }})
              abort('Apple API request failed; no credential value is printed')
            end
            data
          end
          apps = get.call('/v1/apps',{'filter[bundleId]'=>'ch.mint.app'})['data']
          abort('Expected exactly the MINT bundle') unless apps.size == 1 && apps[0]['attributes']['bundleId']=='ch.mint.app'
          app_id = apps[0]['id']
          page = get.call('/v1/builds',{'filter[app]'=>app_id,'sort'=>'-uploadedDate','limit'=>'200','include'=>'preReleaseVersion'})
          all_builds=[]; all_included=[]; pages=0; seen_links={}
          loop do
            pages+=1; abort('Unexpected catalogue size') if pages>100
            all_builds.concat(page.fetch('data')); all_included.concat(page.fetch('included',[]))
            link=page.dig('links','next'); break unless link
            next_uri=URI(link)
            abort('Unexpected pagination URL') unless next_uri.scheme=='https' && next_uri.host=='api.appstoreconnect.apple.com' && next_uri.path=='/v1/builds'
            abort('Repeated catalogue page') if seen_links[link];seen_links[link]=true
            page=get.call(next_uri.path,URI.decode_www_form(next_uri.query.to_s).to_h)
          end
          abort('Duplicate catalogue build identities') unless all_builds.map { |b| b.fetch('id') }.uniq.size==all_builds.size
          builds={'data'=>all_builds,'included'=>all_included}
          
          versions = (builds['included']||[]).to_h { |x| [x['id'],x.dig('attributes','version')] }
          report = {authenticated:true,bundleId:'ch.mint.app',appId:app_id,builds:builds['data'].map { |x|
            {id:x['id'],build:x.dig('attributes','version'),marketingVersion:versions[x.dig('relationships','preReleaseVersion','data','id')],processingState:x.dig('attributes','processingState')}
          }}
          puts JSON.generate(report)
          File.open(ENV.fetch('GITHUB_STEP_SUMMARY'),'a') { |f| f.puts(JSON.pretty_generate(report)) }
          selection=File.join(ENV.fetch('RUNNER_TEMP'),'mint-build-selection.json')
          if File.exist?(selection)
            chosen=JSON.parse(File.read(selection)).fetch('build')
          else
            existing=report[:builds].select { |b| b[:marketingVersion]=='2.15.0' }.map { |b| Integer(b[:build]) }
            abort('Expected previous build13 in fresh catalogue') unless existing.include?(13)
            chosen=([13]+existing).max+1
            File.write(selection,JSON.generate({version:'2.15.0',build:chosen.to_s}))
          end
          abort('Chosen build now exists; inspect instead of uploading') if report[:builds].any? { |b| b[:marketingVersion]=='2.15.0' && b[:build]==chosen.to_s }
          puts JSON.generate(selectedBuild:chosen.to_s,marketingVersion:'2.15.0',freshCatalogueChecked:true)
          abort('Wrong MINT app identity') unless app_id=='6759292583'
          File.write(File.join(ENV.fetch('RUNNER_TEMP'),'mint-build-slot.rb'),File.read(__FILE__))
      - name: Archive verify and upload qualified native build
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        shell: python3 {0}
        run: |
          from pathlib import Path
          import base64,hashlib,json,os,plistlib,shutil,subprocess,time,zipfile
          
          folder=Path(os.environ['RUNNER_TEMP'])/'mint-native-release';root=folder/'source'
          manifest=json.loads((folder/'mint-release-manifest.json').read_text())
          BUILD=json.loads((Path(os.environ['RUNNER_TEMP'])/'mint-build-selection.json').read_text())['build']
          assert manifest['sourceCommit']=='0d9272d2aaad6ed7772c9e67b0065eb2f25d8c6e'
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          info_path=root/'iosApp/iosApp/Info.plist';original=plistlib.loads(info_path.read_bytes());modified=dict(original);modified['CFBundleVersion']=BUILD
          assert original['CFBundleShortVersionString']=='2.15.0'
          assert manifest['sourceCommit']=='0d9272d2aaad6ed7772c9e67b0065eb2f25d8c6e'
          def frozen():
              for name,entry in manifest['files'].items():
                  p=folder/name
                  if p==info_path:assert plistlib.loads(p.read_bytes())==modified
                  else:assert sha(p)==entry['sha256'], 'Qualified source changed: '+name
          info_path.write_bytes(plistlib.dumps(modified,sort_keys=False));frozen()
          env={k:v for k,v in os.environ.items() if not k.startswith(('ASC_','MATCH_','MINT_','GH_'))}
          assert env.get('DEVELOPER_DIR')=='/Applications/Xcode_26.2.app/Contents/Developer','Explicit qualified Xcode required'
          assert Path(env['DEVELOPER_DIR']).is_dir(),'Qualified Xcode missing'
          env['JAVA_HOME']=subprocess.check_output(['/usr/libexec/java_home','-v','17'],text=True).strip()
          assert Path(env['JAVA_HOME']).is_dir()
          sdk_candidates=[env.get('ANDROID_HOME'),env.get('ANDROID_SDK_ROOT'),str(Path.home()/'Library/Android/sdk')]
          sdk=next((x for x in sdk_candidates if x and Path(x).is_dir()),None)
          assert sdk,'Android SDK location required during Gradle configuration'
          env['ANDROID_HOME']=sdk
          def run(args,timeout=180):
              frozen()
              index=len(list(folder.glob('private-build-*.log')))
              log=folder/('private-build-'+str(index)+'.log')
              with log.open('xb') as output:
                  p=subprocess.run(args,cwd=root,env=env,stdout=output,stderr=subprocess.STDOUT,timeout=timeout)
              assert p.returncode==0, 'Private build step failed: '+str(index)+'; output retained only on runner'
              print(json.dumps(dict(nativeBuildStep=index,exitCode=0)))
              frozen()
          run(['xcodebuild','-version']);run(['xcrun','--sdk','iphoneos','--show-sdk-version'])
          archive=folder/('Mint-2.15.0-build'+BUILD+'.xcarchive')
          run(['xcodebuild','archive','-project',str(root/'iosApp/iosApp.xcodeproj'),'-scheme','iosApp','-configuration','Release','-destination','generic/platform=iOS','-archivePath',str(archive),'-derivedDataPath',str(folder/'derived-data'),'-jobs','2','MARKETING_VERSION=2.15.0','CURRENT_PROJECT_VERSION='+BUILD,'CODE_SIGN_STYLE=Manual','DEVELOPMENT_TEAM=7F5UDGYS5H','CODE_SIGN_IDENTITY=DD766DEDB95441E70FB01ADB16E6AE338D3C211E','PROVISIONING_PROFILE_SPECIFIER=946e0a55-e56f-4b6e-9a3f-38596098305d'],3000)
          app=archive/'Products/Applications/iosApp.app';info=plistlib.loads((app/'Info.plist').read_bytes())
          assert (info['CFBundleIdentifier'],info['CFBundleShortVersionString'],info['CFBundleVersion'])==('ch.mint.app','2.15.0',BUILD)
          assert info.get('ITSAppUsesNonExemptEncryption') is False
          run(['codesign','--verify','--deep','--strict',str(app)])
          ent=subprocess.check_output(['codesign','-d','--entitlements',':-',str(app)],env=env);ent=plistlib.loads(ent)
          assert ent.get('get-task-allow') is False and ent.get('application-identifier')=='7F5UDGYS5H.ch.mint.app'
          assert sha(app/'embedded.mobileprovision')=='17975bfe43a8a62736db2098f2be9282d3001093acfb33fc76448c029420851e'
          framework=root/'shared/build/bin/iosArm64/releaseFramework/SharedMint.framework/SharedMint'
          assert framework.is_file(),'Expected compiled static shared framework missing'
          run(['xcrun','lipo',str(framework),'-verify_arch','arm64'])
          run(['xcrun','lipo',str(app/info['CFBundleExecutable']),'-verify_arch','arm64'])
          options=dict(destination='export',manageAppVersionAndBuildNumber=False,method='app-store-connect',provisioningProfiles={'ch.mint.app':'946e0a55-e56f-4b6e-9a3f-38596098305d'},signingCertificate='DD766DEDB95441E70FB01ADB16E6AE338D3C211E',signingStyle='manual',teamID='7F5UDGYS5H',uploadSymbols=True)
          export_options=folder/'ExportOptions.plist';export_options.write_bytes(plistlib.dumps(options))
          run(['xcodebuild','-exportArchive','-archivePath',str(archive),'-exportPath',str(folder/'export'),'-exportOptionsPlist',str(export_options)],1200)
          ipas=list((folder/'export').glob('*.ipa'));assert len(ipas)==1;ipa=ipas[0]
          with zipfile.ZipFile(ipa) as z:
              infos=[n for n in z.namelist() if n.startswith('Payload/') and n.endswith('.app/Info.plist') and n.count('/')==2];assert len(infos)==1
              exported=plistlib.loads(z.read(infos[0]));assert (exported['CFBundleIdentifier'],exported['CFBundleShortVersionString'],exported['CFBundleVersion'])==('ch.mint.app','2.15.0',BUILD)
          # A fresh authenticated catalogue check prevents uploading an already-used number.
          subprocess.run(['ruby',str(Path(os.environ['RUNNER_TEMP'])/'mint-build-slot.rb')],check=True,timeout=120)
          keys=folder/'private_keys';keys.mkdir(mode=0o700)
          keyid=os.environ['ASC_KEY_ID'].strip();issuer=os.environ['ASC_ISSUER_ID'].strip();raw=os.environ['ASC_KEY_CONTENT'].strip().replace('\\n','\n')
          if '-----BEGIN PRIVATE KEY-----' not in raw:raw=base64.b64decode(raw,validate=True).decode()
          assert keyid and issuer and '-----BEGIN PRIVATE KEY-----' in raw
          key=keys/f'AuthKey_{keyid}.p8';key.write_text(raw);key.chmod(0o600)
          try:
              upload_env=dict(env,API_PRIVATE_KEYS_DIR=str(keys))
              subprocess.run(['xcrun','altool','--upload-app','-f',str(ipa),'--apiKey',keyid,'--apiIssuer',issuer,'--output-format','json'],check=True,env=upload_env,timeout=1200)
              frozen()
              report=dict(nativeUploadCommandSucceeded=True,sourceCommit=manifest['sourceCommit'],sourceManifestSHA256=sha(folder/'mint-release-manifest.json'),ipaSHA256=sha(ipa),ipaBytes=ipa.stat().st_size,bundle='ch.mint.app',version='2.15.0',build=BUILD,distributionEntitlementsVerified=True,frameworkArm64Verified=True,sourceMetadataDelta='Info.plist CFBundleVersion ->'+BUILD+' only',testerAvailabilityVerified=False,finishedAt=time.time())
              print(json.dumps(report))
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(json.dumps(report,indent=2)+'\n')
          finally:shutil.rmtree(keys,ignore_errors=True)
      - name: Encrypt private compiler diagnostics on failure
        if: failure()
        env:
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        shell: ruby {0}
        run: |
          require 'openssl'
          require 'base64'
          require 'json'
          require 'digest'
          require 'securerandom'
          require 'rubygems/package'
          require 'stringio'
          folder=File.join(ENV.fetch('RUNNER_TEMP'),'mint-native-release')
          paths=Dir[File.join(folder,'private-build-*.log')].select { |p| File.file?(p) && !File.symlink?(p) }
          if paths.empty?
            puts 'No private compiler log exists to preserve'
            exit(0)
          end
          buffer=StringIO.new
          Gem::Package::TarWriter.new(buffer) do |tar|
            paths.each do |p|
              name=File.basename(p);abort('Unexpected private log name') unless name.match?(/\Aprivate-build-[0-9]+\.log\z/)
              body=File.binread(p);tar.add_file_simple(name,0600,body.bytesize) { |f| f.write(body) }
            end
          end
          plain=buffer.string
          raw=ENV.fetch('ASC_KEY_CONTENT').strip.gsub('\\n',"\n")
          raw=Base64.strict_decode64(raw) unless raw.include?('-----BEGIN PRIVATE KEY-----')
          key=OpenSSL::PKey.read(raw);abort('Expected P256') unless key.group.curve_name=='prime256v1'
          domain='MINT private build logs v1|0d9272d2aaad6ed7772c9e67b0065eb2f25d8c6e|'+ENV.fetch('GITHUB_RUN_ID')
          derived=OpenSSL::KDF.hkdf(key.private_key.to_s(2).rjust(32,"\0"),salt:'MINT CI transport v1',info:domain,length:32,hash:'SHA256')
          nonce=SecureRandom.random_bytes(12);cipher=OpenSSL::Cipher.new('aes-256-gcm');cipher.encrypt;cipher.key=derived;cipher.iv=nonce;cipher.auth_data=domain
          encrypted=cipher.update(plain)+cipher.final
          header={format:'MINTCI1',domain:domain,nonce:Base64.strict_encode64(nonce),plaintextSHA256:Digest::SHA256.hexdigest(plain)}
          output=File.join(ENV.fetch('RUNNER_TEMP'),'mint-private-build-logs.mintenc')
          File.open(output,File::WRONLY|File::CREAT|File::EXCL,0600) { |f| f.binmode;f.write(JSON.generate(header)+"\n"+encrypted+cipher.auth_tag) }
          puts JSON.generate(privateLogsEncrypted:true,files:paths.size,ciphertextSHA256:Digest::SHA256.file(output).hexdigest,noCompilerOutputPrinted:true)
      - name: Preserve encrypted failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mint-private-build-logs-encrypted
          path: ${{ runner.temp }}/mint-private-build-logs.mintenc
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove decrypted runner inputs and private logs
        if: always()
        shell: python3 {0}
        run: |
          from pathlib import Path
          import os,shutil
          p=Path(os.environ['RUNNER_TEMP'])/'mint-native-release'
          assert p.parent==Path(os.environ['RUNNER_TEMP']) and p.name=='mint-native-release' and not p.is_symlink()
          shutil.rmtree(p,ignore_errors=True)
          print('Runner source, private build logs and temporary input files removed')
