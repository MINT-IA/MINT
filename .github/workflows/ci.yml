# MINT CI — Run tests on every push & PR
# Triggers on push to staging/main + PRs targeting dev/staging/main
# Smart path detection: only runs backend/flutter jobs when relevant files changed.
# Saves ~5-8 min per run when only one side is modified.

name: CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Detect which paths changed ─────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      flutter: ${{ steps.filter.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3
        id: filter
        with:
          filters: |
            backend:
              - 'services/backend/**'
              - 'tools/openapi/**'
              - 'tools/checks/regulatory_freshness_monitor.py'
              - 'tools/checks/tests/test_regulatory_freshness_monitor.py'
              - '.github/workflows/regulatory-freshness-monitor.yml'
            flutter:
              - 'apps/mobile/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/patrol.md'
              - 'tools/checks/mint_debug_spine_gate.sh'
              - 'tools/checks/mint_runtime_debug_tooling_gate.sh'
              - 'tools/checks/mint_runtime_debug_release_scan.py'
              - 'tools/checks/tests/test_mint_runtime_debug_release_scan.py'

  # ─── Contracts drift guard (VoiceCursorContract codegen) ─────
  # Regenerates Dart + Python contract consumers from tools/contracts/voice_cursor.json
  # and fails the build if anything drifted. Runs BEFORE backend/flutter for fail-fast.
  contracts-drift:
    name: Contracts drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate contract consumers
        run: bash tools/contracts/regenerate.sh
      - name: Fail on drift
        run: |
          if ! git diff --exit-code \
              tools/contracts/ \
              apps/mobile/lib/services/voice/voice_cursor_contract.g.dart \
              services/backend/app/schemas/voice_cursor.py; then
            echo "::error::Contracts drift detected — run 'bash tools/contracts/regenerate.sh' and commit."
            exit 1
          fi

  # ─── Phase 10 Plan 10-03 / ACCESS-06: onboarding readability gate ───
  # Pure-Dart Kandel–Moles French readability check on the onboarding
  # surfaces (intent screen + landing v2 + intent chips). Fails the build
  # if any scoreable string drops below K–M 50 (B1 floor). Pre-existing
  # legacy keys (landingFeature*, onboardingStep*) are out of scope —
  # scoring targets only the new 2-screen golden path.
  #
  # Runs on every change to apps/mobile/** or tools/checks/flesch_kincaid_fr.dart.
  # Lives in its own job so a readability regression fails fast (no
  # 10-minute wait for the full Flutter shard matrix).
  readability:
    name: Onboarding readability (ACCESS-06)
    needs: [changes]
    if: needs.changes.outputs.flutter == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: '3.41.4'
          cache: true
      - name: Flesch–Kincaid (Kandel–Moles) French gate
        run: |
          dart run tools/checks/flesch_kincaid_fr.dart \
            apps/mobile/lib/l10n/app_fr.arb \
            --keys-prefix=intentScreen,intentChip,landingV2 \
            --min=50 \
            --min-words=8

  # ─── Phase 12 Plan 12-02 / ACCESS-03 / D-04: WCAG 2.1 AA gate ───
  # Two-layer floor gate on every v2.2-touched UI surface:
  #   1. Python hardcoded-color scanner (tools/checks/wcag_aa_all_touched.py)
  #      catches raw Color(0xFF...) literals in text contexts that fall
  #      below WCAG AA 4.5:1 against craie/white.
  #   2. Dart meetsGuideline widget test
  #      (test/accessibility/wcag_aa_all_touched_test.dart) asserts
  #      textContrastGuideline + android/iOS tap target guidelines on
  #      9 representative v2.2 surface scaffolds.
  #
  # Complements (does NOT replace) the strict S0–S5 AAA gate at
  # test/theme/aaa_tokens_contrast_test.dart.
  wcag-aa-all-touched:
    name: WCAG AA all touched surfaces (ACCESS-03)
    needs: [changes]
    if: needs.changes.outputs.flutter == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python WCAG AA hardcoded-color gate
        run: python3 tools/checks/wcag_aa_all_touched.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: '3.41.4'
          cache: true
      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Generate l10n
        working-directory: apps/mobile
        run: flutter gen-l10n
      - name: Dart meetsGuideline AA all-touched-surfaces test
        working-directory: apps/mobile
        run: flutter test test/accessibility/wcag_aa_all_touched_test.dart

  # ─── Backend Tests ───────────────────────────────────────────
  backend:
    name: Backend tests
    needs: [changes, contracts-drift]
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: services/backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for diff-cover on PRs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml

      - name: Install dependencies (app + dev/test)
        run: pip install ".[dev]" pytest-cov diff-cover

      - name: Regulatory freshness monitor (warning-only)
        working-directory: ${{ github.workspace }}
        run: |
          python3 -m pytest tools/checks/tests/test_regulatory_freshness_monitor.py -q
          python3 tools/checks/regulatory_freshness_monitor.py

      - name: Security audit (pip-audit)
        run: |
          # Keep the audited runner pip above PYSEC-2026-196.
          python -m pip install --upgrade "pip==26.1.2"
          pip install pip-audit
          # CVE-2026-4539: pre-existing waiver.
          # PYSEC-2025-183: pyjwt key-length advisory — disputed by the
          # upstream maintainer (key length is the application's
          # responsibility, not the library's). No fix version published
          # because there's no agreed-upon vulnerability. Waive until
          # the dispute resolves or a real fix lands.
          pip-audit --skip-editable --desc on \
            --ignore-vuln CVE-2026-4539 \
            --ignore-vuln PYSEC-2025-183

      - name: Legacy token gate (no chiffre_choc)
        working-directory: ${{ github.workspace }}
        run: python3 tools/checks/no_chiffre_choc.py

      # ─── Phase 8a / MTC-11, MTC-12: no legacy confidence render ─────
      - name: No legacy confidence render (Phase 8a gate)
        working-directory: ${{ github.workspace }}
        run: python3 tools/checks/no_legacy_confidence_render.py

      # ─── Phase 12 / PERF-05: no implicit BloomStrategy on MTC ──────
      - name: No implicit BloomStrategy on MTC (PERF-05)
        working-directory: ${{ github.workspace }}
        run: python3 tools/checks/no_implicit_bloom_strategy.py

      # ─── Phase 8a / TRUST-02 + Phase 9 / ALERT-02: sentence-subject ARB lint ─
      - name: ARB sentence-subject lint (TRUST-02 + ALERT-02)
        working-directory: ${{ github.workspace }}
        run: python3 tools/checks/sentence_subject_arb_lint.py

      # ─── CLAUDE.md TOP rule #1: LSFin banned-terms ARB lint ────────
      # Blocks positive « garanti / guaranteed / garantiert / garantizado /
      # garantito / garantido » uses across all 6 ARB files. Negation-form
      # disclaimers (« pas de... garanti », « not guaranteed », « kein
      # garantierter ») are allowlisted.
      - name: LSFin banned-terms ARB lint (CLAUDE.md TOP rule #1)
        working-directory: ${{ github.workspace }}
        run: python3 tools/checks/banned_terms_arb.py

      # ─── Phase mint-data-architecture-v1-02 Plan 02-01 W0 HARD lints (D-20, D-24, iter-2 B4) ──
      - name: Alembic BOOLEAN DEFAULT lint (Phase 02 D-20)
        working-directory: ${{ github.workspace }}
        run: python3 tools/checks/alembic_boolean_default_lint.py --self-test

      - name: HMAC pepper audit (Phase 02 D-24)
        working-directory: ${{ github.workspace }}
        run: python3 tools/checks/hmac_pepper_audit.py services/backend/app/ --baseline tools/checks/_baseline_hmac_sites_at_p112.txt

      - name: S23 class-name lint (Phase 02 D-09 iter-2 B4)
        working-directory: ${{ github.workspace }}
        run: python3 tools/checks/s23_class_name_lint.py services/backend/

      # ─── Phase 9 / ALERT-07: no LLM-driven alert objects ────────────
      - name: No LLM-driven alert objects (ALERT-07)
        working-directory: ${{ github.workspace }}
        run: python3 tools/checks/no_llm_alert.py

      # ─── Phase 6 / REGIONAL-05: no legacy REGIONAL_MAP ──────────
      - name: No legacy REGIONAL_MAP (REGIONAL-05)
        working-directory: ${{ github.workspace }}
        run: |
          # Match only actual assignments (top-of-line), not doc/comment
          # mentions. Aligned with tools/ship_gate/run_all_gates_v2_2.sh
          # item [17] to keep a single source of truth.
          if git grep -nE '^[[:space:]]*REGIONAL_MAP[[:space:]]*=' services/backend/app/; then
            echo "::error::REGIONAL-05 violation: legacy REGIONAL_MAP reintroduced in services/backend/"
            exit 1
          fi
          if git grep -nE '^[[:space:]]*_REGIONAL_IDENTITY[[:space:]]*=' services/backend/app/; then
            echo "::error::REGIONAL-05 violation: legacy _REGIONAL_IDENTITY reintroduced in services/backend/app/"
            exit 1
          fi

      # ─── Phase 6 / REGIONAL-04: regional microcopy codegen drift ──
      - name: Regional microcopy codegen drift
        working-directory: ${{ github.workspace }}
        run: python3 tools/checks/regional_microcopy_drift.py

      # ─── Phase 7 / LAND-01, LAND-04: landing v2 calm-promise gates ──
      - name: Landing v2 — no numbers / banned terms (LAND-04)
        working-directory: ${{ github.workspace }}
        run: python3 tools/checks/landing_no_numbers.py

      - name: Landing v2 — no financial_core imports (LAND-01)
        working-directory: ${{ github.workspace }}
        run: python3 tools/checks/landing_no_financial_core.py

      - name: Run tests
        env:
          TESTING: "1"
          DATABASE_URL: "sqlite:///./test.db"
        run: python -m pytest tests/ -q --tb=short -x --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=60

      - name: Changed-lines coverage (PRs only, ≥80%)
        if: github.event_name == 'pull_request'
        working-directory: .
        run: diff-cover services/backend/coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80

      - name: OpenAPI contract check
        env:
          TESTING: "1"
          DATABASE_URL: "sqlite:///./test.db"
        run: |
          python ../../tools/openapi/generate_canonical.py
          if git diff --exit-code ../../tools/openapi/mint.openapi.canonical.json; then
            echo "OpenAPI spec is up to date."
          else
            echo "OpenAPI spec has drifted."
            echo "OpenAPI drift preview:"
            git --no-pager diff -- ../../tools/openapi/mint.openapi.canonical.json | sed -n '1,220p'
            echo "OPENAPI_CHANGED=true" >> "$GITHUB_ENV"
          fi

      - name: Auto-commit OpenAPI spec (push to main only)
        if: env.OPENAPI_CHANGED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/openapi/mint.openapi.canonical.json
          git commit -m "chore(ci): auto-regenerate OpenAPI canonical spec" || echo "No changes to commit"
          git push || echo "Push failed (branch protection) — OpenAPI spec will be committed manually"

      - name: Fail on drift (PRs only)
        if: env.OPENAPI_CHANGED == 'true' && github.event_name == 'pull_request'
        run: |
          echo "::error::OpenAPI spec has changed. Regenerate and commit before merging."
          exit 1

      - name: Alembic migration check
        env:
          TESTING: "1"
          DATABASE_URL: "sqlite:///./test_migration.db"
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          rm -f test_migration.db

  # ─── Phase mint-data-architecture-v1-02 W0 Plan 02-01 (D-22) — Real Postgres testcontainers job ──
  # Spins a Postgres 15.x testcontainer + runs the pg_fixture-gated tests under
  # `services/backend/tests/fixtures/` + `services/backend/tests/integration_pg/`
  # (latter created in Plan 02-02). Docker is pre-installed on ubuntu-latest
  # per CONTEXT T-02-09 mitigation. Path-triggered on alembic / models / fixtures
  # changes — keeps CI runtime bounded on docs-only PRs.
  pg-integration:
    name: PG integration (testcontainers)
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - name: Verify Docker available (T-02-09 mitigation)
        run: docker info
      - name: Install backend + test extras
        run: pip install ".[dev,test]"
      - name: Run pg_fixture self-test + integration_pg tests
        env:
          TESTING: "1"
        run: |
          python3 -m pytest tests/fixtures/test_pg_fixture_self.py -v --tb=short
          # tests/integration_pg/ created in Plan 02-02 — silently no-op if absent
          if [ -d tests/integration_pg ]; then
            python3 -m pytest tests/integration_pg -q -k pg --tb=short
          else
            echo "tests/integration_pg/ not yet present (lands in Plan 02-02). Skipping."
          fi

  # ─── Phase 30 / PRIV-03: PII log gate (BLOCKING) ─────────────────
  # Scans recent backend logs for raw IBAN / AVS / Swiss phone / employer
  # gazetteer entries. Runs against staging logs fetched via the railway
  # CLI when RAILWAY_TOKEN is provided; otherwise scans the test fixture
  # so the job never silently no-ops.
  #
  # BLOCKING (AUDIT-2026-04-17): the gate now fails the build on any PII
  # hit. Phase 29 ran it warn-only; the security audit flagged that
  # tolerance as a GDPR Article 5 / nLPD compliance risk and a
  # FINMA-blocking issue, so we flip it ahead of schedule. Make sure
  # scripts/check_pii_in_logs.py has been green on staging before
  # merging — a fresh regression will now block every PR to dev.
  #
  # A separate weekly cron (set up outside this PR) runs the same script
  # against PRODUCTION logs.
  pii-log-gate:
    name: PII log gate (PRIV-03)
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan staging logs (or fall back to clean fixture)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Real staging-log scan requires a VERIFIED `railway logs` invocation
          # (service/environment context) — no workflow has ever run one; arming
          # it untested inside the sole required check could block every backend
          # PR. Tracked separately (audit T15-F02 follow-up). Until then the
          # fixture fallback is kept but made HONEST: it annotates loudly that
          # no real staging log was scanned, instead of claiming token absence.
          if [[ -n "${RAILWAY_TOKEN:-}" ]] && command -v railway >/dev/null 2>&1; then
            python3 scripts/check_pii_in_logs.py --railway
          else
            if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
              reason="RAILWAY_TOKEN absent"
            else
              reason="railway CLI not installed"
            fi
            echo "::warning title=PII log gate ran on FIXTURE::${reason} — staging logs were NOT scanned (PRIV-03). Real-scan arming tracked in beads."
            mkdir -p /tmp/pii_fixture
            printf 'INFO document fingerprint computed count=5\nINFO consent receipt issued purpose=projection\n' > /tmp/pii_fixture/clean.log
            python3 scripts/check_pii_in_logs.py --fixture /tmp/pii_fixture/clean.log
          fi

  # ─── Flutter Analysis & Tests (3-shard parallel) ────────────
  #
  # Sharding strategy: split ~365 test files across 3 parallel runners.
  # Each shard runs `flutter test` on a disjoint subset of test directories.
  #   - services: test/services/ + test/simulators/ + test/financial_core/ + test/domain/ + test/b2b/  (~200 files)
  #   - widgets:  test/widgets/ + test/models/ + test/providers/                                       (~85 files)
  #   - screens:  test/screens/ + test/golden/ + test/auth/ + test/modules/
  #               + test/journeys/ + test/accessibility/ + test/i18n/                                  (~55 files)
  #
  # NOTE: test/patrol/ is intentionally excluded — requires emulator infrastructure.
  # NOTE: test/golden_screenshots/ is intentionally excluded — pixel diffs are
  #       cross-platform fragile (Mac baselines fail on Linux CI). Run locally
  #       before each release. See test/golden_screenshots/README.md.
  # See .github/workflows/patrol.md for manual gate policy.
  #
  # `flutter analyze` runs only in the services shard to avoid redundant work.
  # All shards exclude test/_archive/ (legacy suite).
  # --concurrency=4 parallelizes test execution within each shard.
  #
  flutter:
    name: Flutter ${{ matrix.shard }}
    needs: [changes, contracts-drift]
    if: needs.changes.outputs.flutter == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [services, widgets, screens]
        include:
          - shard: services
            test_dirs: "test/services/ test/simulators/ test/financial_core/ test/domain/ test/b2b/"
            run_analyze: true
          - shard: widgets
            test_dirs: "test/widgets/ test/models/ test/providers/"
            run_analyze: false
          - shard: screens
            test_dirs: "test/screens/ test/golden/ test/auth/ test/modules/ test/journeys/ test/accessibility/ test/i18n/"
            run_analyze: false
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: '3.41.4'  # matches local dev; AppDelegate.swift uses FlutterImplicitEngineDelegate (3.41+)
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install PDF text extraction tools
        if: matrix.shard == 'services'
        timeout-minutes: 5
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Install dependencies
        run: flutter pub get

      - name: Patch google_fonts for Dart compatibility
        run: bash scripts/patch_google_fonts_const_map.sh

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Analyze (errors only)
        if: matrix.run_analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-warnings --no-fatal-infos > /tmp/flutter_analyze.log 2>&1

          errors=$(grep -cE "^[[:space:]]*error[[:space:]]+•" /tmp/flutter_analyze.log || true)
          warnings=$(grep -cE "^[[:space:]]*warning[[:space:]]+•" /tmp/flutter_analyze.log || true)
          infos=$(grep -cE "^[[:space:]]*info[[:space:]]+•" /tmp/flutter_analyze.log || true)
          echo "Analyze summary: errors=$errors warnings=$warnings infos=$infos"

          echo "Analyze diagnostics (warnings/errors only):"
          grep -E "^[[:space:]]*(error|warning)[[:space:]]+•" /tmp/flutter_analyze.log || true
          grep -E "issues found" /tmp/flutter_analyze.log || true

          # Fail only on actual errors — infos and warnings are logged but not blocking
          if [[ "$errors" -gt 0 ]]; then
            echo "::error::Flutter analyze found $errors error(s)"
            sed -n '1,120p' /tmp/flutter_analyze.log
            exit 1
          fi
          echo "Analyze passed (0 errors, $warnings warnings, $infos infos)"

      - name: Mint runtime debug tooling static gate
        if: matrix.shard == 'services'
        shell: bash
        run: ../../tools/checks/mint_runtime_debug_tooling_gate.sh --ci-static-only

      - name: Run tests (${{ matrix.shard }} shard)
        shell: bash
        run: |
          echo "Running Flutter tests — shard: ${{ matrix.shard }}"
          echo "Test directories: ${{ matrix.test_dirs }}"
          # Collect test files from shard directories, excluding _archive
          # Also include root-level test/*.dart files in the services shard
          {
            find ${{ matrix.test_dirs }} -name '*_test.dart' -not -path 'test/_archive/*' -print0
            if [ "${{ matrix.shard }}" = "services" ]; then
              find test/ -maxdepth 1 -name '*_test.dart' -print0
            fi
          } | sort -z \
            | xargs -0 flutter test --concurrency=4 --reporter compact

      # ─── Golden test gate (Plan 04-03) ────────────────────────────
      # Runs ONLY on the services shard to avoid triple-execution.
      # Scope: test/goldens/helpers/ unit tests only (they pin the
      # screen_pump helper's public surface: device dimensions, view
      # wiring, locale wiring, MediaQuery flags).
      #
      # The image-diff goldens under test/goldens/*.dart are tagged
      # `local-only` and intentionally NOT run here. Flutter pixel
      # goldens are cross-platform fragile (macOS masters drift on
      # Linux CI due to font hinting + glyph rasterization), same
      # policy that already excludes test/golden_screenshots/. They
      # are executed locally by Julien before each release and the
      # Galaxy A14 subset is a manual device gate per PERF-04.
      #
      # See apps/mobile/test/goldens/README.md for the full CI scope
      # decision, local-run commands, and the un-skip protocol for
      # S4 goldens once Plan 04-02 lands.
      - name: Golden helper tests (Plan 04-03 CI subset)
        if: matrix.shard == 'services'
        shell: bash
        run: |
          echo "Running golden helper unit tests (CI-safe subset)"
          flutter test test/goldens/helpers/ --reporter compact

  # ─── Phase 32 Plan 32-05 / D-12 §1: route registry parity gate ──
  # Runs the stdlib-only Python lint (tools/checks/route_registry_parity.py)
  # on every push / PR. Compares 148 extracted GoRoute|ScopedGoRoute(path:)
  # literals in app.dart against the 147 keys of kRouteRegistry, with
  # symmetric KNOWN-MISSES exemption (1 admin-conditional + 7 nested
  # /profile children = 140 comparison paths parity OK on pristine HEAD).
  #
  # Fails the PR on any drift in either direction. Runtime ~30 ms
  # (1000× under the plan's 30 s budget). Stdlib-only (no pip install),
  # matches Python 3.9 dev / 3.11 CI forward-compat pattern.
  route-registry-parity:
    name: Route registry parity (MAP-04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run parity lint
        run: python3 tools/checks/route_registry_parity.py

  # ─── Phase 52.3 / TRUTH-CRYPTO: no false E2EE / zero-knowledge claim ──
  # Multilingual lint that scans user-facing strings (ARBs, screens,
  # widgets) and docs for E2EE / « bout en bout » / « Ende-zu-Ende » /
  # « extremo a extremo » / « end-to-end » / « ponto a ponto » / E2EE /
  # zero-knowledge claims that contradict the Path A data-residency
  # decision (`.planning/decisions/2026-05-02-data-residency.md` —
  # E2EE deferred to v3.0). Allow-list covers v3.0 / decision / ADR
  # references. Per-line override: `ALLOW-E2EE-CLAIM: <reason>`.
  #
  # Runs on every PR regardless of changed paths because user-facing
  # copy regressions can land in either backend or mobile changes.
  # Stdlib-only Python, runtime ~50 ms.
  truth-in-crypto:
    name: Truth-in-crypto sweep (Phase 52.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run no-E2EE-overclaim lint
        run: python3 tools/checks/no_e2ee_overclaim.py

  # ─── Phase 53-01 — ScreenRegistry × app.dart parity gate ─────────
  # Mirrors the route-registry-parity job pattern. Compares 153 path:
  # literals in app.dart against ScreenEntry route: literals in
  # apps/mobile/lib/services/navigation/screen_registry.dart. Closes the
  # « façade-sans-câblage » class where a chat intent could route into
  # a screen with no registry entry. Gap inventory at
  # .planning/phases/53-architecture-parity-and-sequence-wiring/
  # SCREEN-REGISTRY-COVERAGE.md. Allow-list rationale at
  # tools/checks/screen_registry_parity-KNOWN-MISSES.md.
  #
  # Runs on every PR regardless of changed paths because registry drift
  # can land in either Flutter or routing changes. Stdlib-only Python,
  # runtime ~50 ms.
  screen-registry-parity:
    name: ScreenRegistry parity (Phase 53-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run screen registry parity lint
        run: python3 tools/checks/screen_registry_parity.py

  # ─── Phase 53-04 — Three-way intent contract parity gate ─────────
  # Enforces single-source-of-truth across the chat→screen routing
  # contract (MintScreenRegistry → screen_registry.json →
  # _valid_routes_generated.dart → _route_intents_generated.py).
  # Without this gate, Plan 53-01's parity claim was misleading: 26
  # ROUTABLE entries were unreachable because the LLM whitelist + mobile
  # validator weren't updated. Drift fails CI with a clear diagnostic
  # pointing at which generated file is out of sync; the fix is to run
  # `python3 tools/contracts/regen_screen_registry_contract.py` and
  # commit the regenerated files. Stdlib-only, runtime ~50 ms.
  screen-registry-three-way-parity:
    name: ScreenRegistry 3-way contract (Phase 53-04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run three-way contract parity lint
        run: python3 tools/checks/screen_registry_three_way_parity.py

  # ─── Phase 32 Plan 32-05 / D-12 §2: mint-routes CLI DRY_RUN tests ─
  # Runs pytest on tests/tools/test_mint_routes.py (14 cases, Plan 02
  # deliverable) + tests/checks/test_route_registry_parity.py (9 cases,
  # Plan 04 deliverable) + tests/tools/test_redirect_breadcrumb_coverage.py
  # (3 cases, Plan 03 deliverable covering MAP-05 43-redirect instrumentation).
  #
  # MINT_ROUTES_DRY_RUN=1 routes all Sentry calls to the committed fixture
  # tests/tools/fixtures/sentry_health_response.json — no network, no token,
  # no Keychain. Runtime ~0.5 s total on CI.
  mint-routes-tests:
    name: mint-routes pytest (DRY_RUN)
    runs-on: ubuntu-latest
    env:
      MINT_ROUTES_DRY_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest
      - name: Run CLI + parity + redirect breadcrumb tests
        run: pytest tests/tools/test_mint_routes.py tests/tools/test_redirect_breadcrumb_coverage.py tests/checks/test_route_registry_parity.py -q --tb=short

  # ─── Phase 32 Plan 32-05 / D-12 §3: release build sanity ────────
  # Defensive scans against release-only compile-time leaks.
  #
  # T-32-05: the admin shell
  # (/admin/routes + kRouteRegistry exposure) is compile-gated by
  # `--dart-define=ENABLE_ADMIN=0` in every production build workflow.
  # A reviewer miss where `ENABLE_ADMIN=1` leaks into testflight.yml or
  # play-store.yml would ship the 147-route registry + dev descriptions
  # to TestFlight / Play Store review — an nLPD D-09 §1 leak.
  #
  # P0-9: third-party model URLs/tokens must never be passed into release
  # workflows. Dart defines are embedded in the app binary and are
  # extractable from a signed IPA/APK. On-device SLM is stubbed in release.
  #
  # This grep runs ≤5 s. Fails the PR if any occurrence is found in
  # either prod build workflow.
  admin-build-sanity:
    name: Release build sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install release scanner test dependency
        run: pip install pytest
      - name: Release scanner unit tests
        run: python3 -m pytest tools/checks/tests/test_mint_runtime_debug_release_scan.py -q --tb=short
      - name: Scan prod workflows for unsafe dart-defines
        run: python3 tools/checks/mint_runtime_debug_release_scan.py --workflows-only
      - name: Scan prod workflows for model credential defines
        run: |
          set -euo pipefail
          FOUND=0
          for wf in .github/workflows/testflight.yml .github/workflows/play-store.yml; do
            if [ ! -f "$wf" ]; then
              echo "[info] $wf not present — skipping"
              continue
            fi
            if grep -nHE "HUGGINGFACE_TOKEN|SLM_MODEL_URL" "$wf" \
              | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#'; then
              echo "::error file=$wf::SLM model URL/token detected in release workflow — do not embed model credentials in signed binaries"
              FOUND=1
            fi
          done
          if [ "$FOUND" -ne 0 ]; then exit 1; fi
          echo "[OK] no model URL/token release dart-defines in prod build workflows"
      - name: Scan iOS Release Info.plist for debug keys
        run: python3 tools/checks/ios_release_info_plist_drift.py

  # ─── Phase 32 Plan 32-05 / D-12 §5: .cache/ gitignore (D-09 §3) ──
  # Belt-and-suspenders on the nLPD 7-day retention control. The CLI
  # writes .cache/route-health.json with auto-expire; the file must
  # never be committable. This job double-checks the `.gitignore`
  # entry (Plan 02 added it). Removing the entry re-exposes a leak
  # vector — this gate fails that regression in CI.
  cache-gitignore-check:
    name: .cache/ in .gitignore (D-09 §3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify .cache/ entry
        run: |
          if ! grep -qE "^\.cache/" .gitignore; then
            echo "::error::.cache/ must be gitignored per nLPD D-09 §3 (7-day retention artifact)"
            exit 1
          fi
          echo "[OK] .cache/ is gitignored"

  # ─── Gate: all checks must pass ──────────────────────────────
  ci-gate:
    name: CI Gate
    needs: [changes, backend, flutter, readability, wcag-aa-all-touched, route-registry-parity, mint-routes-tests, admin-build-sanity, cache-gitignore-check, contracts-drift, pii-log-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          # Skip check if job was skipped (no relevant changes)
          backend="${{ needs.backend.result }}"
          flutter="${{ needs.flutter.result }}"
          readability="${{ needs.readability.result }}"
          wcag="${{ needs.wcag-aa-all-touched.result }}"
          parity="${{ needs.route-registry-parity.result }}"
          cli_tests="${{ needs.mint-routes-tests.result }}"
          admin_sanity="${{ needs.admin-build-sanity.result }}"
          cache_gi="${{ needs.cache-gitignore-check.result }}"
          contracts_drift="${{ needs.contracts-drift.result }}"
          pii_log="${{ needs.pii-log-gate.result }}"
          [[ "$backend" == "skipped" ]] && backend="success"
          [[ "$flutter" == "skipped" ]] && flutter="success"
          [[ "$readability" == "skipped" ]] && readability="success"
          [[ "$wcag" == "skipped" ]] && wcag="success"
          [[ "$parity" == "skipped" ]] && parity="success"
          [[ "$cli_tests" == "skipped" ]] && cli_tests="success"
          [[ "$admin_sanity" == "skipped" ]] && admin_sanity="success"
          [[ "$cache_gi" == "skipped" ]] && cache_gi="success"
          # pii-log-gate has a path-filter `if` (backend changes || push):
          # a skip is legitimate on mobile-only PRs.
          [[ "$pii_log" == "skipped" ]] && pii_log="success"
          # contracts-drift has NO path filter: a skip is never legitimate
          # (cancellation or infra failure) — do NOT collapse it to success.
          # Audit T15-F01/F02 (MINT_nosync-aoa): its red previously skipped
          # backend/flutter, which collapsed to success -> gate stayed green.
          if [[ "$backend" != "success" ]] || [[ "$flutter" != "success" ]] || [[ "$readability" != "success" ]] || [[ "$wcag" != "success" ]] || [[ "$parity" != "success" ]] || [[ "$cli_tests" != "success" ]] || [[ "$admin_sanity" != "success" ]] || [[ "$cache_gi" != "success" ]] || [[ "$contracts_drift" != "success" ]] || [[ "$pii_log" != "success" ]]; then
            echo "CI failed — backend=$backend flutter=$flutter readability=$readability wcag=$wcag parity=$parity cli_tests=$cli_tests admin_sanity=$admin_sanity cache_gi=$cache_gi contracts_drift=$contracts_drift pii_log=$pii_log"
            exit 1
          fi
          echo "All checks passed"
