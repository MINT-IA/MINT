name: MINT Next Batch 12 Runtime Trust Unit

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

concurrency:
  group: mint-next-batch12-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_BATCH12_GUARD_SHA256: efdb4df8c9824ae771fe4de894478cfa6687bfcca249eb675d136a7c47825599
  EXPECTED_BATCH12_TESTS_SHA256: 6087792a6f640a47c5f6d300999ef785e2718b790de5e37ca3c341edeeb5f825
  EXPECTED_BATCH12_ACCEPTANCE_SHA256: 542b1c223ac78ce2202a8981cc1f0f4223dc74e9947f5294b1cbf8693f943dc0

jobs:
  trust-unit:
    name: Exact single-provider amount runtime trust unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.11'
      - name: Install exact guard dependency
        run: python3 -m pip install PyYAML==6.0.2
      - name: Verify the verifier trust unit
        run: |
          test "$(shasum -a 256 tools/checks/mint_next_batch12_amount_runtime_guard.py | cut -d ' ' -f 1)" = "$EXPECTED_BATCH12_GUARD_SHA256"
          test "$(shasum -a 256 tools/checks/tests/test_mint_next_batch12_amount_runtime_guard.py | cut -d ' ' -f 1)" = "$EXPECTED_BATCH12_TESTS_SHA256"
          test "$(shasum -a 256 product/mint_next/batch12/design-lab-acceptance.yaml | cut -d ' ' -f 1)" = "$EXPECTED_BATCH12_ACCEPTANCE_SHA256"
      - name: Verify accepted single-provider amount runtime package
        run: python3 tools/checks/mint_next_batch12_amount_runtime_guard.py
      - name: Fire hostile promotion mutations
        run: python3 -m unittest tools.checks.tests.test_mint_next_batch12_amount_runtime_guard

  real-runtime:
    name: Exact amount routes in real Flutter Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve isolated Design Lab dependencies
        working-directory: product/mint_next/batch7/design_lab
        run: flutter pub get
      - name: Traverse exact Batch 12 amount routes in real Chrome
        run: python3 tools/checks/mint_next_batch12_amount_runtime_probe.py
