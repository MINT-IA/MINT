allowlisted_event_schemas:
- schema_id: operational_outcome_v1
  event_id: operational_outcome
  fields:
  - name: outcome
    type: enum
    allowed_values:
    - accepted
    - dropped
    max_length: 8
    max_cardinality: 2
  - name: platform
    type: enum
    allowed_values:
    - ios
    - android
    - server
    - design_fixture
    max_length: 14
    max_cardinality: 4
  - name: trace_id
    type: ephemeral_trace
    allowed_values: []
    max_length: 36
    max_cardinality: 3
  max_events_per_session: 5
- schema_id: generic_notification_v1
  event_id: generic_attention
  fields:
  - name: reason_code
    type: enum
    allowed_values:
    - review_available
    - action_available
    max_length: 16
    max_cardinality: 2
  - name: coarse_state
    type: enum
    allowed_values:
    - attention
    max_length: 9
    max_cardinality: 1
  max_events_per_session: 3
- schema_id: export_manifest_control_v1
  event_id: export_control
  fields:
  - name: format_version
    type: fixed_literal
    allowed_values:
    - v1
    max_length: 2
    max_cardinality: 1
  - name: outcome
    type: enum
    allowed_values:
    - ready
    - failed
    max_length: 6
    max_cardinality: 2
  max_events_per_session: 3
