- runtime_enforcement
- ios_runtime_behavior
- android_runtime_behavior
- sentry_configuration
- network_payload_behavior
- crash_pipeline_behavior
- scanner_runtime_effectiveness
- external_security_review_acceptance
- B0_acceptance
activation_gate: STOP
feature_flag: 'OFF'
does_not_close_B0: true
schema_to_surfaces:
