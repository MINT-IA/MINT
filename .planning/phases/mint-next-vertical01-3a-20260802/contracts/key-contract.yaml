lifecycle:
  states:
  - absent
  - provisioned_locked
  - available
  - authentication_failed
  - rotation_pending
  - unavailable_recovery_required
  - revoked
  - lost
  - purged
  initial_state: absent
  terminal_states:
  - purged
  transitions:
  - transition: provision
    from: absent
    event: provision_requested
    to: provisioned_locked
    completion_rule: platform_key_reference_created_without_exportable_material
  - transition: unlock
    from: provisioned_locked
    event: platform_auth_succeeded
    to: available
    completion_rule: repository_open_only_after_key_ciphertext_match
  - transition: lock
    from: available
    event: application_or_device_locked
    to: provisioned_locked
    completion_rule: repository_access_denied
  - transition: auth_reject
    from: provisioned_locked
    event: platform_auth_failed
    to: authentication_failed
    completion_rule: repository_access_denied
  - transition: auth_retry
    from: authentication_failed
    event: explicit_retry_requested
    to: provisioned_locked
    completion_rule: no_repository_access_until_new_platform_auth
  - transition: rotate_begin
    from: available
    event: rotation_requested
    to: rotation_pending
    completion_rule: old_key_retained_until_atomic_commit
  - transition: rotate_commit
    from: rotation_pending
    event: all_ciphertext_rewrapped_and_verified
    to: available
    completion_rule: new_key_committed_then_old_reference_invalidated
  - transition: rotation_crash
    from: rotation_pending
    event: rotation_crash_detected
    to: unavailable_recovery_required
    completion_rule: mixed_key_repository_rejected_and_recovery_evidence_preserved
  - transition: rotation_rollback
    from: rotation_pending
    event: rotation_rollback_requested
    to: unavailable_recovery_required
    completion_rule: unverified_rollback_rejected_and_recovery_required
  - transition: reinstall
    from: absent
    event: reinstall_detected_with_existing_ciphertext
    to: unavailable_recovery_required
    completion_rule: key_ciphertext_relationship_unverified_and_repository_closed
  - transition: backup_restore
    from: absent
    event: backup_restore_detected
    to: unavailable_recovery_required
    completion_rule: matching_key_reference_required_before_open
  - transition: recovery_verified
    from: unavailable_recovery_required
    event: independently_authenticated_preprovisioned_recovery_verified
    to: provisioned_locked
    completion_rule: recovered_reference_verified_against_ciphertext_before_use
  - transition: lost_recovery_verified
    from: lost
    event: independently_authenticated_preprovisioned_recovery_verified
    to: provisioned_locked
    completion_rule: recovered_reference_verified_against_ciphertext_before_use
  - transition: key_loss
    from: provisioned_locked
    event: platform_key_reference_missing
    to: lost
    completion_rule: repository_closed_and_irrecoverability_explained_unless_preprovisioned_recovery_exists
  - transition: revoke
    from: available
    event: user_revocation_confirmed
    to: revoked
    completion_rule: wrapping_key_reference_invalidated_and_repository_access_denied_pending_purge
  - transition: purge_from_absent
    from: absent
    event: consented_purge_completed_from_absent
    to: purged
    completion_rule: wrapping_key_reference_destroyed_or_confirmed_absent_and_dependent_purge_completed_with_non_value_tombstone
  - transition: purge_from_provisioned_locked
    from: provisioned_locked
    event: consented_purge_completed_from_provisioned_locked
    to: purged
    completion_rule: wrapping_key_reference_destroyed_or_confirmed_absent_and_dependent_purge_completed_with_non_value_tombstone
  - transition: purge_from_available
    from: available
    event: consented_purge_completed_from_available
    to: purged
    completion_rule: wrapping_key_reference_destroyed_or_confirmed_absent_and_dependent_purge_completed_with_non_value_tombstone
  - transition: purge_from_authentication_failed
    from: authentication_failed
    event: consented_purge_completed_from_authentication_failed
    to: purged
    completion_rule: wrapping_key_reference_destroyed_or_confirmed_absent_and_dependent_purge_completed_with_non_value_tombstone
  - transition: purge_from_rotation_pending
    from: rotation_pending
    event: consented_purge_completed_from_rotation_pending
    to: purged
    completion_rule: wrapping_key_reference_destroyed_or_confirmed_absent_and_dependent_purge_completed_with_non_value_tombstone
  - transition: purge_from_unavailable_recovery_required
    from: unavailable_recovery_required
    event: consented_purge_completed_from_unavailable_recovery_required
    to: purged
    completion_rule: wrapping_key_reference_destroyed_or_confirmed_absent_and_dependent_purge_completed_with_non_value_tombstone
  - transition: purge_from_revoked
    from: revoked
    event: consented_purge_completed_from_revoked
    to: purged
    completion_rule: wrapping_key_reference_destroyed_or_confirmed_absent_and_dependent_purge_completed_with_non_value_tombstone
  - transition: purge_from_lost
    from: lost
    event: consented_purge_completed_from_lost
    to: purged
    completion_rule: wrapping_key_reference_destroyed_or_confirmed_absent_and_dependent_purge_completed_with_non_value_tombstone
  undefined_transition: reject_fail_closed
