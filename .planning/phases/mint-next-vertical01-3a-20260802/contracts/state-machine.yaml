  payload_contract_ref: coach_entry_contract
  financial_value_allowed: false
today_visibility_guard:
  all_of:
  - tax_year_2026_open
  - probable_eligibility
  any_of:
  - fresh_decision_critical_fact_missing
  - time_sensitive_action_exists
  otherwise: silent
  forbidden_prompts:
  - streak
  - guilt
  - artificial_urgency
  - daily_nag
coach_entry_contract:
  schema_version: 1
  payload_type: three_a_intent_v1
  dispatch_kind: typed_intent_deep_link
  allowed_fields:
  - intent_id
  - resume_ref
  intent_routes:
    three_a_opportunity: loading
    three_a_review: loading
    three_a_resume: loading
  intent_id:
    type: string
    allowlist:
    - three_a_opportunity
    - three_a_review
    - three_a_resume
  resume_ref:
    type: opaque_reference
    required_for_intent: three_a_resume
    forbidden_for_other_intents: true
    max_bytes: 128
    format: opaque_token
  authority_limits:
  - no_extract_canonical_values
  - no_calculate
  - no_supply_truth
  - free_text_never_prefills_proposal
  additional_fields: false
  forbidden_fields:
  - financial_value
  - amount
  - free_text
  - proposal
  - url
  - deep_link
  - target_state
noncanonical_draft_contract:
  canonical_writes_allowed: false
  effects:
    preserve_confirmation_draft:
      draft_kind: confirmation
      scope: current_interruption
    preserve_plan_confirmation_draft:
      draft_kind: plan_confirmation
      scope: current_interruption
    interruption_preserves_resume_state:
      preserves: resume_state
      scope: current_interruption
  lifecycle:
    preserve_before_commit_transition_refs:
    - 10
    - 13
    - 31
    commit_transition_refs:
    - 10
    - 13
    - 31
    discard_after_commit_transition_refs:
    - 10
    - 13
    - 31
    purge_transition_refs:
    - 32
states:
- calculation_impossible
- calculation_ready
- completed
- confirmation
- contradiction
- deleted
- known
- loading
- missing
- offline
- plan_confirmation
- refusal
- result
- rules_explanation
- rules_unavailable
- secure_fail
- stale
- unsupported
- unsupported_explanation
selectors:
  any fact state:
    predicate: fact_workflow_state
    expands_to:
    - confirmation
    - contradiction
    - known
    - missing
    - stale
    excludes:
    - calculation_impossible
    - calculation_ready
    - completed
    - deleted
    - loading
    - offline
    - plan_confirmation
    - refusal
    - result
    - rules_explanation
    - rules_unavailable
    - secure_fail
    - unsupported
    - unsupported_explanation
    rationale: Only states that collect, confirm, compare, or refresh decision-critical facts.
  any persisted state:
    predicate: has_live_persisted_graph
    expands_to:
    - calculation_impossible
    - calculation_ready
    - confirmation
    - contradiction
    - known
    - missing
    - plan_confirmation
    - refusal
    - result
    - rules_explanation
    - rules_unavailable
    - stale
    - unsupported
    - unsupported_explanation
    excludes:
    - completed
    - deleted
    - loading
    - offline
    - secure_fail
    rationale: The transition is eligible only when a live persisted dependency graph exists; state membership alone never proves persistence.
fallback:
  unlisted_pair: stay_in_current_state
  writes: '0'
  cta: none
terminal:
  state: completed
  on_entry: render_today_and_discard_resume_token
  accepted_events: []
  accepted_ctas: []
invariants:
  coach_intent_contains_financial_value: false
  free_text_prefills_proposal: false
  chf_zero:
    event: choose CHF 0
    writes: 1 decision, 0 plan
    next: completed
  plan:
    event: confirm
    source: plan_confirmation
    writes: exactly 1 plan
    next: completed
  rules_unavailable:
    state: rules_unavailable
    financial_output_allowed: false
  delete:
    event: revoke/delete
    writes: 1 tombstone + purge graph
    next: deleted
    stale_resume_allowed: false
  idempotence:
    event: double-submit
    writes: exactly 1 idempotent write
    next: known
