collection_policy:
  timing: just_in_time_for_user_visible_declared_purpose
  amount: minimum_required_for_current_operation
  optional_data: separately_explained_and_skippable
  unknown_fact_behavior: remain_unknown_and_request_when_material
  prohibited_behavior: speculative_profile_enrichment
canonical_fact_policy:
  promotion: explicit_user_confirmation_required
  required_metadata:
  - source
  - confidence
  - observed_or_valid_period
  - captured_at
  - confirmation_status
  contradiction_behavior: preserve_history_mark_conflict_and_request_resolution
  silent_overwrite: forbidden
document_policy:
  extracted_fact_status: provisional_candidate
  canonical_promotion: explicit_user_confirmation_required
  send_raw_document_or_extracted_content_to_external_ai: forbidden_without_exception
  unsupported_extraction: fail_closed_and_keep_fact_unknown
ai_boundary:
  role: local_navigator_and_explainer_only
  source_of_truth: forbidden
  financial_calculation_authority: local_deterministic_versioned_engine_only
  canonical_write: forbidden_without_explicit_user_confirmation
  provider_training: not_applicable_external_ai_blocked
  external_ai_processing: blocked
  external_ai_payload: no_user_personal_financial_source_prompt_free_text_document_or_metadata_payload_permitted
  permitted_payload: closed_non_user_non_personal_static_product_content_only_or_block
  processor_retention: unresolved_therefore_blocked
  subprocessors: unresolved_therefore_blocked
  recipient_and_jurisdiction: unresolved_therefore_blocked
  unknown_tool_or_recipient: deny
secondary_use_policy:
  default: deny
  authorization: explicit_granular_purpose_specific_opt_in
  bundling: forbidden
  withdrawal: available_and_without_prejudice_to_core_service
  after_withdrawal: stop_optional_processing_and_preserve_required_audit_only
user_controls:
- view
- correct
- delete
- export
- withdraw_optional_consent
recipient_policy:
  disclosure: named_allowlisted_recipient_and_declared_purpose_only
  unknown_recipient: deny
  onward_transfer: deny_unless_separately_assessed_and_disclosed
cross_border_policy:
  destination: named_and_assessed_before_transfer
  unknown_destination: deny
  user_visibility: destination_recipient_purpose_and_data_classes_before_choice
access_policy:
  authorization: least_privilege_purpose_and_operation_bound
  default: deny
  audit: non_content_event_with_actor_purpose_time_and_outcome
  expired_or_unknown_authorization: deny
event_matrix:
- event_id: just_in_time_collection
  trigger: material_fact_missing_for_user_requested_operation
  required_action: explain_purpose_request_minimum_and_allow_skip
  user_visibility: before_collection
- event_id: provisional_document_extraction
  trigger: user_explicitly_supplies_document
  required_action: show_candidates_and_request_confirmation
  user_visibility: before_canonical_promotion
- event_id: canonical_fact_promotion
  trigger: user_confirms_candidate_and_metadata
  required_action: preserve_source_confidence_time_and_confirmation
  user_visibility: immediate
- event_id: contradiction_detected
  trigger: new_candidate_conflicts_with_current_fact
  required_action: preserve_both_mark_conflict_and_request_resolution
  user_visibility: immediate
- event_id: personalized_conclusion_requested
  trigger: before_every_personalized_answer_calculation_or_plan_evaluation
  required_action: verify_each_material_fact_observed_or_valid_period_covers_decision_time_or_deny_personalized_conclusion_and_degrade_to_non_personal_education
  user_visibility: before_personalized_conclusion
- event_id: optional_consent_change
  trigger: user_grants_or_withdraws_optional_choice
  required_action: apply_prospectively_and_show_affected_purpose
  user_visibility: immediate
- event_id: recipient_or_destination_request
  trigger: operation_requires_external_recipient_or_cross_border_destination
  required_action: disclose_named_recipient_destination_purpose_and_classes_or_deny
  user_visibility: before_transfer
- event_id: ai_assistance_request
  trigger: coach_requires_permitted_ai_narrative
  required_action: execute_locally_with_no_user_payload_transfer_or_block_external_ai
  user_visibility: local_processing_or_explicit_blocked_status
- event_id: access_decision
  trigger: service_or_operator_requests_data
  required_action: authorize_exact_purpose_and_operation_or_deny_and_audit_non_content_outcome
  user_visibility: available_in_access_history
- event_id: user_control_request
  trigger: user_requests_view_correction_deletion_export_or_consent_withdrawal
  required_action: route_to_unproven_adjacent_contract_without_claiming_completion
  user_visibility: immediate_status_and_limit
external_privacy_review:
  status: pending
  reviewer: null
  evidence_sha256: null
runtime_privacy_proof: absent
does_not_prove:
- legal_compliance
- regulatory_approval
- runtime_privacy
- retention_export_deletion
- anti_pii
- runtime_security
does_not_close_B0: true
activation_gate: STOP
feature_flag: 'OFF'
