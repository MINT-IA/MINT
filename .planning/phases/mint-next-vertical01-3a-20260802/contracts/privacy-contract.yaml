telemetry_policy:
  content: no_financial_personal_prompt_free_text_document_or_fact_content
  identifier: no_stable_or_cross_session_user_identifier
  recipient: unresolved_therefore_blocked
  jurisdiction: unresolved_therefore_blocked
  default: local_only_or_disabled
notification_policy:
  locked_device_content: generic_non_financial_non_identifying_message_only
  fact_goal_amount_or_plan_detail: forbidden
  unknown_lock_state: treat_as_locked
audit_identity_policy:
  actor: local_ephemeral_pseudonym
  export: forbidden
  link_to_identity: forbidden
fact_freshness_policy:
  check_timing: before_every_personalized_answer_calculation_or_plan_evaluation
  validity_evaluation: each_material_fact_observed_or_valid_period_must_cover_decision_time
  expired_without_contradiction: deny_personalized_conclusion_or_degrade_to_non_personal_education
  stale_or_unknown: deny_personalized_conclusion_or_degrade_to_non_personal_education
  required_explanation:
  - assumptions
  - uncertainty
  - affected_inputs
  - alternatives
  silent_confident_nudge: forbidden
threat_policy_action_matrix:
  T01:
    policies:
    - access_policy
    - adjacent_key_runtime_proof_deferred
    event: access_decision
    action: deny_repository_access_without_verified_current_authorization_and_key_state
  T03:
    policies:
    - fact_freshness_policy
    - canonical_fact_policy
    event: personalized_conclusion_requested
    action: deny_or_degrade_personalization_and_show_assumptions_uncertainty_alternatives
  T04:
    policies:
    - ai_boundary
    - canonical_fact_policy
    event: ai_assistance_request
    action: keep_untrusted_text_outside_fact_and_calculation_authority_or_block
  T05:
    policies:
    - telemetry_policy
    - audit_identity_policy
    event: access_decision
    action: keep_local_non_content_without_stable_identifier_or_block
  T06:
    policies:
    - recipient_policy
    - cross_border_policy
    - ai_boundary
    - telemetry_policy
    event: recipient_or_destination_request
    action: block_unresolved_recipient_jurisdiction_retention_or_subprocessors
  T07:
    policies:
    - user_controls
    - adjacent_retention_export_deletion_contract_deferred
    event: user_control_request
    action: report_incomplete_and_block_success_claim_until_adjacent_contract_proves_completion
  T08:
    policies:
    - access_policy
    - adjacent_key_runtime_proof_deferred
    - adjacent_anti_pii_proof_deferred
    event: access_decision
    action: deny_repository_read_or_copy_without_verified_runtime_controls
  T09:
    policies:
    - fact_freshness_policy
    - canonical_fact_policy
    event: personalized_conclusion_requested
    action: deny_confident_personalized_conclusion_from_deterministic_output_or_coach_and_offer_non_personal_alternatives
  T11:
    policies:
    - notification_policy
    event: access_decision
    action: disable_notification_or_emit_bounded_generic_notification
  T12:
    policies:
    - canonical_fact_policy
    - adjacent_key_runtime_proof_deferred
    - adjacent_retention_export_deletion_contract_deferred
    event: access_decision
    action: reject_corrupt_restore_keep_repository_blocked_and_report_recovery_unproven
