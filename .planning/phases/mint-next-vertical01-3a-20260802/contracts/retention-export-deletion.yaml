export_policy:
  authentication: fresh_user_authentication_required
  authorization: explicit_user_request_for_closed_data_scope
  source_snapshot: one_consistent_repository_version_or_fail
  format: versioned_machine_readable_archive_with_human_manifest
  delivery: atomic_local_handoff_to_user_owned_destination
  app_staging_cleanup: mandatory_after_delivery_failure_cancel_or_timeout
  unknown_destination: deny
  external_delivery: forbidden
  secret_or_key_material: forbidden
  manifest_fields:
  - export_schema_version
  - created_at
  - included_source_sink_class_record_kinds
  - excluded_source_sink_class_record_kinds_and_reasons
  - source_repository_version
  - file_checksums
  - completion_status
  - fact_provenance
  - record_history
  - validity_and_freshness
  - assumptions
  - staleness
  - plan_dependencies
  - known_limits
  excluded_class_handling: source_sink_class_record_kind_and_plain_language_reason_in_non_content_manifest_only_no_excluded_content_staged
  staging_rule: exactly_included_source_sink_class_record_kind_records_no_other_records
  human_manifest_scope_rule: list_every_included_and_excluded_source_sink_class_record_kind_with_plain_language_reason
