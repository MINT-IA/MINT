sink_semantics:
  app_controlled_export_staging:
    controller: MINT
    contains: temporary_value_archive
    must_be_purged: after_delivery_failure_cancel_or_timeout
    classes_rule: projection_of_exactly_included_source_sink_class_record_kind_records
    source_records_rule: exactly_export_staging_record_matrix_no_other_records
  user_owned_delivered_copy:
    controller: user_after_atomic_handoff
    is_storage_sink: false
    MINT_can_delete_after_handoff: false
    delivery_rule: success_only_after_atomic_handoff_then_app_staging_cleanup
  non_value_tombstone_store:
    contains: non_value_anti_resurrection_markers_only
    must_not_reconstruct_value: true
  draft_cache_read_model_provisional_rule: each_is_explicit_sink_with_own_retention_and_targeted_purge
  in_memory_ephemeral_coach_turn:
    contains: current_turn_transient_free_text_only
    persistence: forbidden
    draft_cache_log_telemetry_backup_export: forbidden
    lifetime: current_turn_only
    purge: mandatory_on_turn_completion_failure_cancel_or_app_background
