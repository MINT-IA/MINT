backup_policy:
  content: ciphertext_only_no_plaintext_or_export_key_material
  backup_epoch: monotonic_epoch_bound_to_repository_and_key_generation
  restore_gate: matching_key_generation_integrity_latest_tombstone_epoch_and_purge_ledger_required
  targeted_deletion: purge_propagates_to_supported_backup_or_tombstone_epoch_blocks_value_on_restore
  whole_repository_deletion: wrapping_key_destroyed_and_backup_ciphertext_purge_requested_restore_cryptographically_blocked
  stale_backup: reject_restore_never_rehydrate_deleted_value
  unknown_platform_behavior: runtime_backup_disabled_or_B0_STOP
  completion: may_use_confirmed_propagation_or_cryptographic_inaccessibility_with_current_tombstone_epoch
  restore_epoch_rule: reject_backup_epoch_older_than_latest_committed_tombstone_epoch_even_when_backup_purge_not_propagated
  unpropagated_backup_at_delete: tombstone_epoch_blocks_restore_immediately_without_waiting_for_backup_propagation
  unpropagated_delete_sequence:
  - value_absence_verified
  - tombstone_committed_atomically_before_or_with_backup_epoch_invalidation
  - stale_backup_restore_rejected_by_tombstone_epoch
  - backup_propagation_or_cryptographic_invalidation_completed_later
legal_hold_policy:
  default: deny_no_hold
  activation: only_sourced_versioned_authoritative_obligation_after_external_legal_review
  required_fields:
  - authority_source
  - source_version
  - closed_scope
  - start_at
  - end_at_or_review_at
  - review_cadence
  - user_visibility
  - release_criteria
  invented_duration: forbidden
  scope: minimum_closed_pairs_only
  user_visibility: required_unless_sourced_lawful_exception
  release_transition: release_immediately_enqueues_targeted_purge_if_other_basis_or_purpose_absent
  current_holds: []
  runtime_without_valid_hold_contract: hold_forbidden
tombstone_policy:
  record_kind: non_value_tombstone
  contains_user_value: false
  reconstructs_deleted_value: false
  allowed_fields:
  - kind
  - occurred_at
  - predecessor_record_version
  - purge_graph_ref
  - backup_epoch
  forbidden_fields:
  - normalized_value
  - source_ref
  - free_text
  - file_path_or_name
  - stable_user_identifier
  duration: authoritative_duration_unset_runtime_blocked
  start_trigger: value_absence_verified
  end_triggers:
  - authoritative_anti_resurrection_retention_ended
  source_value_deleted_is_end_trigger: false
  stale_backup_restore: blocked_by_tombstone_epoch_even_if_backup_purge_unpropagated_and_after_tombstone_purge
  resurrection_channels:
  - canonical_records
  - provenance_records
  - derived_read_models
  - plan_records
  - draft_records
  - provisional_extractions
  - application_caches
  - platform_backups
  - export_staging
  - notification_store
  - telemetry_buffer
  creation_precondition: value_absence_verified
  commit_epoch_atomicity: tombstone_committed_atomically_before_or_with_backup_epoch_invalidation
  purge_preconditions:
    resurrection_channels: all_resurrection_channels_impossible
    authoritative_horizon: authoritative_anti_resurrection_retention_ended
    combination: both_independently_required
