retention_policy:
  duration_authority: external_privacy_and_legal_review_required
  unset_duration_behavior: runtime_persistence_or_export_for_that_pair_blocked
  trigger_rule: earliest_applicable_trigger_starts_targeted_purge
  non_user_triggers:
  - retention_expired
  - purpose_ended
  - consent_withdrawn_where_consent_is_basis
  - record_superseded
  silent_extension: forbidden
  unknown_or_conflict: deny_retention_and_require_review
  tombstone_trigger_rule: create_exactly_after_value_absence_verified_before_or_with_backup_epoch_invalidation
  tombstone_end_rule: purge_only_after_authoritative_anti_resurrection_retention_ended_never_source_value_deleted
  ephemeral_coach_rule: in_memory_current_turn_only_purge_on_completion_failure_cancel_or_background
record_lifecycle_machines:
  revoke:
    meaning: stop_reliance_on_named_record_without_replacement
    states:
    - active
    - revoke_requested
    - purge_pending
    - revoked
    transitions:
    - transition_id: revoke_request
      from: active
      event: user_or_verified_source_revokes
      to: revoke_requested
      action_id: request_revoke
    - transition_id: revoke_detach
      from: revoke_requested
      event: dependents_marked_stale_and_value_purge_enqueued
      to: purge_pending
      action_id: request_revoke
    - transition_id: revoke_complete
      from: purge_pending
      event: targeted_value_purge_verified_and_non_value_tombstone_committed
      to: revoked
      action_id: verify_purge
    interruption_policy: action_failure_or_interruption_leaves_source_state_and_retries_same_idempotent_action
  supersede:
    meaning: replace_named_active_record_with_new_confirmed_version
    states:
    - active
    - replacement_requested
    - replacement_committed
    - old_value_purge_pending
    - superseded
    transitions:
    - transition_id: supersede_request
      from: active
      event: confirmed_replacement_submitted
      to: replacement_requested
      action_id: request_supersede
    - transition_id: supersede_commit
      from: replacement_requested
      event: new_version_atomically_committed
      to: replacement_committed
      action_id: request_supersede
    - transition_id: supersede_enqueue_old_purge
      from: replacement_committed
      event: dependents_rebound_or_stale_and_old_value_purge_enqueued
      to: old_value_purge_pending
      action_id: request_supersede
    - transition_id: supersede_complete
      from: old_value_purge_pending
      event: old_value_purge_verified_and_non_value_link_committed
      to: superseded
      action_id: verify_purge
    interruption_policy: action_failure_or_interruption_leaves_source_state_and_retries_same_idempotent_action
  delete:
    meaning: erase_named_scope_without_replacement
    states:
    - live
    - delete_requested
    - authenticated
    - purge_in_progress
    - purge_interrupted
    - purge_verifying
    - deleted
    transitions:
    - transition_id: delete_request
      from: live
      event: user_requests_closed_scope_deletion
      to: delete_requested
      action_id: request_delete
    - transition_id: delete_auth
      from: delete_requested
      event: fresh_auth_and_scope_confirmation_succeed
      to: authenticated
      action_id: request_delete
    - transition_id: delete_begin
      from: authenticated
      event: targeted_purge_actions_enqueued
      to: purge_in_progress
      action_id: request_delete
    - transition_id: delete_interrupt
      from: purge_in_progress
      event: partial_failure_or_interruption
      to: purge_interrupted
      action_id: verify_purge
    - transition_id: delete_resume
      from: purge_interrupted
      event: idempotent_resume
      to: purge_in_progress
      action_id: verify_purge
    - transition_id: delete_verify
      from: purge_in_progress
      event: all_targeted_actions_have_evidence
      to: purge_verifying
      action_id: verify_purge
    - transition_id: delete_complete
      from: purge_verifying
      event: same_graph_evidence_and_tombstone_verified
      to: deleted
      action_id: verify_purge
    interruption_policy: action_failure_or_interruption_leaves_source_state_and_retries_same_idempotent_action
purge_orchestration:
  targeting_rule: closed_data_class_sink_pairs_only
  all_pairs_have_action_and_evidence: true
  partial_or_unknown: not_complete_deny_value_access_resume_idempotently
  completion_rule: every_targeted_pair_evidence_verified_for_same_graph
  key_rule: destroy_key_reference_only_when_scope_is_whole_repository_else_targeted_value_deletion
  graph_id: required_immutable_unique_nonempty
  targeted_pairs: closed_unique_nonempty_set
  action_binding: exactly_one_targeted_action_per_pair_in_same_graph
  evidence_binding: exactly_one_unique_nonempty_evidence_per_pair_and_action_in_same_graph
  evidence_inverse: every_graph_evidence_maps_to_exactly_one_targeted_pair_and_action
  verify_purge_aggregation: all_and_only_targeted_pair_evidence_for_same_graph_must_verify
  source_delete_is_not_tombstone_purge_authority: true
  tombstone_creation_rule: commit_non_value_marker_exactly_after_value_absence_verified
  tombstone_epoch_rule: commit_atomically_before_or_with_backup_epoch_invalidation
  tombstone_purge_rule: require_all_resurrection_channels_impossible_and_separately_authoritative_horizon_ended
export_state_machine:
  states:
  - idle
  - requested
  - authenticated
  - snapshotted
  - built
  - verified
  - delivered
  - failed
  - cleaned
  terminal_states:
  - cleaned
  success_state: delivered
  transitions:
  - transition_id: export_request
    from: idle
    event: user_requests_closed_scope
    to: requested
    action_id: request_export
  - transition_id: export_authenticate
    from: requested
    event: fresh_auth_succeeds
    to: authenticated
    action_id: authenticate_export
  - transition_id: export_snapshot
    from: authenticated
    event: consistent_snapshot_created
    to: snapshotted
    action_id: snapshot_export
  - transition_id: export_build
    from: snapshotted
    event: archive_and_manifest_built_in_app_staging
    to: built
    action_id: build_export
  - transition_id: export_verify
    from: built
    event: all_checksums_scope_and_manifest_verified
    to: verified
    action_id: verify_export
  - transition_id: export_deliver
    from: verified
    event: atomic_handoff_to_user_destination_succeeds
    to: delivered
    action_id: deliver_export
  - transition_id: export_fail_requested
    from: requested
    event: cancel_timeout_or_failure
    to: failed
    action_id: fail_export
  - transition_id: export_fail_authenticated
    from: authenticated
    event: cancel_timeout_or_failure
    to: failed
