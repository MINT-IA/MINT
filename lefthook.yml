# lefthook.yml — Phase 34 GUARD-01 partial (banned_terms_arb + arb_parity active)
# Phase 30.5 CTX-01 D-04 originally scoped this skeleton to memory_retention only.
# 2026-05-10: replay on last 50 commits of `dev` measured 0/50 commits blocked by
# banned_terms_arb and 0/50 by arb_parity → activated as HARD gates.
# Remaining GUARD-* lints (accent_lint_fr 26/50, no_hardcoded_fr 23/50, no_bare_catch
# script absent) deferred until --diff/baseline mode lands — see ROADMAP_V2 Phase 34.

min_version: 2.1.5

pre-commit:
  # parallel: false until phase 34 — race conditions on .git/index.lock
  parallel: false
  commands:
    memory-retention-gate:
      # Fails commit if memory/topics/*.md has entries >30d not archived
      # (HARD gate per D-02). SOFT warning if MEMORY.md INDEX >100 lines
      # (non-failing, per D-02). All other lints REPORTÉS à Phase 34
      # GUARD-01 (D-04 strict skeleton scope).
      run: python3 tools/checks/memory_retention.py
      tags: [memory, phase-30.5]
    map-freshness-hint:
      # Hint (not a gate) — when the commit touches a subsystem with a
      # map in docs/*.md, remind the author (or their LLM agent) to
      # consult the map. Exits 0 unconditionally. Hard gate promotion
      # deferred to Phase 34 proof_of_read lint once that lands.
      run: python3 tools/checks/map_freshness_hint.py {staged_files}
      glob: "*.{dart,py}"
      tags: [map, agents]
    wiki-lint:
      # Karpathy Wiki Pattern (practice 7) — lint pass for `.planning/`.
      # Currently HARD on decision-artifact bias-check (every ADR must
      # have a « Counter-arguments and data gaps » section). SOFT on
      # orphan pages + new-article candidates (warnings only). Runs only
      # when commit touches `.planning/**/*.md` so it doesn't bloat
      # ordinary code commits.
      run: python3 tools/checks/wiki_lint.py
      glob: ".planning/**/*.md"
      tags: [wiki, planning]
    # ── Phase 34 GUARD-01 partial (HARD gates, 0/50 historical block rate) ──
    banned-terms-arb-gate:
      # LSFin Rule #1 (CLAUDE.md TOP rule #1) — refuses any ARB containing the
      # « garanti / guaranteed / garantiert / garantizado / garantito / garantido »
      # family in a positive (non-negated) context. Replay measure 2026-05-10:
      # 0/50 commits on `dev` would have been blocked. Bypass via LEFTHOOK_BYPASS=1
      # is grep-able per CLAUDE.md §5 dev rules.
      run: python3 tools/checks/banned_terms_arb.py
      glob: "apps/mobile/lib/l10n/*.arb"
      tags: [compliance, lsfin, phase-34-guard-01]
      fail_text: "LSFin banned terms detected in ARB. Rewrite using permitted vocabulary (« vise à fournir », « est conçue pour », …) — CLAUDE.md TOP rule #1."
    arb-parity-gate:
      # CLAUDE.md TOP rule #5 — 6 ARB files (fr/en/de/es/it/pt) must share the
      # same key set. Reference locale = fr. Replay measure 2026-05-10: 0/50
      # commits on `dev` would have been blocked. MCP shim
      # (tools/mcp/mint-tools/tools/arb_parity.py) wraps this same script and
      # returns ArbParityResult to agents.
      run: python3 tools/checks/arb_parity.py
      glob: "apps/mobile/lib/l10n/*.arb"
      tags: [compliance, i18n, phase-34-guard-05]
      fail_text: "ARB parity drift. Run `flutter gen-l10n` after syncing keys, or update FR reference and propagate to en/de/es/it/pt."
    # ── Phase MVP-DESIGN-LINTS-V1 (chat-as-verb milestone, 2026-05-09) ──
    # 5 design-system lints. SOFT-warn at pre-commit (`fail_text` only
    # printed; exit-0 suffices because each script gracefully no-ops on
    # missing baseline / out-of-scope file). HARD-fail at CI via
    # .github/workflows/design-lints.yml. Devs see violations during
    # `git commit`; CI is the merge-blocker.
    #
    # `--file {staged_files}` substitution: lefthook splits staged paths
    # by space and substitutes inline. Each lint declares
    # `--file action='append'` so multiple paths populate correctly.
    prefer-mint-color-token:
      run: python3 tools/checks/prefer_mint_color_token.py --file {staged_files} || true
      glob: "apps/mobile/lib/*.dart"
      tags: [design, phase-1-mvp-design-lints]
      fail_text: "design-lint warning — see CI for full diff (prefer_mint_color_token)"
    prefer-mint-text-style:
      run: python3 tools/checks/prefer_mint_text_style.py --file {staged_files} || true
      glob: "apps/mobile/lib/*.dart"
      tags: [design, phase-1-mvp-design-lints]
      fail_text: "design-lint warning — see CI for full diff (prefer_mint_text_style)"
    prefer-mint-fonts:
      run: python3 tools/checks/prefer_mint_fonts.py --file {staged_files} || true
      glob: "apps/mobile/lib/*.dart"
      tags: [design, phase-1-mvp-design-lints]
      fail_text: "design-lint warning — see CI for full diff (prefer_mint_fonts)"
    prefer-mint-radius:
      run: python3 tools/checks/prefer_mint_radius.py --file {staged_files} || true
      glob: "apps/mobile/lib/*.dart"
      tags: [design, phase-1-mvp-design-lints]
      fail_text: "design-lint warning — see CI for full diff (prefer_mint_radius)"
    prefer-mint-cta:
      run: python3 tools/checks/prefer_mint_cta.py --file {staged_files} || true
      glob: "apps/mobile/lib/*.dart"
      tags: [design, phase-1-mvp-design-lints]
      fail_text: "design-lint warning — see CI for full diff (prefer_mint_cta)"

skip:
  - merge
  - rebase
