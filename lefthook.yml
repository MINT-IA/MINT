# lefthook.yml — MINT checked-in safety gates.
# Keep this file honest: only list gates that actually run in this checkout.

min_version: 2.1.5

pre-commit:
  # parallel: false until phase 34 — race conditions on .git/index.lock
  parallel: false
  commands:
    memory-retention-gate:
      # Fails commit if memory/topics/*.md has entries >30d not archived
      # (HARD gate per D-02). SOFT warning if MEMORY.md INDEX >100 lines
      # (non-failing, per D-02).
      run: python3 tools/checks/memory_retention.py
      tags: [memory, phase-30.5]
    gitleaks-secret-scan:
      run: >-
        command -v gitleaks >/dev/null ||
        { echo "gitleaks is required for MINT secret scanning. Install with: brew install gitleaks"; exit 1; };
        gitleaks git --pre-commit --staged --redact --config .gitleaks.toml --verbose
      tags: [security, secrets, mint]
    map-freshness-hint:
      # Hint (not a gate) — when the commit touches a subsystem with a
      # map in docs/*.md, remind the author (or their LLM agent) to
      # consult the map. Exits 0 unconditionally.
      run: python3 tools/checks/map_freshness_hint.py {staged_files}
      glob: "*.{dart,py}"
      tags: [map, agents]
    arb-parity:
      run: python3 tools/checks/arb_parity.py
      glob: "apps/mobile/lib/l10n/app_*.arb"
      tags: [i18n, mint]
    accent-lint-fr:
      run: for file in {staged_files}; do python3 tools/checks/accent_lint_fr.py --staged-file "$file" || exit 1; done
      glob: "*.{dart,py,arb,md}"
      tags: [i18n, mint]
    no-hardcoded-fr:
      run: for file in {staged_files}; do python3 tools/checks/no_hardcoded_fr.py --staged-file "$file" || exit 1; done
      glob: "apps/mobile/lib/**/*.dart"
      tags: [i18n, mint]
    banned-ui-terms:
      run: for file in {staged_files}; do python3 tools/checks/banned_ui_terms.py --file "$file" || exit 1; done
      glob: "apps/mobile/lib/**/*.dart"
      tags: [compliance, mint]
    financial-core-gate:
      run: python3 tools/checks/financial_core_gate.py --staged
      glob: "apps/mobile/lib/**/*.dart"
      tags: [financial-core, mint]
    hardcoded-rate-gate:
      run: python3 tools/checks/hardcoded_rate_gate.py --staged
      glob: "{apps/mobile/lib/**/*.dart,services/backend/app/**/*.py}"
      tags: [financial-core, swiss-rates, mint]
    no-bypass-persistence:
      run: python3 tools/checks/no_bypass_persistence.py {staged_files}
      glob: "apps/mobile/lib/**/*.dart"
      tags: [data-ledger, persistence, mint]
    g1-avs-certified-null-hard-floor:
      run: python3 -m pytest tools/checks/tests/test_g1_avs_certified_null_contract.py -q
      glob: "{apps/mobile/lib/**/*.dart,services/backend/app/**/*.py,tools/openapi/mint.openapi.canonical.json,tools/checks/tests/test_g1_avs_certified_null_contract.py,lefthook.yml}"
      tags: [g1, avs, data-ledger, hard-floor, mint]
    interaction-registry-lint:
      run: python3 tools/checks/interaction_registry_lint.py
      glob: "{interactions/*.yaml,interactions/INDEX.md,.planning/journeys/diagrams/interaction_graph.mmd,tools/checks/interaction_registry_lint.py,apps/mobile/lib/routes/route_metadata.dart,apps/mobile/lib/services/analytics_events.dart,apps/mobile/lib/l10n/app_fr.arb,apps/mobile/.maestro/*.yaml,apps/mobile/lib/screens/**/*.dart}"
      tags: [interaction-registry, mermaid, mint]
    interaction-coverage-audit:
      run: python3 tools/checks/interaction_coverage_audit.py
      glob: "{apps/mobile/lib/**/*.dart,interactions/*.yaml,.planning/journeys/INTERACTION_COVERAGE_AUDIT.md,tools/checks/interaction_coverage_audit.py,apps/mobile/lib/routes/route_metadata.dart}"
      tags: [interaction-registry, navigation, mint]

skip:
  - merge
  - rebase
