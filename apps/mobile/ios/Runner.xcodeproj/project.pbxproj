			runOnlyForDeploymentPostprocessing = 0;
				shellPath = /bin/sh;
				shellScript = "# Strip xattrs from the app bundle before simulator codesign.\n# On macOS Sequoia/Tahoe, com.apple.provenance can survive xattr -d on\n# .nosync/FileProvider-backed paths, so rebuild the bundle without extattrs.\nfor path in \"${CODESIGNING_FOLDER_PATH}\" \"${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}\" \"${TARGET_BUILD_DIR}/${WRAPPER_NAME}\"; do\n  if [ -n \"$path\" ] && [ -e \"$path\" ]; then\n    tmp=\"${path}.noattrs\"\n    rm -rf \"$tmp\"\n    COPYFILE_DISABLE=1 /usr/bin/ditto --noextattr --noqtn \"$path\" \"$tmp\" 2>/dev/null || true\n    if [ -e \"$tmp\" ]; then\n      rm -rf \"$path\"\n      mv \"$tmp\" \"$path\"\n    fi\n    /usr/bin/xattr -cr \"$path\" 2>/dev/null || true\n  fi\ndone\n";
			};
