name: mint_mobile
description: Mint - Financial mentor mobile app
publish_to: 'none'

version: 2.12.4+71

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.1
  go_router: ^13.2.0
  intl: any  # Pinned by flutter_localizations SDK — do not constrain further
  url_launcher: ^6.2.0
  uuid: ^4.0.0
  pdf: ^3.10.8
  printing: ^5.12.0
  fl_chart: ^0.70.0
  flutter_markdown: ^0.7.6
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.0.0
  sentry_flutter: 9.14.0  # CTX-05 spike (STACK.md §A.1, v2.8 prep for OBS-01)
  file_picker: ^8.0.0
  image_picker: ^1.1.2
  # 2026-04-17: google_mlkit_text_recognition removed. MLKit 7.x has no
  # arm64-simulator slice, blocking simulator QA on Apple Silicon. Backend
  # Claude Vision (/documents/extract-vision) is the single OCR path now.
  # The local OCR fallback in DocumentScanScreen is gone.
  # Phase 28-03 — native document scanner (VisionKit iOS / ML Kit Doc Scanner Android)
  flutter_doc_scanner: ^0.0.13
  # 2026-04-17: google_mlkit_image_labeling removed (MLKit 7.x/9.x conflict).
  # LocalImageClassifier is stubbed fail-open; backend Vision rejects
  # non-financial images server-side.
  in_app_purchase: ^3.2.0
  in_app_purchase_platform_interface: ^1.4.0
  confetti: ^0.7.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  # 2026-04-17: flutter_gemma removed. SLM was already gated off at runtime
  # (FeatureFlags.slmPluginReady=false) and its TensorFlowLiteSelectTfOps
  # pod has no arm64-simulator slice. SlmEngine/SlmDownloadService are
  # preserved as stubs so the orchestrator's tier chain still compiles and
  # falls through to the server-key path on msg 1.
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.3
  sqflite_sqlcipher: ^3.1.0+1
  path_provider: ^2.1.0
  path: ^1.9.0  # pinned by integration_test from SDK
  # Phase 96 D-17 — metaphor TOML library asset loading
  toml: ^0.16.0
  # Phase 02 D-MOB — direct dep promotion of already-transitive package_info_plus
  # (used by api_service.dart ApiService.initAppVersion to read pubspec version
  # at boot, replacing the hardcoded `_appVersion = '1.0.0'`). Powers
  # X-App-Version header + future mobile L1 audit trail (D-MOB-03 obs #186).
  package_info_plus: ^8.0.0
  # Phase 97 W7 iter#5 (T001 EXIF leak) — direct dep promotion of the
  # already-transitive image package. Used by lib/services/exif_scrub.dart
  # to strip GPS / DateTime / Make / Model / Software EXIF tags from
  # photos BEFORE they leave the device on the Vision API path.
  # GDPR Art. 5(1)(c) data minimization + Swiss DSG/LPD Art. 8 security.
  image: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Brand app icon generator — reads assets/branding/menthe/flat-1024.png
  # and produces all iOS sizes + Android mipmaps + web favicons in one shot.
  # Run manually after any icon change : `dart run flutter_launcher_icons`.
  flutter_launcher_icons: ^0.13.1
  # S98 Phase 5.X — auto-upload Dart obfuscation maps + iOS dSYMs to
  # Sentry after `flutter build`. Without this, every TestFlight crash
  # lands in Sentry as obfuscated Dart tokens (file paths look like
  # `package:mint_mobile/foo/0x4f2`) instead of source-line resolved.
  # Activation env vars (set as GitHub Secrets — see testflight.yml) :
  #   SENTRY_AUTH_TOKEN (sntryu_... user token, scope project:read +
  #     project:write + project:releases + org:read)
  #   SENTRY_ORG=moneyint
  #   SENTRY_PROJECT=mint-mobile
  # Plugin no-ops cleanly if env vars are absent (dev local build path).
  sentry_dart_plugin: ^2.0.0

sentry:
  # S98 Phase 5.X — sentry_dart_plugin config. Plugin runs as a post-
  # `flutter build` hook (invoked via `dart run sentry_dart_plugin`)
  # and uploads dSYMs + the obfuscation map to Sentry. `upload_sources`
  # is FALSE — we deliberately do not upload Dart source code (the
  # symbolicated stack trace is enough ; sources would inflate the
  # PII / IP-leak surface).
  upload_debug_symbols: true
  upload_sources: false
  upload_source_maps: false
  # `org` + `project` + `auth_token` resolved from env vars at build
  # time (set as GitHub Secrets, exposed by testflight.yml). Plugin
  # falls back to a `sentry.properties` file if env vars are absent
  # — that file is .gitignored (devs may create it locally).

# MINT « m. » brand app icon — generated from the designer pack at
# assets/branding/menthe/flat-1024.png. To regenerate :
#   flutter pub get
#   dart run flutter_launcher_icons
# iOS strips alpha (App Store requirement). Android writes legacy
# ic_launcher + adaptive_icon (foreground = the same flat PNG, background
# = the menthe solid color, so the adaptive crop never reveals empty space).
flutter_launcher_icons:
  image_path: "assets/branding/menthe/flat-1024.png"
  ios: true
  remove_alpha_ios: true
  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "#9EE5C5"
  adaptive_icon_foreground: "assets/branding/menthe/flat-1024.png"
  web:
    generate: true
    image_path: "assets/branding/menthe/flat-1024.png"
    background_color: "#9EE5C5"
    theme_color: "#9EE5C5"

flutter:
  generate: true
  uses-material-design: true
  
  # Assets
  assets:
    # Phase 6 — L1.4 Regional voice ARBs (loaded at runtime by
    # lib/l10n_regional/regional_localizations_delegate.dart).
    - lib/l10n_regional/app_regional_vs.arb
    - lib/l10n_regional/app_regional_zh.arb
    - lib/l10n_regional/app_regional_ti.arb
    - assets/config/pillar_3a_limits.json
    - assets/config/tax_scales.json
    - assets/config/tax_scales_2024.json
    - assets/config/personas.json
    - assets/config/commune_multipliers.json
    - assets/fonts/Lato-Regular.ttf
    - assets/fonts/Lato-Bold.ttf
    # Phase 96 D-17 — metaphor library v1 bootstrap (loaded at app boot
    # by MetaphorLookup.loadFromAssets() ; byte-equal mirror at
    # services/backend/app/data/metaphors.toml, parity enforced by
    # tools/checks/metaphor_parity.py + lefthook).
    - assets/metaphors.toml

  # Phase 92-01 — MVP-FONTS-TOKENS-V2 — Fontshare Supreme + Gambarino bundled .otf
  # License: apps/mobile/assets/fonts/LICENSE-{SUPREME,GAMBARINO}.txt (Indian Type Foundry FF EULA)
  # Note: Supreme weight 700 ("Bold") is the closest available substitute for the design system's "Semibold"
  #       (Fontshare ships 100/200/300/400/500/700/800 — no 600). See 92-01-SUMMARY.md.
  # Note: Gambarino italic is synthesized via style: italic; Fontshare only ships Gambarino-Regular upright.
  fonts:
    - family: Supreme
      fonts:
        - asset: assets/fonts/Supreme-Regular.otf
          weight: 400
        - asset: assets/fonts/Supreme-Medium.otf
          weight: 500
        - asset: assets/fonts/Supreme-Bold.otf
          weight: 700
    - family: Gambarino
      fonts:
        - asset: assets/fonts/Gambarino-Regular.otf
          style: italic
          weight: 400
