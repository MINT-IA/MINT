appId: ch.mint.app
name: G1 BND-06 persisted financial plan staleness recovery
---
- launchApp:
    clearState: false
- openLink: "mint:///home"
- assertVisible:
    id: "home_route"
- assertVisible:
    id: "financial_plan_stale_state"
- assertVisible:
    id: "financial_plan_stale_recalculate"
- assertNotVisible: ".*54 321 CHF / mois.*"
- tapOn:
    id: "financial_plan_stale_recalculate"
- scrollUntilVisible:
    element:
      id: "financial_plan_setup_retirement_horizon"
    direction: DOWN
- assertVisible:
    id: "financial_plan_setup_retirement_horizon"
- tapOn:
    id: "financial_plan_setup_retirement_horizon"
- scrollUntilVisible:
    element:
      id: "financial_plan_setup_retirement_continue"
    direction: DOWN
- assertVisible:
    id: "financial_plan_setup_retirement_continue"
- tapOn:
    id: "financial_plan_setup_retirement_continue"
- scrollUntilVisible:
    element:
      id: "financial_plan_setup_review"
    direction: DOWN
- assertVisible:
    id: "financial_plan_setup_review"
- tapOn:
    id: "financial_plan_setup_review"
- assertVisible:
    id: "financial_plan_setup_confirmation"
- scrollUntilVisible:
    element:
      id: "financial_plan_setup_confirm"
    direction: DOWN
- tapOn:
    id: "financial_plan_setup_confirm"
- assertNotVisible:
    id: "financial_plan_stale_state"
- assertVisible: ".*54 321 CHF / mois.*"
