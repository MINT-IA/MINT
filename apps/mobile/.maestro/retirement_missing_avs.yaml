appId: ch.mint.app
---
# Synthetic revenue facts create a local profile while AVS evidence remains
# intentionally absent. The retirement dashboard must stay partial.
- stopApp
- launchApp:
    clearState: true
- tapOn:
    text: "Cancel"
    optional: true
- openLink: "mint:///data-block/revenu"
- assertVisible:
    id: "salary_input"
- tapOn:
    id: "salary_input"
- inputText: "96000"
- tapOn:
    id: "canton_picker"
- inputText: "VD"
- tapOn:
    id: "birth_year_input"
- inputText: "1985"
- tapOn:
    id: "has_pension_fund_switch"
- scrollUntilVisible:
    element:
      id: "salary_save_cta"
    direction: DOWN
    speed: 5
    visibilityPercentage: 20
    centerElement: true
- tapOn:
    id: "salary_save_cta"
- assertVisible:
    id: "data_block_save_success"
- openLink: "mint:///retraite"
- assertVisible:
    id: "retirement_missing_avs_state"
- assertVisible:
    id: "retirement_capital_amount"
- assertVisible:
    id: "retirement_avs_document_cta"
- assertNotVisible:
    id: "retirement_complete_income"
- assertNotVisible:
    id: "retirement_replacement_rate"
- tapOn:
    id: "retirement_avs_document_cta"
- assertVisible:
    text: ".*318\\.282.*"
- scrollUntilVisible:
    element:
      id: "avs_official_form_cta"
    direction: DOWN
    speed: 5
    visibilityPercentage: 100
    centerElement: true
- assertVisible:
    id: "avs_official_form_cta"
- takeScreenshot: retirement_missing_avs_official_form

# The report must preserve the same epistemic boundary: AVS, LPP, and 3a are
# pending, and no uncertified pension amount, total, or replacement rate is
# rendered.
- openLink: "mint:///rapport"
- scrollUntilVisible:
    element:
      id: "financial_report_avs_pending"
    direction: DOWN
    speed: 5
    visibilityPercentage: 50
    centerElement: true
- assertVisible:
    id: "financial_report_avs_pending"
- takeScreenshot: financial_report_avs_pending
- scrollUntilVisible:
    element:
      id: "financial_report_lpp_pending"
    direction: DOWN
    speed: 5
    visibilityPercentage: 50
    centerElement: true
- assertVisible:
    id: "financial_report_lpp_pending"
- takeScreenshot: financial_report_lpp_pending
- scrollUntilVisible:
    element:
      id: "financial_report_3a_pending"
    direction: DOWN
    speed: 5
    visibilityPercentage: 50
    centerElement: true
- assertVisible:
    id: "financial_report_3a_pending"
- takeScreenshot: financial_report_3a_pending
- assertNotVisible:
    id: "financial_report_lpp_estimate"
- assertNotVisible:
    id: "financial_report_3a_estimate"
- assertNotVisible:
    id: "financial_report_avs_amount"
- assertNotVisible:
    id: "financial_report_retirement_total"
- assertNotVisible:
    id: "financial_report_replacement_rate"
