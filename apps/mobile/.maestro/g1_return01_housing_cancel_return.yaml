appId: ch.mint.app
---
# Black-box companion for the housing_cancel Patrol stage.
- launchApp
- openLink: "mint:///hypotheque"
- runFlow:
    when:
      visible: "Ouvrir"
    commands:
      - tapOn: "Ouvrir"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "mortgage_enrich_profile_cta"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "mortgage_enrich_profile_cta"
    direction: DOWN
- tapOn:
    id: "mortgage_enrich_profile_cta"
- assertVisible:
    id: "salary_input"
- back
- assertVisible:
    id: "mortgage_enrich_profile_cta"
