appId: ch.mint.app
---
# Black-box companion for the housing_cancel Patrol stage.
- launchApp
- extendedWaitUntil:
    visible:
      id: "landing_route"
    timeout: 20000
- openLink: "mint:///hypotheque"
- runFlow:
    when:
      visible: "Ouvrir"
    commands:
      - tapOn: "Ouvrir"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "mortgage_afford_result"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "mortgage_enrich_profile_cta"
    direction: DOWN
- tapOn:
    id: "mortgage_enrich_profile_cta"
- assertVisible:
    id: "salary_input"
- tapOn:
    id: "data_block_cancel_return_cta"
- assertVisible:
    id: "mortgage_enrich_profile_cta"
