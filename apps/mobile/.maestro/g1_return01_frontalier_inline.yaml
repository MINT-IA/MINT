appId: ch.mint.app
---
# Production-owned black-box proof. Patrol proves the same inline writer
# independently; this flow creates its own facts through the normal app.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "landing_route"
    timeout: 20000
- openLink: "mint:///segments/frontalier"
- runFlow:
    when:
      visible: "Ouvrir"
    commands:
      - tapOn: "Ouvrir"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "frontier_residence_country_field"
    timeout: 20000
- tapOn:
    id: "frontier_residence_country_field"
- tapOn:
    text: "France \\(FR\\)"
- assertVisible:
    text: "France \\(FR\\)"
- tapOn:
    id: "frontier_work_country_field"
- tapOn:
    text: "Suisse \\(CH\\)"
- assertVisible:
    text: "Suisse \\(CH\\)"
- extendedWaitUntil:
    visible:
      id: "frontier_work_canton_field"
    timeout: 20000
- tapOn:
    id: "frontier_work_canton_field"
- tapOn:
    text: "GE"
- assertVisible:
    text: "GE"
- scrollUntilVisible:
    element:
      id: "frontier_jurisdiction_known_state"
    direction: DOWN
- assertVisible:
    id: "frontier_jurisdiction_known_state"

# A real process stop and state-preserving launch must cold-read the same facts.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "landing_route"
    timeout: 20000
- openLink: "mint:///segments/frontalier"
- runFlow:
    when:
      visible: "Ouvrir"
    commands:
      - tapOn: "Ouvrir"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "frontier_residence_country_field"
    timeout: 20000
- assertVisible:
    id: "frontier_residence_country_field"
- assertVisible:
    text: "France \\(FR\\)"
- assertVisible:
    id: "frontier_work_country_field"
- assertVisible:
    text: "Suisse \\(CH\\)"
- extendedWaitUntil:
    visible:
      id: "frontier_work_canton_field"
    timeout: 20000
- assertVisible:
    id: "frontier_work_canton_field"
- assertVisible:
    text: "GE"
- scrollUntilVisible:
    element:
      id: "frontier_jurisdiction_known_state"
    direction: DOWN
- assertVisible:
    id: "frontier_jurisdiction_known_state"
