# Runner precondition: clean install, launch, then simctl openurl to collector.
- extendedWaitUntil:
    visible:
      id: "property_market_value_input"
    timeout: 20000
- assertVisible:
    id: "property_market_value_input"
- tapOn:
    id: "property_market_value_input"
- inputText: "900000"
- tapOn:
    id: "patrimoine_save_cta"
- extendedWaitUntil:
    visible:
      id: "succession_parents_note"
    timeout: 20000
- assertNotVisible:
    id: "succession_reference_quest"
