appId: ch.mint.app
---
# Physical production-default build: no succession feature dart-define.
# Runner precondition: clean install, launch, then simctl openurl to collector.
- extendedWaitUntil:
    visible:
      id: "property_market_value_input"
    timeout: 20000
- assertVisible:
    id: "property_market_value_input"
- tapOn:
    id: "property_market_value_input"
- inputText: "900000"
- tapOn:
    id: "patrimoine_save_cta"
- scrollUntilVisible:
    element:
      id: "succession_reference_quest_flag_off"
    direction: DOWN
    speed: 5
    visibilityPercentage: 20
    centerElement: true
- assertVisible:
    id: "succession_reference_quest_flag_off"
