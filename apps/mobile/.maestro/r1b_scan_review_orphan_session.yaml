appId: ch.mint.app
---
# Regression D-1b: /scan/review with an orphan scanSessionId must recover to /scan.
- launchApp:
    clearState: true
- tapOn:
    text: "Cancel"
    optional: true
- openLink: "mint:///scan/review?scanSessionId=orphan-session-r1b"
- assertVisible:
    text: "Aucun document"
- tapOn:
    point: "50%,90%"
- assertVisible:
    id: "document_scan_header"
