appId: ch.mint.app
---
# Flag-on build hook:
# --dart-define=MINT_TEST_SUCCESSION_EVIDENCE_COLLECTION=true
# Runner precondition: clean install, launch, then simctl openurl to collector.
- extendedWaitUntil:
    visible:
      id: "property_market_value_input"
    timeout: 20000
- assertVisible:
    id: "property_market_value_input"
- tapOn:
    id: "property_market_value_input"
- inputText: "900000"
- tapOn:
    id: "patrimoine_save_cta"
- scrollUntilVisible:
    element:
      id: "succession_civil_status_guard"
    direction: DOWN
    speed: 5
    visibilityPercentage: 20
    centerElement: true
- assertVisible:
    id: "succession_reference_quest"
- assertVisible:
    id: "succession_civil_status_guard"
- tapOn:
    id: "succession_civil_status_confirm"
- assertVisible:
    id: "civil_status_single_choice"
- tapOn:
    id: "civil_status_single_choice"
- tapOn:
    id: "household_save_cta"
- extendedWaitUntil:
    visible:
      id: "succession_instrument_will_question"
    timeout: 20000
- assertVisible:
    id: "succession_instrument_will_question"
