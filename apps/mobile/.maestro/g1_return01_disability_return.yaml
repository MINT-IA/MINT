appId: ch.mint.app
---
# Black-box companion for the independent disability Patrol witness. This
# normal app owns its salary seed because test-host credentials are isolated.
- launchApp
- extendedWaitUntil:
    visible:
      id: "landing_route"
    timeout: 20000
- openLink: "mint:///hypotheque"
- runFlow:
    when:
      visible: "Ouvrir"
    commands:
      - tapOn: "Ouvrir"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "mortgage_afford_result"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "mortgage_enrich_profile_cta"
    direction: DOWN
- tapOn:
    id: "mortgage_enrich_profile_cta"
- assertVisible:
    id: "salary_input"
- tapOn:
    id: "salary_input"
- eraseText
- inputText: "96000"
- scrollUntilVisible:
    element:
      id: "salary_save_cta"
    direction: DOWN
- tapOn:
    id: "salary_save_cta"
# The nested collector returns at Mortgage's retained scroll position, where
# this CTA is visible and the top result anchor is offscreen.
- extendedWaitUntil:
    visible:
      id: "mortgage_enrich_profile_cta"
    timeout: 20000
- openLink: "mint:///invalidite"
- runFlow:
    when:
      visible: "Ouvrir"
    commands:
      - tapOn: "Ouvrir"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "disability_gap_ledger_facts"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "disability_gap_enrich_cta"
    direction: DOWN
- tapOn:
    id: "disability_gap_enrich_cta"
- assertVisible:
    id: "birth_year_input"
- tapOn:
    id: "birth_year_input"
- eraseText
- inputText: "1800"
- scrollUntilVisible:
    element:
      id: "salary_save_cta"
    direction: DOWN
- tapOn:
    id: "salary_save_cta"
- assertVisible:
    id: "birth_year_input"
- tapOn:
    id: "data_block_cancel_return_cta"
- assertVisible:
    id: "disability_gap_ledger_facts"
