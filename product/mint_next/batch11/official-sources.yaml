derived_product_safety_inferences:
  - id: provider_rows_prevent_beginner_mental_sum
    reasoning: Each certificate is provider-scoped while the person's complete fact spans every provider; local addition reduces omission and arithmetic error.
    classification: product_safety_inference_not_direct_official_quote
    source_ids: [estv_circular_18a, estv_form_21_edp_notice]
  - id: all_provider_confirmation_required
    reasoning: A positive subtotal from one provider cannot prove completeness when several recognized providers may exist.
    classification: product_safety_inference_not_direct_official_quote
    source_ids: [estv_circular_18a, estv_form_21_edp_notice]
  - id: exact_minor_units_are_working_storage_not_tax_form_rounding
    reasoning: Exact deterministic local parsing prevents float drift; whole-franc tax declaration rounding is a separate future transformation.
    classification: product_safety_inference_not_direct_official_quote
    source_ids: [estv_form_21_edp_2026]
  - id: zero_after_yes_is_a_contradiction
    reasoning: A prior explicit positive credit status and a zero amount cannot both be canonical; product must ask for correction instead of guessing.
    classification: product_safety_inference_not_direct_official_quote
    source_ids: [estv_circular_18a]

