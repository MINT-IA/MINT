known_rejections:
  - id: FIGMA-3A-001
    severity: P1
    screen_id: "3:4"
    problem: The initial question preselects “Non”, inventing a user fact.
    required_fix: Render all answers unselected and keep continue disabled until an explicit choice.
  - id: FIGMA-3A-002
    severity: P2
    screen_ids: ["3:4", "3:5", "3:6"]
    problem: Several top-bar labels are text-sized rather than explicit 44px touch targets.
    required_fix: Wrap every back, disclosure, and safe-exit control in a minimum 44x44 target.
  - id: FIGMA-3A-003
    severity: P1
    screen_ids: ["3:4", "3:5", "3:6"]
    problem: Fixed 390x844 clipped frames do not prove 320px or Dynamic Type reflow.
    required_fix: Define scroll-safe responsive behavior and prove FR/DE at 320px with text scales 1.3 and 2.0.
  - id: FIGMA-3A-004
    severity: P2
    screen_ids: ["3:4", "3:5", "3:6"]
    problem: Coral and menthe-deep micro-label combinations fail 4.5:1 contrast at 11px.
    required_fix: Darken semantic label tokens or increase size/weight and attach measured ratios.
  - id: FIGMA-3A-005
    severity: P2
    screen_ids: ["3:4", "3:5", "3:6"]
    problem: Fixed content widths and long labels do not prove six-language expansion.
    required_fix: Use wrapping auto-layout and capture all six locales, including German at 320px.
  - id: FIGMA-3A-006
    severity: P2
    screen_id: "3:6"
    problem: “Commencer doucement” does not name the promised action.
    required_fix: Rename to “Commencer mon calcul” and state that canton and income are requested first.
  - id: FIGMA-3A-007
    severity: P2
    screen_id: "3:5"
    problem: The contribution split relies on color without an explicit semantic reading order.
    required_fix: Add a non-color legend and an accessible sentence covering 7’258, 5’154 and illustrative 2’104 CHF.
  - id: FIGMA-3A-008
    severity: P2
    screen_id: "3:4"
    problem: “Marge fiscale à explorer” assumes financial vocabulary the target audience may not know.
    required_fix: Say “Pour savoir si tu peux encore réduire tes impôts cette année — rien de plus.”
  - id: FIGMA-3A-009
    severity: P2
    screen_id: "3:4"
    problem: Adjacent upper blocks have no rhythmic gaps while unused space accumulates below.
    required_fix: Add intentional 8–16px gaps between title, question, purpose and answers; reduce residual spacer.
  - id: FIGMA-3A-010
    severity: P2
    screen_id: "3:5"
    problem: Net effort and estimated tax reduction have equal hierarchy, weakening the teaching point.
    required_fix: Make “environ 2’104 CHF d’impôts en moins dans cet exemple” the memorable hero while retaining the estimate warning.
  - id: FIGMA-3A-011
    severity: P2
    screen_id: "3:6"
    problem: The green summary resembles a CTA and competes with the black primary action.
    required_fix: Label the green surface “Ton choix” as non-interactive and use one explicit primary CTA.

