chat:
  allowed_action_ids: &id001
  - open_relevant_question
  - leave_question
  - use_my_numbers
  - leave_example
  - compare_scenarios
  - leave_inputs
  - see_receipt
  - correct_inputs
  - choose_action
  - back_to_comparison
  - finish_from_receipt
  - resume_saved
  - return_today
  - explain_simply
  - show_contextual_example
  - expert_details_now
  - return_today_without_pressure
  - choose_reminder
  - dismiss_suggestion
  - change_subject
  forbidden:
  - invent_route
  - invent_calculation
  - mutate_hidden_state
  continuity: same_decision_id_and_receipt_inside_or_outside_chat
  action_policy:
    read_only: []
    navigation_only:
    - open_relevant_question
    - see_receipt
    - back_to_comparison
    - return_today
    - explain_simply
    - show_contextual_example
    - expert_details_now
    - return_today_without_pressure
    - change_subject
    - leave_question
    requires_explicit_user_confirmation:
    - use_my_numbers
    - leave_example
    - compare_scenarios
    - leave_inputs
    - correct_inputs
    - choose_action
    - finish_from_receipt
    - resume_saved
    - choose_reminder
    - dismiss_suggestion
    allowed_data_effects:
    - none
    - explicit_save_or_edit
    authorization: same_authenticated_user_and_registered_decision_context
    continuity_fields:
    - decision_id
    - input_version
    - assumption_version
    - source_set_version
schema_version: 1
decision_template:
  applies_to_decision_ids:
  - stability_first
  - salary_protection
  - annual_tax
  - pillar_3a
  - free_investing
  - couple_change
  - child_or_dependent
  - work_incapacity
  - unemployment_pause
  - employer_change
  - self_employment
  - home_purchase
  - lpp_buyback
  - separation_divorce
  - inheritance_received
  - retirement_prepare
  - retirement_live
  - estate_incapacity
  binding_contract: decision_id persists across every node, edge, correction, chat turn and receipt
  required_context:
  - decision_id
  - input_version
  - assumption_version
  - source_set_version
  unbound_decision_behavior: not_reachable
chat_action_ids: *id001
learning_variants:
  planning:
    example_intent: CHF 100 before/after
    tone: neutral
  urgent:
    example_intent: time_until_cash_shortfall
    tone: calm_direct
  protection:
    example_intent: income_timeline_and_gap
    tone: reassuring_non_sales
  sensitive_life_event:
    example_intent: options_and_next_safe_step_without_trivializing_amount
    tone: empathetic_non_infantilizing
