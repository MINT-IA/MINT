schema_version: 1
status: draft_unproven
promotion_receipt: null
work_tracking:
  system: beads
  id: MINT_nosync-qoq
  expected_live_status: in_progress
trust_semantics_authority:
  canonical_machine_sources:
  - batch.yaml
  - formula_contracts.yaml
  human_view:
    path: README.md
    role: non_authoritative_exact_human_view
    canonical_machine_fields_win: true
    free_form_semantic_extension: forbidden
principles:
- event_triggered_not_age_timeline
- survival_before_optimization
- beginner_safe_not_beginner_labeled
- one_consequence_one_action
- expert_depth_in_one_gesture
- route_screen_state_decision_are_distinct
- chat_may_only_emit_registered_actions
- legacy_preserved_behind_explicit_adapters
scope:
  includes:
  - canonical_architecture_registries
  - generated_views
  - mechanical_graph_guard
  - legacy_reuse_classification
  - untrusted_separate_context_advisory_reports
  excludes:
  - flutter_product
  - backend_product
  - legacy_route_rewrite
  - production_api
  - personalized_product_recommendation
  - user_validation_claim
promotion:
  author_cannot_approve: true
  trust_boundary:
    trust_basis: deterministic_evidence_plus_separate_promotion_gate
    external_attestation: absent
    cross_provider_review: absent
    cross_provider_review_scope: diversity_only_not_authenticated_or_cryptographic_identity
    advisory_reports: untrusted_issue_discovery_only
    advisory_not_sufficient: true
  requires:
  - all_guards_pass
  - mutation_tests_pass
  - all_registries_complete
  - external_attestation_or_cross_provider_review
  - all_advisory_issues_reproduced_or_disposed_by_deterministic_evidence
  - exact_head_receipt
  - no_unresolved_canonical_conflicts
  never_sufficient:
  - author_summary
  - diagram_only
  - agent_claim
  - untrusted_advisory_report
  - cross_provider_identity_claim
  - unverified_source
