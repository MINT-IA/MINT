schema_version: 1
fail_closed_rules:
- no personalized output when a required input, source snapshot, jurisdiction, constant version or engine version is missing
- examples must be visibly synthetic and cannot be reused as personal data
- every output receipt exposes input date, assumptions, formula ID, engine version, source IDs, jurisdiction, confidence and expiry
- tax calculations separate federal, cantonal, communal and applicable church tax; they never extrapolate one locality to another
- nominal projections never present expected return as guaranteed and disclose fees, inflation treatment and adverse scenario
contracts:
- {id: stability_runway_v1, decision_id: stability_first, required_inputs: [income_expenses_liquidity, costly_debt], outputs: [essential_monthly_gap, liquidity_runway_months, costly_debt_cost], formula_ids: [cash_runway_v1, debt_apr_cost_v1], source_ids: [], engine_tier: L1}
- {id: salary_protection_v1, decision_id: salary_protection, required_inputs: [gross_net_salary, employment_status, social_insurance_coverage, lpp_certificate], outputs: [payroll_bridge, documented_protection_inventory, missing_coverages], formula_ids: [payroll_reconciliation_v1], source_ids: [ahv_iv_pension_system, fedlex_bvg_lpp], engine_tier: L2}
- {id: annual_tax_v1, decision_id: annual_tax, required_inputs: [residency_canton_commune, household_status, tax_year, taxable_income_wealth, deductions_inventory, taxation_regime, religious_affiliation], outputs: [baseline_tax, marginal_tax_delta, net_cash_cost, unresolved_deductions], formula_ids: [jurisdiction_tax_delta_v1], source_ids: [estv_income_tax, cantonal_tax_authority], engine_tier: L2}
