review_dimensions:
  - id: information_architecture_closure
    question: Are every declared node, edge, action, state, fallback, and terminal outcome closed without dead routes?
  - id: beginner_comprehension_hypotheses
    question: Are beginner-first simplifications explicit hypotheses with falsification gates rather than claims of comprehension?
  - id: swiss_life_coverage
    question: Are material Swiss life events and arbitrages represented or explicitly blocking without claiming financial completeness?
  - id: formula_and_source_boundaries
    question: Do all formulas and official-source assertions remain unimplemented or unverified where evidence is absent?
  - id: regulatory_boundaries
    question: Are advice, intermediation, data-protection, and outsourcing boundaries explicit without a FINMA or legal-compliance claim?
  - id: legacy_reuse_and_preservation
    question: Is every reuse item candidate, reject, or unknown with no destructive coupling to the legacy runtime?
  - id: trust_and_promotion_integrity
    question: Can any prose, metadata, history rewrite, prompt injection, or self-attestation bypass the declared promotion gate?
