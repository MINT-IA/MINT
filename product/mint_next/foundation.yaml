schema_version: 1
status: draft_unproven
bead: MINT_nosync-9kv
work_tracking:
  system: beads
  id: MINT_nosync-9kv
  captured_status: in_progress
  snapshot: product/mint_next/evidence/bead-MINT_nosync-9kv.yaml
  journey_os: not_applicable_foundation_has_no_user_route

promise: >-
  Rebuild MINT one observable Swiss financial decision at a time; a batch is
  not complete until current-state evidence proves the user outcome.

required_capabilities:
  product_lead: {agent: mint-lead, file: .claude/agents/mint-lead.md}
  experience: {agent: mint-experience, file: .claude/agents/mint-experience.md}
  mobile: {agent: mint-mobile, file: .claude/agents/mint-mobile.md}
  backend_calculations: {agent: mint-backend, file: .claude/agents/mint-backend.md}
  swiss_domain: {agent: mint-swiss-brain, file: .claude/agents/mint-swiss-brain.md}
  quality_privacy_security: {agent: mint-quality-gate, file: .claude/agents/mint-quality-gate.md}
  data_integrations: {agent: mint-integrations-security, file: .claude/agents/mint-integrations-security.md}

skills:
  operating_gates: {owner: mint-quality-gate, file: .agents/skills/mint-operating-gates/SKILL.md}
  flutter: {owner: mint-mobile, file: .agents/skills/mint-flutter-dev/SKILL.md}
  backend: {owner: mint-backend, file: .agents/skills/mint-backend-dev/SKILL.md}
  swiss_compliance: {owner: mint-swiss-brain, file: .agents/skills/mint-swiss-compliance/SKILL.md}
  journey_design: {owner: mint-experience, file: .agents/skills/mint-journey-design/SKILL.md}
  runtime_walkthrough: {owner: mint-quality-gate, file: .agents/skills/mint-runtime-walkthrough/SKILL.md}
  financial_calculation_contract: {owner: mint-swiss-brain, file: .agents/skills/mint-financial-calculation-contract/SKILL.md}
  consent_and_provenance: {owner: mint-integrations-security, file: .agents/skills/mint-consent-and-provenance/SKILL.md}
  experience_critique: {owner: mint-experience, file: .agents/skills/mint-experience-critique/SKILL.md}
  regulatory_boundary: {owner: mint-swiss-brain, file: .agents/skills/mint-regulatory-boundary/SKILL.md}
  prompt_eval: {owner: mint-quality-gate, file: .agents/skills/mint-prompt-eval/SKILL.md}

tools:
  flutter:
    role: iOS and Android product implementation
    owner: mint-mobile
    state: repo_configured
    data_class: synthetic_and_user_financial_ui
    proof: apps/mobile/pubspec.yaml
  beads:
    role: durable work, dependencies, blockers, and ownership
    owner: mint-lead
    state: locally_verified
    data_class: project_metadata_no_user_financial_data
    proof: product/mint_next/evidence/bead-MINT_nosync-9kv.yaml
  engram:
    role: prior decisions, discoveries, preferences, and session recovery
    owner: mint-lead
    state: locally_verified
    data_class: project_memory_no_user_financial_data
    proof: product/mint_next/evidence/engram-fun2-20260801.yaml
  mermaid:
    role: generated views of journeys, routes, data, and system boundaries
    owner: mint-lead
    state: repo_configured
    data_class: generated_project_metadata
    proof: tools/checks/mermaid_render_guard.py
  maestro:
    role: small black-box smoke suite for critical user journeys
    owner: mint-quality-gate
    state: repo_configured
    data_class: synthetic_runtime_evidence
    proof: tools/checks/maestro_locator_audit.py
  patrol:
    role: native mobile boundaries such as permissions, files, biometrics, and notifications
    owner: mint-quality-gate
    state: repo_configured
    data_class: synthetic_runtime_evidence
    proof: apps/mobile/pubspec.yaml
  sentry:
    role: privacy-filtered crash and runtime error evidence
    owner: mint-quality-gate
    state: repo_configured
    data_class: redacted_operational_telemetry
    proof: tools/checks/verify_sentry_init.py
  railway:
    role: current synthetic-data staging and existing runtime delivery path
    owner: mint-backend
    state: existing_path_not_reverified_in_batch0
    data_class: synthetic_staging_only
  infomaniak:
    role: candidate Swiss production data plane pending an operational spike
    owner: mint-integrations-security
    state: unconfigured_candidate
    data_class: no_data_until_spike_approved
  vercel:
    role: optional previews and non-sensitive web surfaces, never the default financial data plane
    owner: mint-experience
    state: available_not_reverified_in_batch0
    data_class: public_or_synthetic_only
  hugging_face:
    role: optional measured model, embedding, and evaluation experiments only
    owner: mint-integrations-security
    state: unconfigured_optional
    data_class: public_corpus_or_synthetic_only

memory:
  source_of_truth: false
  live_database_env: ENGRAM_DATA_DIR
  fun2_mode: encrypted_backup
  fun2_bundle_env: MINT_ENGRAM_VAULT_BUNDLE
  runbook: product/mint_next/runbooks/engram-fun2.md
  latest_evidence: product/mint_next/evidence/engram-fun2-20260801.yaml
  cutover_requires:
    - coordinated_agent_shutdown
    - encrypted_volume_mounted
    - database_restore_drill
    - rollback_proof
    - independent_review

batch_policy:
  status_default: unproven
  author_cannot_approve: true
  one_user_outcome: true
  one_owner: true
  small_revertable_diff: true
  runtime_before_completion: true

completion_evidence:
  allowed:
    - deterministic_check
    - current_state_inspection
    - independent_adversarial_review
    - runtime_proof
    - user_research
  never_sufficient:
    - agent_summary
    - author_claim
    - plan_status
    - memory_only
    - unit_tests_for_end_to_end_claim

model_roles:
  fable: long-horizon orchestration after Claude availability returns
  opus: ambiguous product/domain critique and adversarial review
  codex_sol: bounded implementation, command execution, debugging, and independent verification
  rule: models_do_not_vote_evidence_decides

prompt_evals:
  owner: mint-quality-gate
  policy: product/mint_next/contracts/llm-eval.yaml
  applies_to: every_llm_or_rag_behavior_change
  required_artifacts: [versioned_prompt, immutable_golden_corpus, deterministic_and_judged_metrics, regression_report]
  promotion_rule: no_regression_on_safety_privacy_compliance_and_measured_improvement
  self_approval: forbidden

rebuild_strategy:
  repository: existing_monorepo
  mobile_target: sibling_app_after_batch0_approval
  migration: reuse_adapt_rewrite_retire
  backend: modular_monolith
  data_strategy: document_first_api_enhanced
  llm_boundary: explanation_and_orchestration_only
  calculations: deterministic_versioned_and_provenanced
