error_and_focus_order:
  continue:
    inherit_exactly: parent_contract.graph.fact_contributed_amount.controls.continue.failure_order
    missing_provider_step: present_but_dormant_until_missing_provider_subsystem_exists
    narrowing_or_reordering: forbidden
  unresolved_error:
    placement: inline_next_to_exact_row_doubt_trigger
    semantics: described_by_and_polite_live_announcement
    action: scroll_then_focus_exact_row_doubt_trigger

accessibility:
  all_displayed_actions_minimum_target: 48x48
  accessible_name_equals_visible_label_for_text_actions: except_help_actions_extend_visible_label_with_row_year_and_provider_total_verification_status
  doubt_accessible_name: visible_label_plus_visual_row_index_and_selected_tax_year
  help_actions_accessible_names: unique_and_include_selected_provider_row_context_without_exposing_private_provider_name
  help_heading: unique_semantic_heading_temporarily_focused_and_skip_traversal
  help_action_order: [provider_total_obtained, one_provider_refunded_when_guard_true, all_providers_zero, education, rules_disclosure, back, safe_exit]
  keyboard_visual_order: identical
  no_color_only_state: true
  reduced_motion: true

privacy_and_lifecycle:
  local_ephemeral_only: true
  persistence_network_analytics_crash_breadcrumbs: forbidden
  local_inputs:
    disable_platform_learning_and_suggestions: true
  ttl_semantics:
    duration: 30_minutes
    mode: sliding_since_last_pointer_or_keyboard_activity
    activity_resets_deadline_without_persisting_or_logging: true
  purge_events: [status_no_or_unknown, tax_year_change, safe_exit_leave, education_completion_or_reference_save, app_kill_or_ttl_expiry]
  education_completion_or_reference_save_in_batch16_runtime: not_rendered_future_canonical_event_only
  purged_fields:
    inherit_exactly: parent_contract.state_contract.personal_state_purge_fields
    additions: [unresolved_origin_tokens, unresolved_sibling_action_tokens, captured_remove_tokens]
    narrowing_forbidden: true
    duplicate_with_inherited_list: forbidden
  callbacks_after_purge: no_op_across_session_and_tax_year

