schema_version: 1
batch: 16
status: contract_accepted_runtime_unimplemented_product_forbidden
title: Classification par ligne et résolution d'un montant 3a douteux

authority:
  parent_contract: product/mint_next/batch13/multi-provider-navigation-contract.yaml
  parent_contract_sha256: c609f4038842fdc51173e3009f95f8fa1fbd6351a87a24241aa2b3997ac6b282
  prerequisite_commits:
    multi_provider_amount_harness: 1579ea8f3dce299a2180667a0594a3b711ea803e
    reversible_provider_removal: 1c7c18ccd
  runtime_surface: hidden_design_lab_harness_only
  product_promotion: forbidden

user_outcome:
  statement: Une personne peut signaler qu'un montant contient peut-être autre chose que des cotisations ordinaires, comprendre quoi vérifier, puis revenir exactement au bon endroit sans que MINT estime ou valide ce montant.
  beginner_rule: Une décision visible à la fois; aucun calcul mental demandé.

scope:
  included:
    - row_classification_state_machine
    - exact_row_doubt_origin
    - unresolved_help_complete_navigation
    - provider_reported_ordinary_total_obtained_resolution
    - one_provider_fully_refunded_resolution
    - explicit_all_providers_zero_correction
    - existing_education_boundary_back_safe_exit_and_terminal_leave_purge
    - six_locale_copy_and_accessibility
    - hostile_stale_callback_proofs
  excluded:
    - missing_provider_declaration_or_resolution
    - batch12_entry_migration
    - scan_api_llm_or_persistence
    - tax_deduction_ceiling_saving_or_recommendation
    - provider_identity_matching
    - estimation_subtraction_or_automatic_zero
    - product_route_or_testflight_promotion

why_full_help_is_atomic:
  decision: All exposed exits of unresolved help ship together.
  reason: Omitting refund or all-zero recovery traps a real user or forces a false amount; an isolated button or help page would be an uncabled facade.
  swiss_review_constraint: Copies never imply that a refund is a contribution, that a surrender value is an ordinary contribution, or that MINT may infer zero.

row_state_machine:
  states: [unreviewed, confirmed_ordinary, unresolved]
  initial: unreviewed
  amount_edit: unreviewed
  doubt_activation: unresolved
  successful_global_review: confirmed_ordinary_for_every_active_row
  global_review_unchecked: unreviewed_for_every_active_row
  remove_and_undo: preserve_exact_row_classification
  finalize_and_terminal_purge: erase_classification_and_all_related_tokens
  unresolved_amount:
    subtotal: included_in_provisional_subtotal_with_to_verify_label
    canonical_total: null
    global_review: blocked
    continue: blocked
    canton_route: forbidden

origin_contract:
  identity: opaque_session_row_id_plus_session_epoch_plus_row_generation_plus_one_shot_origin_nonce
  registry: at_most_one_current_unresolved_help_origin_per_row_generation_and_session
  successful_doubt_activation:
    atomic: true
    order:
      - consume_previous_origin_and_every_previous_sibling_action_token_for_that_row
      - set_exact_row_unresolved_and_clear_review_commit_downstream
      - capture_exact_current_remove_token_R_g
      - create_fresh_never_reused_origin_nonce_and_distinct_sibling_action_tokens
      - route_help
  captured_on: successful_doubt_activation
  valid_only_when: same_session_same_generation_same_active_unresolved_row
  preservation_without_consumption: [help_back_or_system_back, education_back, safe_exit_cancel_resume_or_system_back, contribution_correction_back_or_system_back]
  successful_terminal_action_consumes_atomically:
    - origin_nonce
    - every_sibling_help_action_token
  invalidation_before_mutation: [amount_edit, provider_name_edit, external_remove, undo, finalize, new_doubt_activation, tax_year_change, status_terminal_choice, leave, education_completion_or_reference_save, app_kill_or_ttl_expiry]
  refunded_origin_transaction:
    atomic_order:
      - validate_origin_refund_sibling_and_exact_captured_R_g_without_consuming_any
      - consume_origin_and_every_sibling
      - consume_exact_R_g_via_batch15_contentful_remove
      - create_tombstone_generation_and_fresh_U_and_F
      - retire_every_captured_reference
    failure_at_any_validation: no_op_and_consume_nothing
    external_remove_rule: invalidate_origin_and_siblings_before_external_remove_mutation
  new_activation_after_invalidation: creates_fresh_never_reused_nonce_and_siblings
  stale_wrong_repeated_or_retired_activation: no_op_never_retarget_recreate_or_mutate_with_polite_non_sensitive_announcement
  first_row_fallback: forbidden

navigation:
  editor_to_unresolved_help:
    trigger: row_amount_classification_doubt
    mutation_order:
      - set_exact_origin_row_unresolved
      - clear_global_review_commit_and_downstream
      - capture_one_shot_origin
      - route_unresolved_help
    preserves: [all_rows, tombstones, raw_inputs, provisional_subtotal, disclosures]
    entry_focus: temporary_help_heading_outside_tab_order

  unresolved_help_to_provider_total_obtained:
    visible_label_intent: i_obtained_the_provider_reported_ordinary_total_and_understand_mint_has_not_verified_it
    compact_visible_label: short_ordinary_total_obtained
    preceding_body_requirement: mint_has_not_verified_this_total_choose_only_if_sure
    accessible_name_requirement: short_visible_label_plus_not_verified_warning_plus_row_and_tax_year
    guard: exact_origin_is_same_active_unresolved_generation
    instruction_if_provider_gave_different_total: edit_the_amount_field_after_return
    mutation: atomically_consume_origin_and_siblings_then_unresolved_to_unreviewed_keep_amount_unchanged_keep_canonical_null
    destination: editor
    focus: exact_origin_row_amount
    automatic_confirmation: forbidden

  unresolved_help_to_one_provider_refunded:
    visible_label_intent: remove_only_this_fully_refunded_provider
    compact_visible_label: full_refund_from_this_provider
    guard: exact_origin_is_same_active_unresolved_generation_and_origin_is_contentful_and_origin_has_positive_parse_valid_amount_and_another_active_provider_has_positive_parse_valid_amount
    operation: atomically_consume_origin_and_siblings_then_reuse_exact_captured_batch15_contentful_remove_token_R_g
    preserves: [all_other_rows, their_exact_order, their_raw_values, their_classification]
    destination: editor
    focus: exact_origin_tombstone_undo
    announcement: updated_provisional_subtotal
    repeated_activation: no_op

  unresolved_help_to_all_zero_correction:
    visible_label_intent: nothing_remained_credited_across_all_providers
    activation_requires: explicit_person_declaration
    destination: contribution_status_correction
    restores_previous_selection: yes
    mutation_before_person_chooses: clear_review_commit_and_downstream_only
    automatic_zero_or_status_change: forbidden
    choose_yes: return_editor_preserve_rows_keep_origin_row_unresolved_keep_origin_and_focus_origin_doubt_trigger
    choose_no_or_unknown: terminally_purge_then_follow_inherited_route
    back_or_system_back: return_same_unresolved_help_same_origin_focus_all_zero_action_without_mutation
    safe_exit:
      cancel_resume_or_system_back: return_same_correction_node_same_origin_focus_safe_exit_trigger
      leave: terminally_purge_before_dismiss

  unresolved_help_to_education:
    destination: existing_head_education_explanation_boundary_only
    canonical_total: null
    runtime_authority:
      path: product/mint_next/batch7/design_lab/lib/design_lab_app.dart
      symbol: _EducationBoundary
      git_blob_sha1: 0a89cf47f5f6d35c741a7f65ba824fe6e9c1052c
    displayed_actions: [explicit_back, global_open_safe_exit]
    explicit_back_or_system_back: return_same_unresolved_help_same_origin_focus_education_trigger
    safe_exit_cancel_resume_or_system_back: return_same_education_boundary_same_origin_focus_safe_exit_trigger
    safe_exit_leave: terminally_purge_before_dismiss
    full_batch13_teach_back_correction_next_action_reference_subgraph: not_implemented_outside_batch16_and_not_claimed_as_runtime

  unresolved_help_rules_disclosure:
    visible_label_intent: understand_rules_for_this_exact_row_and_selected_tax_year
    mutation: none
    destination: same_unresolved_help_same_origin
    focus: disclosure_trigger
    accessible_name: visible_label_plus_selected_provider_row_context_without_private_provider_name

  unresolved_help_back_or_system_back:
    destination: editor
    mutation: none
    classification: remains_unresolved
    focus: exact_origin_row_doubt_trigger

  unresolved_help_safe_exit:
    modal: heading_focus_trap_and_accessible_modal_semantics
    cancel_resume_or_system_back: restore_same_help_mode_origin_and_focus_safe_exit_trigger
    leave: terminally_purge_before_dismiss

  inherited_editor_and_canton_edges:
    inheritance_rule: only_controls_listed_in_runtime_manifest_at_head_are_claimed_as_rendered
    local_override: unresolved_blocks_global_review_continue_and_canton

runtime_manifest_at_head_1c7c18ccd:
