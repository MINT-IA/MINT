schema_version: 1
status: candidate_for_swiss_roast
selected_tax_year_placeholder: '{taxYear}'
intents:
  batch16AnnualOrdinaryTotalMeaning:
    fr: Saisis une seule fois, pour chaque prestataire, le total annuel des cotisations ordinaires indiqué sur son attestation annuelle.
    en: Enter once, for each provider, the annual total of ordinary contributions shown on its annual certificate.
    de: Erfasse für jeden Anbieter einmal den Jahrestotalbetrag der ordentlichen Beiträge aus seiner Jahresbescheinigung.
    it: Inserisci una sola volta, per ogni offerente, il totale annuo dei contributi ordinari indicato nell’attestazione annuale.
    es: Introduce una sola vez, para cada proveedor, el total anual de las aportaciones ordinarias indicado en su certificado anual.
    pt: Introduz uma única vez, para cada prestador, o total anual das contribuições ordinárias indicado no certificado anual.
  batch16ActuallyCreditedMeaning:
    fr: Compte uniquement ce qui a réellement été crédité pour {taxYear}, pas ce qui était prévu, envoyé ou débité.
    en: Count only what was actually credited for {taxYear}, not what was planned, sent or debited.
    de: Zähle nur, was für {taxYear} tatsächlich gutgeschrieben wurde, nicht was geplant, überwiesen oder belastet wurde.
    it: Considera solo quanto è stato effettivamente accreditato per il {taxYear}, non quanto era previsto, inviato o addebitato.
    es: Cuenta solo lo que se abonó realmente para {taxYear}, no lo que estaba previsto, se envió o se cargó.
    pt: Conta apenas o que foi efetivamente creditado para {taxYear}, não o que estava previsto, foi enviado ou debitado.
  batch16ExcludedMovementsMeaning:
    fr: N’inclus pas les transferts, rachats rétroactifs, mouvements en attente, remboursements ni gains de placement.
    en: Do not include transfers, retroactive buy-ins, pending movements, refunds or investment gains.
    de: Schliesse Überträge, rückwirkende Einkäufe, ausstehende Bewegungen, Rückerstattungen und Anlagegewinne aus.
    it: Non includere trasferimenti, versamenti retroattivi, movimenti in sospeso, rimborsi o guadagni d’investimento.
    es: No incluyas transferencias, aportaciones retroactivas, movimientos pendientes, reembolsos ni ganancias de inversión.
    pt: Não incluas transferências, contribuições retroativas, movimentos pendentes, reembolsos nem ganhos de investimento.
  batch16ProviderConfirmedNetMeaning:
    fr: Après une correction ou un remboursement, demande au prestataire son total net confirmé des cotisations ordinaires; ne soustrais rien toi-même.
    en: After a correction or refund, ask the provider for its confirmed net total of ordinary contributions; do not subtract anything yourself.
    de: Frage den Anbieter nach einer Korrektur oder Rückerstattung nach dem bestätigten Nettototal der ordentlichen Beiträge; ziehe selbst nichts ab.
    it: Dopo una correzione o un rimborso, chiedi all’offerente il totale netto confermato dei contributi ordinari; non sottrarre nulla autonomamente.
    es: Tras una corrección o un reembolso, pide al proveedor el total neto confirmado de las aportaciones ordinarias; no restes nada por tu cuenta.
    pt: Após uma correção ou um reembolso, pede ao prestador o total líquido confirmado das contribuições ordinárias; não subtraias nada por tua conta.
  batch16InsuranceCertificateMeaning:
    fr: Pour une assurance, utilise l’attestation annuelle; n’utilise ni la valeur de rachat ni la répartition risque/épargne.
    en: For insurance, use the annual certificate; use neither the surrender value nor the risk/savings split.
    de: Verwende bei einer Versicherung die Jahresbescheinigung; nutze weder den Rückkaufswert noch die Aufteilung in Risiko und Sparen.
    it: Per un’assicurazione usa l’attestazione annuale; non usare né il valore di riscatto né la ripartizione rischio/risparmio.
    es: Para un seguro, utiliza el certificado anual; no uses ni el valor de rescate ni el reparto entre riesgo y ahorro.
    pt: Para um seguro, utiliza o certificado anual; não uses nem o valor de resgate nem a repartição entre risco e poupança.
  batch16RefundVsAllZeroMeaning:
    fr: Le remboursement intégral d’un prestataire ne signifie pas que tous les prestataires sont à zéro.
    en: A full refund from one provider does not mean that all providers are at zero.
    de: Eine vollständige Rückerstattung eines Anbieters bedeutet nicht, dass bei allen Anbietern null verbleibt.
    it: Il rimborso integrale di un offerente non significa che tutti gli offerenti siano a zero.
    es: El reembolso íntegro de un proveedor no significa que todos los proveedores estén a cero.
    pt: O reembolso integral de um prestador não significa que todos os prestadores estejam a zero.
  batch16MintNotVerifiedMeaning:
    fr: MINT n’a pas vérifié le montant saisi.
    en: MINT has not verified the amount entered.
    de: MINT hat den eingegebenen Betrag nicht überprüft.
    it: MINT non ha verificato l’importo inserito.
    es: MINT no ha verificado el importe introducido.
    pt: A MINT não verificou o montante introduzido.
  batch16NoTaxAdviceMeaning:
    fr: Cette étape ne produit ni résultat fiscal ni recommandation.
    en: This step produces neither a tax result nor a recommendation.
    de: Dieser Schritt liefert weder ein Steuerergebnis noch eine Empfehlung.
    it: Questo passaggio non produce né un risultato fiscale né una raccomandazione.
    es: Este paso no produce ni un resultado fiscal ni una recomendación.
    pt: Este passo não produz qualquer resultado fiscal nem recomendação.
