schema_version: 2
status: accepted_written_contract_runtime_forbidden
journey_id: swiss_3a_question_to_next_action
audience: beginner_low_financial_and_numeracy_literacy
# R2 = fact_lieu. COMMUNE DIRECTE model (Julien decision 2026-08-04, AskUserQuestion):
# fact_canton + fact_commune FUSE into ONE node. The user answers "Où habites-tu ?"
# with a NATIONAL commune search; the canton is DERIVED from the chosen commune and
# shown, never asked first. One screen less, zero redundancy. Supersedes the earlier
# canton-scoped two-node draft (reachable in reflog at 4a633b404).
model: commune_directe_single_node

navigation_amendment:
  # To fold into product/mint_next/batch6/navigation.yaml via a governed revision.
  fuses: [fact_canton, fact_commune]
  into: fact_lieu
  decision_trace: julien_askuserquestion_2026_08_04_commune_directe
  canton_node_status: removed_as_a_standalone_question_canton_is_now_derived
  authority_note: this_contract_amends_batch6_navigation_it_may_not_add_or_remove_other_routes

authority:
  canonical_navigation: product/mint_next/batch6/navigation.yaml
  source_of_truth_rule: this_contract_amends_fact_lieu_and_folds_canton_into_it_but_may_not_touch_other_batch6_routes
  runtime_change: forbidden
  product_promotion: forbidden
  supersedes:
    # SUPERSESSION by PIN (regle13): R2 supersedes R1-green without live re-attestation.
    r1_green_gate: product/mint_next/batch19/r1-green-gate.yaml
    r1_green_accepted_commit: '584702094'
    r1_green_attestation_run: https://github.com/MINT-IA/MINT/actions/runs/30916749754
    r1_red_acceptance_commit: d7461aab184125c11ec78c8d0f269c23a1236c7b
    no_live_reattestation_of_r1: true

dataset_perimeter:
  # finding (c) — clarify test fixture vs production coverage so no reviewer mistakes the sealed
  # subset for the shipping scope.
  production_search_scope: national_all_swiss_communes_circa_2100
  sealed_test_dataset: product/mint_next/batch20/commune-dataset.yaml
  sealed_test_dataset_is: a_representative_reviewed_subset_BE_BS_FR_JU_not_the_full_national_set
  why_a_subset: exercises_render_cap_overflow_small_canton_bilingual_variants_and_a_cross_canton_tax_year_edge_deterministically
  copy_and_mockups_target: the_national_production_experience_illustrations_may_name_communes_outside_the_sealed_subset
  no_claim_that_the_subset_is_the_product_coverage: true

perimeter_decisions_closed:
  selection_pattern: national_commune_search_first   # ~2100 communes; a wheel is unfit at that scale
  canton_is_derived_not_asked: true                  # commune -> canton is a total function (a commune belongs to one canton)
  canton_shown_on_every_result_and_after_selection: true   # "Morat — Fribourg"
  homonym_disambiguation: official_bfs_suffix_plus_secondary_npa   # "Bargen (BE)"; NPA secondary text disambiguates further
  results_render_cap: 50
  results_scrollable: true
  # amendement Julien 2026-08-04 : molette-canton retirée d'ici. Voir product_decision_no_wheel_here.
  not_found_fallback_pattern: no_match_check_spelling_plus_a_discreet_help_link_escalating_to_r3_complex_situation   # remplace la molette
  canton_is_pure_derived_display_no_canton_input_control_on_this_screen: true
  npa_display_only_and_matchable_never_committed: true
  committed_key: bfs_ofs_gemeindenummer   # national-unique; canton derived from it
  border_contrast_min_ratio: 3.0
  query_clamp_enforced_at_state_boundary: true

# privacy_copy_rule REMOVED (product decision 2026-08-05): privacy claims derive
# from the screen's data contract; locality claims are abolished everywhere. The
# search query stays device-local as a DATA fact (see runtime_contract query_storage
# below), but the screen no longer whispers an unsolicited on-device claim — a
# security fact is consulted on demand, not chuchoté. The committed commune joins the
# profile, so any on-device claim about the choice would have been a lie; removing the
# claim removes the question it created instead of building trust.

slice:
  entry_preconditions:
    shared: [tax_year_explicitly_selected, lpp_affiliation_yes]
  implemented_nodes: [fact_lieu]
  boundary_nodes: [fact_household]
  locales: [fr, en, de, es, it, pt]

human_outcome:
  question: Où habites-tu ?
  why_now: La commune de domicile situe l’imposition ; le canton s’en déduit et un
    impôt communal peut s’ajouter à l’impôt cantonal. Aucun résultat fiscal personnel
    n’est affiché ici.
  must_understand:
  # Amendement Julien 2026-08-04 : la question « Où habites-tu ? » porte seule le sens (pas de body) ;
  # le canton est PUR AFFICHAGE dérivé (jamais demandé, jamais une molette ici) ; la molette-canton
  # de secours est retirée de cet écran.
  - La question suffit : on cherche la commune de domicile fiscal, le canton s’en déduit et s’affiche, il n’est jamais demandé. L’anti-appareil (pas de GPS/NPA/locale) vit dans le contrat, pas dans une phrase à l’écran.
  - Si la commune est introuvable, ce n’est pas bloquant mais ce n’est pas une molette : l’état no_match invite à vérifier l’orthographe, et un lien d’aide discret escalade vers le chemin d’aide R3 (situation complexe) — seule sortie résiduelle.
  - Le choix est éphémère et corrigible avant tout calcul.
  canton_derivation: commune_to_canton_is_total_derived_from_the_reviewed_dataset_and_displayed_pure_display_never_asked_never_a_wheel_here
  next_small_action:
    selected: Continuer vers la collecte distincte du ménage.
    not_found: Vérifier l’orthographe, ou suivre le lien d’aide qui escalade vers le chemin R3 (situation complexe).

fact_contract:
  id: tax_applicable_commune_of_domicile_national_search_with_derived_canton_for_selected_tax_year
  provenance: explicit_user_declaration
  storage: ephemeral_until_committed_then_joins_profile   # search query stays local; committed commune joins profile
  initial_state: unset
  states: [unset, selected]   # amendement Julien 2026-08-04 : unknown_canton_only retiré (molette hors écran)
  committed_key: bfs_ofs_gemeindenummer
  derived_on_commit: canton_from_bfs
  selected_value_shape: one_reviewed_national_bfs_commune_number_valid_at_the_determining_date_with_its_derived_canton
  determining_date: jour_determinant_31_12_of_selected_tax_year
  coefficient_scope: political_commune_civil_multiplier_church_tax_excluded
  never_derive_commune_from:
  - gps_or_device_location
  - ip_address
  - postal_address_or_postcode
  - app_language_or_locale
  - profile_or_previous_answer
  - employer_or_provider_location
  - device_region_or_timezone
  forbidden_fallbacks:
  - canton_capital
  - first_list_item
  - most_populous_commune
  - previous_or_last_used_commune
  supported_case: one_ordinary_commune_of_domicile_in_switzerland_valid_at_the_determining_date
  not_found_semantics: no_match_state_prompts_spelling_check_and_offers_a_discreet_help_link_that_escalates_to_the_r3_complex_situation_help_path_never_a_wheel_never_a_forced_commune_never_a_canton_input
  no_commit_without_a_reviewed_commune: true   # amendement Julien 2026-08-04 : plus d'état canton-seul ; Continuer exige une commune

input_contract:
  presentation: national_search_required   # ~2100 communes; no full dump
  free_text_commits_a_fact: false
  no_preselection: true
  help_escalation_link_visible_in_no_match_only: true   # amendement Julien 2026-08-04 : remplace le contrôle unknown/molette
  selection_summary_persistent_and_visible_in_every_query_state: true
  result_shows_derived_canton: true          # "Morat — Fribourg" on every row
  disambiguation: official_bfs_suffix_on_name_plus_npa_secondary_text_also_matchable_never_committed
  results:
    render_cap: 50
    scrollable: true
    stable_localized_sort: true
    selected_row_marked_and_announced_when_in_results: true
    each_row_names_its_derived_canton: true
  post_commit_render: keep_query_and_filtered_results_mark_selected_row_show_derived_canton_keep_selection_summary
  search_behavior:
    query_storage: ephemeral_device_local_only_never_sent_never_committed
    maximum_code_points: 64
    maximum_code_points_enforced_at: state_mutation_boundary_and_input_formatter
    unicode_normalization: NFKC
    hyphen_and_space_insensitive: true
    reviewed_label_set_includes_official_variants_and_aliases: true   # Biel/Bienne, Fribourg/Freiburg
    matching: national_local_casefold_plus_diacritic_fold_prefix_or_boundary_substring_against_reviewed_commune_labels_and_official_npa_raw_query_preserved
    empty_query: prompt_to_type_a_commune_name_no_full_dump_example_placeholder
    no_match: named_empty_state_check_spelling_with_clear_search_action_and_a_discreet_help_link_escalating_to_r3   # amendement Julien 2026-08-04
    overflow_beyond_cap: named_status_with_total_match_count_refine_search_never_silent_truncate
    misspell_or_postcode_typer_recovery: find_by_name_or_follow_the_help_link_to_r3_no_dead_end   # molette retirée
    network_logging_analytics_platform_learning_autofill_clipboard: forbidden
    purge: same_30_min_leave_kill_and_restart_contract_as_personal_facts
  three_regions:
    pinned_header: search_field_and_count_status
    scrollable_middle: capped_results_each_naming_its_derived_canton_help_link_appears_here_in_no_match_only
    pinned_footer: continue_above_back_no_unknown_control

node_contracts:
  fact_lieu:
    arrival_focus: heading_not_auto_raised_keyboard
    required_copy_intents:
    - where_do_you_live_the_question_alone_carries_domicile_no_body_sentence   # amendement Julien 1
    - the_canton_is_derived_from_the_commune_and_shown_never_asked_first_never_a_scoping_header_never_a_wheel_here
    - commune_not_found_is_not_blocking_check_spelling_then_a_discreet_help_link_escalates_to_r3_the_only_residual_exit   # amendement Julien 2
    - commune_only_refines_it_does_not_produce_a_personal_result_here
    - choice_is_ephemeral_and_correctable
    - a_communal_tax_may_be_added_to_the_cantonal_tax_and_varies_by_commune_mechanism_neutral_no_coefficient_jargon
    - the_political_commune_is_the_tax_unit_parish_is_separate_church_tax_postal_locality_npa_has_no_fiscal_effect
    - excluding_church_tax_this_estimate_is_not_the_total_tax_burden
    - only_the_search_query_stays_on_device_the_committed_commune_joins_the_profile   # privacy_copy_rule
    teaching_mechanism:
      # Julien 2026-08-04 (ferme) : plus AUCUN pavé d'enseignement inline. Tout terme difficile est
      # tappable (marque discrète : souligné pointillé ou teinte sauge) et ouvre une feuille de
      # définition ultra-aérée (1 phrase + métaphore éventuelle, LSFin-safe). Réalise le
      # « glossaire vivant » de l'ADR navigation-compagnon (profondeur sur demande, par étages).
      pattern: tap_glossary_sheet_no_dense_inline_note
      dense_kind_note_removed: true   # fact_commune_kind_note supprimé de la copie
      concepts_are_glossary_entries: [impot_communal, commune_politique, jour_determinant, impot_ecclesiastique, npa]
      on_screen_anchors_minimal: communal_hint_carries_impot_communal_anchor_npa_secondary_carries_npa_anchor
      sheet_copy_intents: [one_plain_sentence, optional_fun_metaphor_lsfin_safe_never_a_promise_never_mocking]
      copy_source: product/mint_next/batch20/six-locale-copy.yaml#copy.{locale}.fact_commune_gloss_*
    coach_intent:
      # Julien 2026-08-04 : le LLM est navigateur ET monstrateur de widgets/graphs. Chaque écran et
      # widget du contrat porte un identifiant coach-invocable. EXIGENCE DE CONTRAT, NON IMPLÉMENTÉE EN R2.
      status: contract_requirement_not_implemented_in_r2
      invocable_id: fact_lieu
      three_paths_rule:   # règle des trois chemins de l'ADR navigation-compagnon
        declared_route: fact_lieu_in_batch6_navigation
        hub_reachable_within_taps: 2
        natural_language_intents: ["où suis-je imposé ?", "ma commune fiscale", "quel canton pour mes impôts ?"]
      coach_may_show_widget: communal_tax_impact_widget_grounded_on_this_fact_when_it_exists
      every_screen_and_widget_carries_a_coach_invocable_id: true
    controls:
      # amendement Julien 2026-08-04 : choose_unknown (molette canton) RETIRÉ de cet écran.
      choose_commune: {operation: atomically_commit_one_reviewed_national_bfs_number_and_its_derived_canton_without_routing}
      update_search_query: {operation: normalize_clamp_filter_national_commune_labels_without_route, storage: ephemeral_device_local_only}
      clear_search: {operation: clear_query_restore_example_prompt_preserve_selection_and_focus}
      help_escalation: {visible_in: no_match_state_only, operation: escalate_to_r3_complex_situation_help_path_without_committing_a_fact_or_a_canton, never_routes_in_r2: true}
      continue: {to: fact_household, route_guard: a_reviewed_commune_is_selected, activation: always_enabled_validation_dispatch, never_routes_in_r2: true}
      back: {operation: exact_history_back}
      open_safe_exit: {overlay: safe_exit}
    same_commune_reselect: idempotent_no_op_no_state_churn_selection_summary_unchanged
    forbidden:
    - default_or_recommended_commune
    - commune_or_canton_derived_from_location
    - asking_the_canton_before_the_commune
    - a_canton_wheel_or_any_canton_input_on_this_screen   # amendement Julien 2026-08-04
    - a_body_sentence_below_the_question   # amendement Julien 2026-08-04
    - committing_a_canton_only_answer_without_a_commune
    - automatic_route_after_selection
    - tax_amount_rate_range_or_saving
    - full_national_commune_dump_on_empty_query
    - account_creation
    - any_privacy_claim_that_the_committed_commune_stays_on_device
    copy_source: product/mint_next/batch20/six-locale-copy.yaml#copy.{locale}.fact_commune_*

accessibility_contract:
  inherit_from_r1_except: [list_interaction, compact_proof]
  semantics_traversal_order: continue_reachable_before_or_independently_of_the_50_results_never_trapped_below_results_help_link_in_no_match_is_reachable_without_scrolling_past_results
  empty_query_discoverable_by_screen_reader: named_type_to_search_prompt_announced_not_only_visual
  selection_refindable: selection_summary_is_a_focusable_announced_region_even_when_selected_row_not_in_current_results
  result_count_liveregion: announced_count_matches_visible_overflow_status_including_beyond_cap_total
  derived_canton_announced_with_each_result: true
  # finding (e) — ATOMIC announcement of the derived result. Commune + its derived canton are ONE
  # semantics node, spoken as a single utterance on selection ("Morat, canton Fribourg, choisi"),
  # never two split announcements; selecting a row is the derivation, so the derivation is not a
  # second live-region event the user could miss.
  derived_canton_announced_atomically_with_commune_on_selection:
    single_semantics_node: true
    utterance_template: commune_then_canton_then_selected_state_one_node
    never_split_into_two_liveregion_updates: true
  # amendement Julien 2026-08-04 : la molette-canton est retirée de cet écran ; son contrat a11y
  # (wheel_fallback_accessible) est supprimé ici. Le pattern molette reste ailleurs (voir
  # product_decision_no_wheel_here). Sortie résiduelle a11y = lien d'aide dans no_match.
  help_link_accessible:
    help_link_is_a_named_button_role_announced_in_no_match_only: true
    activating_it_escalates_to_r3_and_restores_focus_predictably_no_dead_end: true
  # glossary sheet a11y (tap-glossary teaching_mechanism).
  glossary_sheet_accessible:
    anchor_is_a_named_button_role_not_a_bare_styled_span: true
    sheet_opens_with_focus_on_its_heading_traps_focus_until_dismissed_then_restores_to_the_anchor: true
    dismiss_by_swipe_button_and_screen_reader_escape: true
    anchor_visible_mark_meets_border_contrast_min_ratio_not_colour_only: true
  minimum_target_size_points: 48
  border_contrast_min_ratio: 3.0
  text_contrast_min_ratio: 4.5
  keyboard_and_switch_navigation: deterministic_visual_and_traversal_order
  focus_restoration: exact_trigger_or_heading
  compact_proof: 320x700_logical_px_text_scale_2_with_keyboard_raised_shows_continue_and_at_least_one_result_naming_its_derived_canton_no_overflow_clip
  required_proof_cases:
  - national_filtered_list_with_derived_canton_per_row
  - first_result
  - beyond_cap_overflow
  - no_match_with_spelling_prompt_and_help_escalation_link   # amendement Julien 2026-08-04 (remplace unknown_wheel_canton_fallback)
  - selected_not_in_current_results
  - derived_canton_announced_atomically_on_selection
  - glossary_sheet_open_focus_trapped_and_restored

inherited_verbatim_from_R1:
  - mutation_contract.atomic_order_and_generation_guard
  - navigation_contract.safe_exit_resume_keep_reference_leave
  - lifecycle_contract.generation_token_30min_ttl_app_kill_taxyear_purge
  - privacy_contract.search_query_ephemeral_local_only_no_network_log_analytics_autofill_clipboard   # committed fact joins profile per privacy_copy_rule
  - six_locale_semantic_contract.human_review_required_key_parity_insufficient
  - accessibility_contract.single_select_group_focus_restoration_48pt

scope_exclusions:
- flutter_runtime
- tax_calculation_or_personal_result
- persistence_backend_or_api
- location_or_address_lookup
- postcode_as_an_input_or_derivation_path
- public_product_route
- user_validation
- routing_to_fact_household
- church_tax_or_confession
- the_standalone_fact_canton_question   # folded into fact_lieu; canton is derived
- the_canton_wheel_fallback_on_this_screen   # amendement Julien 2026-08-04 : molette retirée d'ici (reste le pattern des choix courts ailleurs)

product_decision_no_wheel_here:
  # Décision produit datée (Julien, Revue d'écrans 2026-08-04) — à ne pas reperdre.
  date: 2026-08-04
  author: Julien (Revue d'écrans fact_lieu)
  decision: >-
    La molette-canton de secours est RETIRÉE de fact_lieu. Le canton est pur affichage dérivé de la
    commune (montré sous/sur la sélection), jamais demandé, jamais saisi ici. Le cas résiduel
    « commune introuvable » se règle par l'état no_match (vérifier l'orthographe) plus un lien d'aide
    discret qui escalade vers le chemin d'aide R3 (situation complexe) — seule sortie résiduelle.
  rationale: tout le monde connaît sa commune de domicile ; une molette-canton ici était une sortie
    de secours surdimensionnée qui rendait le canton saisissable et brouillait « le canton est déduit ».
  wheel_still_used_elsewhere: true   # la molette Cupertino reste le pattern GÉNÉRAL des choix courts bornés (autres écrans), décision antérieure conservée.
  supersedes_within_this_contract: [unknown_canton_only_state, choose_unknown_control, wheel_fallback_accessible_block]

sealing_lessons_regle13_to_apply:
  a_simulated_green_smoke_at_red_sealing: true
  b_delta_scoped_proofs: true
  c_supersession_pin_not_reattest: true
  d_mechanical_anchor_invariant_assertion: true

roast_status:
  four_lens_delta_roast_required_on_the_fused_flow: pending   # beginner/ux/swiss_finance/a11y on COMMUNE DIRECTE
  bulk_survives_from_canton_scoped_draft: dataset_fixture_and_voice_copy_states

future_runtime_gate:
  requires:
  - failing_runtime_tests_first
  - hidden_design_lab_only
  - six_runtime_locales
  - national_search_over_the_reviewed_commune_set_with_derived_canton_per_row
  - no_match_state_with_spelling_prompt_and_a_discreet_help_link_escalating_to_r3   # amendement Julien 2026-08-04 (remplace la molette)
  - compact_320x700_text_scale_2_with_keyboard_raised_proof
  - accessibility_proof_including_switch_control_voiceover_traversal_and_help_link_escalation
  - privacy_proof_that_only_the_search_query_is_device_local
  - zero_p1_p2_p3_roasts
  product_promotion_after_runtime: separately_forbidden_until_named_gate
