# Governed by product/mint_next/batch20/commune-scope.yaml (status: accepted_written_contract_runtime_forbidden).
# Keys are prefixed fact_commune_* per commune-scope.yaml node_contracts.fact_lieu.copy_source.
#
# NATIONALISATION (roast delta REWORK, findings a-d) + GLOSSAIRE PAR TAP (Julien 2026-08-04).
# AMENDEMENTS REVUE JULIEN 2026-08-04 :
#  1) BODY SUPPRIMÉ — « Où habites-tu ? » se suffit ; toute précision domicile-vs-appareil est morte
#     (la question porte le sens ; l'anti-GPS vit dans fact_contract.never_derive_commune_from).
#  2) MOLETTE CANTON RETIRÉE DE CET ÉCRAN — le canton est PUR AFFICHAGE dérivé. Le chemin
#     « je ne connais pas ma commune » -> molette est supprimé. Clés mortes retirées :
#     fact_commune_unknown, fact_commune_unknown_reassurance, fact_commune_selection_unknown.
#     Le cas résiduel commune-introuvable = état no_match (« Vérifie l'orthographe ») + un lien
#     d'aide discret (fact_commune_help_link) qui escalade vers le chemin d'aide R3 (situation
#     complexe) — SEULE sortie. La molette reste le pattern des choix courts AILLEURS, pas ici.
#  a) Recherche NATIONALE ; canton dérivé, montré par ligne + après sélection, jamais un en-tête.
#  c) Copie écrite pour le national de production ; commune-dataset.yaml (BE/BS/FR/JU) = sous-ensemble
#     représentatif de test scellé, pas la couverture de production.
#  d) NPA = texte secondaire d'aide au repérage, jamais committé (clé committée = numéro OFS).
#  GLOSSAIRE : plus aucun pavé inline ; concepts -> entrées gloss_* tappables (1 phrase + métaphore).
#
# Commune names and NPA/postcode are DISPLAY-ONLY, drawn from the reviewed dataset — not authored here.
