schema_version: 1
status: pending_reviewed_dataset_runtime_forbidden
kind: fact_commune_reviewed_dataset
# R2 reviewed commune dataset for the hidden design lab. Keyed by BFS/OFS Gemeindenummer
# (committed key). REPRESENTATIVE reviewed set for sealed tests, NOT the full ~2000 Swiss
# communes. Obeys product/mint_next/batch20/commune-scope.yaml (fact_contract, input_contract,
# perimeter_decisions_closed). Runtime and product promotion forbidden.
contract: product/mint_next/batch20/commune-scope.yaml
committed_key: bfs_ofs_gemeindenummer
provenance_kind: explicit_user_declaration_reviewed_finite_set
determining_date: jour_determinant_31_12_of_selected_tax_year
coefficient_scope: political_commune_civil_multiplier_church_tax_excluded
# No church/confessional multiplier, tax amount, rate, range or saving is carried here.
locales: [fr, en, de, it, es, pt]
tax_years: [2024, 2025, 2026]
cantons: [BE, BS, FR, JU]
canton_roles:
  BE: large_canton_exercises_render_cap_50_and_beyond_cap_overflow
  BS: small_canton_exercises_shown_list_fallback
  FR: bilingual_canton_exercises_official_variant_alias_matching
  JU: canton_transfer_destination_for_the_tax_year_edge
name_localization_note: >-
  Contrairement aux cantons (exonymes officiels multilingues), une commune porte un seul
  nom officiel au registre fédéral ; les six locales partagent donc ce même nom. Les formes
  bilingues et exonymes (Biel/Bienne, Fribourg/Freiburg, Morat, Guin) sont fournies dans
  aliases pour l'appariement, jamais comme nom d'affichage distinct. Un nom OFS conserve
  son suffixe cantonal officiel (p. ex. Bargen (BE)) quand il lève une homonymie inter-cantonale.
npa_note: >-
  Le NPA est un texte secondaire d'affichage uniquement (jamais une entrée ni un chemin de
  dérivation, cf. scope_exclusions du contrat). Un NPA peut couvrir plusieurs communes et une
  commune plusieurs NPA ; la valeur retenue est le NPA principal représentatif.
