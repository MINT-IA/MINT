copy_contract_fr:
  page:
    eyebrow: Tes versements 3a · {taxYear}
    title: Ajoute tes prestataires 3a, un par un.
    body: Pour chacun, saisis le total annuel des cotisations ordinaires créditées pour toi en {taxYear}, tel qu’il figure sur ton attestation. MINT fait l’addition.
    provider_total_note: Si une attestation regroupe plusieurs contrats, utilise son total une seule fois.
    privacy_note: Rien n’est enregistré ni envoyé. Si tu quittes, les noms et montants saisis seront effacés.
  where_to_find:
    title: Sur l’attestation annuelle de chaque prestataire
    body: Pour {taxYear}, cherche « Total des cotisations au pilier 3a » ou le total Q. Utilise ce total une seule fois, même s’il regroupe plusieurs contrats. Ne saisis ni le solde, ni un versement prévu ou seulement débité.
    exclusions: Un transfert, un rachat rétroactif ou un remboursement n’est pas une cotisation ordinaire. Après une correction, demande au prestataire son nouveau total ordinaire net au lieu de faire la soustraction toi-même.
  all_reviewed_help:
    title: Vérifie chaque endroit où tu as un 3a
    body: Regarde tes apps et attestations de banque, fintech, fondation ou assurance 3a pour {taxYear}. Ajoute une seule ligne par prestataire, même si son attestation regroupe plusieurs contrats.
    privacy: Utilise seulement le nom figurant sur l’attestation, sans numéro de compte, de police, AVS ou IBAN.
  row:
    heading: Prestataire 3a n° {index}
    provider_name: Nom du prestataire
    provider_hint: Le nom figurant sur l’attestation, par exemple VIAC, ta banque, une fondation ou une assurance — aucun numéro.
    amount: Cotisations ordinaires créditées · {taxYear}
    amount_doubt: J’ai un doute sur ce montant
    remove: Supprimer ce prestataire
    undo_remove: Annuler la suppression du prestataire {index}
    tombstone: Prestataire supprimé
    finalize_remove: Confirmer la suppression du prestataire {index}
    finalize_announcement: La ligne supprimée a été définitivement effacée de cette saisie.
  subtotal:
    incomplete: Sous-total saisi — encore incomplet
    includes_unresolved: Addition provisoire — inclut un montant à vérifier
    unconfirmed: Total saisi — à vérifier
    ready: Total prêt — aucun résultat fiscal calculé
  controls:
    add_provider: Ajouter un autre prestataire 3a
    all_reviewed: J’ai utilisé le total annuel ordinaire de chaque prestataire et vérifié tous mes 3a pour {taxYear}
    missing_amount: Il me manque encore un montant
    unknown_amount: Je ne connais encore aucun montant
    continue: Continuer
    correct_previous: Corriger ma réponse précédente
    all_reviewed_help: Comment savoir si j’ai d’autres prestataires à vérifier ?
    return_to_bound_missing_request: Revenir au montant manquant
    return_to_unallocated_missing_request: Reprendre l’ajout du prestataire manquant
    retract_missing_provider: En fait, j’ai déjà ajouté tous mes prestataires
  errors:
    empty_before_add: Commence la ligne vide ou supprime-la avant d’en ajouter une autre.
    provider_name_empty: Indique seulement le nom du prestataire, sans numéro.
    provider_name_unsafe: Retire le numéro de compte, de police, AVS ou l’IBAN.
    amount_empty: Indique le total ordinaire crédité pour {taxYear}.
    exact_duplicate: Ce prestataire est déjà présent. Corrige sa ligne au lieu de compter son total deux fois.
    confirmation_missing: Confirme que tu as vérifié tous tes prestataires 3a pour {taxYear}.
    unresolved_classification: Vérifie s’il s’agit bien du total ordinaire confirmé, sans transfert, rachat rétroactif ni remboursement.
    invalid_format: Utilise uniquement des chiffres et un seul séparateur décimal.
    too_many_decimals: Indique au maximum deux chiffres après le séparateur.
    zero: Le montant doit être supérieur à zéro. Si rien n’est resté crédité, corrige ta réponse précédente.
    negative_or_forbidden_token: Vérifie le total indiqué sur l’attestation; ne saisis ni signe, pourcentage, exposant ou autre devise.
    ambiguous_separator: Le séparateur est ambigu. Saisis par exemple 7258 ou 7258,50.
    amount_overflow: Ce montant est trop long. Vérifie le total indiqué par ton prestataire.
    provider_name_too_long: Le nom est trop long. Indique seulement le nom visible sur l’attestation, sans numéro.
  unresolved_help:
    title: Vérifie ce qui compose ce montant
    body: Utilise le total annuel ordinaire ou total Q confirmé par ton prestataire pour {taxYear}. Ne compte pas un transfert, un rachat rétroactif, un versement encore en attente ou un remboursement.
    correction: Après un remboursement ou une correction, demande le nouveau total ordinaire net. Ne fais pas la soustraction toi-même.
    insurance: Pour une assurance 3a, utilise l’attestation annuelle, pas la valeur de rachat ni la répartition risque-épargne.
    one_provider_refunded: Si seul ce prestataire a tout remboursé mais que d’autres montants restent crédités, supprime seulement cette ligne.
    all_providers_zero: Corrige ta réponse précédente uniquement si rien n’est resté crédité chez aucun de tes prestataires.
    remove_refunded_provider_action: Supprimer seulement ce prestataire remboursé
    all_providers_zero_action: Rien n’est resté crédité chez aucun de mes prestataires

