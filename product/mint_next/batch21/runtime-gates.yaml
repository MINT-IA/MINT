deferred_integration:
  # RIDER 1 (explicit lifecycle) : the R3 forward controls never route in R3
  # (eclairage-scope continue.never_routes_in_r3). So this expected-RED can only bind
  # obligations reachable by the navigation that EXISTS pre-runtime — the linear
  # journey. The R3 SCREENS land first (runtime), and this LINEAR contract flips green
  # at the INTEGRATION BATCH, not at the screen-flip.
  status: delivered   # ANCHOR''' 2026-08-05 — the éclairage integration wave landed (see amendment below)
  delivered_2026_08_05:
    # forward-only content amendment (ANCHOR'''): the linear journey is wired and the R3
    # frozen-RED contract above stays the sealed record; the live delivered record is the
    # batch21 R3 green-gate. R3_14 keeps reading this registry (expected_red / runtime_implemented
    # strings intact) and passes in RED and after integration.
    wired: fact_lieu_continue_to_fact_revenu_then_fact_revenu_continue_to_eclairage
    batch20_r2_outbound_edge: superseded_by_pin_and_r2_14_re_gated
    situation_toggle: removed_situation_is_display_only
    versement: display_only_amount_choice_deferred_to_r4_scenarios_versement   # lead ruling 1a
    revenu_refine: recompute_by_band_mapping_only_the_sealed_85000_point_tightens   # lead ruling 1b
    eclairage_continue: boundary_kept_future_target_r4_scenarios_versement   # lead decision 2
    a11y: real_keyboard_switch_activation_on_r3_controls
    green_record: product/mint_next/batch21/r3-green-gate.yaml
  green_flips_here_not_at_screen_flip: true
  scope:
  - wire_journey_fact_lieu_continue_to_fact_revenu_then_fact_revenu_continue_to_eclairage_then_next_action
  - supersede_batch20_r2_fact_lieu_outbound_edge_obligation_and_re_gate_it
  - remove_runtime_inline_situation_toggle_situation_is_display_only
  - re_gate_sibling_screens_touched_by_the_new_wiring
  interim_evidence:
    # the screens are NOT a silent gray zone between screen-flip and integration:
    # they are attested by the NAMED runtime dev tests, reached via the harness.
    runtime_dev_tests:
    - product/mint_next/batch7/design_lab/test/dev_eclairage_r3_test.dart
    - product/mint_next/batch7/design_lab/test/dev_fact_revenu_r3_test.dart
    reached_via: MintNextDesignLabApp.batch21Harness
    not_a_silent_gray_zone: true
  green_gate_semantics:
    # RIDER 2 (green-gate re-semanticized) : the batch21 green-gate's acceptance means
    # runtime IMPLEMENTED **and** journey WIRED — its --release attestation replays THIS
    # linear test, which passes only once the screens are wired into the journey. No pin
    # may attest a runtime-only state without the wiring.
    acceptance_means: r3_runtime_implemented_AND_journey_wired
    release_attestation_replays: this_linear_integration_test_passing_within_the_wired_screens
    no_pin_may_attest_runtime_only_without_wiring: true
forbidden_claims:
- runtime_implemented
- runtime_accepted
