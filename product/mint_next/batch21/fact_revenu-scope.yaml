# (navigation.yaml:320) : « estimate the current-year TAXABLE-income band … avoid a false point
# estimate ». Le modèle canonique était DÉJÀ une TRANCHE (choose_band), pas un chiffre précis.
# R3 conserve la tranche et durcit la voix beginner. Il ne réinvente pas le modèle.
model: taxable_income_band_single_node

navigation_amendment:
  refreshes: fact_income          # batch6 navigation.yaml:320
  into: fact_revenu
  keeps: choose_band_semantics_taxable_income_band_not_a_precise_figure
  decision_trace: r3_lead_scope_eclairage_arc_2026_08_05
