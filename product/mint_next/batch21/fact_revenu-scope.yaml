  authority_note: this_draft_amends_fact_income_only_it_may_not_add_or_remove_other_batch6_routes

authority:
  canonical_navigation: product/mint_next/batch6/navigation.yaml
  source_of_truth_rule: this_draft_refreshes_fact_income_into_fact_revenu_it_may_not_touch_other_batch6_routes
