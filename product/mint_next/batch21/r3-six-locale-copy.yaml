    eclairage_assumptions: "On suppose aussi : sans enfant, hors impôt d’Église, imposé ordinairement."
    eclairage_disclaimer: "C’est une estimation, pas un conseil fiscal. Le montant exact figure sur ta taxation."
    eclairage_continue: "Continuer"
    eclairage_back: "Retour"
    # états non-nominaux
    eclairage_pending_title: "Il manque ton revenu imposable."
    eclairage_pending_revenu: "Choisis d’abord ta tranche de revenu."
    eclairage_pending_action: "Choisir ma tranche"
    eclairage_zero_income: "Sous 30 000 CHF, l’effet fiscal d’un versement 3a est souvent faible cette année."
    # glossaire par tap
    eclairage_gloss_deduction_term: "déduction"
    eclairage_gloss_deduction_def: "Un montant qu’on retire de ton revenu imposable. Moins de revenu imposable, moins d’impôt."
    eclairage_gloss_deduction_metaphor: "Ce que tu verses sur ton 3a, l’impôt ne le compte plus."
    eclairage_gloss_3a_term: "3a"
    eclairage_gloss_3a_def: "Le pilier 3a est une épargne liée. Tes versements peuvent être déduits de ton revenu imposable, jusqu’à la limite annuelle."
    eclairage_gloss_versement_term: "versement 3a"
    eclairage_gloss_versement_def: "C’est ce que tu as versé sur ton 3a cette année. Ici, le calcul part de la limite annuelle. Touche la ligne pour changer le montant."
    eclairage_gloss_ordinaire_term: "imposé ordinairement"
    eclairage_gloss_ordinaire_def: "Ton impôt est calculé sur ta déclaration. Si tu es imposé à la source — souvent avec un permis B ou comme frontalier — la déduction 3a peut fonctionner autrement. Vérifie ce qui vaut pour toi."
    # état « non applicable » (garde-fou binaire imposition à la source / FATCA) — JAMAIS un CHF X ici
    eclairage_na_title: "On ne peut pas estimer ton économie ici."
    eclairage_na_body: "Imposé à la source, tu ne peux en général pas déduire ton 3a de la même façon. Une taxation ordinaire est parfois possible — vérifie ta situation."
