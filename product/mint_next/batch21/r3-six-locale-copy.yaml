    eclairage_situation_celibataire: "Célibataire"
    eclairage_situation_marie: "Marié·e ou pacsé·e"
    eclairage_situation_concubinage: "En couple, non marié·e"
    # échelle de précision déclarée — le raffinage tiré par la valeur (tap sur une ligne d'hypothèse)
    eclairage_refine_hint: "Un chiffre exact resserre l’estimation."
    eclairage_amount_caption_refined: "d’impôt en moins cette année, d’après ton chiffre."
    eclairage_exact_revenu_title: "Ton revenu imposable exact"
    eclairage_exact_revenu_placeholder: "p. ex. 85 000"
    eclairage_exact_revenu_note: "Pas besoin d’un chiffre exact. Si tu l’as, il resserre l’estimation."
    eclairage_exact_save: "Utiliser ce chiffre"
    # tranche ouverte gt150 : bornée BAS (2776 arrondi plancher -> 2700), JAMAIS de borne haute inventée
    eclairage_amount_open: "{low} CHF et plus"
    # badge de l'état precision_refined : l'estimation part désormais du chiffre exact déclaré
    provenance_exact: "Chiffre exact"

