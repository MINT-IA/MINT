# R3 — ARC ÉCLAIRAGE — six-locale semantic copy (DRAFT, PENDING lead + Julien review).
# Écrans : fact_revenu (revenu imposable, tranche) + eclairage_impot_3a (le payoff).
# Governed by product/mint_next/batch21/{fact_revenu,eclairage}-scope.yaml (SCELLÉ).
# Pattern hérité de product/mint_next/batch20/six-locale-copy.yaml (R2 fact_lieu).
#
# STADE : CONTRAT + MAQUETTES. Runtime interdit, promotion produit interdite, AUCUN scellement.
#
# DOCTRINE APPLIQUÉE :
#  - Écrans ultra-aérés : la question se suffit, aucun body redondant.
#  - Test voix haute sur chaque phrase (« dirait-on ça à un ami ? »).
#  - Glossaire PAR TAP : tout terme difficile (revenu imposable, déduction, brut) = ancre tappable
#    -> feuille 1 phrase + métaphore éventuelle (LSFin-safe, jamais une promesse).
#  - LSFin STRICT sur eclairage : jamais de promesse ni d'impératif (« Économise X » ABOLI, bug #1061),
#    fourchette/scénarios, hypothèses VISIBLES et ÉDITABLES, « estimation, pas un conseil fiscal ».
#  - AUCUNE claim de localité (« reste sur ton téléphone » ABOLI). Ici, aucune donnée n'est
#    device-only : la tranche rejoint le profil comme la commune -> aucune phrase privacy (honnête).
#  - Termes bannis LSFin (garanti/optimal/meilleur/sans risque/assuré/parfait) : absents.
#  - Framing life-event « Simulation 3a » (effet SUR L'IMPÔT DE CETTE ANNÉE), jamais « retraite ».
#
# Les VALEURS chiffrées de l'exemple sont DÉRIVÉES du moteur canonique
# services/backend/app/services/fiscal/cantonal_comparator.py (estimate_tax_saving:426),
# étalon ESTV chef-lieu, célibataire sans enfant (cantonal_comparator.py:99-101). Rien d'inventé.
# Détail des dérivations : scoring/derivations-suisse.md.

schema_version: 1
status: sealed_semantic_copy_runtime_not_implemented
model: r3_eclairage_arc_two_nodes
locales: [fr, en, de, it, es, pt]
required_placeholders:
  - taxYear      # ex. 2026
  - band         # tranche de revenu imposable choisie, ex. "70 000 – 100 000"
  - low          # borne basse de la fourchette d'économie, ex. "1 800"
  - high         # borne haute de la fourchette, ex. "2 200"
  - versement    # montant du versement 3a supposé, ex. "7 258"
  - commune      # commune de fact_lieu, ex. "Fribourg"
  - canton       # canton dérivé, ex. "Fribourg"

