hermeneutic_inscription:
  experience_visee: "Le débutant voit, pour la première fois, ce que l'app lui rend : un ordre de grandeur d'impôt en moins cette année, avec les hypothèses en clair et modifiables."
  pourquoi_la_decision: "Une fourchette dérivée par différence d'impôt (jamais un chiffre promis ni un impératif — le bug #1061), hypothèses éditables, cadrée sur l'impôt de l'année : lucidité, pas promesse, pas retraite."
  ce_que_ca_prepare: "La confiance : si l'estimation est honnête et manipulable, l'utilisateur peut décider lui-même de l'étape suivante — au lieu qu'on décide pour lui."
