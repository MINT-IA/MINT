  - title: Discord_webhooks
    url: https://docs.discord.com/developers/platform/webhooks
    supports: [incoming_webhook_without_persistent_bot]
  - title: Discord_privacy
    url: https://discord.com/privacy
    supports: [not_a_swiss_financial_data_plane, international_processing_risk]
verified_state:
  official_sources_checked_utc: 2026-08-01
  discord_server_exists: user_attested_only
