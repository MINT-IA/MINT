    score_100: 81
    criterion_scores_1_to_5: {source_of_truth_drift_resistance: 4, privacy_and_secret_exposure: 2, timely_incident_awareness: 5, fit_with_existing_stack: 5, cost: 5, operational_simplicity: 4}
    strengths: [existing_user_attested_server, simple_one_way_webhooks, low_cost, good_interrupt_surface]
    weaknesses: [not_swiss_data_plane, weak_governance, secret_and_noise_risk]
  slack_free:
    score_100: 47
    criterion_scores_1_to_5: {source_of_truth_drift_resistance: 1, privacy_and_secret_exposure: 1, timely_incident_awareness: 4, fit_with_existing_stack: 2, cost: 5, operational_simplicity: 3}
