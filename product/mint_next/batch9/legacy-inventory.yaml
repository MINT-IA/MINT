  - standing_order_or_plan_means_already_credited
  - null_or_missing_means_zero_or_no
  - existing_balance_proves_selected_year_payment
  - one_provider_certificate_is_the_all_provider_total
  - bank_debit_date_is_the_3a_credit_date
  - ordinary_contribution_can_include_transfer_or_retroactive_buyback
