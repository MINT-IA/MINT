# ────────────────────────────────────────────────────────────────────────────
# FAUTES RENDUES IMPOSSIBLES PAR LE CONTRAT (assertions vérifiables, cité path:line)
# ────────────────────────────────────────────────────────────────────────────
legacy_faults_made_impossible:

  fault_A_ceiling_from_affiliation_not_status:
    inherits: r3_eclairage_fault_1   # même règle, ici RENDUE OPÉRATIONNELLE (le plafond pilote l'UI)
    contract_assertion: >-
      Aucun scénario n'utilise un plafond dérivé du statut d'emploi ou d'un archétype. Le plafond
      dérive de l'affiliation + du revenu (ceiling_derivation_opp3). Les 3 cas de test le gouvernent.
    forbidden: serving_a_flat_7258_to_a_non_affilie_or_deriving_the_cap_from_employment_status

  fault_B_no_benefit_above_remaining_room:
    etalon_ref: navigation.yaml:65_67   # deductible = min(planned, room) ; tax_base = deductible_only
    contract_assertion: >-
      L'effet fiscal d'un scénario ne s'applique QU'À la part dans la marge restante (deductible_amount).
      Un montant au-dessus de la marge n'ajoute AUCUNE économie ; l'excédent (planned_excess) est dit,
      jamais silencieusement crédité d'un bénéfice. Anti-illusion.
    forbidden: showing_a_tax_effect_on_the_portion_of_a_scenario_that_exceeds_remaining_room

  fault_C_never_a_bare_number_never_a_promise:
    contract_assertion: >-
      Chaque effet de scénario est une FOURCHETTE (bornes de tranche / résidu moteur), jamais un chiffre
      nu, jamais « garanti/optimal », jamais un impératif « Verse X ». Framing « pourrait » + « tu
      choisis ». Cohérent régression #1061.
    forbidden: [a_single_promised_effect, an_imperative_to_contribute, any_banned_lsfin_term]

  fault_D_liquidity_never_hidden:
    etalon_ref: navigation.yaml:123_124   # learning_objective inclut LOCKED LIQUIDITY
    contract_assertion: >-
      L'écran DIT que le versement est bloqué jusqu'à la retraite (sauf exceptions légales). Ne montrer
      que l'économie serait un dark pattern (3a = argent gratuit). Interdit de masquer le coût liquidité.
    forbidden: presenting_only_the_tax_saving_without_stating_the_locked_liquidity

  fault_E_overcontribution_is_honest_not_silent:
    etalon_ref: navigation.yaml:64_and_515_518   # existing_excess_contribution ; existing_overcontribution_help
    contract_assertion: >-
      Si le déjà-versé dépasse le plafond, la marge restante est 0 : AUCUN scénario « verser plus »,
      et la part excédentaire est dite (« au-dessus du plafond, ne réduit pas l'impôt, à corriger »),
      avec une aide (existing_overcontribution_help). Jamais un scénario qui inviterait à sur-cotiser.
    forbidden: offering_a_contribute_more_scenario_when_remaining_room_is_zero

lsfin_no_promise_contract:
  banned_terms_absent: [garanti, optimal, meilleur, sans_risque, assuré, parfait, certain]
  never_imperative: true   # PRÉCISION : aucun impératif de CONTRIBUTION/INVESTISSEMENT (« Verse X », « Cotise au max » ABOLIS) ; un impératif PROTECTEUR/correctif (« Vérifie avec ton prestataire ») reste admis (légal)
  never_a_single_promised_number: true
  always_a_range_per_scenario: true
  scenarios_never_a_recommendation: true   # spectre éducatif, l'utilisateur choisit
  liquidity_cost_stated: true
  disclaimer_present_estimate_not_advice: true
  framed_on_this_years_tax_not_retirement: true
  marginal_rate_jargon_not_surfaced: true   # francs, pas taux

slice:
  entry_preconditions:
    shared: [tax_year_explicitly_selected, commune_selected, taxable_income_band_selected, eclairage_seen]
    nominal_path_also: [lpp_affiliation_yes]   # hérité R3 ; le plafond-20% illustre la branche non-affiliée gravée
  implemented_nodes: [scenarios_versement]
  boundary_nodes: [personal_setup_boundary, reference_saved, existing_overcontribution_help]   # navigation.yaml:555,518
  locales: [fr, en, de, es, it, pt]

human_outcome:
  what_it_renders: >-
    Un petit spectre de scénarios : ce que l'utilisateur POURRAIT verser cette année (dans sa marge
    restante) et l'effet d'impôt estimé de chaque montant, en fourchette. Plus la note honnête que
    l'argent reste bloqué. Pas un conseil, pas une invitation à verser.
  must_understand:
    - C'est toi qui choisis combien verser (ou rien) — aucun montant n'est recommandé.
    - Chaque montant a un effet ESTIMÉ en fourchette, jamais un montant fixe.
    - Seule la part dans ta marge restante réduit l'impôt ; au-delà, pas d'effet.
    - Un versement 3a reste bloqué jusqu'à la retraite, sauf quelques exceptions.
    - Ce qui compte déjà versé réduit ce qu'il te reste de possible cette année.
  next_small_action:
    default: Garder ce repère, ou continuer — sans pression.

render_contract:
  states:
    nominal:
      precondition: remaining_3a_room_gt_0_and_lpp_affiliation_yes_and_contributed_amount_zero
      shows: [choose_line, scenarios_2_or_3, liquidity_note, disclaimer, next_step_actions]
      each_scenario_shape: amount_plus_effect_range_never_single
    marge_reduite:
      precondition: contributed_amount_gt_0_and_remaining_3a_room_gt_0
      shows: [already_line_contributed_amount, remaining_line, scenarios_on_remaining_incremental, liquidity_note, disclaimer, next_step_actions]
      wiring: remaining_3a_room = max(0, annual_cap - contributed_amount)   # navigation.yaml:63
      scenario_effect: incremental_effect_of_additional_above_already   # la marge acquise non recomptée
    plafond_20pct_non_affilie:
      precondition: lpp_affiliation_no   # branche gravée ; câblage runtime pending_lead
      shows: [ceiling_depends_on_income_line, derived_ceiling_amount, one_max_scenario, income_base_hypothesis, low_income_honest_note, liquidity_note, disclaimer]   # income_base_hypothesis -> scenarios_plafond20_income_hyp (receipt gap comblé)
      ceiling_derivation: min(0.20 * revenu_net_activite, 36288)   # OPP3 art.7
      net_income_base_is_a_visible_hypothesis: true
      role: non_affilie_ceiling_OVERLAY_illustration_at_contributed_zero_composes_with_marge_states_NOT_terminal   # correctif Codex
      status: rule_shown_wiring_pending_lead
    marge_epuisee_overcontribution:
      precondition: effective_contributed_amount_ge_annual_cap   # remaining_room = 0
      shows: [cap_line, contributed_line, excess_line_no_tax_benefit, correction_help_action]
      shows_no_contribute_more_scenario: true   # fault_E
      excess_is_not_asserted_an_error: true   # rachat 3a (OPP3 art.7-7b) possible au-dessus du plafond ANNUEL
      excess_vs_rachat_distinction_deferred: true   # correctif Codex : R4 ne CLASSE pas {excess} en excédent définitif ; copie « ne réduit pas TOUJOURS » + « vérifie » ; distinguer contribution ordinaire / rachat admissible / vrai excédent = deferred_integration.rachat_3a_classification
      maps_to: existing_overcontribution_help   # navigation.yaml:518
    pending_missing_fact:
      precondition: a_critical_input_missing_EXCLUDING_additional_planned_amount   # CARVE-OUT : additional_planned_amount est optionnel-tiré (own_amount_control.optional, défaut aucun) — il ne déclenche JAMAIS pending, sinon l'état nominal serait impossible ; navigation.yaml:84 le liste critical pour le nœud fact_amount, PAS pour l'écran scénarios
      critical_inputs_for_this_screen: [tax_year, commune, taxable_income_band, lpp_affiliation]   # les facteurs SANS lesquels aucun scénario n'est calculable
      shows: [pending_title, which_fact_missing, complete_action]
      which_fact_missing_key: scenarios_pending_which   # receipt gap comblé : {fact} nomme le fait manquant
      shows_no_scenario_number: true

  ceiling_dimension:   # correctif Codex 2026-08-05 : l'AFFILIATION détermine le PLAFOND (dimension), PAS un état de rendu terminal
    cap: ceiling_derivation_opp3   # affilié -> 7258 (LIFD 33-1-e) ; non-affilié -> min(0.20*revenu_net, 36288) (OPP3 art.7)
    note: >-
      Les états de rendu s'évaluent RELATIVEMENT au cap DÉRIVÉ, quelle que soit l'affiliation. La branche
      non-affiliée ne PLAFONNE pas le parcours : elle change le cap et AJOUTE une explication de plafond
      (ceiling_depends_on_income_line + income_base_hypothesis + low_income_note) par-dessus l'état marge
      applicable. Câblage complet = deferred_integration.non_affilie_ceiling_routing.
  state_precedence:   # ORDRE de résolution DÉTERMINISTE (corrigé Codex) : premier état satisfait GAGNE, RELATIF au cap dérivé
    order:
      - pending_missing_fact            # 1. fait critique de l'écran manquant (hors additional_planned_amount)
      - marge_epuisee_overcontribution  # 2. contributed >= cap_dérivé -> marge 0 (affilié OU non-affilié)
      - marge_reduite                   # 3. 0 < contributed < cap_dérivé
      - nominal                         # 4. contributed == 0 (défaut)
    non_affilie_overlay: >-
      plafond_20pct_non_affilie n'est PAS un état terminal : c'est l'OVERLAY d'explication du cap non-affilié
      (illustré à contributed==0) qui se COMPOSE avec l'état marge ci-dessus ; correctif Codex — le plafond
      dérivé ne masque jamais la marge restante ni un dépassement.
    rule: preconditions_evaluated_first_match_wins_RELATIVE_to_the_DERIVED_cap_affiliation_only_changes_the_cap
    resolves:
      - non_affilie_who_contributed_reaches_marge_reduite_or_marge_epuisee_on_their_20pct_cap_never_swallowed_by_a_terminal_ceiling_state
      - over_contributor_resolves_to_marge_epuisee_before_marge_reduite

  scenarios_block:
    label_key: scenarios_choose_line
    scenario_row_shape:
      amount_key: scenarios_amount            # ex. « 7 258 CHF »
      max_marker_key: scenarios_amount_max    # « — le maximum cette année » sur la borne haute
      effect_key: scenarios_effect            # ex. « environ 1 800 à 2 200 CHF d'impôt en moins »
    anchors_rule: 2_or_3_amounts_spanning_zeroish_to_remaining_room_low_to_high
    every_effect_is_a_range_derived_from_income_band_edges: true
    own_amount_control:   # TIRÉ par la valeur, jamais poussé
      key: scenarios_own_amount
      opens: exact_amount_sheet
      writes: additional_planned_amount   # navigation.yaml:340
      optional: true
      no_preselection: true
    liquidity_note:
      key: scenarios_liquidity
      glossary_anchor: scenarios_gloss_bloque   # exceptions au blocage (logement, départ CH, indépendance)
    excess_note_when_scenario_exceeds_room:
      key: scenarios_excess_note   # fault_B : la part au-dessus de la marge n'a pas d'effet
      shown_only_when: a_scenario_or_own_amount_exceeds_remaining_room

node_contracts:
  scenarios_versement:
    arrival_focus: heading_the_choose_line_announced_not_a_scenario_amount
    required_copy_intents:
      - it_is_the_user_who_chooses_how_much_no_amount_is_recommended
      - each_amount_has_an_estimated_range_effect_never_a_single_promised_number
      - only_the_part_within_remaining_room_reduces_tax
      - a_3a_payment_is_locked_until_retirement_save_a_few_exceptions
      - what_is_already_paid_reduces_what_is_still_possible_this_year
      - framed_on_this_years_tax_not_on_retirement
    teaching_mechanism:
      pattern: tap_glossary_sheet_no_dense_inline_note
      concepts_are_glossary_entries: [plafond_3a, marge_restante, bloque_liquidite]
      on_screen_anchors_minimal: choose_line_carries_plafond_anchor_remaining_line_carries_marge_anchor_liquidity_note_carries_bloque_anchor
      sheet_copy_intents: [one_plain_sentence, where_relevant_the_exceptions, optional_fun_metaphor_lsfin_safe_never_a_promise]
      copy_source: product/mint_next/batch22/r4-six-locale-copy.yaml#copy.{locale}.scenarios_gloss_*
    coach_intent:
      status: contract_requirement_not_implemented_in_r4
      invocable_id: scenarios_versement
      three_paths_rule:
        declared_route: scenarios_versement_refreshes_next_action_in_batch6
        hub_reachable_within_taps: 2
        natural_language_intents: ["combien je pourrais verser sur mon 3a", "l'effet si je verse plus", "ce qu'il me reste à verser cette année", "est-ce que mon argent est bloqué"]
      coach_may_offer_own_amount: pulled_by_value_never_a_recommendation   # coach ne conseille jamais un montant
      coach_may_show_widget: scenarios_spectrum_widget_grounded_on_this_estimate_with_its_room_and_liquidity_note
      widget_must_carry_the_same_liquidity_note_and_disclaimer_as_the_screen: true
      every_screen_and_widget_carries_a_coach_invocable_id: true
    controls:
      open_own_amount: {overlay: exact_amount_sheet, operation: optionally_set_additional_planned_amount_pulled_by_value_then_recompute_within_room}
      open_plafond_glossary: {operation: open_plafond_sheet_no_route}
      open_marge_glossary: {operation: open_marge_restante_sheet_no_route}
      open_liquidity_glossary: {operation: open_bloque_exceptions_sheet_no_route}
      review_existing_overcontribution: {to: existing_overcontribution_help, visible_when: existing_excess_contribution_gt_0}   # navigation.yaml:515
      keep_local_reference: {to: reference_saved, persistence: local_non_sensitive}   # navigation.yaml:549
      prepare_personal_setup: {to: personal_setup_boundary}                            # navigation.yaml:550
      continue: {activation: always_enabled, never_routes_in_r4: true}
      back: {operation: exact_history_back}
      open_safe_exit: {overlay: safe_exit}
    forbidden:
      - a_recommended_or_highlighted_amount   # scénarios, jamais une reco
      - a_single_promised_effect
      - an_imperative_to_contribute_verse_or_cotise
      - showing_a_tax_effect_on_the_portion_above_remaining_room   # fault_B
      - hiding_the_locked_liquidity_cost   # fault_D
      - offering_a_contribute_more_scenario_when_remaining_room_is_zero   # fault_E
      - a_flat_7258_ceiling_for_a_non_affilie   # fault_A
      - a_rate_or_percentage_as_the_headline
      - reinventing_estimate_tax_saving_or_the_ceiling_rule_cross_layer   # NEVER#3
      - framing_the_scenarios_as_a_retirement_outcome
      - account_creation
    copy_source: product/mint_next/batch22/r4-six-locale-copy.yaml#copy.{locale}.scenarios_*

accessibility_contract:
  inherit_from_r2_r3_except: [scenario_list_semantics]
  each_scenario_is_a_named_region_amount_and_effect_spoken_as_one_utterance: true
  effect_range_not_conveyed_by_colour_alone: true
  liquidity_note_reachable_by_screen_reader_not_only_visual: true
  own_amount_and_glossary_anchors_are_named_buttons_not_bare_styled_spans: true
  glossary_sheet_accessible:
    sheet_opens_with_focus_on_its_heading_traps_focus_until_dismissed_then_restores_to_the_anchor: true
    dismiss_by_swipe_button_and_screen_reader_escape: true
  minimum_target_size_points: 48
  border_contrast_min_ratio: 3.0
  text_contrast_min_ratio: 4.5
  secondary_text_contrast_binding:   # amendement post-revue Codex 2026-08-05 (contraste sauge MESURÉ 3,37:1)
    rule: all_functional_text_including_secondary_sauge_meets_4.5_to_1_on_paper_background
    applies_to: [eyebrow, effect_ranges, amount_max_suffix, commune_caveat, disclaimer, plafond20_notes]
    measured_violation: sauge_rgb_110_140_116_on_paper_rgb_246_244_238_is_3.37_to_1_BELOW_4.5   # les fourchettes d'effet SONT l'info décisionnelle, jamais décoratives
    required_fix: darken_the_sauge_text_token_until_ge_4.5_to_1_effect_ranges_and_disclaimer_are_functional
    forbidden: treating_effect_ranges_or_disclaimer_as_decorative_low_contrast
    token_location: apps/mobile/lib/theme/colors.dart   # le TOKEN sauge vit dans le thème Flutter, HORS de ce contrat de données ; ce contrat le BORNE
    status: MUST_FIX_BEFORE_GREEN_runtime_obligation   # correctif Codex : le changement de token + re-render maquette = tâche runtime ; la spec green DOIT prouver >= 4.5:1
  compact_proof: 320x700_logical_px_text_scale_2_shows_choose_line_at_least_one_scenario_liquidity_note_and_disclaimer_no_overflow_clip
  required_proof_cases:
    - nominal_two_or_three_scenarios_each_a_range_plus_liquidity_note
    - marge_reduite_already_line_remaining_line_incremental_scenarios
    - plafond_20pct_ceiling_depends_on_income_derived_amount_low_income_note
    - marge_epuisee_no_contribute_more_scenario_excess_stated
    - a_scenario_region_focused_and_announced
    - plafond_glossary_sheet_open_focus_trapped_and_restored

