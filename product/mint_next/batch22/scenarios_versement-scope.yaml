  - persistence_backend_or_api
  - the_non_affilie_ceiling_runtime_wiring_until_lead_navigation_decision   # règle gravée, câblage pending
  - the_communal_multiplier_recomposition_until_a_named_source_exists   # hérité R3 pending
  - public_product_route
  - user_validation
  - routing_to_personal_setup_or_reference_saved
  - retirement_projection_or_capital_at_65
  - account_creation_or_bank_connection
  - the_3a_buy_in_rachat_mechanism_OPP3_art_7_to_7b   # rachat 3a (en vigueur 01.01.2025 ; 1er rachat possible ANNÉE FISCALE 2026 pour lacunes dès 2025 ; plafonné 7258/année lacunaire ; exige le versement annuel max d'abord ; fenêtre 10 ans) = mécanisme AVANCÉ conditionnel HORS périmètre de l'écran scénarios ORDINAIRES ; escaladé lead+swiss-brain. R4 ne l'affiche pas mais dé-absolutise scenarios_over_excess pour ne PAS le contredire ni pousser à annuler un rachat valable
  - reimplementing_estimate_tax_saving_or_the_ceiling_rule_cross_layer

hermeneutic_inscription:
  experience_visee: "Après avoir vu ce qu'un versement change, l'utilisateur voit le SPECTRE — petit, moyen, le maximum — et comprend que c'est LUI qui choisit, sans qu'on lui pousse un chiffre."
  pourquoi_la_decision: "Des scénarios, jamais une recommandation ; chaque effet en fourchette dérivée du moteur ; le plafond dérivé de l'affiliation+revenu (pas un forfait) ; et — décisif — la liquidité bloquée DITE, pour que le 3a ne passe pas pour de l'argent gratuit. Lucidité, pas vente."
  ce_que_ca_prepare: "L'autonomie : l'utilisateur repart avec un repère honnête (ce qu'il pourrait faire, à quel effet, à quel coût de liquidité) et décide seul de l'étape suivante — la boucle se ferme sans qu'on décide à sa place."
