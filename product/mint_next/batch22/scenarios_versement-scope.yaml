# ────────────────────────────────────────────────────────────────────────────
# LE PLAFOND DÉRIVE DE L'AFFILIATION + DU REVENU — règle OPP3 GRAVÉE, 3 cas de test contractuels
# (directive lead R4). Rend impossible le forfait 7258 servi à un non-affilié. Cite l'étalon path:line.
# ────────────────────────────────────────────────────────────────────────────
ceiling_derivation_opp3:
  rule_statement: >-
    Le plafond 3a de l'année DÉRIVE de l'AFFILIATION au 2e pilier + du revenu, JAMAIS du statut
    salarié/indépendant, JAMAIS un forfait servi à tous.
  legal_basis:
    affilie: LIFD_art_33_al_1_let_e   # plafond avec affiliation = 7258 (petit 3a)
    non_affilie: OPP3_art_7           # 20% du revenu net de l'activité lucrative, max 36288 (grand 3a)
  etalon_refs:
    plafond_avec_lpp: apps/mobile/lib/constants/social_insurance.dart:398          # pilier3aPlafondAvecLpp = 7258.0
    plafond_sans_lpp_max: apps/mobile/lib/constants/social_insurance.dart:401      # pilier3aPlafondSansLpp = 36288.0
    taux_sans_lpp: apps/mobile/lib/constants/social_insurance.dart:404             # pilier3aTauxRevenuSansLpp = 0.20
    opp3_formula_backend: services/backend/app/services/independant_service.py:147_161   # calculate_3a_plafond = round(min(revenu_net*0.20, 36288))
    opp3_art7_mention: services/backend/app/services/independant_service.py:26_and_150
    cap_switch_avec_sans_lpp: services/backend/app/services/independant_service.py:207_212
    room_calculator_mobile: apps/mobile/lib/services/financial_core/pillar3a_room_calculator.dart:8_28   # annualCeiling: gate canContribute3a -> 0 ; independentNoLpp -> incomeBase*0.20 clamp[0,36288] ; sinon 7258. ATTENTION :19-20 branche sur FinancialArchetype.independentNoLpp (ARCHÉTYPE) — à NE PAS recopier comme source d'affiliation ; la règle R4 dérive de l'AFFILIATION (fait), pas de l'archétype
  legacy_bug_site: apps/mobile/lib/services/minimal_profile_service.dart:228   # hasLpp = !isIndependantNoLpp (STATUT — à ne pas recopier)
  mandatory_contract_test_cases:   # gouvernent le contrat ; le runtime devra les faire passer
    - {revenu: 20000, affilie: false, plafond_attendu: 4000, verified_engine: true, why: "20% * 20000 ; le forfait 7258 SURESTIMERAIT le plafond de 81%"}
    - {revenu: 250000, affilie: false, plafond_attendu: 36288, verified_engine: true, why: "20% plafonné au max ; le forfait 7258 SOUS-ESTIMERAIT de 5x"}
    - {revenu: "any", affilie: true, plafond_attendu: 7258, verified_engine: true, why: "affilié -> petit 3a quel que soit le revenu (testé 20000 ET 250000 -> 7258)"}
  net_professional_income_is_a_visible_hypothesis: >-
    Pour le non-affilié, la base des 20% est le « revenu net de l'activité lucrative » — un input
    DISTINCT du revenu imposable (base du taux). Nommé comme hypothèse VISIBLE, jamais le brut en
    silence (cohérent R3 fault_2).
  precision_note_non_affilie: >-
    Un plafond PRÉCIS (4000) exige un revenu PRÉCIS (20000). Avec seulement une tranche, le plafond
    non-affilié serait lui-même une fourchette (20% des bornes). Cohérent principe 1 R3 (précision
    entrée <= précision sortie). La maquette plafond-20% illustre le cas revenu connu.
  batch6_current_scope_boundary:
    fact: batch6_couvre_aujourd_hui_UNIQUEMENT_le_salarie_avec_LPP
    evidence:
      - navigation.yaml:52_annual_cap_key_pillar3a_with_lpp_annual_cap_only
      - navigation.yaml_outcome_predicate_unsupported_case_lpp_affiliation_is_not_yes
      - navigation.yaml_without_lpp_boundary_purpose_no_lpp_ceiling_differs_and_this_first_calculation_does_not_cover_it
    r4_position: >-
      R4 GRAVE la règle complète (f(affiliation, revenu)) pour qu'elle soit correcte et prête. Câbler
      la branche non-affilié vers un VRAI plafond (au lieu de l'actuel without_lpp_boundary éducatif)
      est une décision de navigation lead + swiss-brain pour un batch ultérieur. La maquette plafond-20%
      montre la règle ; le contrat déclare la branche `pending_lead_navigation`.
    status: rule_engraved_non_affilie_wiring_pending_lead

# ────────────────────────────────────────────────────────────────────────────
# COUVERTURE DES PARAMÈTRES (règle DURE, directive coordinateur 2026-08-05)
# Chaque entrée du calcul est un fait collecté OU une hypothèse VISIBLE. Jamais d'orphelin silencieux.
# ────────────────────────────────────────────────────────────────────────────
parameter_coverage:
  calc_inputs_ref: navigation.yaml:50   # [tax_year, lpp_affiliation, contribution_status, contributed_amount, canton, commune, household, taxable_income_band, additional_planned_amount]
  rule: every_input_is_a_collected_fact_or_a_shown_default_hypothesis_no_silent_orphan
  map:
    scenario_amount:
      role: le_montant_illustratif_de_chaque_scenario_PAS_un_fait
      coverage: derived_anchor_amounts_from_remaining_room   # 2-3 ancres dans [0, remaining_room]
    remaining_3a_room:
      etalon_ref: navigation.yaml:63   # max(0, annual_cap - effective_contributed_amount)
      coverage: derived_variable
      depends_on: [annual_cap_from_affiliation_income, contributed_amount]
    annual_cap:
      etalon_ref: ceiling_derivation_opp3   # f(affiliation, revenu)
      coverage: derived_fact
      source: affiliation_fact_lpp_plus_revenu
    tax_year:
      etalon_ref: navigation.yaml:51_55   # le plafond/barème a une année d'effet (millésime) ; {cap} injecté par placeholder
      coverage: collected_fact
      source_node: fact_annee_fiscale
      note: le_plafond_et_le_bareme_sont_millesimes_le_glossaire_plafond_utilise_le_placeholder_cap
    lpp_affiliation:
      etalon_ref: ceiling_derivation_opp3   # pilote annual_cap (7258 vs 20%)
      coverage: collected_fact
      source_node: fact_lpp_affiliation
    contribution_status:
      etalon_ref: navigation.yaml:108_113
      coverage: collected_fact
      source_node: fact_contribution   # oui/non -> contributed_amount visible quand > 0
    commune:
      etalon_ref: cantonal_comparator.py:99_101   # chef-lieu ; résidu communal MESURÉ (communal_residual_rule)
      coverage: collected_fact
      source_node: fact_lieu
    household_bucket:
      status: SUPERSEDED_by_civil_status_is_married   # le seau grossier household remplacé par fact_etat_civil (fault_5) ; plus un input silencieux
      coverage: not_an_input_replaced
    contributed_amount:
      etalon_ref: navigation.yaml:108_113_contributed_amount_contract
      coverage: collected_fact_optional   # défaut 0 si contribution_status=no ; VISIBLE quand > 0
      source_node: fact_contributed_amount   # navigation.yaml:260
      wiring: reduces_remaining_room_max(0, cap - contributed_amount)   # LE câblage demandé par le lead
    additional_planned_amount:
      etalon_ref: navigation.yaml:340
      coverage: collected_fact_optional_pulled   # l'utilisateur PEUT saisir son montant ; défaut aucun
      source_node: fact_amount
    deductible_amount:
      etalon_ref: navigation.yaml:65   # min(additional_planned_amount, remaining_3a_room)
      coverage: derived_variable
      note: seule_la_part_dans_la_marge_reduit_l_impot
    taxable_income_band:
      etalon_ref: fact_revenu_R3   # bornes -> fourchette d'effet
      coverage: collected_fact
      source_node: fact_revenu
    canton:
      etalon_ref: cantonal_comparator.py:448
      coverage: derived_fact
      source_node: fact_lieu   # commune -> canton
    civil_status_is_married:
      etalon_ref: cantonal_comparator.py:482_483_x080_splitting
      coverage: shown_hypothesis_refined_via_fact_etat_civil   # défaut célibataire ; devient fait via fact_etat_civil (R4)
      default: celibataire
      refines_via: fact_etat_civil   # contrat frère R4 collecte le fait
      display_only_until_married_recompute_exists: true   # cohérence batch21 : le fait est COLLECTÉ + AFFICHÉ, mais l'effet ×0.80 sur les scénarios ne se recompute qu'à l'intégration (deferred_integration.married_recompute_backend)
    children:
      etalon_ref: cantonal_comparator.py:33_39   # ne mord que si marié + enfants
      coverage: shown_hypothesis_STATED_not_falsely_editable
      default: sans_enfant
    confession / regime_source:
      coverage: shown_hypothesis_STATED   # hérité éclairage R3 (imposé ordinairement tappable)
  data_map_dependency:
    inventaire: scratchpad/inventaire_exhaustivite_3a.md
