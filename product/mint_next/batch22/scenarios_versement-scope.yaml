      effet_point_chef_lieu_FR: "586.40"   # revenu EXACT -> plus de largeur de tranche ; le résidu = dispersion communale MESURÉE (grande)
      affiche: effet_dit_QUALITATIVEMENT_modeste_et_depend_beaucoup_de_la_commune_PAS_un_nombre_serre   # communal_residual_rule.display_rule.at_exact_income
