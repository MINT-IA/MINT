# ────────────────────────────────────────────────────────────────────────────
# ARCHITECTURE NÉE AVEC LA LEÇON γ (2026-08-05) — déclarer la cible, jamais câbler en R4
# Ce contrat DÉCLARE des positions/cibles de navigation mais NE CÂBLE aucun routage, recompute
# ou persistance en R4 (never_routes_in_r4:true sur tous les contrôles). Ce qui doit être
# intégré plus tard est ÉNONCÉ ICI — jamais découvert au green (RIDER INTÉGRATION R3, eclairage-scope.yaml:334-337).
# ────────────────────────────────────────────────────────────────────────────
deferred_integration:
  principle: declare_target_position_only_never_wire_the_route_or_recompute_in_this_r_batch
  never_routes_in_r4_applies_to: [continue, keep_local_reference, prepare_personal_setup, review_existing_overcontribution]
  items:
    - id: contributed_amount_to_remaining_room_wiring
      what: le_cablage_runtime_remaining_3a_room_eq_max0_annual_cap_moins_effective_contributed_amount_et_le_recompute_des_scenarios_dessus
      etalon_ref: [product/mint_next/batch6/navigation.yaml:63]   # navigation.yaml:63 = étalon AUTORITAIRE max(0, cap - effective_contributed_amount). NOTE: pillar3a_room_calculator.dart:34-40 soustrait plannedAnnualContribution (=total3aMensuel×12), PAS le déjà-versé — miroir sémantiquement DIFFÉRENT, à NE PAS recopier pour ce câblage
      r4_position: la_regle_est_gravee_parameter_coverage_contributed_amount_wiring_seul_le_cablage_runtime_est_differe   # marge restante cablee sur remaining_3a_room : REGLE gravee, cablage differe
      defers_to: integration_wave_runtime_batch
      green_must_assert: scenarios_recompute_on_remaining_room_not_on_full_cap
    - id: non_affilie_ceiling_routing
      what: router_la_branche_lpp_affiliation_no_vers_un_vrai_plafond_derive_au_lieu_du_without_lpp_boundary_educatif_de_batch6
      rule_engraved_here: ceiling_derivation_opp3   # la regle f(affiliation,revenu) + les 3 cas OPP3 sont GRAVES ; seul le ROUTAGE no-LPP est differe vers la vague d'integration
      defers_to: integration_wave_lead_plus_swiss_brain_navigation_decision
      green_must_assert: non_affilie_reaches_a_derived_ceiling_never_a_flat_7258
    - id: married_recompute_backend
      what: le_vrai_bareme_marie_sur_le_revenu_du_menage_remplacant_l_approximation_etalon_x080_sur_la_meme_tranche
      defers_to: later_backend_batch   # recompute marie -> batch backend ulterieur
      r4_position: x080_sur_la_meme_tranche_est_une_hypothese_visible_fourchette_elargie_jamais_un_point_situation_display_only_tant_que_le_recompute_n_existe_pas
    - id: communal_multiplier_recomposition
      what: moduler_l_estimation_chef_lieu_par_le_multiplicateur_communal_reel
      inherits: r3_pending_named_source   # commune-multipliers-reviewed.yaml, pending_reviewed_dataset (dispersion MESUREE, cf communal_residual_rule)
      defers_to: named_source_ingestion_then_integration_wave
    - id: rachat_3a_classification
      what: distinguer_contribution_ordinaire_rachat_admissible_OPP3_art7a_et_vrai_excedent_avant_l_etat_marge_epuisee
      etalon_ref: OPP3_art_7_to_7b_en_vigueur_01_01_2025_1er_rachat_annee_fiscale_2026_plafonne_7258_par_annee_lacunaire
      defers_to: later_backend_batch_needs_the_buy_in_mechanism_and_gap_year_tracking
      green_must_assert: an_amount_above_the_annual_cap_is_NOT_labelled_non_deductible_without_checking_buy_in_eligibility
  rider_no_green_surprise: >-
    Le batch d'intégration NE DOIT PAS découvrir ces câblages au green. Chaque item ci-dessus est
    déclaré ; la spec green de l'intégration porte l'assertion green_must_assert correspondante.

# ────────────────────────────────────────────────────────────────────────────
# DÉCISION PRODUIT — nature de l'écran (scénarios éducatifs, pas un configurateur)
# ────────────────────────────────────────────────────────────────────────────
product_decision_screen_nature:
  date: 2026-08-05
  decision: SCENARIOS_EDUCATIFS_DISCRETS_plus_saisie_optionnelle_tirée_par_la_valeur
  rejected_slider: >-
    Un curseur « glisse jusqu'au max » pousse psychologiquement vers le plafond — biais de
    configurateur, borderline dark pattern (on maximise le produit, pas la lucidité de l'utilisateur).
    Aussi : pénible en VoiceOver/switch-control. Rejeté.
  rejected_single_recommended_amount: >-
    Afficher UN montant « conseillé » serait une RECOMMANDATION (interdit MINT/LSFin) et un chiffre nu.
    Rejeté.
  chosen_discrete_scenarios: >-
    2 à 3 scénarios illustratifs (montant -> effet en fourchette), couvrant un SPECTRE (petit / moyen /
    le maximum possible). L'enseignement = « tu peux verser ce que tu veux jusqu'au plafond, voici
    l'effet à différents niveaux ». Non prescriptif, honnête, chaque effet dérivé du moteur.
  own_amount_is_pulled_not_pushed: >-
    L'utilisateur PEUT saisir son propre montant (fact additional_planned_amount, navigation.yaml:340) —
    TIRÉ par la valeur (il le veut), jamais poussé par un formulaire imposé. Défaut = aucun montant
    choisi ; on ne présélectionne rien.
  liquidity_is_shown_not_hidden:
    decision: la_liquidité_bloquée_est_DITE_sur_l_écran_pas_seulement_l_économie
    why: >-
      Montrer l'économie d'impôt SANS dire que l'argent est bloqué jusqu'à la retraite (sauf exceptions)
      ferait passer le 3a pour de l'argent gratuit = dark pattern. L'objectif d'apprentissage batch6 est
      explicite : « understand tax deduction, LOCKED LIQUIDITY, and no tax benefit above remaining room »
      (navigation.yaml:123-124). On l'honore.
    tradeoff_surfaced_for_julien: >-
      Enthousiasme d'un écran « voilà tout ce que tu économises » VS honnêteté d'un écran qui dit aussi
      « et c'est bloqué ». Choix = honnêteté (lucidité, pas vente). La note liquidité est une phrase +
      un glossaire des exceptions (aéré).

privacy_copy_rule:
  # HARD (décision produit 2026-08-05) : toute phrase privacy dérive du contrat de données de CET écran. Ici
  # additional_planned_amount et contributed_amount sont éphémères puis rejoignent le profil (comme la
  # tranche R3). AUCUNE donnée device-only exclusive à cet écran -> AUCUNE phrase privacy.
  on_device_claims_must_not_exceed_data_contract: true
  device_local_only_datum_on_this_screen: none
  committed_amounts_join_profile: true
  privacy_sentence_on_screen: omitted_because_no_device_only_datum_exists_here
  forbidden_privacy_claim: any_on_device_or_not_sent_claim_about_the_amounts

# ────────────────────────────────────────────────────────────────────────────
# DÉRIVATION — la seule source de vérité chiffrée (0-trust, path:line, moteur RÉELLEMENT exécuté)
# Chaque valeur des maquettes est une SORTIE du moteur (voir scoring/derivations-suisse-r4.md +
# scoring/derive_r4.py). Rien saisi à la main.
# ────────────────────────────────────────────────────────────────────────────
number_derivation:
  canonical_saving_source: services/backend/app/services/fiscal/cantonal_comparator.py
  saving_function: "estimate_tax_saving(taxable_income, deduction, canton, is_married)"      # :426
  saving_method: difference_of_tax_impot(revenu)_moins_impot(revenu_moins_deductible)_JAMAIS_plafond_fois_taux   # :441-444
  income_tax_function: "estimate_income_tax(taxable_income, canton, is_married)"              # :448
  etalon_calibration: chef_lieu_celibataire_sans_enfant_sans_confession_fortune_0            # :99-101
  deductible_is_within_room_only:
    formula: deductible_amount = min(scenario_amount, remaining_3a_room)                       # navigation.yaml:65
    tax_base: deductible_amount_only                                                           # navigation.yaml:67
    why: un_versement_au_dela_de_la_marge_ne_reduit_PAS_l_impot_effet_plafonne_a_la_marge
  fourchette_construction:
    low: estimate_tax_saving_at_the_income_band_LOWER_edge_on_the_deductible
    high: estimate_tax_saving_at_the_income_band_UPPER_edge_on_the_deductible
    incremental_when_already_contributed: >-
      effet_additionnel = saving(income, already + add) - saving(income, already), aux deux bornes de
      tranche. La marge déjà acquise n'est pas recomptée (honnête).
    rounding: floor_to_100_both_bounds_never_collapse   # HÉRITÉ R3 (eclairage-scope.yaml:44) : les DEUX bornes au plancher CHF 100 ; jamais gonflé, jamais effondré en un point ; si floor(low)==floor(high) élargir (aucune valeur R4 ne le déclenche)
    residual_width_at_exact_income: derived_from_MEASURED_canton_communal_dispersion_never_a_decorative_pm   # voir communal_residual_rule
  # LACUNE COMMUNALE — la dispersion est désormais MESURÉE, plus supposée (rapport coordinateur 2026-08-05)
  communal_residual_rule:
    report: scratchpad/RESEARCH-steuerfuss-communal-source-BE-BS-FR-JU.md   # lecture seule, consulté 2026-08-05
    measured_dispersion_BE:
      steuanlg_civil_range: "0.89 (Deisswil b. M., bfs 535) à 2.20 (Schelten, bfs 708)"   # rapport §2, geoparquet AGI
      chef_lieu_bern: 1.54
      cantonal_base_BE: "≈3.06"
      magnitude: "~×2.5 sur la part communale — massif, PAS ±3%"
    measured_dispersion_FR_example_canton:
      mechanism: pct_of_cantonal_base   # FR = coefficient en % (pas des unités)
      published_2026_spread: "32% (Greng) à 100% (Jaun)"   # rapport §3.6, encore plus large
    r3_assumption_corrected: la_reserve_R3_~pm3pct_ou_pm5pct_communal_etait_OPTIMISTE_la_dispersion_reelle_est_grande
    named_source_status:
      identified: true   # per-canton, en file (rapport §4) : BE fin.be.ch+AGI ; JU jura.ch ; FR fr.ch DIAF/SCOM ; BS table 3 communes
      in_repo_yet: false   # commune-multipliers-reviewed.yaml PROPOSÉ, pas encore ingéré
      status: source_named_ingestion_pending_seal_stays_chef_lieu_until_filed
    display_rule:
      at_band_income: width_dominated_by_income_band_edges_commune_shown_as_a_visible_chef_lieu_hypothesis_with_honest_caveat
      at_exact_income: width_reflects_MEASURED_canton_dispersion_never_a_tight_number   # ex. plafond-20% : effet dit modeste_et_depend_beaucoup_de_la_commune
      hypothesis_line_always_visible: "Impôts · <commune> (chef-lieu du canton)"
      forbidden: claiming_a_tight_communal_precision_the_chef_lieu_seal_cannot_support
  mockup_values_executed:   # SORTIES réelles (derive_r4.py), arrondies vers l'intérieur pour l'écran
    nominal_band_70_100k_FR_celibataire_plafond_7258_deja_0:
      - {verser: 2000, effet_brut: "504.53 a 617.87", affiche: "environ 500 à 600 CHF"}
      - {verser: 4000, effet_brut: "1009.07 a 1235.73", affiche: "environ 1 000 à 1 200 CHF"}
      - {verser: 7258, effet_brut: "1830.95 a 2242.24", affiche: "environ 1 800 à 2 200 CHF"}   # = R3 payoff
    marge_reduite_deja_4000_reste_3258:
      - {verser_de_plus: 1000, effet_additionnel_brut: "252.26 a 308.94", affiche: "environ 200 à 300 CHF"}   # floor_to_100 des DEUX bornes (252.26->200, 308.94->300) ; corrige le nearest_50 du draft
      - {verser_de_plus: 3258, effet_additionnel_brut: "821.88 a 1006.51", affiche: "environ 800 à 1 000 CHF"}
    plafond_20pct_non_affilie_revenu_20000:
