    rattachement exact (teach_back de compréhension conservé entre éclairage et scenarios_versement ?)
    reste une décision de navigation du lead ; ce draft ne touche aucun autre nœud batch6.
  authority_note: this_draft_refreshes_next_action_only_it_may_not_add_or_remove_other_batch6_routes

