# « et maintenant ? » : ce que l'utilisateur POURRAIT verser cette année et l'effet estimé de chaque
# scénario. STRICTEMENT ÉDUCATIF : des scénarios, JAMAIS une recommandation ; pas d'impératif ;
# « pourrait » ; toujours une fourchette, jamais un chiffre nu ; la liquidité bloquée dite honnêtement
# (anti-dark-pattern). Ce nœud REFRAÎCHIT `next_action` de batch6.
