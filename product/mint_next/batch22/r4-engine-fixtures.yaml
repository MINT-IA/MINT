# ── DISPLAY ROUNDING — floor_to_100 sur les DEUX bornes, jamais un point (hérité R3) ──
rounding_rule:
  name: floor_to_100_both_bounds_never_collapse
  inherited_from: product/mint_next/batch21/eclairage-scope.yaml:44
  definition: display_low = floor100(raw_low) ; display_high = floor100(raw_high)
  never_collapse_guard: >-
    Si floor100(low) == floor100(high), la fourchette d'affichage serait effondrée en un point :
    interdit. Élargir (p. ex. plancher bas / plafond haut au 100 suivant). AUCUNE valeur R4
    ci-dessous ne déclenche ce garde (toutes les paires diffèrent d'au moins 100).
  note: les FIXTURES portent la valeur moteur brute ; la clé `display` porte la valeur floor_to_100 rendue à l'écran.

# ── 1. PLAFOND = f(affiliation, revenu) — les 3 cas OPP3 contractuels (EXÉCUTÉS) ──
# affilié -> 7258 (LIFD 33-1-e, constante) ; NON affilié -> min(0.20 * revenu_net, 36288) (OPP3 art.7).
# Ces 3 cas gouvernent le contrat scenarios_versement.ceiling_derivation_opp3 ; le runtime devra les faire passer.
