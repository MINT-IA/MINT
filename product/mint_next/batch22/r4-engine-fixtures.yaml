  - {revenu_chf: 20000,  affilie: false, plafond_chf: 4000.0,  executed: "IndependantService().calculate_3a_plafond(20000)",  why: "20% * 20000 ; le forfait 7258 SURESTIMERAIT le plafond de 81%"}
  - {revenu_chf: 250000, affilie: false, plafond_chf: 36288.0, executed: "IndependantService().calculate_3a_plafond(250000)", why: "20% plafonné au max ; le forfait 7258 SOUS-ESTIMERAIT de 5x"}
  - {revenu_chf: any,    affilie: true,  plafond_chf: 7258.0,  executed: "constante PILIER_3A_PLAFOND_AVEC_LPP + room-calculator switch", why: "affilié -> petit 3a quel que soit le revenu (constante, testé 20000 ET 250000 -> 7258)"}

