deferred_integration:
  # RIDER 1 (explicit lifecycle) : the R4 forward edges never route in R4
  # (scenarios continue.never_routes_in_r4 ; fact_etat_civil continue.never_routes_in_r4
  # and the situation row is display_only). So this expected-RED binds only the
  # obligations reachable by the navigation that EXISTS pre-runtime — the wired R3
  # arc up to the delivered eclairage boundary. The R4 SCREENS land first (runtime),
  # and this LINEAR contract flips green at the INTEGRATION BATCH, not at the
  # screen-flip.
  status: declared_next_governance_unit_after_r4_runtime_lands
  green_flips_here_not_at_screen_flip: true
  scope:
  - wire_eclairage_continue_to_scenarios_versement_refreshing_next_action
  - upgrade_the_eclairage_situation_row_to_a_refine_affordance_routing_to_fact_etat_civil
  - wire_fact_etat_civil_continue_to_recompute_eclairage_with_is_married_no_re_ask_of_income
  - route_the_non_affilie_lpp_no_branch_to_a_derived_ceiling_not_a_flat_7258
  - keep_situation_display_only_until_the_married_recompute_exists_engine_side
  - re_gate_sibling_screens_touched_by_the_new_wiring
  interim_evidence:
    # the screens are NOT a silent gray zone between screen-flip and integration:
    # they are attested by the NAMED runtime dev tests, reached via the harness.
    runtime_dev_tests:
    - product/mint_next/batch7/design_lab/test/dev_scenarios_versement_r4_test.dart
