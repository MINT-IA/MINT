  green_gate_semantics:
    # RIDER 2 (green-gate re-semanticized) : the future R4 green-gate's acceptance
    # means runtime IMPLEMENTED **and** journey WIRED — its --release attestation
    # replays THIS linear test, which passes only once the two nodes are wired into
    # the journey. No pin may attest a runtime-only state without the wiring.
    acceptance_means: r4_runtime_implemented_AND_journey_wired
    release_attestation_replays: this_linear_integration_test_passing_within_the_wired_screens
    no_pin_may_attest_runtime_only_without_wiring: true
