deferred_integration:
  # LOOP CLOSED (Vague Groupée fermeture-de-boucle, 2026-08-06). The R4 fermeture
  # OUTBOUND edges are now WIRED: scenarios_versement.continue -> fact_etat_civil ;
  # fact_etat_civil.continue (with a selected status) -> éclairage (sealed R4_14) ;
  # the scenarios footer controls (back / keep-reference) route. The fermeture-loop
  # financial state (own-amount "versement", kept reference, committed amount, and
  # the picked commune LABEL) is PRESERVED across one loop turn (scenarios ->
  # etat_civil -> éclairage -> scenarios) rather than reset, and the éclairage shows
  # the commune the user actually picked (never the fixture). The non-affilié LPP-no
  # branch routes to a DERIVED ceiling (min(20% net, grand plafond) — sealed R4_17,
  # never a flat 7258). The ONLY piece NOT recomputed in Dart is the MARRIED CHIFFRE
  # (splitting quotient): selecting marie_pacse routes but does not move the éclairage
  # number — that recompute is a BACKEND L2 (comparer) contract on dev (CLAUDE.md
  # NEVER#3, canonical layer), so the runtime shows a co-located married caveat on the
  # éclairage Situation row (Vague Groupée P1) instead of a fabricated number. The
  # registry KEEPS the frozen RED R4 gate strings (state expected_red,
  # runtime_implemented:false) so the sealed R4_16 control holds; the LIVE delivered
  # record is the R4 GREEN gate. This block is asserted byte-equal to the R4
  # red_guard's EXPECTED_DEFERRED_INTEGRATION.
  status: delivered_r4_loop_closed_married_chiffre_recompute_backend_l2_deferred
  green_flips_here_not_at_screen_flip: true
  key_reconciliation:
    # GRAVEN direction (roast p3): the RUNTIME conforms to the FROZEN sealed test,
    # NEVER the inverse. At the RED seal the runtime spoke fact_etat_civil.* +
