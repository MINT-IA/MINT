deferred_integration:
  # DELIVERED — INBOUND ONLY (green wave, 2026-08-05). The R4 fermeture-de-boucle
  # runtime landed (scenarios_versement.dart + fact_etat_civil.dart) and the two R4
  # SCREENS are now REACHABLE from the linear journey via the two INBOUND edges:
  # eclairage.continue -> scenarios_versement ; the eclairage situation row refine
  # -> fact_etat_civil. BOTH inbound edges are PROVEN by the 16/16 reach (the sealed
  # test drives them). The frozen R4 expected-RED test (sha 27abb5ff...) flips 2/14
  # -> 16/16 by this WIRING ALONE (no test amendment). The OUTBOUND loop is NOT
  # closed in this wave and is NOT claimed: fact_etat_civil.continue NEVER routes
  # (sealed R4_14; runtime onContinue:null) and the scenarios footer controls do not
  # route (runtime no-ops) — the married recompute (etat_civil -> eclairage,
  # is_married) and the outbound routing remain DEFERRED (see scope +
  # not_yet_delivered). "fermeture-de-boucle" here means the two closing SCREENS are
  # reachable, NOT that the recompute loop is wired. This registry deliberately KEEPS
  # the frozen RED R4 gate strings (state expected_red, runtime_implemented:false) so
  # the sealed R4_16 control holds unchanged; the LIVE delivered record is the R4
  # GREEN gate (r4-green-gate.yaml), which seals the 16/16 reachability replay only.
  status: delivered_r4_screens_reachable_inbound_wired_recompute_deferred
  green_flips_here_not_at_screen_flip: true
  key_reconciliation:
    # GRAVEN direction (roast p3): the RUNTIME conforms to the FROZEN sealed test,
    # NEVER the inverse. At the RED seal the runtime spoke fact_etat_civil.* +
    # row:scenarios.scenario_N ; the integration RECONCILED the runtime keys to the
    # sealed test (etat_civil.* + region:scenarios.scenario + amount:scenarios.effect),
    # proven by the 16/16 replay of the byte-identical test. No sealed obligation was
    # weakened to fit the runtime.
    direction: runtime_conforms_to_sealed_test_never_the_inverse
    runtime_adopted_test_keys:
    - etat_civil_dot_prefix_not_fact_etat_civil_dot
    - region_scenarios_scenario_not_row_scenarios_scenario_N
    - amount_scenarios_effect
  delivered_edges:
    # câblage livré: the TWO INBOUND edges the integration wired + PROVEN by the
    # sealed 16/16 reach (the test drives eclairage.continue and
    # eclairage.refine_situation). The batch21 ECLAIRAGE arc itself
    # (fact_lieu -> fact_revenu -> eclairage) is UNTOUCHED by this wave.
    edges:
    - eclairage_continue_to_scenarios_versement
    - eclairage_situation_row_refine_to_fact_etat_civil
    eclairage_batch21_arc_untouched: true
  not_yet_delivered:
    # HONESTY (independent roast, mint-experience P1 + mint-swiss-brain P3b): the
    # OUTBOUND loop is NOT closed in this wave and is NOT claimed as delivered. These
    # stay DEFERRED (see scope). Surfaced, not hidden.
    edges:
    - fact_etat_civil_continue_recomputes_eclairage_with_is_married  # sealed R4_14: etat_civil.continue never routes; runtime onContinue:null
    - scenarios_versement_footer_continue_back_keep_routing  # runtime onContinue/onBack/onKeepLocalReference are no-ops
    married_recompute_is_display_only_today: true  # selecting marie_pacse does not move the eclairage number yet (splitting quotient deferred backend-side)
