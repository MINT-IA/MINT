    etat_civil_continue: "Continuer"
    etat_civil_back: "Retour"
    etat_civil_error_no_selection: "Choisis ta situation pour continuer."
    # glossaire par tap — imposition commune (splitting) : ancre du help_link + carte marié
    etat_civil_gloss_marie_term: "marié·e ou en partenariat enregistré"
    etat_civil_gloss_marie_def: "Marié·e ou en partenariat enregistré et vivant en ménage commun, tu es imposé·e avec ton ou ta partenaire : vos revenus entrent dans un calcul commun. Séparé·e durablement, tu es imposé·e comme une personne seule."
    # glossaire par tap — concubinage (LE ruling, en clair)
    etat_civil_gloss_concubinage_term: "en couple, non marié·e"
    etat_civil_gloss_concubinage_def: "Sans mariage ni partenariat enregistré, chacun est imposé séparément, comme une personne célibataire."
