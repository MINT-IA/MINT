    scenarios_gloss_marge_term: "marge restante"
    scenarios_gloss_marge_def: "Ce qu’il te reste à verser cette année : le plafond, moins ce que tu as déjà mis."
    scenarios_gloss_bloque_term: "bloqué"
    scenarios_gloss_bloque_def: "L’argent du 3a ne peut pas être retiré librement. Un retrait anticipé est notamment possible pour acheter ton logement, te mettre à ton compte ou quitter définitivement la Suisse. Sinon, il reste bloqué jusqu’à la retraite."

    # ---------------------------------------------------------------------
