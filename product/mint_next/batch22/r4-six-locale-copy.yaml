# R4 — FERMETURE DE LA BOUCLE — six-locale semantic copy (paquet prêt-à-sceller, revue lead 2026-08-05 passée).
# Écrans : scenarios_versement (« et maintenant ? ») + fact_etat_civil (le fait le plus lourd).
# Governed by product/mint_next/batch22/{scenarios_versement,fact_etat_civil}-scope.yaml (SCELLÉ).
# Pattern hérité de product/mint_next/batch21/r3-six-locale-copy.yaml (R3, SCELLÉ).
#
# STADE : CONTRAT + MAQUETTES. Runtime interdit, promotion produit interdite, AUCUN scellement.
#
# DOCTRINE APPLIQUÉE :
#  - Écrans ultra-aérés : la question / la phrase se suffit, aucun body redondant.
#  - Test voix haute sur chaque phrase (« dirait-on ça à un ami ? »).
#  - Glossaire PAR TAP : plafond, marge restante, bloqué, imposition commune, concubinage = ancres.
#  - LSFin STRICT sur scenarios_versement : des SCÉNARIOS, JAMAIS une recommandation ; pas d'impératif
#    (« Verse X », « Cotise au max » ABOLIS) ; toujours une fourchette, jamais un chiffre nu ;
#    la LIQUIDITÉ bloquée DITE (anti-dark-pattern) ; « estimation, pas un conseil ».
#  - Le PLAFOND dérive de l'affiliation + du revenu (7 258 avec caisse ; 20 % du revenu sans).
#  - CONCUBINAGE = traitement célibataire (jamais le splitting marié ×0.80) — ruling gravé.
#  - AUCUNE claim de localité ; aucune donnée device-only ici -> aucune phrase privacy.
#  - Résidu communal MESURÉ (rapport RESEARCH-steuerfuss-communal-source-BE-BS-FR-JU.md) : l'estimation
#    part du chef-lieu, la commune peut changer le montant — dit, jamais un ± décoratif.
#  - Framing « Simulation 3a » (effet SUR L'IMPÔT DE CETTE ANNÉE), jamais « retraite ».
#
# Les VALEURS chiffrées sont DÉRIVÉES du moteur (cantonal_comparator.py estimate_tax_saving + règle
# OPP3). Détail : scoring/derivations-suisse-r4.md + scoring/derive_r4.py. Rien inventé.

schema_version: 1
status: sealed_semantic_copy_runtime_not_implemented
model: r4_fermeture_boucle_two_nodes
locales: [fr, en, de, it, es, pt]
required_placeholders:
  - taxYear      # ex. 2026
  - amount       # montant d'un scénario, ex. "7 258"
  - low          # borne basse de la fourchette d'effet, ex. "1 800"
  - high         # borne haute, ex. "2 200"
  - room         # marge restante, ex. "3 258"
  - contributed  # déjà versé, ex. "4 000"
  - cap          # plafond de l'année, ex. "7 258"
  - affiliatedCap  # petit plafond 3a AVEC caisse (LIFD 33-1-e), millésimé, ex. "7 258" — distinct de cap (peut être 20% du revenu sans caisse)
  - excess       # part au-dessus du plafond, ex. "742"
  - ceiling      # plafond dérivé du revenu (sans caisse), ex. "4 000"
  - commune      # commune de fact_lieu, ex. "Fribourg"
  - canton       # canton dérivé, ex. "Fribourg"
  - status       # état civil choisi, ex. "En couple, non marié·e"
  - fact         # nom localisé du fait manquant (état pending), ex. "revenu imposable"

copy:
