deferred_integration:
  principle: declare_target_position_only_never_wire_the_route_or_recompute_in_this_r_batch
  never_routes_in_r4_applies_to: [continue, back]
  items:
    - id: fact_household_refresh_wiring
      what: remplacer_le_seau_grossier_fact_household_de_batch6_par_fact_etat_civil_et_le_routage_de_refresh
      etalon_ref: product/mint_next/batch6/navigation.yaml:311
      r4_position: la_regle_is_married_derivation_est_gravee_seul_le_remplacement_dans_le_flux_lineaire_est_une_decision_lead
      defers_to: integration_wave_lead_navigation_decision
      green_must_assert: is_married_derives_from_civil_status_enum_never_from_a_coarse_household_bucket
    - id: eclairage_situation_row_upgrade
      what: promouvoir_la_ligne_situation_de_l_eclairage_de_display_only_R3_a_une_action_de_raffinage_vers_fact_etat_civil
      etalon_ref: [product/mint_next/batch21/eclairage-scope.yaml:356, product/mint_next/batch21/eclairage-scope.yaml:396]
      defers_to: integration_wave_runtime_batch
      green_must_assert: situation_row_becomes_refinable_and_recomputes_with_is_married
    - id: married_recompute_backend
      what: le_vrai_bareme_marie_sur_le_revenu_du_menage_remplacant_l_approximation_etalon_x080_sur_la_meme_tranche
      etalon_ref: services/backend/app/services/fiscal/cantonal_comparator.py:482_483   # x0.80 approximation LHID sur le MEME taxable_income
      defers_to: later_backend_batch   # recompute marie -> batch backend ulterieur
      r4_position: display_only_situation_et_x080_hypothese_visible_tant_que_le_recompute_moteur_n_existe_pas
    - id: single_parent_and_children_rate
      what: bareme_personne_seule_avec_enfant_plus_child_factor_marie_avec_enfants
      etalon_ref: services/backend/app/services/fiscal/cantonal_comparator.py:33_39   # FAMILY_ADJUSTMENTS
      defers_to: later_lead_plus_swiss_brain_batch   # escalade, priorite moyenne
  situation_stays_display_only_until_recompute: true   # coherence batch21 : tant que le recompute marie n'existe pas cote moteur
  rider_no_green_surprise: >-
    Cohérence batch21 : la ligne situation de l'éclairage reste display_only tant que le recompute
    marié n'existe pas côté moteur (eclairage-scope.yaml:356). fact_etat_civil COLLECTE le fait ;
    le RECOMPUTE et le routage sont l'intégration, déclarée ici, jamais découverte au green.

# ────────────────────────────────────────────────────────────────────────────
# DÉCISION PRODUIT — pattern de saisie (molette Apple vs cartes) — TRANCHÉ AVEC PANEL, documenté
# ────────────────────────────────────────────────────────────────────────────
product_decision_input_pattern:
  date: 2026-08-05
  decision: CARTES_tappables_single_select   # ni molette
  panel_4_lens_verdict: cards_unanimous   # détail : scoring/panel-input-pattern-r4.md
  rejected_wheel_cupertino_picker: >-
    La molette (validée en revue produit pour l'ANNÉE fiscale = enum ORDONNÉ à détentes : 2024/2025/2026) est
    inadaptée à l'état civil. (a) L'état civil est NOMINAL, non ordonné : une molette suggère un
    continuum/ordre là où il n'y en a pas. (b) Une molette CACHE les options non sélectionnées derrière
    la rotation — un débutant pourrait manquer l'option « en couple, non marié·e » et tomber par défaut
    sur la 1re visible : exactement le risque de mésclassification que le ruling concubinage interdit
    (safety-critique). (c) VoiceOver/switch-control sur CupertinoPicker = sémantique « adjustable »
    ambiguë, rotor pénible. Rejetée.
  chosen_cards: >-
    Trois cartes single-select, toutes visibles d'un coup (découvrabilité), chacune un bouton nommé
    48pt (a11y), réutilisant le composant single-select de fact_revenu (cohérence d'arc + une seule
    surface à tester). La distinction contractuelle marié/concubinage/célibataire est UNMISSABLE.
  extends_fact_revenu_reasoning: >-
    Prolonge EXACTEMENT le rejet-molette de fact_revenu (R3) : molette = détentes ordonnées ; choix
    nominal borné = cartes. Décision confiante, cohérente, documentée.
  three_options_not_five:
    decision: trois_cartes_celibataire_marie_pacse_concubinage
    why: >-
      Pour l'estimation 3a, seul is_married mord (splitting ×0.80). Les trois options couvrent la
      distinction contractuelle OBLIGATOIRE (marié/partenaire enregistré vs concubinage vs célibataire) et matchent
      les options déjà scellées dans le situation_sheet de l'éclairage R3
      (product/mint_next/batch21/eclairage-scope.yaml:210). Cohérence de raffinage : la carte choisie ici EST la valeur de
      la ligne situation de l'éclairage.
    divorce_veuvage_coverage: >-
      Divorcé·e et veuf·ve sont imposé·e·s comme personne SEULE (traitement célibataire pour is_married).
      Ils tombent sous « Célibataire » pour cette estimation ; le glossaire de la carte le dit
      (« seul·e, y compris après séparation durable, divorce ou veuvage »). LIMITE documentée : le barème
      « personne seule avec enfant » (parent isolé, splitting-like) n'est PAS couvert — défaut sans-enfant
      R3, escaladé lead+swiss-brain pour un batch ultérieur. Priorité MOYENNE.

privacy_copy_rule:
  # HARD (décision produit 2026-08-05) : la phrase privacy dérive du contrat de données. L'état civil committé
  # REJOINT le profil (comme la tranche, comme la commune). AUCUNE donnée device-only -> AUCUNE phrase privacy.
  on_device_claims_must_not_exceed_data_contract: true
  device_local_only_datum_on_this_screen: none
  committed_status_joins_profile: true
  privacy_sentence_on_screen: omitted_because_no_device_only_datum_exists_here
  forbidden_privacy_claim: any_on_device_or_not_sent_claim_about_the_committed_status

slice:
  entry_preconditions:
    shared: [tax_year_explicitly_selected, commune_selected, eclairage_seen]   # tiré depuis la ligne situation de l'éclairage
  implemented_nodes: [fact_etat_civil]
  boundary_nodes: [eclairage_impot_3a]   # retour à l'éclairage raffiné
  locales: [fr, en, de, es, it, pt]

human_outcome:
  question: "Quelle est ta situation de famille ?"   # aligné copie finale (destructeur R2)
  why_now: >-
    C'est le fait qui pèse le plus sur l'estimation d'impôt : marié·e ou partenaire enregistré·e, vous êtes imposé·e·s
    ensemble (barème splitting), ce qui change le chiffre. En couple non marié·e, ou célibataire, tu es
    imposé·e séparément. Aucun résultat personnel n'est affiché ici.
  must_understand:
    - La question suffit : trois situations, une touche.
    - Marié·e/partenaire enregistré·e change le barème (imposition commune) ; concubinage et célibataire non.
    - « En couple, non marié·e » (concubinage) = imposé·e séparément, comme une personne seule.
    - Le choix est corrigible et remplace l'hypothèse « célibataire » de l'éclairage, sans re-demander le reste.
  next_small_action:
    selected: Revenir à l'éclairage — l'estimation se recalcule avec ta situation.

fact_contract:
  id: civil_status_for_income_tax_splitting_single_assessment_unit
  provenance: explicit_user_declaration
  storage: ephemeral_until_committed_then_joins_profile
  initial_state: default_hypothesis   # valeur DANS l'enum states ; l'hypothèse par défaut = célibataire (resolution_scale.ladder ; l'éclairage montre « Situation · célibataire »)
  states: [default_hypothesis, declared]
  committed_key: civil_status_enum
  status_enum: [celibataire, marie_pacse, concubinage]   # marie_pacse = marié·e OU partenaire enregistré·e (jamais le PACS français, art. LPart) ; renommage de la clé = décision lead
  # DÉRIVATION is_married — la règle GRAVÉE (ruling concubinage, axe justesse suisse)
  is_married_derivation:
    map: {celibataire: false, marie_pacse: true, concubinage: false}
    etalon_ref: services/backend/app/services/fiscal/cantonal_comparator.py:482_483   # if is_married: total *= 0.80
    family_adjustments_ref: services/backend/app/services/fiscal/cantonal_comparator.py:33_39   # AUCUNE clé concubinage
    ruling: >-
      Concubinage = TRAITEMENT CÉLIBATAIRE (is_married=False). En droit suisse, les concubins sont
      imposés SÉPARÉMENT (chacun comme personne seule) ; seuls mariés et partenaires enregistrés sont
      imposés conjointement avec effet de splitting. L'étalon n'a AUCUNE clé concubinage.
    legacy_bug_site: apps/mobile/lib/services/minimal_profile_service.dart:215_216   # isMarriedHousehold = household 'couple'||'family' (concubinage -> couple -> ×0.80 à tort)
    forbidden: mapping_concubinage_to_married_or_deriving_is_married_from_a_coarse_household_bucket
  never_derive_status_from:
    - a_coarse_household_couple_or_family_bucket   # le site exact du bug legacy
    - device_or_account_signals
    - profile_or_previous_unrelated_answer
  forbidden_fallbacks:
    - a_default_or_recommended_status
    - the_most_common_status
    - silently_keeping_celibataire_as_if_declared   # défaut = hypothèse AFFICHÉE, pas un fait déclaré
  no_commit_without_a_selected_status: true
  # DATE DÉTERMINANTE (LIFD/LHID) — l'état civil qui compte est celui AU 31 DÉCEMBRE de l'année fiscale
  determining_date:
    rule: civil_status_at_31_december_of_the_selected_tax_year_governs_the_whole_period
    legal_basis: periode_fiscale_etat_civil_determinant_au_31_decembre_LIFD_LHID   # ESTV/AFC imposition couple-famille
    divorce_or_separation_during_year: each_person_taxed_individually_for_the_ENTIRE_period   # séparation durable/divorce dans l'année -> imposition séparée toute la période
    exceptions:   # correctif Codex : « le 31.12 gouverne toute la période » n'est PAS absolu
      death_of_a_spouse: opens_DISTINCT_tax_periods_the_surviving_spouse_is_NOT_simply_taxed_as_single_for_the_whole_year   # décès -> périodes fiscales séparées
      end_of_tax_liability: partial_year_on_arrival_or_departure_CH_prorates_the_period   # fin/début d'assujettissement -> période partielle
      r4_scope_bound: R4_modelise_le_contribuable_VIVANT_et_assujetti_TOUTE_l_annee_deces_et_assujettissement_partiel_escaladés_lead_plus_swiss_brain
    consequence_for_r4: >-
      Le fait collecté est la situation AU 31 DÉCEMBRE de {taxYear}, pas « aujourd'hui ». Ancre de copie
      REQUISE (câblée, PLUS déférée — correctif Codex) : etat_civil_determining_hint « On regarde ta situation
      au 31 décembre {taxYear} », affichée en sous-ligne discrète sous la question (sans surcharger la question).
      Pour une année PASSÉE ou un changement en cours d'année, cette ancre rend le fait correct.
    source_dated: "ESTV/AFC — état civil déterminant au 31.12 (imposition couple/famille), consulté 2026-08-05"
    reform_awareness: >-
      Votation 08.03.2026 : imposition individuelle acceptée (54,23%). NON en vigueur pour 2025/2026 ; le
      régime joint + splitting reste applicable. Transition à suivre (batch ultérieur, hors R4).
  # ÉCHELLE DE PRÉCISION DÉCLARÉE (décision produit 2026-08-05) — analogue catégoriel de fact_revenu.
  resolution_scale:
    ladder: [default_hypothesis_celibataire, declared_status]
    default_entry_form: shown_hypothesis   # l'éclairage montre « Situation · célibataire » AVANT toute déclaration
    declared_status: {value_shape: one_of_three_statuses, provenance: explicit_user_declaration}
    replaces_in_place: same_situation_fact_upgraded_provenance_never_re_asked   # principe 3
    entered_where: as_a_refine_action_on_the_eclairage_situation_row_not_a_forced_linear_step   # principe 2
    invariant_provenance_over_value: >-
      Déclarer la situation UPGRADE la provenance (hypothèse -> fait) et retire le hedge « on suppose ».
      Si le statut déclaré diffère du défaut (marié), l'estimation SE DÉPLACE (×0.80) et se recalcule.
      La fourchette ne s'EFFONDRE jamais en point (tranche revenu + résidu communal MESURÉ subsistent).

