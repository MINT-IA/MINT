# R4 = FERMETURE DE LA BOUCLE. fact_etat_civil collecte le fait le plus LOURD de la carte de
# sensibilité : la situation. Il REFRAÎCHIT `fact_household` de batch6 (le SEAU GROSSIER couple/family
# qui EST le site du bug fault_5) en un fait PRÉCIS d'état civil qui dérive is_married correctement :
# marié·e/partenaire enregistré·e -> splitting ×0.80 ; concubinage -> traitement CÉLIBATAIRE, jamais ×0.80.
# Ce fait alimente le RAFFINAGE en place de l'éclairage (la ligne « Situation · célibataire » devient
# raffinable). Aucun résultat personnel affiché ici (comme fact_revenu).
model: civil_status_fact_single_node

navigation_amendment:
  refreshes: fact_household            # batch6 navigation.yaml:311 (seau grossier household)
  into: fact_etat_civil
  keeps: choose_category_semantics_but_makes_the_category_a_PRECISE_civil_status_not_a_coarse_couple_family_bucket
  corrects: >-
    fault_5 (inventaire) : household 'couple'||'family' -> is_married mappait le CONCUBINAGE sur marié
    (×0.80 mésappliqué). fact_etat_civil dérive is_married UNIQUEMENT de {marie, partenariat_enregistre}.
  decision_trace: r4_lead_scope_fermeture_boucle_2026_08_05
  supersedes_r3_choice: >-
    R3 fact_revenu avait exclu la question ménage autonome (« situation devient hypothèse éditable sur
    éclairage, défaut célibataire », product/mint_next/batch21/fact_revenu-scope.yaml:16,245). R4, sur décision lead, DONNE à
    cette hypothèse un vrai foyer de collecte : fact_etat_civil. La ligne d'hypothèse éclairage
    (défaut célibataire) devient la CIBLE de raffinage de ce nœud. Pas une contradiction : R3 laissait
    la situation en hypothèse-avec-édition-inline ; R4 la promeut en fait déclaré, tiré par la valeur.
  reached_how:
    primary: pull_based_refinement_of_the_eclairage_situation_row   # principe 2 R3 : tiré par la valeur
    r3_eclairage_control_upgraded: toggle_situation_overlay_situation_sheet_now_routes_to_or_opens_fact_etat_civil   # product/mint_next/batch21/eclairage-scope.yaml:356_396
    linear_step_status: whether_it_also_replaces_fact_household_in_the_linear_flow_is_a_lead_navigation_decision   # flaggé, comme R3
  authority_note: this_draft_refreshes_fact_household_only_it_may_not_add_or_remove_other_batch6_routes

authority:
  canonical_navigation: product/mint_next/batch6/navigation.yaml
  source_of_truth_rule: this_draft_refreshes_fact_household_it_may_not_touch_other_batch6_routes
