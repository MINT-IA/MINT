hermeneutic_inscription:
  experience_visee: "Le débutant dit sa situation en une touche, et comprend que « en couple non marié·e » n'est PAS « marié·e » aux yeux de l'impôt — sans jargon."
  pourquoi_la_decision: "Trois cartes (pas une molette) parce que l'état civil est nominal et que rater l'option concubinage serait rejouer le bug legacy ; is_married dérive du seul état civil marié/partenaire enregistré — le concubinage reste traité comme célibataire, gravé contre le seau ménage grossier."
  ce_que_ca_prepare: "Le raffinage honnête de l'éclairage : le fait le plus lourd de la sensibilité devient déclaré, remplace l'hypothèse en place sans re-demander le reste, et l'estimation se déplace si — et seulement si — la situation le justifie vraiment."
