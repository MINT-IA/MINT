      - the_situation_is_the_one_at_31_december_of_the_selected_tax_year   # etat_civil_determining_hint (correctif Codex, câblé)
      - marie_pacse_means_joint_taxation_splitting_which_moves_the_estimate
      - concubinage_is_the_single_treatment_never_the_married_splitting   # le ruling, en clair
