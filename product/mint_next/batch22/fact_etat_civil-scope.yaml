  inherit_from_r2_r3_except: [list_interaction]
  status_cards_single_select_group: true
  selection_refindable: selection_summary_is_a_focusable_announced_region
  semantics_traversal_order: continue_reachable_before_or_independently_of_the_status_cards_never_trapped
  concubinage_distinction_not_colour_only: the_ruling_is_carried_by_text_and_glossary_not_a_colour   # a11y : la distinction critique est lisible
  glossary_sheet_accessible:
    anchor_is_a_named_button_role_not_a_bare_styled_span: true
    sheet_opens_with_focus_on_its_heading_traps_focus_until_dismissed_then_restores_to_the_anchor: true
    dismiss_by_swipe_button_and_screen_reader_escape: true
  minimum_target_size_points: 48
  border_contrast_min_ratio: 3.0
  text_contrast_min_ratio: 4.5
  secondary_text_contrast_binding:   # amendement post-revue Codex 2026-08-05 (contraste sauge MESURÉ 3,37:1)
    rule: all_functional_text_including_secondary_sauge_meets_4.5_to_1_on_paper_background
    applies_to: [eyebrow, help_link, selection_summary, glossary_body]
    measured_violation: sauge_rgb_110_140_116_on_paper_rgb_246_244_238_is_3.37_to_1_BELOW_4.5   # token maquette trop pâle
    required_fix: darken_the_sauge_text_token_until_ge_4.5_to_1_secondary_text_is_functional_not_decorative
    forbidden: treating_eyebrow_or_help_link_as_decorative_low_contrast
    token_location: apps/mobile/lib/theme/colors.dart   # le TOKEN sauge vit dans le thème Flutter, HORS de ce contrat de données ; ce contrat le BORNE
    status: MUST_FIX_BEFORE_GREEN_runtime_obligation   # correctif Codex : le changement de token + re-render maquette = tâche runtime ; la spec green DOIT prouver >= 4.5:1
  compact_proof: 320x700_logical_px_text_scale_2_shows_question_continue_and_all_three_status_cards_no_overflow_clip
  required_proof_cases:
    - three_status_cards_none_preselected
    - concubinage_selected_summary_announced
    - splitting_glossary_sheet_open_focus_trapped_and_restored
    - concubinage_glossary_sheet_states_separate_taxation
