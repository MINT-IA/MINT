      concepts_are_glossary_entries: [imposition_commune_splitting, concubinage, celibataire_seul]
      on_screen_anchors_minimal: help_link_opens_the_splitting_vs_separate_sheet_concubinage_card_carries_its_own_gloss
      sheet_copy_intents: [one_plain_sentence, why_it_changes_the_tax, optional_fun_metaphor_lsfin_safe_never_a_promise]
      copy_source: product/mint_next/batch22/r4-six-locale-copy.yaml#copy.{locale}.etat_civil_gloss_*
    coach_intent:
      status: contract_requirement_not_implemented_in_r4
      invocable_id: fact_etat_civil
      three_paths_rule:
        declared_route: fact_etat_civil_refreshes_fact_household_in_batch6
        hub_reachable_within_taps: 2
        natural_language_intents: ["je suis marié pour l'impôt", "je vis en concubinage", "ma situation de famille", "est-ce que le concubinage compte comme marié"]
      coach_may_show_widget: civil_status_picker_grounded_on_this_fact_that_maps_is_married_correctly
      widget_must_not_map_concubinage_to_married: true   # le ruling porté jusque dans le widget coach
      every_screen_and_widget_carries_a_coach_invocable_id: true
    controls:
      choose_status: {operation: atomically_commit_one_reviewed_status_without_routing, upgrades_provenance: hypothesis_to_declared, replaces_in_place: true}
      open_splitting_glossary: {operation: open_splitting_vs_separate_sheet_no_route_no_commit}
      open_concubinage_glossary: {operation: open_concubinage_sheet_no_route_no_commit}   # le ruling
      continue: {to: eclairage_impot_3a, route_guard: a_status_is_selected, activation: always_enabled_validation_dispatch, never_routes_in_r4: true, operation: recompute_eclairage_with_is_married_no_re_ask_of_income}
      back: {operation: exact_history_back_restores_prior_situation_hypothesis_or_declared}
      open_safe_exit: {overlay: safe_exit}
    same_status_reselect: idempotent_no_op_no_state_churn
    forbidden:
      - a_default_or_recommended_status
      - a_preselected_card
      - mapping_concubinage_to_married   # fault_5, ruling
      - deriving_is_married_from_a_coarse_household_bucket   # fault_5 site
      - a_body_sentence_below_the_question
      - any_tax_amount_rate_range_or_saving_shown_here   # comme fact_revenu
      - re_asking_the_income_band_after_a_status_change_in_r4   # principe 3 ; voir joint_income_model_limit
      - automatic_route_after_selection
      - account_creation
      - any_privacy_claim_that_the_committed_status_stays_on_device
    copy_source: product/mint_next/batch22/r4-six-locale-copy.yaml#copy.{locale}.etat_civil_*

# ────────────────────────────────────────────────────────────────────────────
# COUVERTURE DES PARAMÈTRES — ce fait EST le paramètre civil_status/is_married de l'étalon.
# ────────────────────────────────────────────────────────────────────────────
parameter_coverage:
  etalon_signature: "estimate_income_tax(taxable_income, canton, is_married)"   # cantonal_comparator.py:448
  rule: this_screen_collects_the_is_married_input_previously_only_a_shown_hypothesis
  map:
    civil_status_is_married:
      etalon_ref: cantonal_comparator.py:482_483
      coverage: collected_fact   # promu d'hypothèse (R3) à fait (R4)
      source_node: fact_etat_civil
      before_r4: shown_hypothesis_default_celibataire   # product/mint_next/batch21/eclairage-scope.yaml:83
    children:
      etalon_ref: cantonal_comparator.py:33_39   # ne mord que si marié + enfants
      coverage: shown_hypothesis_STATED_not_collected_here   # défaut sans-enfant R3 ; hors périmètre de CE fait
      note: un_marie_AVEC_enfants_a_un_facteur_0.66_non_couvert_defaut_sans_enfant_escaladé_lead
  joint_income_model_limit:
    etalon_reality: le_marié_×0.80_est_appliqué_à_l_impôt_sur_le_MÊME_taxable_income_approximation_splitting   # cantonal_comparator.py:482 (commentaire « approximation LHID »)
    consequence_for_r4: >-
      Déclarer marié NE re-demande PAS le revenu (l'étalon réutilise la même tranche avec ×0.80,
      principe 3). MAIS le vrai barème marié porte sur le revenu du MÉNAGE (unité d'imposition conjointe),
      que l'étalon ne modélise pas.
    divergence_from_batch6: >-
      batch6 fact_household EFFACE le revenu au changement de ménage (navigation.yaml:315, changement
      d'unité d'imposition). R4 ne l'efface pas (l'étalon ×0.80 réutilise la tranche). Divergence ASSUMÉE
      et documentée ; le revenu conjoint précis (vraie unité mariée) est une LIMITE de l'étalon.
    escalation_to_lead: >-
      Modéliser le revenu conjoint (barème marié réel sur revenu ménage) dépasse R4. Escaladé
      lead+swiss-brain. R4 : ×0.80 sur la même tranche = hypothèse VISIBLE, fourchette élargie du résidu.

legacy_faults_made_impossible:
  fault_5_civil_status_splitting_ruling:
    inherits: r3_eclairage_fault_5   # ici RENDU OPÉRATIONNEL : le fait est collecté, pas juste une hypothèse
    contract_assertion: >-
      is_married DÉRIVE du fait ÉTAT CIVIL (civil_status ∈ {marie_pacse}) UNIQUEMENT. Le concubinage ->
      traitement célibataire. is_married ne dérive JAMAIS d'un seau ménage grossier « couple/family »
      (le site du bug legacy minimal_profile_service.dart:215-216).
    verified_engine:   # derive_r4.py, sorties réelles
      celibataire_effet_7258_70_100k: "1830.95 à 2242.24"
