schema_version: 1
flow:
  id: debt_ratio_missing_facts
  title: "Debt ratio screen to canonical ledger facts"
  exits:
    - db.route.revenu
    - db.route.patrimoine
    - budget.route.setup
    - db.route.composition_menage
  invariants:
    max_depth: 2
    back_never_loses_input: true
    every_scene_has_exit: true

nodes:
  - id: debt.route.ratio
    kind: route
    route: /debt/ratio
    widget: screens/debt_prevention/debt_ratio_screen.dart
    entries:
      - {via: deeplink, back: pop}
      - {via: flow, back: pop}
    states: [content, partial, loading, error.compute]

  - id: db.route.revenu
    kind: route
    route: /data-block/:type
    widget: screens/onboarding/data_block_enrichment_screen.dart
    entries:
      - {via: flow, back: pop}
    states: [content, loading, error.compute]

  - id: db.route.patrimoine
    kind: route
    route: /data-block/:type
    widget: screens/onboarding/data_block_enrichment_screen.dart
    entries:
      - {via: flow, back: pop}
    states: [content, loading, error.compute]

  - id: budget.route.setup
    kind: route
    route: /budget/setup
    widget: screens/budget/budget_setup_screen.dart
    entries:
      - {via: flow, back: pop}
    states: [content, loading, error.compute]

  - id: db.route.composition_menage
    kind: route
    route: /data-block/:type
    widget: screens/onboarding/data_block_enrichment_screen.dart
    entries:
      - {via: flow, back: pop}
    states: [content, loading, error.compute]

edges:
  - id: debt.edge.ratio.enrich_income
    from: debt.route.ratio
    to: db.route.revenu
    trigger: tap
    intent: "Collect a canonical income fact before computing the Swiss debt ratio"
    payload:
      path_params: {type: EnrichmentType}
      query_params: {inputKey: InputKey}
    transition: push
    back: pop
    test_ref: apps/mobile/test/screens/debt_ratio_ledger_test.dart

  - id: debt.edge.ratio.enrich_debt_payments
    from: debt.route.ratio
    to: db.route.patrimoine
    trigger: tap
    intent: "Collect monthly debt payments as a ledger fact instead of a local screen parameter"
    payload:
      path_params: {type: EnrichmentType}
      query_params: {inputKey: InputKey}
    transition: push
    back: pop
    test_ref: apps/mobile/test/screens/debt_ratio_ledger_test.dart

  - id: debt.edge.ratio.enrich_housing
    from: debt.route.ratio
    to: budget.route.setup
    trigger: tap
    intent: "Collect actual housing cost before comparing remaining margin with the LP minimum-vital base"
    payload:
      query_params: {focus: InputKey}
    transition: push
    back: pop
    test_ref: apps/mobile/test/screens/debt_ratio_ledger_test.dart

  - id: debt.edge.ratio.enrich_household_type
    from: debt.route.ratio
    to: db.route.composition_menage
    trigger: tap
    intent: "Clarify household type before applying the single or couple LP base amount"
    payload:
      path_params: {type: EnrichmentType}
      query_params: {inputKey: InputKey}
    transition: push
    back: pop
    test_ref: apps/mobile/test/screens/debt_ratio_ledger_test.dart

  - id: debt.edge.ratio.enrich_children
    from: debt.route.ratio
    to: db.route.composition_menage
    trigger: tap
    intent: "Collect number of children before applying the child supplement in the LP minimum-vital estimate"
    payload:
      path_params: {type: EnrichmentType}
      query_params: {inputKey: InputKey}
    transition: push
    back: pop
    test_ref: apps/mobile/test/screens/debt_ratio_ledger_test.dart
