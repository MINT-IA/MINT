[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mint-backend"
version = "0.1.0"
description = "Mint Backend Services"
requires-python = ">=3.10"
dependencies = [
    # CI supply-chain gate: fastapi 0.136.3 is flagged by pip-audit
    # MAL-2026-4750 for an undocumented `fastar` standard-extra dependency.
    # Keep the upper bound tight until FastAPI publishes an audited release
    # beyond the affected wheel.
    "fastapi>=0.109.0,<0.136.3",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",
    "python-multipart>=0.0.7,<1.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "pyjwt>=2.8.0,<3.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "bcrypt>=4.0,<5.0",
    "email-validator>=2.0.0,<3.0.0",
    "slowapi>=0.1.9,<1.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "gunicorn>=22.0.0,<24.0.0",
    "alembic>=1.13.0,<2.0.0",
    "tenacity>=8.2.0,<10.0.0",
    "anthropic>=0.40.0,<1.0.0",
    # Phase 31 OBS-03 — pinned 2.53.0 for reliable auto-read of sentry-trace
    # + baggage headers; upgrade requires re-running
    # tools/simulator/trace_round_trip_test.sh against staging to confirm
    # cross-project link behaviour with sentry-flutter 9.14.0.
    "sentry-sdk[fastapi]==2.53.0",
    # Required transitively: sentry-sdk 2.53.0 StarletteIntegration
    # auto-patches Jinja2Templates on setup_once(), which forces
    # `from starlette.templating import Jinja2Templates`. Without jinja2
    # in the image, every gunicorn worker crashes on boot with
    # ModuleNotFoundError. starlette declares jinja2 as an EXTRA
    # (starlette[full]), not a core dep, so we pin it here.
    # Incident: Railway deploy loop 2026-04-21 post-#374.
    "jinja2>=3.1,<4.0",
    "defusedxml>=0.7.0,<1.0.0",
    "redis>=5.0,<6.0",
    "pymupdf>=1.24,<2.0",
    "pyyaml>=6.0,<7.0",
    # Wave 1a D-07 — Karpathy LLM Wiki retrieval over the user's CoachInsightRecord rows.
    # Pure-Python (numpy is the only transitive dep, already present via sentry-sdk[fastapi]).
    "rank_bm25>=0.2.2,<1.0.0",
    "sse-starlette>=2.1,<3.0",
    # CI supply-chain gate: GHSA-537c-gmf6-5ccf affects PyPI wheels before
    # 48.0.1 because they bundle a vulnerable OpenSSL copy.
    "cryptography>=48.0.1,<49",
    # Phase 95 DAG-INVALIDATION — RFC 8785 JCS canonical JSON for deterministic hashing.
    # Trail of Bits maintained, zero deps. Replaces stale `jcs==0.2.1` per RESEARCH §D-01.
    "rfc8785>=0.1.4,<1.0.0",
    # Phase 95 DAG-INVALIDATION — UUID7 backport (stdlib uuid.uuid7 is Python 3.14-only,
    # Railway base image is python:3.12-slim). Rust-backed, drop-in API.
    "uuid_utils>=0.14.1,<1.0.0",
    # Phase mint-calc-engine-v1 W4 Plan 17 (D-CE-17 composite scorecard) —
    # Prometheus client library for counter + histogram declarations and the
    # /metrics exposition endpoint. Open Q1 resolved with Prometheus (vs
    # Sentry-only fallback) per RESEARCH §Q-H Option 1. Railway scrape
    # target config deferred to Julien decision (Grafana Cloud vs Datadog
    # vs Railway built-in).
    "prometheus-client>=0.20,<1.0",
    # Phase mint-data-architecture-v1-02 Plan 02-02 — D-02 DEK TTL cache
    # in key_vault.py uses cachetools.TTLCache. Without this declared dep,
    # Railway clean `pip install .` lands without cachetools (it was
    # transitively installed locally but not in the lockfile), and the
    # first call to encrypt_value/decrypt_value crashes with ImportError.
    # Detected by Phase 02 QA panel code-reviewer (2026-05-19).
    "cachetools>=5.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.1.0",
    "httpx>=0.24.0",
    "fakeredis>=2.20.0",
    "hypothesis>=6.111",
]
# Phase mint-data-architecture-v1-02 W0 Plan 02-01 — D-22 testcontainers Postgres harness
# (per-PR primary ; Railway staging replica is supplementary nightly soak). Requires Docker
# on the test runner. GH Actions ubuntu-latest ships Docker pre-installed ; local devs without
# Docker see `pytest.skip("Docker unavailable")` in `tests/fixtures/test_pg_fixture_self.py`.
# uuid_utils is already declared in the main `dependencies` list (Phase 95 DAG-INVALIDATION
# UUID7 backport, pinned >=0.14.1,<1.0). No duplicate pin here.
test = [
    "testcontainers[postgres]>=4.7,<5",
]
rag = [
    "chromadb>=0.5.5",
    "anthropic>=0.40.0,<1.0.0",
    "openai>=1.30.0",
    "tiktoken>=0.7.0",
]
docling = [
    "pdfplumber>=0.11.0",
    "python-multipart>=0.0.7",
]
kms = [
    # Used by phase 29-01 envelope encryption AND phase 29-06 Bedrock EU
    # client (eu-central-1 inference). Single boto3 install covers both.
    "boto3>=1.34,<2.0",
]
privacy = [
    # PRIV-03 / Phase 29. Optional extra: production installs require
    # Python ≥ 3.10 (presidio + spaCy). Dev environments on 3.9 fall back
    # to the regex scrubber automatically.
    "presidio-analyzer>=2.2,<3.0",
    "presidio-anonymizer>=2.2,<3.0",
    "spacy>=3.7,<4.0",
    "pyffx>=0.3,<1.0",
    # PRIV-07 / Phase 29-06: two-stage image PII masking. Tesseract
    # binary is installed at the Dockerfile layer (+tessdata fra+deu+ita+eng).
    "pytesseract>=0.3.10",
    "Pillow>=10.2",
]
oracle = [
    # Phase 92.5 CALC-03 — ESTV oracle Playwright scraper (manual annual run).
    # NOT installed by default (extra) to keep dev install lean. Install with:
    #   pip install ".[oracle]" && playwright install chromium
    # Cadence: Julien runs once per ESTV publication cycle (Nov-Dec when new
    # tarifs publish). Output → services/backend/tests/fixtures/estv_oracle_2025.jsonl.
    "playwright>=1.40,<2.0",
    "playwright-stealth>=1.0.6,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["E402"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
