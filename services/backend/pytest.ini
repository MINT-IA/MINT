[pytest]
asyncio_mode = auto
# Phase 95 Plan 95-03 / TEST-04 — opt-in marker for testcontainers-Postgres
# tests. Registered here (not just pyproject.toml) because pytest takes
# pytest.ini over pyproject.toml when both exist. Tests tagged
# `pytestmark = pytest.mark.postgres` activate the session-scoped Postgres
# container; they skip cleanly when Docker is unavailable.
markers =
    postgres: opt-in to testcontainers-Postgres fixture (Phase 95 Plan 95-03 / TEST-04)
    vcr_anthropic: opt-in to recorded Anthropic VCR cassette (Phase 95 Plan 95-04 / TEST-05)
