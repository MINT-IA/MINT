# Provenance: assertions only. Prompts live in evals/datasets/ authored separately
# per doctrine §3 (author-and-grade-same-session banned). This file references
# code SOTs by symbolic name — never SHA-pinned.
#
# Phase 95 Plan 95-01 / TEST-01 — archetype variance assertions.
#
# Premise: julien_swiss (default Swiss employee VD/GE) and lauren_expat_us (US
# person + FATCA) MUST receive materially different responses on the same
# prompt — otherwise the LLM is ignoring the archetype context.
#
# Threshold: cosine-embedding similarity between the two responses must stay
# BELOW 0.85. Above 0.85 = archetype context lost = test fails.

assertions:
  - id: julien_vs_lauren_must_diverge
    description: "Same prompt, different archetypes → similarity < 0.85."
    applies_to_categories:
      - eclairage
      - coach_freeform
    cross_row_pair:
      a:
        archetype: julien_swiss
      b:
        archetype: lauren_expat_us
    type: similar-to
    invert: true
    threshold: 0.85
  - id: julien_vs_sofia_must_diverge_on_locale
    description: "fr-Romandie vs it-Ticino on same topic → similarity < 0.90."
    applies_to_categories:
      - coach_freeform
    cross_row_pair:
      a:
        archetype: julien_swiss
      b:
        archetype: sofia_ticino_it
    type: similar-to
    invert: true
    threshold: 0.90
  - id: kai_independent_no_lpp_distinct_from_julien
    description: "no-LPP advice MUST diverge from with-LPP advice on same topic."
    applies_to_categories:
      - coach_freeform
      - simulators
    when_topic_match:
      topic: ["pillar3a", "lpp_voluntary", "avs"]
      sim: ["pillar3a_no_lpp"]
    cross_row_pair:
      a:
        archetype: julien_swiss
      b:
        archetype: kai_independent_no_lpp
    type: similar-to
    invert: true
    threshold: 0.85
